      - name: Verify V280-12 console, preserved master, and critical recording path
        shell: bash
        run: |
          set -euo pipefail
          SRC='v172-source/app/src/main/java/com/sentongoharuna/pulse'
          HUB="$SRC/DevelopUgandaGeneralHubActivity.kt"
          CONSOLE="$SRC/DevelopUgandaV28012ProWorkflowConsole.kt"
          CAM="$SRC/DevelopUgandaCameraActivity.kt"
          GRADLE='v172-source/app/build.gradle.kts'
          MASTER_AUDIT='v172-source/V280-11-FULL-PRESERVATION-AUDIT.txt'
          WORKFLOW_AUDIT='v172-source/V280-12-PRO-WORKFLOW-AUDIT.txt'

          test -s "$MASTER_AUDIT"
          grep -q 'MASTER RESULT: PASS' "$MASTER_AUDIT"
          test -s "$WORKFLOW_AUDIT"
          grep -q 'RESULT: STATIC PATCH PASS' "$WORKFLOW_AUDIT"
          test -s "$CONSOLE"

          grep -q 'V280/12 • PRO WORKFLOW CONSOLE' "$HUB"
          grep -q '1 • PREPARE • PROJECT / HEALTH / AUDIO / CAMERA' "$HUB"
          grep -q '2 • SHOOT • FRAME / LIGHT / FOCUS / RECORD' "$HUB"
          grep -q '3 • DIRECT / MONITOR • LOCAL / REMOTE / MULTI-CAM / LIVE CUT' "$HUB"
          grep -q '4 • REVIEW / COLOR • RATE / PROXY / PROTECT / GRADE' "$HUB"
          grep -q '5 • EDIT / DELIVER • ASSEMBLE / QUEUE / SHARE' "$HUB"

          grep -q 'DevelopUgandaV262RemoteDirectorActivity::class.java' "$HUB"
          grep -q 'DevelopUgandaV263MultiCamDirectorActivity::class.java' "$HUB"
          grep -q 'DevelopUgandaV264LiveCutDirectorActivity::class.java' "$HUB"
          grep -q 'DevelopUgandaV265ProxySyncReviewActivity::class.java' "$HUB"
          grep -q 'DevelopUgandaV277LightingExposureActivity::class.java' "$HUB"

          grep -q 'statusRibbon' "$CONSOLE"
          grep -q 'nextAction' "$CONSOLE"
          grep -q 'stageSummary' "$CONSOLE"
          grep -q 'PROJECT / SCENE / TAKE' "$CONSOLE"
          grep -q 'V262 Remote' "$CONSOLE"
          grep -q 'V263 Multi-Cam' "$CONSOLE"
          grep -q 'V264 Live Cut' "$CONSOLE"
          grep -q 'V274 Media Vault' "$CONSOLE"
          grep -q 'V265 Proxy Review' "$CONSOLE"

          grep -q '.withAudioEnabled()' "$CAM"
          grep -q 'DevelopUgandaV276RecordingSafety.onRecordingStarted' "$CAM"
          grep -q 'DevelopUgandaV276RecordingSafety.onRecordingFinalized' "$CAM"
          grep -q 'DevelopUgandaV272FieldSoundContinuity.armAudioLock' "$CAM"
          grep -q 'DevelopUgandaV272FieldSoundContinuity.audioRouteChanged' "$CAM"
          ! grep -q 'AudioRecord.Builder()' "$CAM"

          grep -q 'versionCode = 28120' "$GRADLE"
          grep -q 'versionName = "280.12-pro-workflow-console-function-deepening"' "$GRADLE"
          echo 'PASS: V280/12 console + V280/11 preservation master + recording/audio safety verified.'

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android platform
        run: sdkmanager "platforms;android-36" "build-tools;35.0.0"

      - name: Set up Gradle 8.11.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Build V280-12 APK
        working-directory: v172-source
        shell: bash
        run: |
          set -o pipefail
          gradle --no-daemon :app:assembleDebug --stacktrace 2>&1 | tee v28012-build.log

      - name: Prepare V280-12 APK + workflow audits
        if: success()
        run: |
          cp v172-source/app/build/outputs/apk/debug/app-debug.apk \
            DEVELOP-UGANDA-V280-12-PRO-WORKFLOW-CONSOLE-FUNCTION-DEEPENING.apk

      - name: Upload V280-12 APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: DEVELOP-UGANDA-V280-12-PRO-WORKFLOW-CONSOLE-FUNCTION-DEEPENING
          path: DEVELOP-UGANDA-V280-12-PRO-WORKFLOW-CONSOLE-FUNCTION-DEEPENING.apk
          retention-days: 14

      - name: Upload V280-12 workflow + preservation audits
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: V280-12-PRO-WORKFLOW-AUDITS
          path: |
            v172-source/V280-11-FULL-PRESERVATION-AUDIT.txt
            v172-source/V280-12-PRO-WORKFLOW-AUDIT.txt
          retention-days: 14

      - name: Upload V280-12 build log if failed
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: V280-12-BUILD-LOG
          path: v172-source/v28012-build.log
          if-no-files-found: ignore
          retention-days: 7
