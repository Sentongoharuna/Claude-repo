      - name: Apply V280-11 FIX2 full legacy preservation master guard
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re

          root = Path('v172-source')
          src = root / 'app/src/main/java/com/sentongoharuna/pulse'
          gradle = root / 'app/build.gradle.kts'
          manifest = root / 'app/src/main/AndroidManifest.xml'

          if not src.is_dir():
              raise SystemExit('V280/11 preservation failure: Android source directory is missing')
          if not gradle.is_file() or not manifest.is_file():
              raise SystemExit('V280/11 preservation failure: Gradle or AndroidManifest is missing')

          kt_files = sorted(src.glob('*.kt'))
          source_texts = {}
          for p in kt_files:
              source_texts[p.name] = p.read_text(encoding='utf-8', errors='ignore')
          combined = '\n'.join(source_texts.values())
          combined_lower = combined.lower()

          audit_lines = [
              'DEVELOP.UGANDA V280/11 FULL LEGACY PRESERVATION MASTER',
              'Purpose: fail the build if a protected historical camera/workflow function disappears.',
              '',
          ]

          def passed(label, detail=''):
              line = f'PASS • {label}' + (f' • {detail}' if detail else '')
              audit_lines.append(line)
              print(line)

          def require_file(label, filename, min_size=300):
              p = src / filename
              if not p.is_file() or p.stat().st_size < min_size:
                  raise SystemExit(f'V280/11 preservation failure: {label} missing/too small: {p}')
              passed(label, filename)
              return p

          def require_all(label, tokens, haystack=combined, case_sensitive=True):
              h = haystack if case_sensitive else haystack.lower()
              missing = []
              for t in tokens:
                  needle = t if case_sensitive else t.lower()
                  if needle not in h:
                      missing.append(t)
              if missing:
                  raise SystemExit(f'V280/11 preservation failure: {label} missing signatures: {missing}')
              passed(label, ', '.join(tokens))

          def require_any(label, alternatives, haystack=combined, case_sensitive=False):
              h = haystack if case_sensitive else haystack.lower()
              for token in alternatives:
                  needle = token if case_sensitive else token.lower()
                  if needle in h:
                      passed(label, token)
                      return token
              raise SystemExit(f'V280/11 preservation failure: {label} none of signatures found: {alternatives}')

          # -----------------------------------------------------------------
          # A. CUMULATIVE MODULE FILE GATE — later versions must not delete
          # the major historical feature modules that the V270→V280 lineage
          # was built to preserve.
          # -----------------------------------------------------------------
          module_files = [
              ('V255 Pro Monitor / waveform / false color', 'DevelopUgandaV255ProMonitorView.kt'),
              ('V262 Remote Director', 'DevelopUgandaV262RemoteDirector.kt'),
              ('V263 Multi-Cam Director', 'DevelopUgandaV263MultiCamDirector.kt'),
              ('V264 Live Cut Director', 'DevelopUgandaV264LiveCutDirector.kt'),
              ('V265 Proxy Sync + Review', 'DevelopUgandaV265ProxySyncReview.kt'),
              ('V269 Smart Story / Field Desk', 'DevelopUgandaV269SmartStoryDesk.kt'),
              ('V270 Guidance / Action Guard', 'DevelopUgandaV270Guidance.kt'),
              ('V271 Live Coach / Output Master', 'DevelopUgandaV271LiveCoach.kt'),
              ('V272 Field Sound + Continuity', 'DevelopUgandaV272FieldSoundContinuity.kt'),
              ('V273 Motion + Shot Control', 'DevelopUgandaV273MotionShotControl.kt'),
              ('V274 Media Vault + Delivery', 'DevelopUgandaV274MediaVault.kt'),
              ('V275 Control Surface + Dual Settings', 'DevelopUgandaV275ControlSurface.kt'),
              ('V276 Recording Safety + Recovery', 'DevelopUgandaV276RecordingSafety.kt'),
              ('V277 Lighting + Exposure Intelligence', 'DevelopUgandaV277LightingExposure.kt'),
              ('V278 Live Workflow', 'DevelopUgandaV278LiveWorkflow.kt'),
              ('V279 Active Shooting Intelligence', 'DevelopUgandaV279ActiveShooting.kt'),
              ('V280 Smart Director', 'DevelopUgandaV280SmartDirector.kt'),
          ]
          for label, filename in module_files:
              require_file(label, filename)

          # -----------------------------------------------------------------
          # B. V235–V250 LOOK / FIELD INTELLIGENCE / EDGE-RULER GATE.
          # -----------------------------------------------------------------
          require_any('V235 live LUT / grade panel', [
              'develop_uganda_v235_live_grade_panel', 'LUTS / Color Grade', 'LUTS'
          ])
          require_any('V236 field intelligence', [
              'develop_uganda_v236_field_intelligence', 'FIELD INTELLIGENCE'
          ])
          require_all('V250 iPhone-style edge rulers', [
              'ZoomRulerView', 'ExposureRulerView', 'v250Cam2DismissAll'
          ])
          require_any('V250 ruler show/hide behavior', [
              'v250HideRulers', 'v250Cam2Show', 'v250EdgeHandler'
          ])

          # -----------------------------------------------------------------
          # C. V251–V259 CORE PRO SHOOTING STACK.
          # -----------------------------------------------------------------
          require_all('V251 clean master / face exposure / pro assist', [
              'v251ToggleCleanMaster',
              'v251ToggleFaceExposurePriority',
              'v251ToggleProAssist',
          ])
          # V280/11 FIX2: V252's original helper names were superseded by the
          # later V253/V275 settings architecture. Preserve the actual settings
          # capability lineage rather than obsolete private helper identifiers.
          require_file('V252/V253/V275 settings host', 'DevelopUgandaV242QualityMatchPro.kt')
          require_all('V252+ surviving settings architecture', [
              'v253ExpandableRow', 'v253MovingSwitch', 'v253ChoiceGrid'
          ])
          require_file('V275 dual settings/control surface', 'DevelopUgandaV275ControlSurface.kt')
          require_any('V252 Clean Master route', [
              'v251ToggleCleanMaster', 'Clean Master', 'CLEAN MASTER'
          ])
          require_any('V252 Face Exposure route', [
              'v251ToggleFaceExposurePriority', 'Face Exposure', 'FACE EXPOSURE'
          ])
          require_any('V252 Focus / Zebra assist route', [
              'v251ToggleProAssist', 'Focus Peaking', 'Zebra', 'ZEBRA'
          ])
          require_any('V252 LUT / Grade route', [
              'develop_uganda_v235_live_grade_panel', 'LUTS', 'Color Grade'
          ])
          require_any('V252 Aspect / Format route', [
              'develop_uganda_v236_field_intelligence', 'ASPECT', 'Aspect', 'Format'
          ])
          require_all('V253 expandable tactile settings', [
              'v253ExpandableRow', 'v253MovingSwitch', 'v253ChoiceGrid'
          ])
          require_all('V254 field controls', [
              'v254SetIso', 'v254SetShutter', 'v254SetWhiteBalance',
              'v254SetStabilizationPolicy', 'v254TogglePreflight'
          ])
          require_all('V255 subject tracking / waveform / false color / focus pull', [
              'v255SetSubjectTrackingMode',
              'v255ToggleWaveform',
              'v255ToggleFalseColor',
              'v255RunFocusPull',
          ])
          require_any('V255 waveform monitor', ['WAVEFORM • LUMA', 'Waveform Monitor'])
          require_any('V255 false color exposure', ['False Color Exposure', 'falseColorFor'])
          require_all('V256 tactile switches + timecode', [
              'v256SetTimecodeMode', 'v256TimecodeModeState'
          ])
          require_all('V257 record-core controls', [
              'v257SetBitrateMode', 'v257BitrateTargetMbps'
          ])
          require_any('V258 live workflow home', [
              'develop_uganda_v258_live_workflow_home',
              'Workflow Home Motion',
              'GENERAL WORKFLOW HOME • LIVE MOTION',
          ])
          require_any('V258 workflow path animation', [
              'flow_path_motion', 'Flow Path Animation', 'CAPTURE  →'
          ])
          require_all('V259 Smart Shoot core functions', [
              'v259RecordingConfidenceScore', 'v259SmartShootStatus'
          ])
          require_any('V259 exposure/confidence UI lineage', [
              'Smart Exposure Assist', 'Recording Confidence', 'SMART SHOOT',
              'V259 SMART SHOOT + MEDIA INTELLIGENCE'
          ])
          require_any('V259 best-take lineage', [
              'Best Take Flags', 'TAKE FLAG', 'BEST'
          ])

          # -----------------------------------------------------------------
          # D. V260 PROJECT CONTROL + FAILSAFE.
          # -----------------------------------------------------------------
          require_all('V260 project/slate integration', [
              'v260ProjectName', 'v260CameraName',
              'v260ActiveSceneNumber', 'v260ActiveTakeNumber'
          ])
          require_all('V260 project/failsafe core functions', [
              'v260ProjectStatus', 'v260SaveCameraPreset'
          ])
          require_any('V260 camera presets A/B', [
              'v260SaveCameraPreset', 'Camera Presets A / B', 'PRESET A', 'PRESET B'
          ])
          require_any('V260 storage reservation', [
              'PROJECT STORAGE RESERVE', 'Storage Reservation', 'storage_reservation'
          ])
          require_any('V260 thermal strategy', [
              'Thermal Strategy', 'QUALITY FIRST', 'ENDURANCE'
          ])
          require_any('V260 settings search', [
              'Search settings •', 'Settings Search', 'search settings', 'project, thermal'
          ])

          # -----------------------------------------------------------------
          # E. V261 PROFESSIONAL DIRECTOR MONITOR.
          # -----------------------------------------------------------------
          require_any('V261 Director Monitor status', ['v261DirectorMonitorStatus', 'DIRECTOR MONITOR'])
          require_any('V261 RGB Parade', ['RGB PARADE', 'RGB Parade'])
          require_any('V261 vectorscope', ['VECTORSCOPE', 'Vectorscope'])
          require_any('V261 skin tone reference', ['SKIN TONE', 'Skin Tone Reference'])
          require_any('V261 highlight/shadow assist', ['Highlight + Shadow Assist', 'HIGHLIGHT', 'SHADOW'])
          require_any('V261 director frame guides', ['Director Frame Guides', '2.39:1', '1.85:1'])
          require_any('V261 shutter-angle range', ['360°', '270°', '144°'])
          require_any('V261 anamorphic desqueeze', ['Anamorphic Desqueeze', '1.33x', '2.0x'])

          # -----------------------------------------------------------------
          # F. V262–V265 REMOTE / MULTI-CAM / LIVE CUT / PROXY REVIEW.
          # -----------------------------------------------------------------
          remote = source_texts['DevelopUgandaV262RemoteDirector.kt']
          require_all('V262 authenticated Remote Director host', [
              'DevelopUgandaV262RemoteDirectorActivity',
              'DevelopUgandaV262RemoteServer',
              'PORT = 8262',
          ], remote)
          require_any('V262 remote record / safe stop', ['START RECORD', 'SAFE STOP'], remote)
          require_any('V262 remote AF/AE/AWB', ['REMOTE AF + AE + AWB', 'AF + AE + AWB'], remote)
          require_any('V262 remote zoom', ['ZOOM', 'zoom'], remote, case_sensitive=False)

          multicam = source_texts['DevelopUgandaV263MultiCamDirector.kt']
          require_all('V263 multi-camera synchronized controls', [
              'SYNC START', 'SYNC SAFE STOP'
          ], multicam)
          require_any('V263 2–4 camera grid', ['CAM A', 'CAM B', 'CAM C', 'CAM D'], multicam)

          livecut = source_texts['DevelopUgandaV264LiveCutDirector.kt']
          require_all('V264 Live Cut transport', ['TAKE', 'CUT'], livecut)
          require_any('V264 Preview → Program workflow', ['PROGRAM', 'PREVIEW'], livecut)
          require_any('V264 director cut-list export', ['JSON', 'CSV'], livecut)

          proxy = source_texts['DevelopUgandaV265ProxySyncReview.kt']
          require_any('V265 proxy review protocol', ['PROXY_META', 'PROXY'], proxy)
          require_any('V265 proxy integrity / transfer', ['INTEGRITY', 'LOCAL READY', 'TRANSFER'], proxy)
          require_any('V265 review sync nudge', ['20ms', 'SYNC', 'NUDGE'], proxy)
          require_all('V265 take-rating vocabulary', ['BEST', 'KEEP', 'RETAKE', 'REJECT'], proxy)

          # -----------------------------------------------------------------
          # G. V267–V270 FIRST PAGE COMMAND CENTER / STORY / GUIDANCE.
          # -----------------------------------------------------------------
          require_all('V267 Live Spec core functions', [
              'v267DeviceSpecSummary', 'v267ConsumePendingQuickPreset'
