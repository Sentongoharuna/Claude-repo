name: Build develop.uganda V280-34.5.6.5 FIX1 LIVE-CAMERA-ONLY HUD + APK

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/V280-34-5-6-5-FIX1-LIVE-CAMERA-ONLY-HUD.yml'

permissions:
  contents: read

jobs:
  build_v280_34_5_6_5_fix1:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout Claude repo
        uses: actions/checkout@v4

      - name: Replay V280-34.5.6.5 source pipeline
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PYREPLAY'
          from pathlib import Path
          import os, re, subprocess, tempfile

          recipe = Path('.github/workflows/V280-34-5-6-5-SMART-AUTO-HIDE-HUD.yml')
          lines = recipe.read_text(encoding='utf-8').splitlines()
          wanted = [
              'Replay proven V280-33.4.5.4 clean HUD source',
              'Apply V280-34.5.6.5 compact smart auto-hide refinement',
              'Verify V280-34.5.6.5 smart auto-hide HUD',
          ]

          def indent(s):
              return len(s) - len(s.lstrip(' '))

          steps = {}
          i = 0
          while i < len(lines):
              m = re.match(r'^(\s*)- name:\s*(.+?)\s*$', lines[i])
              if not m:
                  i += 1
                  continue
              step_indent = len(m.group(1))
              name = m.group(2)
              end = len(lines)
              for k in range(i + 1, len(lines)):
                  mm = re.match(r'^(\s*)- name:\s*(.+?)\s*$', lines[k])
                  if mm and len(mm.group(1)) == step_indent:
                      end = k
                      break

              wd = None
              script = None
              for k in range(i + 1, end):
                  s = lines[k].strip()
                  if s.startswith('working-directory:'):
                      wd = s.split(':', 1)[1].strip().strip("'\"")
                  if s == 'run: |':
                      run_indent = indent(lines[k])
                      content_indent = run_indent + 2
                      block = []
                      for q in range(k + 1, end):
                          ln = lines[q]
                          if not ln.strip():
                              block.append('')
                              continue
                          if indent(ln) <= run_indent:
                              break
                          block.append(ln[content_indent:] if len(ln) >= content_indent else '')
                      script = '\n'.join(block) + '\n'
                      break
              steps[name] = (wd, script)
              i = end

          missing = [n for n in wanted if n not in steps or not steps[n][1]]
          if missing:
              raise SystemExit('Missing V280-34 replay steps: ' + ', '.join(missing))

          root = Path.cwd()
          for name in wanted:
              wd, script = steps[name]
              print(f'\n===== V280-34 FIX1 BASE: {name} =====', flush=True)
              work = (root / wd).resolve() if wd else root
              if wd and not work.exists():
                  work.mkdir(parents=True, exist_ok=True)
              with tempfile.NamedTemporaryFile('w', suffix='.sh', delete=False, encoding='utf-8') as f:
                  f.write(script)
                  tmp = f.name
              try:
                  r = subprocess.run(['bash', tmp], cwd=str(work), env=os.environ.copy())
              finally:
                  Path(tmp).unlink(missing_ok=True)
              if r.returncode:
                  raise SystemExit(r.returncode)

          print('PASS: V280-34.5.6.5 source pipeline replayed.')
          PYREPLAY

      - name: Apply FIX1 live-camera-only HUD guard
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PYFIX1'
          from pathlib import Path
          import re

          p = Path('v172-source/app/src/main/java/com/sentongoharuna/pulse/DevelopUgandaV28033454CleanHudProvider.kt')
          s = p.read_text(encoding='utf-8')

          old = '''                      override fun onActivityResumed(activity: Activity) {
                          if (!activity.javaClass.simpleName.contains("Camera", ignoreCase = true)) return
                          activity.window.decorView.post {
                              runCatching { CleanCinemaHud.install(activity) }
                          }
                      }'''
          new = '''                      override fun onActivityResumed(activity: Activity) {
                          val screen = activity.javaClass.simpleName
                          if (!screen.contains("Camera", ignoreCase = true)) return

                          // HUD belongs only on the actual live camera surface.
                          // Never place recording controls over settings, setup, health,
                          // review, director, recovery or other management screens.
                          val blocked = listOf(
                              "Settings",
                              "Setup",
                              "Health",
                              "Review",
                              "Story",
                              "Vault",
                              "Director",
                              "Recovery",
                              "Control",
                              "Console"
                          )
                          if (blocked.any { screen.contains(it, ignoreCase = true) }) return

                          activity.window.decorView.post {
                              runCatching { CleanCinemaHud.install(activity) }
                          }
                      }'''
          if old not in s:
              raise SystemExit('FIX1 could not find the old broad Camera activity guard')
          s = s.replace(old, new, 1)

          # Version tag for this exact correction.
          s = s.replace(
              'private const val TAG = "V28034565_SMART_AUTO_HIDE_HUD"',
              'private const val TAG = "V28034565_FIX1_LIVE_CAMERA_ONLY_HUD"',
              1
          )

          p.write_text(s, encoding='utf-8')

          gradle = Path('v172-source/app/build.gradle.kts')
          g = gradle.read_text(encoding='utf-8')
          g, n1 = re.subn(r'versionCode\s*=\s*\d+', 'versionCode = 2834566', g, count=1)
          g, n2 = re.subn(
              r'versionName\s*=\s*"[^"]+"',
              'versionName = "280.34.5.6.5-fix1-live-camera-only-hud"',
              g,
              count=1
          )
          if n1 != 1 or n2 != 1:
              raise SystemExit(f'Version metadata update failed: code={n1}, name={n2}')
          gradle.write_text(g, encoding='utf-8')

          print('PASS: HUD restricted away from Camera Settings and other non-live camera pages.')
          PYFIX1

      - name: Verify FIX1 settings-screen protection
        shell: bash
        run: |
          set -euo pipefail
          FILE='v172-source/app/src/main/java/com/sentongoharuna/pulse/DevelopUgandaV28033454CleanHudProvider.kt'
          GRADLE='v172-source/app/build.gradle.kts'

          grep -Fq 'V28034565_FIX1_LIVE_CAMERA_ONLY_HUD' "$FILE"
          grep -Fq '"Settings",' "$FILE"
          grep -Fq '"Setup",' "$FILE"
          grep -Fq '"Health",' "$FILE"
          grep -Fq '"Review",' "$FILE"
          grep -Fq 'blocked.any { screen.contains(it, ignoreCase = true) }' "$FILE"
          grep -Fq 'ASPECT\n9:16' "$FILE"
          grep -Fq 'versionCode = 2834566' "$GRADLE"
          grep -Fq 'versionName = "280.34.5.6.5-fix1-live-camera-only-hud"' "$GRADLE"

          echo 'PASS: camera HUD cannot attach to Camera Settings / setup / health / review screens.'

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android platform
        shell: bash
        run: sdkmanager "platforms;android-36" "build-tools;35.0.0"

      - name: Set up Gradle 8.11.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.11.1

      - name: Build V280-34.5.6.5 FIX1 APK
        working-directory: v172-source
        shell: bash
        run: |
          set -o pipefail
          gradle --no-daemon :app:assembleDebug --stacktrace 2>&1 | tee v28034565-fix1-build.log

      - name: Prepare V280-34.5.6.5 FIX1 APK
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          APK='v172-source/app/build/outputs/apk/debug/app-debug.apk'
          OUT='DEVELOP-UGANDA-V280-34-5-6-5-FIX1-LIVE-CAMERA-ONLY-HUD.apk'
          test -s "$APK"
          cp "$APK" "$OUT"
          test -s "$OUT"
          ls -lh "$OUT"
          sha256sum "$OUT"

      - name: Upload V280-34.5.6.5 FIX1 APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: DEVELOP-UGANDA-V280-34-5-6-5-FIX1-LIVE-CAMERA-ONLY-HUD
          path: DEVELOP-UGANDA-V280-34-5-6-5-FIX1-LIVE-CAMERA-ONLY-HUD.apk
          if-no-files-found: error
          compression-level: 0
          retention-days: 14

      - name: Upload FIX1 build log if failed
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: V280-34-5-6-5-FIX1-BUILD-LOG
          path: v172-source/v28034565-fix1-build.log
          if-no-files-found: ignore
          retention-days: 7
