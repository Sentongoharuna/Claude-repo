      - name: Verify V280-25 continuity match, retake assist, preservation, routes, and artifact contract
        shell: bash
        run: |
          set -euo pipefail
          SRC='v172-source/app/src/main/java/com/sentongoharuna/pulse'
          CAM="$SRC/DevelopUgandaCameraActivity.kt"
          UI="$SRC/DevelopUgandaV28025ContinuityMatchRetakeAssist.kt"
          GRADLE='v172-source/app/build.gradle.kts'
          AUDIT='v172-source/V280-25-CONTINUITY-MATCH-RETAKE-ASSIST-AUDIT.txt'
          test -s "$UI"; test -s "$AUDIT"; test -s /tmp/v28025_cam_before.kt
          grep -q 'versionCode = 28250' "$GRADLE"
          grep -q 'versionName = "280.25-continuity-match-retake-assist"' "$GRADLE"
          grep -q 'DevelopUgandaV28025ContinuityMatchRetakeAssist.attach' "$CAM"
          grep -q 'internal fun v28025SaveMatchProfile' "$CAM"
          grep -q 'internal fun v28025EnsureLastTakeProfile' "$CAM"
          grep -q 'internal fun v28025MatchSummary' "$CAM"
          grep -q 'internal fun v28025RestoreExposureMatch' "$CAM"
          grep -q 'internal fun v28025OpenMatchControl' "$CAM"
          grep -q 'MATCH RETAKE' "$UI"
          grep -q 'RESTORE EXPOSURE MATCH' "$UI"
          grep -q 'UPDATE MATCH FROM CURRENT' "$UI"
          grep -q 'activity.v28024IsRecording()' "$UI"
          grep -q 'DevelopUgandaV28012RuntimeGuard.recordUiFault' "$UI"
          grep -q 'DevelopUgandaV28024ShotMemoryContinuity.attach' "$CAM"
          grep -q 'DevelopUgandaV28023AudioConfidenceTakeAssist.attach' "$CAM"
          grep -q 'DevelopUgandaV28022FocusExposureIntelligence.attach' "$CAM"
          grep -q '.withAudioEnabled()' "$CAM"
          grep -q 'DevelopUgandaV276RecordingSafety.onRecordingStarted' "$CAM"
          grep -q 'DevelopUgandaV276RecordingSafety.onRecordingFinalized' "$CAM"
          grep -q 'DevelopUgandaV272FieldSoundContinuity.armAudioLock' "$CAM"
          grep -q 'DevelopUgandaV272FieldSoundContinuity.audioRouteChanged' "$CAM"
          grep -q 'ZoomRulerView' "$SRC/DevelopUgandaV242QualityMatchPro.kt"
          grep -q 'ExposureRulerView' "$SRC/DevelopUgandaV242QualityMatchPro.kt"
          python3 - <<'PYVERIFY25'
          from pathlib import Path
          import re
          root=Path('v172-source'); src=root/'app/src/main/java/com/sentongoharuna/pulse'
          manifest=(root/'app/src/main/AndroidManifest.xml').read_text(encoding='utf-8')
          declared=set(re.findall(r'android:name="\.([A-Za-z0-9_]+)"',manifest)); routes=set(); classes=set(); empty=[]
          for p in src.glob('*.kt'):
              t=p.read_text(encoding='utf-8',errors='ignore')
              routes.update(re.findall(r'(DevelopUganda[A-Za-z0-9_]+Activity)::class\.java',t))
              classes.update(re.findall(r'\b(?:open\s+)?class\s+(DevelopUganda[A-Za-z0-9_]+Activity)\b',t))
              if re.search(r'setOnClickListener\s*\{\s*\}',t): empty.append(p.name)
          mm=sorted(routes-declared); mc=sorted(routes-classes)
          if mm or mc or empty: raise SystemExit('V280/25 route/button audit failed: missing manifest=%r missing class=%r empty=%r' % (mm,mc,empty))
          before=Path('/tmp/v28025_cam_before.kt').read_text(encoding='utf-8',errors='ignore')
          after=(src/'DevelopUgandaCameraActivity.kt').read_text(encoding='utf-8',errors='ignore')
          sig=re.compile(r'\b(?:private\s+|internal\s+|public\s+|protected\s+)?fun\s+([A-Za-z0-9_]+)\s*\(')
          old=set(sig.findall(before)); new=set(sig.findall(after)); removed=sorted(old-new)
          if removed: raise SystemExit('V280/25 removed existing CameraActivity functions: %r' % removed[:30])
          print('PASS: %d routed Activities resolve; no empty click handlers; 0 previous CameraActivity functions removed.' % len(routes))
          PYVERIFY25
          echo 'PASS: V280/25 continuity match, V280/24 review, audio, focus/exposure assist, rulers and recording safety verified.'


