      - name: Set V280-29.3.3.3 FIX3 real-class-route-audit version
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PYV29FIX1VERSION'
          from pathlib import Path
          p=Path('v172-source/app/build.gradle.kts')
          t=p.read_text(encoding='utf-8')
          old_code='versionCode = 2829333'
          old_name='versionName = "280.29.3.3.3-live-production-pulse-ui"'
          if t.count(old_code) != 1 or t.count(old_name) != 1:
              raise SystemExit('V29 FIX3 version target not found exactly once')
          t=t.replace(old_code,'versionCode = 2829336',1)
          t=t.replace(old_name,'versionName = "280.29.3.3.3-fix3-real-class-route-audit"',1)
          p.write_text(t,encoding='utf-8')
          print('PASS: V280/29.3.3.3 FIX3 version set')
          PYV29FIX1VERSION

      - name: Verify V280-29.3.3.3 FIX3 additive UI, Page2 third upgrade, Camera UI third upgrade and protected core
        shell: bash
        run: |
          set -euo pipefail
          SRC='v172-source/app/src/main/java/com/sentongoharuna/pulse'
          HUB="$SRC/DevelopUgandaGeneralHubActivity.kt"
          CAM="$SRC/DevelopUgandaCameraActivity.kt"
          UI="$SRC/DevelopUgandaV28027211CameraUi.kt"
          MAN='v172-source/app/src/main/AndroidManifest.xml'
          GRADLE='v172-source/app/build.gradle.kts'
          AUDIT='v172-source/V280-29-3-3-3-LIVE-PRODUCTION-PULSE-UI-AUDIT.txt'
          test -s "$AUDIT"
          grep -q 'versionCode = 2829336' "$GRADLE"
          grep -q 'versionName = "280.29.3.3.3-fix3-real-class-route-audit"' "$GRADLE"
          grep -Fq 'develop.uganda • V280/26.1 LIVE INTERACTIVE MASTER' "$HUB"
          grep -Fq 'page.addView(buildV280261LiveControlDeck())' "$HUB"
          grep -Fq 'page.addView(buildV28027211FirstPageSecondUpgrade())' "$HUB"
          grep -Fq 'page.addView(buildV28028322FirstPageThirdUpgrade())' "$HUB"
          grep -Fq 'shell.addView(buildV28027211SecondPageFirstUpgrade())' "$HUB"
          grep -Fq 'shell.addView(buildV28028322SecondPageSecondUpgrade())' "$HUB"
          grep -Fq 'shell.addView(buildV28029333SecondPageThirdUpgrade())' "$HUB"
          grep -Fq '29 • LIVE PRODUCTION PULSE' "$HUB"
          grep -Fq 'PAGE 2 • THIRD UI UPGRADE • LIVE PRODUCTION PULSE' "$HUB"
          grep -Fq 'smartReady = chip("SMART READY"' "$UI"
          grep -Fq 'quickDock.addView(makeDockRow(quickActions.take(3))' "$UI"
          grep -Fq 'quickDock.addView(makeDockRow(quickActions.drop(3))' "$UI"
          grep -Fq 'smartReady.visibility = if (rec) View.GONE else View.VISIBLE' "$UI"
          grep -Fq 'quickDock.visibility = if (rec) View.GONE else View.VISIBLE' "$UI"
          grep -Fq 'leftMargin = dp(58)' "$UI"
          grep -Fq 'rightMargin = dp(100)' "$UI"
          ! grep -q 'AudioRecord(' "$UI"
          ! grep -q 'MediaRecorder(' "$UI"
          ! grep -q 'ProcessCameraProvider' "$UI"
          python3 - <<'PYV29VERIFY'
          from pathlib import Path
          import re
          src=Path('v172-source/app/src/main/java/com/sentongoharuna/pulse')
          man=Path('v172-source/app/src/main/AndroidManifest.xml').read_text(encoding='utf-8',errors='ignore')
          hub=(src/'DevelopUgandaGeneralHubActivity.kt').read_text(encoding='utf-8',errors='ignore')
          ui=(src/'DevelopUgandaV28027211CameraUi.kt').read_text(encoding='utf-8',errors='ignore')
          # FIX3: Kotlin files can contain Activity classes whose class name differs from the filename.
          # Parse real class declarations instead of assuming p.stem == Activity class name.
          routes=set(re.findall(r'v267Open\((DevelopUganda[A-Za-z0-9_]+)::class\.java\)', hub))
          declared=set(re.findall(r'android:name="\.([A-Za-z0-9_]+)"', man))
          classes=set(); empty=[]
          class_pat=re.compile(r'\b(?:public\s+|internal\s+|private\s+|protected\s+|open\s+|abstract\s+|final\s+)*class\s+(DevelopUganda[A-Za-z0-9_]+Activity)\b')
          for p in src.glob('*.kt'):
              t=p.read_text(encoding='utf-8',errors='ignore')
              classes.update(class_pat.findall(t))
              if re.search(r'setOnClickListener\s*\{\s*\}',t): empty.append(p.name)
          missing_class=sorted(routes-classes); missing_manifest=sorted(routes-declared)
          if missing_class or missing_manifest or empty:
              raise SystemExit('V29 FIX3 route/button audit failed: class=%r manifest=%r empty=%r' % (missing_class,missing_manifest,empty))
          hero=hub.index('page.addView(hero)')
          deck=hub.index('page.addView(buildV280261LiveControlDeck())',hero)
          home2=hub.index('page.addView(buildV28027211FirstPageSecondUpgrade())',deck)
          home3=hub.index('page.addView(buildV28028322FirstPageThirdUpgrade())',home2)
          console=hub.index('page.addView(buildV28012ProWorkflowConsole())',home3)
          if not hero < deck < home2 < home3 < console: raise SystemExit('V29 Home additive order regression')
          if 'buildV28029333FirstPageFourthUpgrade' in hub: raise SystemExit('V29 must not create a fourth Home layer')
          c=hub.index('private fun buildV28012ProWorkflowConsole')
          p1=hub.index('shell.addView(buildV28027211SecondPageFirstUpgrade())',c)
          p2=hub.index('shell.addView(buildV28028322SecondPageSecondUpgrade())',p1)
          p3=hub.index('shell.addView(buildV28029333SecondPageThirdUpgrade())',p2)
          if not c < p1 < p2 < p3: raise SystemExit('V29 Page2 order regression')
          if ui.count('Triple("LUT"') != 1 or ui.count('Triple("TOOLS"') != 1: raise SystemExit('V29 camera dock duplication')
          if 'SMART READY' not in ui or 'MARKS ${activity.v280261MarkerCount()}' not in ui: raise SystemExit('V29 camera third UI missing')
          print('PASS: additive Home3 refinement, Page2 .3, Camera .3, standalone button contract and routes verified.')
          PYV29VERIFY
          echo 'PASS: V280/29.3.3.3 live production pulse UI verified.'

