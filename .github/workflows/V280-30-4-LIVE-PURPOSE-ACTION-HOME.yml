      - name: Verify V280-30.4 live action figures dropdowns no-overlap and protected core
        shell: bash
        run: |
          set -euo pipefail
          SRC='v172-source/app/src/main/java/com/sentongoharuna/pulse'
          HUB="$SRC/DevelopUgandaGeneralHubActivity.kt"
          GRADLE='v172-source/app/build.gradle.kts'
          AUDIT='v172-source/V280-30-4-LIVE-PURPOSE-ACTION-HOME-AUDIT.txt'
          test -s "$AUDIT"
          grep -q 'versionCode = 2830400' "$GRADLE"
          grep -q 'versionName = "280.30.4-live-purpose-action-home"' "$GRADLE"
          grep -Fq 'page.addView(buildV280304FirstPageFourthUpgrade())' "$HUB"
          grep -Fq '● LIVE ACTION DECK • HOME UI 4' "$HUB"
          grep -Fq 'v280304FigureButton("READY"' "$HUB"
          grep -Fq 'v280304FigureButton("STORY"' "$HUB"
          grep -Fq 'v280304FigureButton("COVER"' "$HUB"
          grep -Fq 'v280304FigureButton("TAKE"' "$HUB"
          grep -Fq 'v280304FigureButton("BAT"' "$HUB"
          grep -Fq 'v280304FigureButton("SPACE"' "$HUB"
          grep -Fq 'v280304Dropdown("SHOOTING"' "$HUB"
          grep -Fq 'v280304Dropdown("DIRECTING"' "$HUB"
          grep -Fq 'v280304Dropdown("REVIEW + DELIVER"' "$HUB"
          grep -Fq 'v280304Dropdown("SYSTEM + SAFETY"' "$HUB"
          grep -Fq 'AlphaAnimation(1f, 0.48f)' "$HUB"
          grep -Fq 'body.visibility = View.GONE' "$HUB"
          grep -Fq 'HorizontalScrollView(this)' "$HUB"
          grep -Fq 'shell.addView(buildV28029333SecondPageThirdUpgrade())' "$HUB"
          grep -Fq 'smartReady = chip("SMART READY"' "$SRC/DevelopUgandaV28027211CameraUi.kt"
          sha256sum -c /tmp/v280304-protected.sha256
          python3 - <<'PYV30VERIFY'
          from pathlib import Path
          import re
          src=Path('v172-source/app/src/main/java/com/sentongoharuna/pulse')
          hub=(src/'DevelopUgandaGeneralHubActivity.kt').read_text(encoding='utf-8',errors='ignore')
          man=Path('v172-source/app/src/main/AndroidManifest.xml').read_text(encoding='utf-8',errors='ignore')
          routes=set(re.findall(r'v267Open\((DevelopUganda[A-Za-z0-9_]+)::class\.java\)',hub))
          classes=set(); empty=[]
          class_pat=re.compile(r'\b(?:public\s+|internal\s+|private\s+|protected\s+|open\s+|abstract\s+|final\s+)*class\s+(DevelopUganda[A-Za-z0-9_]+Activity)\b')
          for p in src.glob('*.kt'):
              t=p.read_text(encoding='utf-8',errors='ignore')
              classes.update(class_pat.findall(t))
              if re.search(r'setOnClickListener\s*\{\s*\}',t): empty.append(p.name)
          declared=set(re.findall(r'android:name="\.([A-Za-z0-9_]+)"',man))
          mc=sorted(routes-classes); mm=sorted(routes-declared)
          if mc or mm or empty: raise SystemExit('V30.4 route/button audit failed: class=%r manifest=%r empty=%r' % (mc,mm,empty))
          hero=hub.index('page.addView(hero)')
          deck=hub.index('page.addView(buildV280261LiveControlDeck())',hero)
          home2=hub.index('page.addView(buildV28027211FirstPageSecondUpgrade())',deck)
          home3=hub.index('page.addView(buildV28028322FirstPageThirdUpgrade())',home2)
          home4=hub.index('page.addView(buildV280304FirstPageFourthUpgrade())',home3)
          console=hub.index('page.addView(buildV28012ProWorkflowConsole())',home4)
          if not hero < deck < home2 < home3 < home4 < console: raise SystemExit('V30.4 additive Home order regression')
          if hub.count('private fun buildV280304FirstPageFourthUpgrade()') != 1: raise SystemExit('V30.4 Home4 duplicate/missing')
          if hub.count('private fun v280304Dropdown(') != 1: raise SystemExit('V30.4 dropdown helper duplicate/missing')
          if hub.count('v280304Dropdown("') != 4: raise SystemExit('V30.4 expected four dropdown action groups')
          if hub.count('v280304FigureButton("') < 7: raise SystemExit('V30.4 dynamic figure button contract missing')
          print('PASS: V30.4 Home4 additive order, live-purpose figures, dropdown groups, routes and no-overlap contract verified.')
          PYV30VERIFY
          echo 'PASS: V280/30.4 live purpose action Home verified; Page2 .3 and Camera .3 protected unchanged.'

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android platform
        run: sdkmanager "platforms;android-36" "build-tools;35.0.0"

      - name: Set up Gradle 8.11.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.11.1

      - name: Build V280-30.4 APK
        working-directory: v172-source
        shell: bash
        run: |
          set -o pipefail
          gradle --no-daemon :app:assembleDebug --stacktrace 2>&1 | tee v280304-build.log

      - name: Prepare and verify V280-30.4 APK artifact
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          APK='v172-source/app/build/outputs/apk/debug/app-debug.apk'
          OUT='DEVELOP-UGANDA-V280-30-4-LIVE-PURPOSE-ACTION-HOME.apk'
          test -s "$APK"
          cp "$APK" "$OUT"
          test -s "$OUT"
          echo "PASS: APK exists and is non-empty."
          ls -lh "$OUT"
          sha256sum "$OUT"

      - name: Upload V280-30.4 APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: DEVELOP-UGANDA-V280-30-4-LIVE-PURPOSE-ACTION-HOME
          path: DEVELOP-UGANDA-V280-30-4-LIVE-PURPOSE-ACTION-HOME.apk
          if-no-files-found: error
          compression-level: 0
          retention-days: 14

      - name: Upload V280-30.4 audits
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: V280-30-4-LIVE-PURPOSE-ACTION-HOME-AUDITS
