      - name: Verify V280-24 shot memory, continuity, preservation, routes, and artifact contract
        shell: bash
        run: |
          set -euo pipefail
          SRC='v172-source/app/src/main/java/com/sentongoharuna/pulse'
          CAM="$SRC/DevelopUgandaCameraActivity.kt"
          STORY="$SRC/DevelopUgandaV269SmartStoryDesk.kt"
          UI="$SRC/DevelopUgandaV28024ShotMemoryContinuity.kt"
          GRADLE='v172-source/app/build.gradle.kts'
          AUDIT='v172-source/V280-24-SHOT-MEMORY-CONTINUITY-REVIEW-AUDIT.txt'
          test -s "$UI"; test -s "$AUDIT"
          grep -q 'versionCode = 28240' "$GRADLE"
          grep -q 'versionName = "280.24-shot-memory-continuity-review"' "$GRADLE"
          grep -q 'DevelopUgandaV28024ShotMemoryContinuity.attach' "$CAM"
          grep -q 'internal fun v28024RateLastTake' "$CAM"
          grep -q 'internal fun v28024ContinuitySummary' "$CAM"
          grep -q 'internal fun v28024OpenMediaVault' "$CAM"
          grep -q 'internal fun v28024OpenStoryDesk' "$CAM"
          grep -q 'fun lastShot(context: Context)' "$STORY"
          grep -q '.putString("last_shot", shot)' "$STORY"
          grep -q 'REVIEW LAST TAKE' "$UI"
          grep -q 'RETAKE •' "$UI"
          grep -q 'BEST' "$UI"
          grep -q 'KEEP' "$UI"
          grep -q 'REJECT' "$UI"
          grep -q 'activity.v28024IsRecording()' "$UI"
          grep -q 'DevelopUgandaV28012RuntimeGuard.recordUiFault' "$UI"
          grep -q 'DevelopUgandaV28023AudioConfidenceTakeAssist.attach' "$CAM"
          grep -q 'DevelopUgandaV28022FocusExposureIntelligence.attach' "$CAM"
          grep -q '.withAudioEnabled()' "$CAM"
          grep -q 'DevelopUgandaV276RecordingSafety.onRecordingStarted' "$CAM"
          grep -q 'DevelopUgandaV276RecordingSafety.onRecordingFinalized' "$CAM"
          grep -q 'DevelopUgandaV272FieldSoundContinuity.armAudioLock' "$CAM"
          grep -q 'DevelopUgandaV272FieldSoundContinuity.audioRouteChanged' "$CAM"
          grep -q 'ZoomRulerView' "$SRC/DevelopUgandaV242QualityMatchPro.kt"
          grep -q 'ExposureRulerView' "$SRC/DevelopUgandaV242QualityMatchPro.kt"
          python3 - <<'PYROUTE24'
          from pathlib import Path
          import re
          root=Path('v172-source'); src=root/'app/src/main/java/com/sentongoharuna/pulse'
          manifest=(root/'app/src/main/AndroidManifest.xml').read_text(encoding='utf-8')
          declared=set(re.findall(r'android:name="\.([A-Za-z0-9_]+)"',manifest)); routes=set(); classes=set(); empty=[]
          for p in src.glob('*.kt'):
              t=p.read_text(encoding='utf-8',errors='ignore')
              routes.update(re.findall(r'(DevelopUganda[A-Za-z0-9_]+Activity)::class\.java',t))
              classes.update(re.findall(r'\b(?:open\s+)?class\s+(DevelopUganda[A-Za-z0-9_]+Activity)\b',t))
              if re.search(r'setOnClickListener\s*\{\s*\}',t): empty.append(p.name)
          mm=sorted(routes-declared); mc=sorted(routes-classes)
          if mm or mc or empty: raise SystemExit('V280/24 route/button audit failed: missing manifest=%r missing class=%r empty=%r' % (mm,mc,empty))
          print('PASS: %d routed Activities resolve; no empty click handlers.' % len(routes))
          PYROUTE24
          echo 'PASS: V280/24 shot memory, retake continuity, V280/23 audio, focus/exposure assist, rulers and recording safety verified.'

