      - name: Verify V280-28.3.2.2 additive UI, standalone controls, routes and protected camera core
        shell: bash
        run: |
          set -euo pipefail
          SRC='v172-source/app/src/main/java/com/sentongoharuna/pulse'
          HUB="$SRC/DevelopUgandaGeneralHubActivity.kt"
          CAM="$SRC/DevelopUgandaCameraActivity.kt"
          UI="$SRC/DevelopUgandaV28027211CameraUi.kt"
          GRADLE='v172-source/app/build.gradle.kts'
          AUDIT='v172-source/V280-28-3-2-2-MODERN-STANDALONE-NO-OVERLAP-UI-AUDIT.txt'
          test -s "$AUDIT"; test -s /tmp/v28028322_hub_before.kt; test -s /tmp/v28028322_cam_before.kt; test -s /tmp/v28028322_camui_before.kt
          grep -q 'versionCode = 2828322' "$GRADLE"
          grep -q 'versionName = "280.28.3.2.2-modern-standalone-no-overlap-ui"' "$GRADLE"
          # Preserve V280/26.1 foundation and additive order.
          grep -Fq 'develop.uganda • V280/26.1 LIVE INTERACTIVE MASTER' "$HUB"
          grep -Fq 'page.addView(buildV280261LiveControlDeck())' "$HUB"
          grep -Fq 'page.addView(buildV28027211FirstPageSecondUpgrade())' "$HUB"
          grep -Fq 'page.addView(buildV28028322FirstPageThirdUpgrade())' "$HUB"
          grep -Fq 'shell.addView(buildV28027211SecondPageFirstUpgrade())' "$HUB"
          grep -Fq 'shell.addView(buildV28028322SecondPageSecondUpgrade())' "$HUB"
          grep -q 'THIRD HOME UPGRADE' "$HUB"
          grep -q 'STANDALONE COMMANDS' "$HUB"
          grep -q 'v28028322TwoButtonRow' "$HUB"
          grep -q 'stageScroll.addView(stageRow)' "$HUB"
          # Camera UI2: two independent rows, six controls, no inherited squeezed 5-across dock.
          grep -q 'orientation = LinearLayout.VERTICAL' "$UI"
          grep -q 'makeDockRow(quickActions.take(3))' "$UI"
          grep -q 'makeDockRow(quickActions.drop(3))' "$UI"
          grep -q 'Triple("TOOLS"' "$UI"
          grep -q 'leftMargin = dp(58)' "$UI"
          grep -q 'rightMargin = dp(100)' "$UI"
          ! grep -Fq 'quickDock.addView(b, LinearLayout.LayoutParams(0, dp(36), 1f)' "$UI"
          # Protected camera ownership/safety remains untouched.
          grep -q '.withAudioEnabled()' "$CAM"
          grep -q 'DevelopUgandaV276RecordingSafety.onRecordingStarted' "$CAM"
          grep -q 'DevelopUgandaV276RecordingSafety.onRecordingFinalized' "$CAM"
          grep -q 'DevelopUgandaV272FieldSoundContinuity.armAudioLock' "$CAM"
          grep -q 'DevelopUgandaV280261ShotReadyLiveAssist.attach' "$CAM"
          grep -q 'DevelopUgandaV28027211CameraUi.attach' "$CAM"
          grep -q 'ZoomRulerView' "$SRC/DevelopUgandaV242QualityMatchPro.kt"
          grep -q 'ExposureRulerView' "$SRC/DevelopUgandaV242QualityMatchPro.kt"
          ! grep -q 'AudioRecord(' "$UI"
          ! grep -q 'MediaRecorder(' "$UI"
          ! grep -q 'ProcessCameraProvider.getInstance' "$UI"
          python3 - <<'PYVERIFY28322'
          from pathlib import Path
          import re
          root=Path('v172-source'); src=root/'app/src/main/java/com/sentongoharuna/pulse'
          manifest=(root/'app/src/main/AndroidManifest.xml').read_text(encoding='utf-8')
          declared=set(re.findall(r'android:name="\.([A-Za-z0-9_]+)"',manifest)); routes=set(); classes=set(); empty=[]
          for p in src.glob('*.kt'):
              t=p.read_text(encoding='utf-8',errors='ignore')
              routes.update(re.findall(r'(DevelopUganda[A-Za-z0-9_]+Activity)::class\.java',t))
              classes.update(re.findall(r'\b(?:open\s+)?class\s+(DevelopUganda[A-Za-z0-9_]+Activity)\b',t))
              if re.search(r'setOnClickListener\s*\{\s*\}',t): empty.append(p.name)
          mm=sorted(routes-declared); mc=sorted(routes-classes)
          if mm or mc or empty: raise SystemExit('V280/28.3.2.2 route/button audit failed: missing manifest=%r missing class=%r empty=%r' % (mm,mc,empty))
          sig=re.compile(r'\b(?:private\s+|internal\s+|public\s+|protected\s+)?fun\s+([A-Za-z0-9_]+)\s*\(')
          for filename,before_path in [('DevelopUgandaCameraActivity.kt','/tmp/v28028322_cam_before.kt'),('DevelopUgandaGeneralHubActivity.kt','/tmp/v28028322_hub_before.kt')]:
              before=Path(before_path).read_text(encoding='utf-8',errors='ignore'); after=(src/filename).read_text(encoding='utf-8',errors='ignore')
              removed=sorted(set(sig.findall(before))-set(sig.findall(after)))
              if removed: raise SystemExit('V280/28.3.2.2 removed functions from %s: %r' % (filename,removed[:30]))
          hub=(src/'DevelopUgandaGeneralHubActivity.kt').read_text(encoding='utf-8',errors='ignore')
          hero=hub.index('page.addView(hero)'); deck=hub.index('page.addView(buildV280261LiveControlDeck())',hero)
          home2=hub.index('page.addView(buildV28027211FirstPageSecondUpgrade())',deck); home3=hub.index('page.addView(buildV28028322FirstPageThirdUpgrade())',home2)
          console=hub.index('page.addView(buildV28012ProWorkflowConsole())',home3)
          if not (hero < deck < home2 < home3 < console): raise SystemExit('V280/28 additive page-order regression')
          ui=(src/'DevelopUgandaV28027211CameraUi.kt').read_text(encoding='utf-8',errors='ignore')
          if ui.count('makeDockRow(quickActions.take(3))') != 1 or ui.count('makeDockRow(quickActions.drop(3))') != 1:
              raise SystemExit('Camera standalone two-row dock contract failed')
          print('PASS: additive order V280/26.1 -> V27 Home2 -> V28 Home3 -> workflow console preserved.')
          print('PASS: %d routed Activities resolve; no empty click handlers; no previous Camera/Hub functions removed.' % len(routes))
          PYVERIFY28322
          echo 'PASS: V280/28.3.2.2 modern standalone no-overlap UI verified.'

