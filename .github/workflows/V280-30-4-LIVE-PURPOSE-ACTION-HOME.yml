      - name: Verify V280-20 cinema HUD, preservation, routes, and artifact contract
        shell: bash
        run: |
          set -euo pipefail
          SRC='v172-source/app/src/main/java/com/sentongoharuna/pulse'
          CAM="$SRC/DevelopUgandaCameraActivity.kt"
          HUD="$SRC/DevelopUgandaV28020CinemaHud.kt"
          GRADLE='v172-source/app/build.gradle.kts'
          AUDIT='v172-source/V280-20-CINEMA-HUD-ADAPTIVE-PRO-CONTROLS-AUDIT.txt'
          test -s "$HUD"; test -s "$AUDIT"
          grep -q 'versionCode = 28200' "$GRADLE"
          grep -q 'versionName = "280.20-cinema-hud-adaptive-pro-controls"' "$GRADLE"
          grep -q 'DevelopUgandaV28020CinemaHud.attach' "$CAM"
          grep -q 'internal fun v28020InvokeControl' "$CAM"
          grep -q 'internal fun v28020ControlsLocked' "$CAM"
          grep -q 'develop_uganda_v235_live_grade_panel' "$CAM"
          grep -q 'develop_uganda_v236_field_intelligence' "$CAM"
          grep -q 'v28020_legacy_narration' "$CAM"
          grep -q 'formatButton = action("FORMAT' "$HUD"
          grep -q 'lutButton = action("LUT' "$HUD"
          grep -q 'lensButton = action("LENS' "$HUD"
          grep -q 'Recording Quiet Mode' "$AUDIT"
          grep -q 'v237_camera_deck' "$HUD"
          grep -q 'v244_cinema_status_strip' "$HUD"
          grep -q 'ZoomRulerView' "$SRC/DevelopUgandaV242QualityMatchPro.kt"
          grep -q 'ExposureRulerView' "$SRC/DevelopUgandaV242QualityMatchPro.kt"
          grep -q 'v250Cam2DismissAll' "$SRC/DevelopUgandaV242QualityMatchPro.kt"
          grep -q '.withAudioEnabled()' "$CAM"
          grep -q 'DevelopUgandaV276RecordingSafety.onRecordingStarted' "$CAM"
          grep -q 'DevelopUgandaV276RecordingSafety.onRecordingFinalized' "$CAM"
          grep -q 'DevelopUgandaV272FieldSoundContinuity.armAudioLock' "$CAM"
          grep -q 'DevelopUgandaV272FieldSoundContinuity.audioRouteChanged' "$CAM"
          ! grep -q 'AudioRecord.Builder()' "$CAM"
          sha256sum -c /tmp/v28020-protected.sha256
          python3 - <<'PYFUN'
          from pathlib import Path
          import re
          old=Path('/tmp/v28020-camera-before.kt').read_text(encoding='utf-8',errors='ignore')
          new=Path('v172-source/app/src/main/java/com/sentongoharuna/pulse/DevelopUgandaCameraActivity.kt').read_text(encoding='utf-8',errors='ignore')
          pat=re.compile(r'\bfun\s+([A-Za-z0-9_]+)\s*\(')
          before=set(pat.findall(old)); after=set(pat.findall(new)); removed=sorted(before-after)
          if removed: raise SystemExit('V280/20 removed camera functions: '+', '.join(removed))
          print('PASS: no V280/19 camera functions removed; %d V280/20 bridge functions added/retained.' % len(after-before))
          PYFUN
          python3 - <<'PYROUTE'
          from pathlib import Path
          import re
          root=Path('v172-source'); src=root/'app/src/main/java/com/sentongoharuna/pulse'
          manifest=(root/'app/src/main/AndroidManifest.xml').read_text(encoding='utf-8')
          declared=set(re.findall(r'android:name="\.([A-Za-z0-9_]+)"',manifest)); routes=set(); classes=set(); empty=[]
          for p in src.glob('*.kt'):
              t=p.read_text(encoding='utf-8',errors='ignore')
              routes.update(re.findall(r'(DevelopUganda[A-Za-z0-9_]+Activity)::class\.java',t))
              classes.update(re.findall(r'\b(?:open\s+)?class\s+(DevelopUganda[A-Za-z0-9_]+Activity)\b',t))
              if re.search(r'setOnClickListener\s*\{\s*\}',t): empty.append(p.name)
          mm=sorted(routes-declared); mc=sorted(routes-classes)
          if mm or mc or empty: raise SystemExit('V280/20 route/button audit failed: missing manifest=%r missing class=%r empty=%r' % (mm,mc,empty))
          print('PASS: %d routed Activities resolve; no empty click handlers.' % len(routes))
          PYROUTE
          echo 'PASS: V280/20 HUD, real LUT/FORMAT routes, lens, V250 rulers, recording safety, audio continuity and routes verified.'

