name: Build DU Camera R014 DFV238 HARDENED MASTER APK

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/BUILD-DU-CAMERA-R014-DFV238-MASTER-STABLE.yml'

permissions:
  contents: read
  actions: write

jobs:
  build_du_camera_r014_dfv238_master_stable:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout Claude repo
        uses: actions/checkout@v4

      - name: Quarantine stale red workflows
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Best-effort cleanup only. Failure to quarantine an old workflow must not block R014.
          set +e
          for WORKFLOW_ID in 347730619 347014871 348865042; do
            HTTP_CODE="$(
              curl -sS -o "/tmp/disable-${WORKFLOW_ID}.txt" -w '%{http_code}'                 -X PUT                 -H "Accept: application/vnd.github+json"                 -H "Authorization: Bearer ${GH_TOKEN}"                 -H "X-GitHub-Api-Version: 2022-11-28"                 "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/workflows/${WORKFLOW_ID}/disable"
            )"
            if [ "$HTTP_CODE" = "204" ]; then
              echo "Disabled stale workflow ${WORKFLOW_ID}"
            else
              echo "WARN: stale workflow ${WORKFLOW_ID} not disabled (HTTP ${HTTP_CODE}); continuing."
            fi
          done
          exit 0

      - name: Replay proven V280-33.4.5.4 clean HUD source
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PYREPLAY'
          from pathlib import Path
          import base64
          import os, re, subprocess, tempfile

          recipe = Path('.github/workflows/V280-33-4-5-4-CLEAN-CINEMA-HUD.yml')
          lines = recipe.read_text(encoding='utf-8').splitlines()
          wanted = [
              'Replay proven V280-31.4 FIX1 source pipeline',
              'Apply V280-33.4.5.4 clean cinema HUD overlay',
              'Verify V280-33.4.5.4 clean cinema HUD contract',
          ]

          def indent(s):
              return len(s) - len(s.lstrip(' '))

          steps = {}
          i = 0
          while i < len(lines):
              m = re.match(r'^(\s*)- name:\s*(.+?)\s*$', lines[i])
              if not m:
                  i += 1
                  continue
              step_indent = len(m.group(1))
              name = m.group(2)
              end = len(lines)
              for k in range(i + 1, len(lines)):
                  mm = re.match(r'^(\s*)- name:\s*(.+?)\s*$', lines[k])
                  if mm and len(mm.group(1)) == step_indent:
                      end = k
                      break

              script = None
              for k in range(i + 1, end):
                  if lines[k].strip() == 'run: |':
                      run_indent = indent(lines[k])
                      content_indent = run_indent + 2
                      block = []
                      for q in range(k + 1, end):
                          ln = lines[q]
                          if not ln.strip():
                              block.append('')
                              continue
                          if indent(ln) <= run_indent:
                              break
                          block.append(ln[content_indent:] if len(ln) >= content_indent else '')
                      script = '\n'.join(block) + '\n'
                      break

              steps[name] = script
              i = end

          missing = [n for n in wanted if n not in steps or not steps[n]]
          if missing:
              raise SystemExit('Missing V280-33 replay steps: ' + ', '.join(missing))

          for name in wanted:
              print(f'\n===== V280-69.32.33.41 BASE: {name} =====', flush=True)
              with tempfile.NamedTemporaryFile('w', suffix='.sh', delete=False, encoding='utf-8') as f:
                  f.write(steps[name])
                  tmp = f.name
              try:
                  result = subprocess.run(['bash', tmp], cwd=str(Path.cwd()), env=os.environ.copy())
              finally:
                  Path(tmp).unlink(missing_ok=True)
              if result.returncode:
                  raise SystemExit(result.returncode)

          print('PASS: stable V280-33.4.5.4 source replayed.')
          PYREPLAY


      - name: Restore dfv238 master camera law and remove late HUD provider
        shell: bash
        run: |
          set -euo pipefail
          SRC='v172-source/app/src/main/java/com/sentongoharuna/pulse'
          MANIFEST='v172-source/app/src/main/AndroidManifest.xml'

          # R011-R013 are intentionally not replayed. Disable the later clean-HUD provider
          # so the camera is controlled by the dfv238 shell rather than a full-screen overlay.
          python3 - <<'PYRESET'
          from pathlib import Path
          import re
          manifest = Path('v172-source/app/src/main/AndroidManifest.xml')
          text = manifest.read_text(encoding='utf-8')
          text = re.sub(
              r'\s*<provider\b(?=[^>]*(?:CleanHudProvider|V28033454CleanHudProvider))[^>]*/>',
              '', text, flags=re.S
          )
          manifest.write_text(text, encoding='utf-8')
          print('PASS: late full-screen HUD provider registration removed where present.')
          PYRESET

          echo '' | base64 -d > /tmp/dfv238_reset_master.py
          python3 -m py_compile /tmp/dfv238_reset_master.py
          python3 /tmp/dfv238_reset_master.py

          # Remove the provider source itself only after its manifest registration is gone.
          rm -f "$SRC/DevelopUgandaV28033454CleanHudProvider.kt"

          # Minimal checks only: no fragile false-red preflight.
          test -f "$SRC/DevelopUgandaDfv238CameraShell.kt"
          grep -q 'DevelopUgandaDfv238CameraShell.attach' "$SRC/DevelopUgandaCameraActivity.kt"
          grep -q 'v237_camera_action_row' "$SRC/DevelopUgandaDfv238CameraShell.kt"
          grep -q 'LUTS is permanent' "$SRC/DevelopUgandaDfv238CameraShell.kt"
          grep -q 'versionCode = 28140' v172-source/app/build.gradle.kts
          grep -q 'versionName = "dfv238-reset-master"' v172-source/app/build.gradle.kts
          echo 'PASS: DFV238 RESET MASTER source prepared.'


      - name: Stamp R014 stable identity and audit dfv238 master contract
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PYR14'
          from pathlib import Path
          import re

          ROOT = Path('v172-source')
          SRC = ROOT / 'app/src/main/java/com/sentongoharuna/pulse'
          GRADLE = ROOT / 'app/build.gradle.kts'
          MANIFEST = ROOT / 'app/src/main/AndroidManifest.xml'
          STRINGS = ROOT / 'app/src/main/res/values/strings.xml'
          SHELL = SRC / 'DevelopUgandaDfv238CameraShell.kt'
          CAMERA = SRC / 'DevelopUgandaCameraActivity.kt'

          required = [GRADLE, MANIFEST, SHELL, CAMERA]
          missing = [str(p) for p in required if not p.exists()]
          if missing:
              raise SystemExit('R014 required source missing: ' + ', '.join(missing))

          # Keep the dfv238 reset source exactly as the design base, then give R014
          # its own install identity so it can sit beside earlier test builds.
          g = GRADLE.read_text(encoding='utf-8')
          g, n1 = re.subn(r'versionCode\s*=\s*\d+', 'versionCode = 400000022', g, count=1)
          g, n2 = re.subn(r'versionName\s*=\s*"[^"]+"', 'versionName = "1.0-r014-dfv238-master-stable"', g, count=1)
          if re.search(r'applicationId\s*=\s*"[^"]+"', g):
              g, n3 = re.subn(
                  r'applicationId\s*=\s*"[^"]+"',
                  'applicationId = "com.sentongoharuna.pulse.preview.r014dfv238"',
                  g,
                  count=1,
              )
          else:
              n3 = 0
          if n1 != 1 or n2 != 1 or n3 != 1:
              raise SystemExit(f'R014 Gradle identity update failed: versionCode={n1}, versionName={n2}, applicationId={n3}')
          GRADLE.write_text(g, encoding='utf-8')

          STRINGS.parent.mkdir(parents=True, exist_ok=True)
          if STRINGS.exists():
              s = STRINGS.read_text(encoding='utf-8')
              if re.search(r'<string\s+name="app_name"[^>]*>.*?</string>', s, flags=re.S):
                  s = re.sub(
                      r'<string\s+name="app_name"[^>]*>.*?</string>',
                      '<string name="app_name">DU Camera R014</string>',
                      s,
                      count=1,
                      flags=re.S,
                  )
              elif '</resources>' in s:
                  s = s.replace('</resources>', '    <string name="app_name">DU Camera R014</string>\n</resources>', 1)
              else:
                  raise SystemExit('R014 strings.xml has no </resources>')
          else:
              s = '<?xml version="1.0" encoding="utf-8"?>\n<resources>\n    <string name="app_name">DU Camera R014</string>\n</resources>\n'
          STRINGS.write_text(s, encoding='utf-8')

          m = MANIFEST.read_text(encoding='utf-8')
          app = re.search(r'<application\b[^>]*>', m, flags=re.S)
          if not app:
              raise SystemExit('R014 AndroidManifest has no <application> tag')
          tag = app.group(0)
          if re.search(r'android:label\s*=\s*"[^"]+"', tag):
              new_tag = re.sub(r'android:label\s*=\s*"[^"]+"', 'android:label="@string/app_name"', tag, count=1)
          else:
              new_tag = tag[:-1] + ' android:label="@string/app_name">'
          m = m[:app.start()] + new_tag + m[app.end():]
          MANIFEST.write_text(m, encoding='utf-8')

          shell = SHELL.read_text(encoding='utf-8')
          camera = CAMERA.read_text(encoding='utf-8')
          manifest_now = MANIFEST.read_text(encoding='utf-8')

          checks = {
              'dfv238 shell attached': 'DevelopUgandaDfv238CameraShell.attach' in camera,
              'LUTS protected': 'LUTS is permanent' in shell,
              'ASPECT protected': 'ASPECT and LUTS are the only two persistent top camera controls' in shell,
              'shooting action row protected': 'v237_camera_action_row' in shell,
              'right SETTINGS drawer present': 'CAMERA SETTINGS' in shell and 'setDrawer' in shell,
              'late CleanHudProvider disabled': 'V28033454CleanHudProvider' not in manifest_now and 'CleanHudProvider' not in manifest_now,
              'R014 version name': '1.0-r014-dfv238-master-stable' in GRADLE.read_text(encoding='utf-8'),
              'R014 application id': 'com.sentongoharuna.pulse.preview.r014dfv238' in GRADLE.read_text(encoding='utf-8'),
          }
          failed = [name for name, ok in checks.items() if not ok]
          report = ['R014 DFV238 MASTER CONTRACT AUDIT', '================================']
          report += [f'{"PASS" if ok else "FAIL"}  {name}' for name, ok in checks.items()]
          report.append(f'Camera click listeners: {camera.count("setOnClickListener")}')
          report.append(f'Shell click listeners: {shell.count("setOnClickListener")}')
          Path('/tmp/R014-DFV238-MASTER-AUDIT.txt').write_text('\n'.join(report) + '\n', encoding='utf-8')
          print('\n'.join(report))
          if failed:
              raise SystemExit('R014 dfv238 master contract failed: ' + ', '.join(failed))
          PYR14

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android platform
        run: sdkmanager "platforms;android-36" "build-tools;35.0.0"

      - name: Set up Gradle 8.11.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Build DU Camera R014 APK
        working-directory: v172-source
        shell: bash
        run: |
          set -o pipefail
          gradle --no-daemon :app:assembleDebug --stacktrace 2>&1 | tee du-camera-r014-build.log

      - name: Prepare DU Camera R014 APK
        shell: bash
        run: |
          set -euo pipefail
          cp v172-source/app/build/outputs/apk/debug/app-debug.apk DU-Camera-R014-DFV238-MASTER-STABLE.apk
          ls -lh DU-Camera-R014-DFV238-MASTER-STABLE.apk

      - name: Upload R014 dfv238 master audit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: R014-DFV238-MASTER-AUDIT
          path: /tmp/R014-DFV238-MASTER-AUDIT.txt
          if-no-files-found: warn
          retention-days: 14

      - name: Upload DU Camera R014 APK
        uses: actions/upload-artifact@v4
        with:
          name: DU-Camera-R014-DFV238-MASTER-STABLE
          path: DU-Camera-R014-DFV238-MASTER-STABLE.apk
          if-no-files-found: error
          retention-days: 14

      - name: Upload build log if failed
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: DU-Camera-R014-BUILD-LOG
          path: v172-source/du-camera-r014-build.log
          if-no-files-found: warn
          retention-days: 7
