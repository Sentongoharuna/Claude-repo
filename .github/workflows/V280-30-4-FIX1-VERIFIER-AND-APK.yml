name: Build develop.uganda V280-30.4 FIX1 VERIFIER + APK

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/V280-30-4-FIX1-VERIFIER-AND-APK.yml'

permissions:
  contents: read

jobs:
  build_v280_30_4_fix1:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout Claude repo
        uses: actions/checkout@v4

      - name: Replay V280-30.4 source pipeline with FIX1 verifier
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PYFIX1'
          from pathlib import Path
          import os, re, subprocess, tempfile

          workflow = Path('.github/workflows/V280-30-4-LIVE-PURPOSE-ACTION-HOME.yml')
          lines = workflow.read_text(encoding='utf-8').splitlines()
          start_name = 'Fetch verified V280-12 FIX3 stable recipe'
          end_name = 'Verify V280-30.4 live action figures dropdowns no-overlap and protected core'

          def indent(s):
              return len(s) - len(s.lstrip(' '))

          steps = []
          i = 0
          while i < len(lines):
              m = re.match(r'^(\s*)- name:\s*(.+?)\s*$', lines[i])
              if not m:
                  i += 1
                  continue
              step_indent = len(m.group(1))
              name = m.group(2)
              end = len(lines)
              for k in range(i + 1, len(lines)):
                  mm = re.match(r'^(\s*)- name:\s*(.+?)\s*$', lines[k])
                  if mm and len(mm.group(1)) == step_indent:
                      end = k
                      break
              wd = None
              script = None
              for k in range(i + 1, end):
                  s = lines[k].strip()
                  if s.startswith('working-directory:'):
                      wd = s.split(':', 1)[1].strip().strip("'\"")
                  if s == 'run: |':
                      run_indent = indent(lines[k])
                      content_indent = run_indent + 2
                      block = []
                      for q in range(k + 1, end):
                          ln = lines[q]
                          if not ln.strip():
                              block.append('')
                              continue
                          if indent(ln) <= run_indent:
                              break
                          block.append(ln[content_indent:] if len(ln) >= content_indent else '')
                      script = '\n'.join(block) + '\n'
                      break
              steps.append((name, wd, script))
              i = end

          names = [s[0] for s in steps]
          if start_name not in names or end_name not in names:
              raise SystemExit('FIX1 could not locate V280-30.4 replay boundaries')
          start = names.index(start_name)
          finish = names.index(end_name)
          selected = steps[start:finish + 1]
          missing = [name for name, _, script in selected if not script]
          if missing:
              raise SystemExit('FIX1 found non-runnable source steps: ' + ', '.join(missing))

          old_check = "grep -Fq 'body.visibility = View.GONE' \"$HUB\""
          new_check = "grep -Fq 'visibility = View.GONE' \"$HUB\"\ngrep -Fq 'body.visibility = if (open) View.VISIBLE else View.GONE' \"$HUB\""

          root = Path.cwd()
          fixed = False
          for name, wd, script in selected:
              print(f'\n===== V280-30.4 FIX1 REPLAY: {name} =====', flush=True)
              if name == end_name:
                  if script.count(old_check) != 1:
                      raise SystemExit('FIX1 expected exactly one obsolete dropdown visibility check')
                  script = script.replace(old_check, new_check, 1)
                  fixed = True
                  print('FIX1: corrected dropdown visibility verification before execution.', flush=True)
              work = (root / wd).resolve() if wd else root
              if wd and not work.exists():
                  work.mkdir(parents=True, exist_ok=True)
              with tempfile.NamedTemporaryFile('w', suffix='.sh', delete=False, encoding='utf-8') as f:
                  f.write(script)
                  tmp = f.name
              try:
                  result = subprocess.run(['bash', tmp], cwd=str(work), env=os.environ.copy())
              finally:
                  Path(tmp).unlink(missing_ok=True)
              if result.returncode:
                  raise SystemExit(result.returncode)

          if not fixed:
              raise SystemExit('FIX1 verifier correction was not applied')
          print('PASS: V280-30.4 complete source pipeline replayed with FIX1 verifier correction.')
          PYFIX1

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android platform
        shell: bash
        run: sdkmanager "platforms;android-36" "build-tools;35.0.0"

      - name: Set up Gradle 8.11.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.11.1

      - name: Build V280-30.4 FIX1 APK
        working-directory: v172-source
        shell: bash
        run: |
          set -o pipefail
          gradle --no-daemon :app:assembleDebug --stacktrace 2>&1 | tee v280304-fix1-build.log

      - name: Prepare and verify V280-30.4 FIX1 APK artifact
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          APK='v172-source/app/build/outputs/apk/debug/app-debug.apk'
          OUT='DEVELOP-UGANDA-V280-30-4-FIX1-LIVE-PURPOSE-ACTION-HOME.apk'
          test -s "$APK"
          cp "$APK" "$OUT"
          test -s "$OUT"
          echo 'PASS: FIX1 APK exists and is non-empty.'
          ls -lh "$OUT"
          sha256sum "$OUT"

      - name: Upload V280-30.4 FIX1 APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: DEVELOP-UGANDA-V280-30-4-FIX1-LIVE-PURPOSE-ACTION-HOME
          path: DEVELOP-UGANDA-V280-30-4-FIX1-LIVE-PURPOSE-ACTION-HOME.apk
          if-no-files-found: error
          compression-level: 0
          retention-days: 14

      - name: Upload V280-30.4 FIX1 audit
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: V280-30-4-FIX1-AUDIT
          path: v172-source/V280-30-4-LIVE-PURPOSE-ACTION-HOME-AUDIT.txt
          if-no-files-found: error
          retention-days: 14

      - name: Upload V280-30.4 FIX1 build log if failed
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: V280-30-4-FIX1-BUILD-LOG
          path: v172-source/v280304-fix1-build.log
          if-no-files-found: ignore
          retention-days: 7
