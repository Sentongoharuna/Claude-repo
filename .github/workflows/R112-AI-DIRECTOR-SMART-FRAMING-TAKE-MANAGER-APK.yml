name: Build Magic Pro R112 AI Director Smart Framing Take Manager

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Create R112 Android project
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p r112/app/src/main/java/com/sentongoharuna/ducamera
          cat > r112/gradle.properties <<'EOF'
          android.useAndroidX=true
          android.enableJetifier=false
          org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
          EOF
          cat > r112/settings.gradle <<'EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
                  maven { url 'https://jitpack.io' }
              }
          }
          
          rootProject.name = "DUCameraR105ThreeFace"
          include(":app")
          EOF
          cat > r112/build.gradle <<'EOF'
          plugins {
              id 'com.android.application' version '8.11.1' apply false
          }
          EOF
          cat > r112/app/build.gradle <<'EOF'
          plugins {
              id 'com.android.application'
          }
          
          android {
              namespace 'com.sentongoharuna.ducamera'
              compileSdk 36
          
              defaultConfig {
                  applicationId 'com.sentongoharuna.ducamera.r105threeface'
                  minSdk 24
                  targetSdk 35
                  versionCode 400000127
                  versionName '1.0-r112-ai-director-smart-framing-take-manager'
              }
          
              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
          }
          
          dependencies {
              implementation 'androidx.activity:activity:1.10.1'
              implementation 'androidx.core:core:1.15.0'
              implementation 'androidx.camera:camera-core:1.7.0-alpha03'
              implementation 'androidx.camera:camera-camera2:1.7.0-alpha03'
              implementation 'androidx.camera:camera-lifecycle:1.7.0-alpha03'
              implementation 'androidx.camera:camera-video:1.7.0-alpha03'
              implementation 'androidx.camera:camera-view:1.7.0-alpha03'
              implementation 'androidx.camera:camera-effects:1.7.0-alpha03'
          
              // R22 true saved-video enhancement.
              def media3_version = '1.10.1'
              implementation "androidx.media3:media3-common:${media3_version}"
              implementation "androidx.media3:media3-effect:${media3_version}"
              implementation "androidx.media3:media3-transformer:${media3_version}"
              implementation 'androidx.camera.media3:media3-effect:1.0.0-alpha04'
              implementation 'com.github.pedroSG94.RootEncoder:library:2.8.0'
          }
          EOF
          mkdir -p r112/app/src/main
          cat > r112/app/src/main/AndroidManifest.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
          
              <uses-permission android:name="android.permission.CAMERA" />
              <uses-permission android:name="android.permission.RECORD_AUDIO" />
              <uses-permission android:name="android.permission.ACCESS_FINE_LOCATION" />
              <uses-permission android:name="android.permission.ACCESS_COARSE_LOCATION" />
              <uses-permission android:name="android.permission.INTERNET" />
              <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE" />
              <uses-permission android:name="android.permission.ACCESS_WIFI_STATE" />
          
              <uses-feature
                  android:name="android.hardware.camera.any"
                  android:required="true" />
          
              <application
                  android:allowBackup="false"
                  android:label="Magic Pro R112 AI Director"
                  android:theme="@style/Theme.DUCamera">
          
                  <activity
                      android:name=".R112MagicProAiDirectorActivity"
                      android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
          
              </application>
          </manifest>
          EOF
          echo '' | base64 -d > r112/app/src/main/java/com/sentongoharuna/ducamera/R112MagicProAiDirectorActivity.java
          SRC=r112/app/src/main/java/com/sentongoharuna/ducamera/R112MagicProAiDirectorActivity.java
          grep -Fq 'public class R112MagicProAiDirectorActivity' "$SRC"
          grep -Fq 'AI DIRECTOR + SMART FRAMING' "$SRC"
          grep -Fq 'SMART TAKE MANAGER' "$SRC"
          grep -Fq 'analyzeR112Frame' "$SRC"
          grep -Fq 'R112FramingOverlay' "$SRC"
          grep -Fq 'GOOD TAKE' "$SRC"
          grep -Fq 'showR108AudioPanel()' "$SRC"
          grep -Fq 'showR108TagStudio()' "$SRC"
          grep -Fq 'showR108SafetyPanel()' "$SRC"
          grep -Fq 'showR109ToolHub()' "$SRC"
          grep -Fq 'showR111BroadcastStudio()' "$SRC"
          grep -Fq 'startR111Broadcast(' "$SRC"
          grep -Fq 'startR111RemoteServer()' "$SRC"
          grep -Fq 'r111CreateSafeCopy(' "$SRC"
          grep -Fq 'com.pedro.library.rtmp.RtmpStream' "$SRC"
          grep -Fq 'com.pedro.library.srt.SrtStream' "$SRC"
          grep -Fq 'showR110MediaStudio()' "$SRC"
          grep -Fq 'exportR110Selected(' "$SRC"
          grep -Fq 'FHD60' "$SRC"
          grep -Fq 'MIMETYPE_VIDEO_HEVC' "$SRC"
          grep -Fq 'r108MicEnabled' "$SRC"
          grep -Fq 'R107  •  SMART SCENE + QUICK PRESETS' "$SRC"
          grep -Fq 'SMART AUTO' "$SRC"
          grep -Fq 'ANALYZE NOW' "$SRC"
          grep -Fq 'QUICK PRESETS' "$SRC"
          grep -Fq 'CLEAN HUD' "$SRC"
          grep -Fq 'QualitySelector.from(Quality.FHD)' "$SRC"
          grep -Fq 'new Range<>(60, 60)' "$SRC"
          grep -Fq 'MIMETYPE_VIDEO_HEVC' "$SRC"
          grep -Fq '15_000_000' "$SRC"
          echo 'PASS: R112 AI Director + Smart Framing + Take Manager verified; R111 platform preserved.'

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android platform
        shell: bash
        run: sdkmanager "platforms;android-36" "build-tools;35.0.0"

      - name: Set up Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Build R112 APK
        working-directory: r112
        shell: bash
        run: |
          set -o pipefail
          gradle --no-daemon :app:assembleDebug --stacktrace 2>&1 | tee r112-build.log

      - name: Prepare R112 APK
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          test -s r112/app/build/outputs/apk/debug/app-debug.apk
          cp r112/app/build/outputs/apk/debug/app-debug.apk MAGIC-PRO-R112-AI-DIRECTOR-SMART-FRAMING-TAKE-MANAGER.apk
          sha256sum MAGIC-PRO-R112-AI-DIRECTOR-SMART-FRAMING-TAKE-MANAGER.apk

      - name: Upload failed build log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: R112-FAILED-BUILD-LOG
          path: r112/r112-build.log
          if-no-files-found: warn
          retention-days: 14

      - name: Upload R112 APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: MAGIC-PRO-R112-APK
          path: MAGIC-PRO-R112-AI-DIRECTOR-SMART-FRAMING-TAKE-MANAGER.apk
          if-no-files-found: error
          retention-days: 14
