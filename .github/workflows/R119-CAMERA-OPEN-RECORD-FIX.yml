name: Build Magic Pro R119 Camera Open Record Fix

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/R119-CAMERA-OPEN-RECORD-FIX.yml'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install YAML parser
        run: python -m pip install --disable-pip-version-check pyyaml

      - name: Recreate exact tested R116 engine
        shell: bash
        run: |
          set -euo pipefail
          python <<'PY'
          from pathlib import Path
          import yaml

          source = Path(".github/workflows/R116-PRODUCTION-CONTROL-CENTER-FIX3-APK.yml")
          if not source.exists():
              raise SystemExit("Missing R116 FIX3 tested-engine workflow")

          wf = yaml.safe_load(source.read_text(encoding="utf-8"))
          step = next((s for s in wf["jobs"]["build"]["steps"]
                       if s.get("name") == "Create R116 Android project"), None)
          if not step or not step.get("run"):
              raise SystemExit("R116 project generator not found")

          Path("/tmp/r116-engine.sh").write_text(step["run"], encoding="utf-8")
          print("Using the exact R116 project generator as the R119 engine foundation.")
          PY

          bash /tmp/r116-engine.sh
          test -f r116/app/src/main/java/com/sentongoharuna/ducamera/R116MagicProProductionControlActivity.java

      - name: Rebuild only the presentation layer as R119
        shell: bash
        run: |
          set -euo pipefail
          python <<'PY'
          from pathlib import Path
          import re

          java = Path("r116/app/src/main/java/com/sentongoharuna/ducamera/R116MagicProProductionControlActivity.java")
          manifest = Path("r116/app/src/main/AndroidManifest.xml")
          gradle = Path("r116/app/build.gradle")
          src = java.read_text(encoding="utf-8")

          # Known R116 FIX3 compilation repair. No engine behavior is changed.
          if "import java.io.FileOutputStream;" not in src:
              anchor = "import java.io.PrintWriter;"
              if anchor in src:
                  src = src.replace(anchor, anchor + "\nimport java.io.FileOutputStream;", 1)
              else:
                  p = src.find("\n", src.find("package "))
                  src = src[:p+1] + "import java.io.FileOutputStream;\n" + src[p+1:]

          def method_end(text, method_name):
              m = re.search(r'\bvoid\s+' + re.escape(method_name) + r'\s*\([^)]*\)\s*\{', text)
              if not m:
                  return None
              start = text.find("{", m.start())
              depth = 0
              mode = "code"
              i = start
              while i < len(text):
                  c = text[i]
                  n = text[i+1] if i + 1 < len(text) else ""
                  if mode == "code":
                      if c == '"': mode = "str"
                      elif c == "'": mode = "chr"
                      elif c == "/" and n == "/": mode = "line"; i += 1
                      elif c == "/" and n == "*": mode = "block"; i += 1
                      elif c == "{": depth += 1
                      elif c == "}":
                          depth -= 1
                          if depth == 0: return i
                  elif mode == "str":
                      if c == "\\": i += 1
                      elif c == '"': mode = "code"
                  elif mode == "chr":
                      if c == "\\": i += 1
                      elif c == "'": mode = "code"
                  elif mode == "line":
                      if c == "\n": mode = "code"
                  elif mode == "block":
                      if c == "*" and n == "/": mode = "code"; i += 1
                  i += 1
              return None

          # Install R119 after the existing R116 initialization has completed.
          if "r119InstallOrganizedCameraUi();" not in src:
              end = method_end(src, "onCreate")
              if end is None:
                  raise SystemExit("Could not safely locate onCreate()")
              call = '''
                  new android.os.Handler(android.os.Looper.getMainLooper()).postDelayed(
                          () -> r119InstallOrganizedCameraUi(), 450L);
              '''
              src = src[:end] + call + src[end:]

          if "private void r119InstallOrganizedCameraUi()" not in src:
              helper = r'''
          // ================================================================
          // MAGIC PRO R119 — ORGANIZED UI OVER THE TESTED R116 ENGINE
          // ================================================================
          private final java.util.ArrayList<android.view.View> r119Legacy =
                  new java.util.ArrayList<>();
          private android.widget.FrameLayout r119Shell;
          private android.widget.ScrollView r119Sheet;
          private android.widget.LinearLayout r119SheetBody;
          private android.widget.TextView r119Mode;

          private int r119Dp(float n) {
              return Math.round(n * getResources().getDisplayMetrics().density);
          }

          private android.graphics.drawable.GradientDrawable r119Background(
                  int fill, float radius, int stroke, int strokeWidth) {
              android.graphics.drawable.GradientDrawable g =
                      new android.graphics.drawable.GradientDrawable();
              g.setColor(fill);
              g.setCornerRadius(r119Dp(radius));
              if (strokeWidth > 0) g.setStroke(r119Dp(strokeWidth), stroke);
              return g;
          }

          private android.widget.TextView r119Label(String text, float sp) {
              android.widget.TextView v = new android.widget.TextView(this);
              v.setText(text);
              v.setTextColor(0xFFF4F1E8);
              v.setTextSize(sp);
              v.setTypeface(android.graphics.Typeface.MONOSPACE);
              v.setGravity(android.view.Gravity.CENTER);
              v.setPadding(r119Dp(8), r119Dp(8), r119Dp(8), r119Dp(8));
              v.setMinHeight(r119Dp(44));
              return v;
          }

          private String r119Norm(String s) {
              return s == null ? "" :
                      s.toUpperCase(java.util.Locale.US).replace("\n", " ")
                       .replaceAll("\\s+", " ").trim();
          }

          private void r119Collect(android.view.View v) {
              if (v == null) return;
              if (v instanceof android.widget.TextView && v.hasOnClickListeners()) {
                  CharSequence t = ((android.widget.TextView) v).getText();
                  if (t != null && t.length() > 0) r119Legacy.add(v);
              }
              if (v instanceof android.view.ViewGroup) {
                  android.view.ViewGroup g = (android.view.ViewGroup) v;
                  for (int i = 0; i < g.getChildCount(); i++) r119Collect(g.getChildAt(i));
              }
          }

          private androidx.camera.view.PreviewView r119Preview(android.view.View v) {
              if (v instanceof androidx.camera.view.PreviewView)
                  return (androidx.camera.view.PreviewView) v;
              if (v instanceof android.view.ViewGroup) {
                  android.view.ViewGroup g = (android.view.ViewGroup) v;
                  for (int i = 0; i < g.getChildCount(); i++) {
                      androidx.camera.view.PreviewView p = r119Preview(g.getChildAt(i));
                      if (p != null) return p;
                  }
              }
              return null;
          }

          private boolean r119Matches(android.view.View v, String... keys) {
              if (!(v instanceof android.widget.TextView) || !v.hasOnClickListeners()) return false;
              String text = r119Norm(((android.widget.TextView) v).getText().toString());
              for (String key : keys) {
                  String k = r119Norm(key);
                  if (!k.isEmpty() && (text.equals(k) || text.startsWith(k + " ") || text.contains(k)))
                      return true;
              }
              return false;
          }

          private boolean r119Has(String... keys) {
              for (android.view.View v : r119Legacy) if (r119Matches(v, keys)) return true;
              return false;
          }

          private boolean r119Click(String... keys) {
              java.util.ArrayList<android.view.View> matches = new java.util.ArrayList<>();
              for (android.view.View v : r119Legacy) if (r119Matches(v, keys)) matches.add(v);
              java.util.Collections.sort(matches, (a, b) ->
                      Integer.compare(((android.widget.TextView)a).getText().length(),
                                      ((android.widget.TextView)b).getText().length()));
              for (android.view.View v : matches) {
                  // performClick() invokes the already-tested R116/R60-lineage listener
                  // without touching CameraX binding or rebuilding the capture session.
                  if (v.performClick()) return true;
              }
              return false;
          }

          private android.widget.TextView r119Action(String label, String... keys) {
              if (!r119Has(keys)) return null; // no fake unsupported controls
              android.widget.TextView b = r119Label(label, 11f);
              b.setTypeface(android.graphics.Typeface.DEFAULT_BOLD);
              b.setBackground(r119Background(0xF0191B1D, 11, 0x553A3E42, 1));
              b.setOnClickListener(v -> {
                  if (!r119Click(keys)) android.widget.Toast.makeText(
                          this, label + " unavailable", android.widget.Toast.LENGTH_SHORT).show();
              });
              return b;
          }

          private android.widget.LinearLayout r119Row() {
              android.widget.LinearLayout r = new android.widget.LinearLayout(this);
              r.setOrientation(android.widget.LinearLayout.HORIZONTAL);
              r.setGravity(android.view.Gravity.CENTER);
              return r;
          }

          private void r119Put(android.widget.LinearLayout row, String label, String... keys) {
              android.widget.TextView b = r119Action(label, keys);
              if (b == null) return;
              android.widget.LinearLayout.LayoutParams lp =
                      new android.widget.LinearLayout.LayoutParams(0, r119Dp(46), 1f);
              lp.setMargins(r119Dp(3), r119Dp(3), r119Dp(3), r119Dp(3));
              row.addView(b, lp);
          }

          private void r119Section(String title) {
