          private void r119InstallOrganizedCameraUi() {
              if (r119Shell != null) return;
              android.widget.FrameLayout content =
                      (android.widget.FrameLayout)findViewById(android.R.id.content);
              if (content == null || content.getChildCount() == 0) return;

              r119Legacy.clear();
              r119Collect(content);

              // R119 CAMERA FIX:
              // NEVER detach, remove, or re-parent the PreviewView.
              // The tested camera engine owns its original view hierarchy and Surface.
              // We only place the new UI as an overlay on top.
              androidx.camera.view.PreviewView preview = r119Preview(content);
              if (preview == null) {
                  android.widget.Toast.makeText(this,
                          "Camera preview is starting...",
                          android.widget.Toast.LENGTH_SHORT).show();
              }

              // Hide only the old clickable labels/buttons. Their listeners remain alive,
              // so R119 controls can forward actions to the tested engine with performClick().
              for (android.view.View legacyView : r119Legacy) {
                  legacyView.setVisibility(android.view.View.INVISIBLE);
              }

              r119Shell = new android.widget.FrameLayout(this);
              r119Shell.setClipChildren(false);
              r119Shell.setClipToPadding(false);
              r119Shell.setBackgroundColor(android.graphics.Color.TRANSPARENT);
              content.addView(r119Shell, new android.widget.FrameLayout.LayoutParams(
                      android.view.ViewGroup.LayoutParams.MATCH_PARENT,
                      android.view.ViewGroup.LayoutParams.MATCH_PARENT));

              // Top status strip.
              android.widget.LinearLayout top = new android.widget.LinearLayout(this);
              top.setOrientation(android.widget.LinearLayout.HORIZONTAL);
              top.setGravity(android.view.Gravity.CENTER_VERTICAL);
              top.setPadding(r119Dp(12), 0, r119Dp(8), 0);
              top.setBackground(r119Background(0xF00E0F10, 0, 0, 0));

              android.widget.TextView brand = r119Label("MAGIC PRO  /  CAMERA SYSTEM", 12.5f);
              brand.setGravity(android.view.Gravity.START | android.view.Gravity.CENTER_VERTICAL);
              brand.setTypeface(android.graphics.Typeface.DEFAULT_BOLD);
              top.addView(brand, new android.widget.LinearLayout.LayoutParams(
                      0, android.view.ViewGroup.LayoutParams.MATCH_PARENT, 1f));

              r119Mode = r119Label("● PRO", 10.5f);
              r119Mode.setTextColor(0xFF9EA4A8);
              top.addView(r119Mode);

              android.widget.TextView settings = r119Label("SYS", 10f);
              settings.setTypeface(android.graphics.Typeface.DEFAULT_BOLD);
              settings.setOnClickListener(v -> r119Show("SETTINGS"));
              top.addView(settings);

              android.widget.FrameLayout.LayoutParams topP =
                      new android.widget.FrameLayout.LayoutParams(
                              android.view.ViewGroup.LayoutParams.MATCH_PARENT, r119Dp(52),
                              android.view.Gravity.TOP);
              r119Shell.addView(top, topP);

              android.widget.TextView statusLine = r119Label("● CAMERA ENGINE TEST / UI STEP 1", 9.5f);
              statusLine.setTextColor(0xFFFF6A2A);
              statusLine.setGravity(android.view.Gravity.START | android.view.Gravity.CENTER_VERTICAL);
              statusLine.setBackground(r119Background(0xB30E0F10, 0, 0, 0));
              android.widget.FrameLayout.LayoutParams statusP =
                      new android.widget.FrameLayout.LayoutParams(
                              android.view.ViewGroup.LayoutParams.MATCH_PARENT, r119Dp(28),
                              android.view.Gravity.TOP);
              statusP.topMargin = r119Dp(52);
              statusP.leftMargin = r119Dp(12);
              statusP.rightMargin = r119Dp(12);
              r119Shell.addView(statusLine, statusP);

              // Left exposure rail — only real existing controls are shown.
              android.widget.LinearLayout left = new android.widget.LinearLayout(this);
              left.setOrientation(android.widget.LinearLayout.VERTICAL);
              left.setGravity(android.view.Gravity.CENTER);
              String[][] leftData = {
                      {"ISO","ISO"}, {"SHUT","SHUTTER"}, {"WB","WB"},
                      {"FOCUS","FOCUS"}, {"EV","EV"}, {"LUT","LUT"}
              };
              for (String[] x : leftData) {
                  android.widget.TextView b = r119Action(x[0], x[1]);
                  if (b != null) {
