    - name: Set up Java 17
      uses: actions/setup-java@v4
      with:
        distribution: temurin
        java-version: '17'
    - name: Set up Android SDK
      uses: android-actions/setup-android@v3
    - name: Install Android platform
      shell: bash
      run: sdkmanager "platforms;android-36" "build-tools;35.0.0"
    - name: Set up Gradle 8.13
      uses: gradle/actions/setup-gradle@v4
      with:
        gradle-version: 8.13
    - name: Build R107 APK
      working-directory: r50-texture
      shell: bash
      run: 'set -o pipefail

        gradle --no-daemon :app:assembleDebug --stacktrace 2>&1 | tee r092-build.log

        '
    - name: Prepare R107 APK
      if: success()
      shell: bash
      run: 'set -euo pipefail

        APK=''r50-texture/app/build/outputs/apk/debug/app-debug.apk''

        OUT=''MAGIC-PRO-R108-REAL-3-PAGE-V280-R60-ENGINE.apk''

        test -s "$APK"

        cp "$APK" "$OUT"

        ls -lh "$OUT"

        sha256sum "$OUT"

        '
    - name: Upload R107 failed build log
      if: failure()
      uses: actions/upload-artifact@v4
      with:
        name: R108-FAILED-BUILD-LOG
        path: r50-texture/r092-build.log
        if-no-files-found: warn
        retention-days: 14
    - name: Upload R107 APK
      if: success()
      uses: actions/upload-artifact@v4
      with:
        name: MAGIC-PRO-R108-APK
        path: MAGIC-PRO-R108-REAL-3-PAGE-V280-R60-ENGINE.apk
        if-no-files-found: error
        retention-days: 14
