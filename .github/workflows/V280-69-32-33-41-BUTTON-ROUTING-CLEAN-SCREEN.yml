      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android platform
        shell: bash
        run: sdkmanager "platforms;android-36" "build-tools;35.0.0"

      - name: Set up Gradle 8.11.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.11.1

      - name: Build V280-69.32.33.41 APK
        working-directory: v172-source
        shell: bash
        run: |
          set -o pipefail
          gradle --no-daemon :app:assembleDebug --stacktrace 2>&1 | tee v28069323341-build.log

      - name: Prepare V280-69.32.33.41 APK
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          APK='v172-source/app/build/outputs/apk/debug/app-debug.apk'
          OUT='V280-69-32-33-41-DEVELOP-UGANDA-DOUBLE-TAP-RESET.apk'
          test -s "$APK"
          cp "$APK" "$OUT"
          test -s "$OUT"
          ls -lh "$OUT"
          sha256sum "$OUT"

      - name: Upload V280-69.32.33.41 camera function audit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: V280-69-32-33-41-CAMERA-FUNCTION-AUDIT
          path: /tmp/V280-69-32-33-41-CAMERA-FUNCTION-AUDIT.txt
          if-no-files-found: warn
          retention-days: 14

      - name: Upload V280-69.32.33.41 DOUBLE TAP RESET APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: V280-69-32-33-41-DEVELOP-UGANDA-DOUBLE-TAP-RESET
          path: V280-69-32-33-41-DEVELOP-UGANDA-DOUBLE-TAP-RESET.apk
          if-no-files-found: error
          compression-level: 0
          retention-days: 14

      - name: Upload V280-69.32.33.41 build log if failed
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: V280-69-32-33-41-BUILD-LOG
