          lines = text.splitlines(keepends=True)
          declaration = next(
              (i for i, line in enumerate(lines) if 'fun wakeIdleHud() {' in line),
              None
          )
          if declaration is None:
              raise SystemExit('wakeIdleHud declaration is missing')

          removed = 0
          repaired = []
          for i, line in enumerate(lines):
              if i < declaration and line.strip() == 'wakeIdleHud()':
                  removed += 1
                  continue
              repaired.append(line)

          text = ''.join(repaired)
          declaration_offset = text.index('fun wakeIdleHud() {')
          if 'wakeIdleHud()' in text[:declaration_offset]:
              raise SystemExit('A wakeIdleHud call still appears before its local declaration')

          if text[declaration_offset:].count('wakeIdleHud()') < 3:
              raise SystemExit('Later HUD wake behavior was not preserved')

          source.write_text(text, encoding='utf-8')
          print(
              f'PASS: removed {removed} premature wakeIdleHud call(s); '
              'later HUD wake behavior preserved.'
          )
          PYKOTLINORDER

      - name: Repair settings touch routing and remove lower legacy overlays
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PYBUTTONROUTING'
          from pathlib import Path

          source = Path(
              'v172-source/app/src/main/java/com/sentongoharuna/pulse/'
              'DevelopUgandaV28033454CleanHudProvider.kt'
          )
          text = source.read_text(encoding='utf-8')

          old_bottom = '''                            "CHECK BEFORE REC" in upper
                        )'''
          clean_bottom = '''                            "CHECK BEFORE REC" in upper ||
                            "VERTICAL 9:16" in upper ||
                            "PREVIEW HISTOGRAM" in upper ||
                            "STEADYSHOT" in upper ||
                            "LIGHT • DARK" in upper ||
                            "AUDIO • MIC READY" in upper ||
                            "THERMAL • NORMAL" in upper ||
                            "FIELD PROJECT" in upper ||
                            "READY • WATCH" in upper
                        )'''
          if text.count(old_bottom) != 1:
              raise SystemExit('Legacy lower-overlay cleanup anchor missing')
          text = text.replace(old_bottom, clean_bottom, 1)

          guard_anchor = '''        ghostCleanupHandler.postDelayed({ removeOldCameraGhosts() }, 1800L)

        // Number every visible build so side-by-side installs are instantly identifiable.'''
          guard = '''        ghostCleanupHandler.postDelayed({ removeOldCameraGhosts() }, 1800L)

        // The settings surface is hosted inside the camera Activity. Hide this HUD
        // whenever that surface exposes its own CLOSE/BACK control, otherwise the
        // full-screen transparent overlay intercepts settings taps.
        fun isVisibleThroughParents(view: View): Boolean {
            var current: View? = view
            repeat(12) {
                val node = current ?: return true
                if (node.visibility != View.VISIBLE || node.alpha <= 0.02f) return false
                current = node.parent as? View
            }
            return true
        }

        val settingsRouteHandler = Handler(Looper.getMainLooper())
        val settingsRouteGuard = object : Runnable {
            override fun run() {
                val live = mutableListOf<TextView>()
                walk(decor, live)
                val settingsOpen = live.any { tv ->
                    if (insideNewHud(tv) || !isVisibleThroughParents(tv)) return@any false
                    val label = tv.text?.toString()?.uppercase()?.replace("\\n", " ")?.trim().orEmpty()
                    label == "CLOSE" || label == "BACK" || label.startsWith("CLOSE ")
                }
                overlay.visibility = if (settingsOpen) View.GONE else View.VISIBLE
                settingsRouteHandler.postDelayed(this, 180L)
            }
        }
        settingsRouteHandler.post(settingsRouteGuard)

        // Number every visible build so side-by-side installs are instantly identifiable.'''
          if text.count(guard_anchor) != 1:
              raise SystemExit('Settings routing guard anchor missing')
          text = text.replace(guard_anchor, guard, 1)

          source.write_text(text, encoding='utf-8')
          print('PASS: settings owns touch input while open; lower legacy overlays removed.')
          PYBUTTONROUTING

