                  fun setIdleHudVisible(visible: Boolean) {
                      if (recording) return

                      idleHudHidden = !visible
                      telemetry.visibility = if (visible) View.VISIBLE else View.GONE
                      safePill.visibility = if (visible) View.VISIBLE else View.GONE
                      slatePill.visibility = if (visible) View.VISIBLE else View.GONE
                      drawerTab.visibility = if (visible) View.VISIBLE else View.GONE
