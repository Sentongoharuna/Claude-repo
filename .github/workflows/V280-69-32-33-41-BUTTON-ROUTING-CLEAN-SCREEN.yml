                      handler.postDelayed(hideTemporary, 1000L)
                  }

                  overlayActions["RESET EXP"] = {
                      resetExposureWithFeedback()
                      Toast.makeText(
                          activity,
                          "Exposure reset to ${dialController.value("EXPOSURE")}",
                          Toast.LENGTH_SHORT
                      ).show()
                  }

                  overlayActions["RESET ZOOM"] = {
                      resetZoomWithFeedback()
                      Toast.makeText(
                          activity,
                          "Zoom reset to ${dialController.value("ZOOM")}",
                          Toast.LENGTH_SHORT
                      ).show()
                  }

                  val pendingSingleTap = Runnable {
                      if (recording) return@Runnable

                      val ok = dialController.tapMeter(
                          pendingTapX,
                          pendingTapY,
                          w,
                          h
                      )
                      showFocusReticle(
                          pendingTapX,
                          pendingTapY,
                          if (ok) "AF/AE" else "N/A",
                          false
                      )
                  }

                  overlay.setOnTouchListener { _, event ->
                      if (recording) return@setOnTouchListener false

                      scaleDetector.onTouchEvent(event)

                      if (event.pointerCount > 1 || pinchActive) {
                          if (event.actionMasked == MotionEvent.ACTION_UP ||
                              event.actionMasked == MotionEvent.ACTION_CANCEL
                          ) {
                              pinchActive = false
                          }
                          return@setOnTouchListener true
                      }

                      if (event.action == MotionEvent.ACTION_DOWN) {
                          wakeIdleHud()
                      }

                      val leftEdge = event.x < w * 0.12f
                      val rightEdge = event.x > w * 0.88f
                      val centerZone = !leftEdge && !rightEdge

                      when (event.action) {
                          MotionEvent.ACTION_DOWN -> {
                              touchDownAt = SystemClock.elapsedRealtime()
                              edgeLastY = event.y
                              edgeTravel = 0f
                              edgeGesture =
                                  when {
                                      leftEdge -> "EXPOSURE"
                                      rightEdge -> "ZOOM"
                                      else -> null
                                  }

                              when (edgeGesture) {
                                  "EXPOSURE" -> {
                                      exposureMeter.text =
                                          edgeRulerText(
                                              "EXP",
                                              dialController.value("EXPOSURE")
                                          )
                                      exposureMeter.visibility = View.VISIBLE
                                      zoomMeter.visibility = View.GONE
                                  }

                                  "ZOOM" -> {
                                      zoomMeter.text =
                                          edgeRulerText(
                                              "ZOOM",
                                              dialController.value("ZOOM")
                                          )
                                      zoomMeter.visibility = View.VISIBLE
                                      exposureMeter.visibility = View.GONE
                                  }

                                  else -> {
                                      showFocusReticle(
                                          event.x,
                                          event.y,
                                          if (dialController.isMeteringLocked()) "LOCKED" else "METER",
                                          dialController.isMeteringLocked()
                                      )
                                  }
                              }

                              handler.removeCallbacks(hideTemporary)
                              true
                          }

                          MotionEvent.ACTION_MOVE -> {
                              val key = edgeGesture
                              if (key != null) {
                                  val dy = edgeLastY - event.y
                                  edgeTravel += dy
                                  edgeLastY = event.y

                                  val threshold = dp(activity, 22).toFloat()
                                  val steps = (edgeTravel / threshold).toInt()

                                  if (steps != 0) {
                                      applyEdgeStep(key, steps.coerceIn(-3, 3))
                                      edgeTravel -= steps * threshold
                                  }
                                  true
                              } else {
                                  true
                              }
                          }

                          MotionEvent.ACTION_UP -> {
                              val now = SystemClock.elapsedRealtime()
                              val held = now - touchDownAt
                              val edgeWasActive = edgeGesture != null

                              if (!edgeWasActive && centerZone) {
                                  if (held >= 520L) {
                                      handler.removeCallbacks(pendingSingleTap)
                                      lastTapUpAt = 0L

                                      val ok = dialController.lockMeteringAt(
                                          event.x,
                                          event.y,
                                          w,
                                          h
                                      )
                                      if (ok) {
                                          showFocusReticle(event.x, event.y, "AF/AE LOCK", true)
                                          meterLockButton.text = "AF/AE METER LOCK\nLOCKED"
                                          Toast.makeText(
                                              activity,
                                              "AF/AE locked at this point",
                                              Toast.LENGTH_SHORT
                                          ).show()
                                      } else {
                                          Toast.makeText(
                                              activity,
                                              "AF/AE lock unavailable",
                                              Toast.LENGTH_SHORT
                                          ).show()
                                      }
                                  } else {
                                      val dt = now - lastTapUpAt
                                      val dx = event.x - lastTapX
                                      val dy = event.y - lastTapY
                                      val distance2 = dx * dx + dy * dy
                                      val maxDistance = dp(activity, 80).toFloat()
                                      val isDoubleTap =
                                          lastTapUpAt > 0L &&
                                              dt in 40L..320L &&
                                              distance2 <= maxDistance * maxDistance

                                      if (isDoubleTap) {
                                          handler.removeCallbacks(pendingSingleTap)
                                          lastTapUpAt = 0L

                                          if (event.x < w * 0.5f) {
                                              resetExposureWithFeedback()
                                              Toast.makeText(
                                                  activity,
                                                  "Double tap: exposure reset",
                                                  Toast.LENGTH_SHORT
                                              ).show()
                                          } else {
                                              resetZoomWithFeedback()
                                              Toast.makeText(
                                                  activity,
                                                  "Double tap: zoom reset to 1x",
                                                  Toast.LENGTH_SHORT
                                              ).show()
                                          }
                                      } else {
                                          lastTapUpAt = now
                                          lastTapX = event.x
                                          lastTapY = event.y
                                          pendingTapX = event.x
                                          pendingTapY = event.y
                                          handler.removeCallbacks(pendingSingleTap)
                                          handler.postDelayed(pendingSingleTap, 330L)
                                      }
                                  }
                              }

                              edgeGesture = null
                              edgeTravel = 0f
                              handler.removeCallbacks(hideTemporary)
                              handler.postDelayed(hideTemporary, 950L)
                              true
                          }

                          MotionEvent.ACTION_CANCEL -> {
                              handler.removeCallbacks(pendingSingleTap)
                              edgeGesture = null
                              edgeTravel = 0f
                              handler.removeCallbacks(hideTemporary)
                              handler.postDelayed(hideTemporary, 500L)
                              true
                          }

                          else -> false
                      }
                  }

                  val telemetryTicker = object : Runnable {
                      override fun run() {
                          if (!overlay.isAttachedToWindow) return
                          val limits = dialController.hardwareLimits()
                          telemetry.text =
                              dialController.telemetry() +
                              if (limits.manualSensor) " • MANUAL ✓" else " • AUTO HW"
                          handler.postDelayed(this, 650L)
                      }
                  }
                  handler.post(telemetryTicker)

                  val safetyTicker = object : Runnable {
                      override fun run() {
                          if (!overlay.isAttachedToWindow) return

                          val real = recPreflight(activity, dialController)
                          val legacy = warningState(textViews)
                          val warn = real.warning || legacy.first
                          val reason =
                              if (real.warning) real.reason
                              else if (legacy.first) legacy.second
                              else "READY"

                          if (!recording) {
                              safePill.text = "V280/69\n$reason"
                              safePill.background = GradientDrawable().apply {
                                  cornerRadius = dp(activity, 10).toFloat()
                                  setColor(BUTTON)
                                  setStroke(
                                      dp(activity, 1),
                                      if (real.critical) RED else if (warn) WARN else SAFE
                                  )
                              }

                              rec.background = GradientDrawable().apply {
                                  shape = GradientDrawable.OVAL
                                  setColor(0xF23D0509.toInt())
                                  setStroke(dp(activity, 2), if (warn) WARN else RED)
                              }
                          }

                          handler.postDelayed(this, 900L)
                      }
                  }
                  handler.post(safetyTicker)
                  wakeIdleHud()

                  fun enterRecordMode() {
                      drawer.visibility = View.GONE
                      drawerTab.visibility = View.GONE
                      dialsTab.visibility = View.GONE
                      quickAccess.visibility = View.GONE
                      telemetry.visibility = View.GONE
                      presets.visibility = View.GONE
                      dialPanel.visibility = View.GONE
                      functionPanel.visibility = View.GONE
                      selfTestPanel.visibility = View.GONE
                      safePill.visibility = View.GONE
                      slatePill.visibility = View.GONE
                      recordGuardPill.visibility =
                          if (recordGuardEnabled && !warningOnlyHud) View.VISIBLE else View.GONE
                      recHealthPill.visibility =
                          if (warningOnlyHud) View.GONE else View.VISIBLE
                      exposureMeter.visibility = View.GONE
                      zoomMeter.visibility = View.GONE
                      focusReticle.visibility = View.GONE
                  }

                  fun exitRecordMode() {
                      drawerTab.visibility = View.VISIBLE
                      dialsTab.visibility = View.VISIBLE
                      quickAccess.visibility = View.VISIBLE
                      telemetry.visibility = View.VISIBLE
                      recordGuardPill.visibility = View.GONE
                      recHealthPill.visibility = View.GONE
                      if (dialController.isMeteringLocked()) {
                          focusReticle.visibility = View.VISIBLE
                          focusReticle.text = "◎\nAF/AE LOCK"
                          focusReticle.setTextColor(WARN)
                      }
                      if (horizonVisible) {
                          horizonLine.visibility = View.VISIBLE
                          horizonReadout.visibility = View.VISIBLE
                          steadyReadout.visibility = View.VISIBLE
                      }
                      safePill.visibility = View.VISIBLE
                      slatePill.visibility = View.VISIBLE
                      refreshSlateUi()
                      wakeIdleHud()
                  }

                  val pulse = object : Runnable {
                      override fun run() {
                          if (!recording || !rec.isAttachedToWindow) return

                          val elapsed = (SystemClock.elapsedRealtime() - startedAt) / 1000L
                          rec.text = "REC\n%02d:%02d".format(elapsed / 60L, elapsed % 60L)

                          bright = !bright
                          rec.animate().cancel()
                          rec.animate()
                              .alpha(if (bright) 1f else 0.20f)
                              .scaleX(if (bright) 1.16f else 1f)
                              .scaleY(if (bright) 1.16f else 1f)
                              .setDuration(210)
                              .start()

                          handler.postDelayed(this, 310L)
                      }
                  }

                  val recordGuard = object : Runnable {
                      override fun run() {
                          if (!overlay.isAttachedToWindow) return
                          if (!recording) return

                          val check = recPreflight(activity, dialController)
                          if (lastHealthyFreeGb <= 0.0 || !check.warning) {
                              lastHealthyFreeGb = check.freeGb
                          }

                          val level =
                              if (check.critical) 2
                              else if (check.warning) 1
                              else 0

                          // Haptic feedback only when health level changes.
                          if (level != lastGuardLevel) {
                              when (level) {
                                  2 -> rec.performHapticFeedback(HapticFeedbackConstants.LONG_PRESS)
                                  1 -> rec.performHapticFeedback(HapticFeedbackConstants.CLOCK_TICK)
                              }
                              lastGuardLevel = level
                          }

                          recHealthPill.text =
                              "REC HEALTH\n${compactRecHealth(check)}"
                          recHealthPill.background = GradientDrawable().apply {
                              cornerRadius = dp(activity, 10).toFloat()
                              setColor(BUTTON)
                              setStroke(
                                  dp(activity, 1),
                                  if (check.critical) RED else if (check.warning) WARN else SAFE
                              )
                          }

                          recordGuardPill.text =
                              if (check.critical) "GUARD\n${check.reason}"
                              else if (check.warning) "GUARD\n${check.reason}"
                              else "GUARD\nREADY"

                          recordGuardPill.background = GradientDrawable().apply {
                              cornerRadius = dp(activity, 10).toFloat()
                              setColor(BUTTON)
                              setStroke(
                                  dp(activity, 1),
                                  if (check.critical) RED else if (check.warning) WARN else SAFE
                              )
                          }

                          // Keep the camera image clean when everything is healthy.
                          if (warningOnlyHud) {
                              val show = check.warning || check.critical
                              recHealthPill.visibility =
                                  if (show) View.VISIBLE else View.GONE
                              recordGuardPill.visibility =
                                  if (recordGuardEnabled && show) View.VISIBLE else View.GONE
                          } else {
                              recHealthPill.visibility = View.VISIBLE
                              recordGuardPill.visibility =
                                  if (recordGuardEnabled) View.VISIBLE else View.GONE
                          }

                          if (recordGuardEnabled && check.critical) {
                              recordGuardTrips += 1

                              // Require two consecutive critical samples before protective stop.
                              if (recordGuardTrips >= 2) {
                                  trigger("REC")
                                  recording = false

                                  val protectedDuration =
                                      ((SystemClock.elapsedRealtime() - startedAt) / 1000L)
                                          .coerceAtLeast(0L)
                                  val protectedMarkerText =
                                      if (takeMarkers.isEmpty()) "none"
                                      else takeMarkers.joinToString(", ") {
                                          "%02d:%02d".format(it / 60L, it % 60L)
                                      }
                                  val protectedSummary =
                                      "PROTECTED %s • %02d:%02d • MARKERS %s • %s".format(
                                          activeSlateLabel,
                                          protectedDuration / 60L,
                                          protectedDuration % 60L,
                                          protectedMarkerText,
                                          takeStartSnapshot
                                      )
                                  takeLogPrefs.edit()
                                      .putString("last_take_summary", protectedSummary)
                                      .putLong("last_take_duration_seconds", protectedDuration)
                                      .putInt("last_take_marker_count", takeMarkers.size)
                                      .putString("last_take_slate", activeSlateLabel)
                                      .putInt("last_take_scene", sceneNumber)
                                      .putString("last_take_shot", shotLetter())
                                      .putInt("last_take_number", takeNumber)
                                      .apply()

                                  if (recordLocksEngaged) {
                                      dialController.releaseRecordLocks()
                                      recordLocksEngaged = false
                                  }
                                  exitRecordMode()
                                  handler.removeCallbacks(pulse)
                                  rec.animate().cancel()
                                  rec.alpha = 1f
                                  rec.scaleX = 1f
                                  rec.scaleY = 1f
                                  rec.text = "REC\nSTOPPED"
                                  Toast.makeText(
                                      activity,
                                      "Recording stopped to protect the clip: ${check.reason}",
                                      Toast.LENGTH_LONG
                                  ).show()
                                  recordGuardTrips = 0
                                  lastGuardLevel = 0
                                  return
                              }
                          } else {
                              recordGuardTrips = 0
                          }

                          handler.postDelayed(this, 1500L)
                      }
                  }

                  rec.setOnLongClickListener {
                      if (!recording) {
                          val summary =
                              takeLogPrefs.getString("last_take_summary", "No completed take yet")
                                  ?: "No completed take yet"
                          Toast.makeText(activity, summary, Toast.LENGTH_LONG).show()
                          return@setOnLongClickListener true
                      }

                      val elapsed =
                          ((SystemClock.elapsedRealtime() - startedAt) / 1000L)
                              .coerceAtLeast(0L)
                      takeMarkers += elapsed
                      rec.performHapticFeedback(HapticFeedbackConstants.CLOCK_TICK)
                      rec.text =
                          "MARK\n%02d:%02d".format(elapsed / 60L, elapsed % 60L)
                      Toast.makeText(
                          activity,
                          "Marker ${takeMarkers.size} at %02d:%02d".format(
                              elapsed / 60L,
                              elapsed % 60L
                          ),
                          Toast.LENGTH_SHORT
                      ).show()
                      true
                  }

                  overlayActions["REC MARK"] = { rec.performLongClick() }

                  rec.setOnClickListener {
                      val real = recPreflight(activity, dialController)
                      val legacy = warningState(textViews)
                      val warn = real.warning || legacy.first
                      val reason =
                          if (real.warning) real.reason
                          else if (legacy.first) legacy.second
                          else "READY"

                      if (!recording && warn) {
                          Toast.makeText(
                              activity,
                              "PRE-REC $reason • ${real.details()}",
                              Toast.LENGTH_LONG
                          ).show()
                      }

                      val startingRecord = !recording
                      if (startingRecord && recordLockEnabled) {
                          recordLocksEngaged = dialController.engageRecordLocks()
                          if (!recordLocksEngaged && dialController.recordLockAvailable()) {
                              Toast.makeText(
                                  activity,
                                  "CINE record lock could not be applied",
                                  Toast.LENGTH_SHORT
                              ).show()
                          }
                      }

                      trigger("REC")
                      recording = !recording

                      if (recording) {
                          enterRecordMode()
                          startedAt = SystemClock.elapsedRealtime()
                          takeMarkers.clear()
                          takeNumber += 1
                          persistSlate()
                          activeSlateLabel = slateLabel(nextTake = false)
                          takeStartSnapshot = dialController.takeSnapshot()
                          recordGuardTrips = 0
                          lastGuardLevel = 0
                          lastHealthyFreeGb = recPreflight(activity, dialController).freeGb
                          rec.background = GradientDrawable().apply {
                              shape = GradientDrawable.OVAL
                              setColor(0xF266050A.toInt())
                              setStroke(dp(activity, 3), RED)
                          }
                          handler.removeCallbacks(pulse)
                          handler.removeCallbacks(recordGuard)
                          handler.post(pulse)
                          if (recordGuardEnabled) handler.post(recordGuard)
                      } else {
                          val duration =
                              ((SystemClock.elapsedRealtime() - startedAt) / 1000L)
                                  .coerceAtLeast(0L)
                          val markerText =
                              if (takeMarkers.isEmpty()) "none"
                              else takeMarkers.joinToString(", ") {
                                  "%02d:%02d".format(it / 60L, it % 60L)
                              }
                          val takeSummary =
                              "%s • %02d:%02d • MARKERS %s • %s".format(
                                  activeSlateLabel,
                                  duration / 60L,
                                  duration % 60L,
                                  markerText,
                                  takeStartSnapshot
                              )
                          takeLogPrefs.edit()
                              .putString("last_take_summary", takeSummary)
                              .putLong("last_take_duration_seconds", duration)
                              .putInt("last_take_marker_count", takeMarkers.size)
                              .putString("last_take_slate", activeSlateLabel)
                              .putInt("last_take_scene", sceneNumber)
                              .putString("last_take_shot", shotLetter())
                              .putInt("last_take_number", takeNumber)
                              .apply()

                          if (recordLocksEngaged) {
                              dialController.releaseRecordLocks()
                              recordLocksEngaged = false
                          }
                          exitRecordMode()
                          handler.removeCallbacks(pulse)
                          handler.removeCallbacks(recordGuard)
                          lastGuardLevel = 0
                          rec.animate().cancel()
                          rec.alpha = 1f
                          rec.scaleX = 1f
                          rec.scaleY = 1f
                          rec.text = "REC\n00:00"
                      }
                  }
              }
          }
          KOTLIN

