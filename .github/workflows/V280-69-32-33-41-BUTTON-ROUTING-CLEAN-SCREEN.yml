                  val scaleDetector = ScaleGestureDetector(
                      activity,
                      object : ScaleGestureDetector.SimpleOnScaleGestureListener() {
                          override fun onScaleBegin(detector: ScaleGestureDetector): Boolean {
                              if (recording) return false
                              wakeIdleHud()
                              pinchActive = true
                              pinchStartZoom = dialController.currentZoomRatio()
                              zoomMeter.text =
                                  edgeRulerText(
                                      "ZOOM",
                                      String.format("%.1fx", pinchStartZoom)
                                  )
                              zoomMeter.visibility = View.VISIBLE
                              exposureMeter.visibility = View.GONE
                              handler.removeCallbacks(hideTemporary)
                              return true
                          }

                          override fun onScale(detector: ScaleGestureDetector): Boolean {
                              if (!pinchActive || recording) return false

                              val current = dialController.currentZoomRatio()
                              val target = current * detector.scaleFactor
                              val value = dialController.setZoomRatioDirect(target)
                              zoomMeter.text = edgeRulerText("ZOOM", value)
                              zoomMeter.performHapticFeedback(
                                  HapticFeedbackConstants.CLOCK_TICK
                              )
                              return true
                          }

                          override fun onScaleEnd(detector: ScaleGestureDetector) {
                              pinchActive = false
                              handler.removeCallbacks(hideTemporary)
                              handler.postDelayed(hideTemporary, 900L)
                          }
                      }
                  )

                  overlayActions["PINCH ZOOM"] = {
                      wakeIdleHud()
                      zoomMeter.text =
                          edgeRulerText(
                              "ZOOM",
                              dialController.value("ZOOM")
                          )
                      zoomMeter.visibility = View.VISIBLE
                      exposureMeter.visibility = View.GONE
                      handler.removeCallbacks(hideTemporary)
                      handler.postDelayed(hideTemporary, 1400L)
                      Toast.makeText(
