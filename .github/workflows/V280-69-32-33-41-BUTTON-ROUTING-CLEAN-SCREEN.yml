name: Build V280-69.32.33.41 BUTTON ROUTING + CLEAN SCREEN APK

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/V280-69-32-33-41-BUTTON-ROUTING-CLEAN-SCREEN.yml'

permissions:
  contents: read

jobs:
  build_v280_69_32_33_41:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout Claude repo
        uses: actions/checkout@v4

      - name: Replay proven V280-33.4.5.4 clean HUD source
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PYREPLAY'
          from pathlib import Path
          import os, re, subprocess, tempfile

          recipe = Path('.github/workflows/V280-33-4-5-4-CLEAN-CINEMA-HUD.yml')
          lines = recipe.read_text(encoding='utf-8').splitlines()
          wanted = [
              'Replay proven V280-31.4 FIX1 source pipeline',
              'Apply V280-33.4.5.4 clean cinema HUD overlay',
              'Verify V280-33.4.5.4 clean cinema HUD contract',
          ]

          def indent(s):
              return len(s) - len(s.lstrip(' '))

          steps = {}
          i = 0
          while i < len(lines):
              m = re.match(r'^(\s*)- name:\s*(.+?)\s*$', lines[i])
              if not m:
                  i += 1
                  continue
              step_indent = len(m.group(1))
              name = m.group(2)
              end = len(lines)
              for k in range(i + 1, len(lines)):
                  mm = re.match(r'^(\s*)- name:\s*(.+?)\s*$', lines[k])
                  if mm and len(mm.group(1)) == step_indent:
                      end = k
                      break

              script = None
              for k in range(i + 1, end):
                  if lines[k].strip() == 'run: |':
                      run_indent = indent(lines[k])
                      content_indent = run_indent + 2
                      block = []
                      for q in range(k + 1, end):
                          ln = lines[q]
                          if not ln.strip():
                              block.append('')
                              continue
                          if indent(ln) <= run_indent:
                              break
                          block.append(ln[content_indent:] if len(ln) >= content_indent else '')
                      script = '\n'.join(block) + '\n'
                      break

              steps[name] = script
              i = end

          missing = [n for n in wanted if n not in steps or not steps[n]]
          if missing:
              raise SystemExit('Missing V280-33 replay steps: ' + ', '.join(missing))

          for name in wanted:
              print(f'\n===== V280-69.32.33.41 BASE: {name} =====', flush=True)
              with tempfile.NamedTemporaryFile('w', suffix='.sh', delete=False, encoding='utf-8') as f:
                  f.write(steps[name])
                  tmp = f.name
              try:
                  result = subprocess.run(['bash', tmp], cwd=str(Path.cwd()), env=os.environ.copy())
              finally:
                  Path(tmp).unlink(missing_ok=True)
              if result.returncode:
                  raise SystemExit(result.returncode)

          print('PASS: stable V280-33.4.5.4 source replayed.')
          PYREPLAY

      - name: Audit all camera functions before V280-69.32.33.41
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PYAUDIT'
          from pathlib import Path
          import re

          root = Path('v172-source/app/src/main/java/com/sentongoharuna/pulse')
          files = sorted(root.glob('*Camera*.kt')) + [
              root / 'DevelopUgandaGeneralHubActivity.kt'
          ]
          files = [p for p in files if p.exists()]
          if not files:
              raise SystemExit('No camera Kotlin sources found for function audit')

          combined = '\n'.join(p.read_text(encoding='utf-8', errors='ignore') for p in files)
          upper = combined.upper()

          controls = {
              'REC / RECORD': [r'\bREC\b', r'RECORD'],
              'PHOTO': [r'PHOTO', r'TAKEPHOTO'],
              'ISO': [r'\bISO\b'],
              'SHUTTER': [r'SHUTTER'],
              'WHITE BALANCE': [r'\bWB\b', r'WHITE.?BALANCE'],
              'FPS / FRAME RATE': [r'\bFPS\b', r'FRAME.?RATE'],
              'EXPOSURE': [r'EXPOSURE'],
              'FOCUS / AF': [r'FOCUS', r'AF/AE', r'AUTOFOCUS'],
              'ZOOM': [r'ZOOM'],
              'LENS': [r'LENS'],
              'LUT': [r'\bLUT\b'],
              'ASPECT / FORMAT': [r'ASPECT', r'FORMAT'],
              'STABILIZATION': [r'STAB', r'STABIL'],
              'TORCH / FLASH': [r'TORCH', r'FLASH'],
              'AUDIO / MIC': [r'AUDIO', r'\bMIC\b'],
              'TIMECODE': [r'TIMECODE', r'\bTC\b'],
              'GRID / GUIDES': [r'GRID', r'GUIDE'],
              'REVIEW': [r'REVIEW'],
              'TOOLS / PRO SETTINGS': [r'TOOLS', r'PRO.?SETTINGS', r'PRO.?CTRL'],
          }

          found = {}
          evidence = {}
          for name, patterns in controls.items():
              found[name] = False
              evidence[name] = []
              for path in files:
                  lines = path.read_text(encoding='utf-8', errors='ignore').splitlines()
                  for line_no, line in enumerate(lines, 1):
                      u = line.upper()
                      if any(re.search(p, u) for p in patterns):
                          found[name] = True
                          evidence[name].append(f'{path.name}:{line_no}: {line.strip()[:110]}')
                          if len(evidence[name]) >= 3:
                              break
                  if len(evidence[name]) >= 3:
                      break

          click_count = combined.count('setOnClickListener')
          touch_count = combined.count('setOnTouchListener')
          long_count = combined.count('setOnLongClickListener')

          report = [
              'V280/69.32.33.41 CAMERA FUNCTION AUDIT',
              '=======================================',
          ]
          for name, ok in found.items():
              report.append(f'{"FOUND" if ok else "CHECK"}  {name}')
              for item in evidence[name]:
                  report.append(f'    {item}')
          report += [
              '',
              f'Clickable handlers found: {click_count}',
              f'Touch handlers found: {touch_count}',
              f'Long-click handlers found: {long_count}',
              f'Camera source files scanned: {len(files)}',
          ]

          out = Path('/tmp/V280-69-32-33-41-CAMERA-FUNCTION-AUDIT.txt')
          out.write_text('\n'.join(report) + '\n', encoding='utf-8')
          print(out.read_text(encoding='utf-8'))

          # These are the core functions visible in the current pro-camera UI.
          core = [
              'REC / RECORD', 'ISO', 'SHUTTER', 'WHITE BALANCE',
              'FPS / FRAME RATE', 'EXPOSURE', 'FOCUS / AF',
              'ZOOM', 'LENS', 'LUT', 'ASPECT / FORMAT', 'AUDIO / MIC'
          ]
          missing = [name for name in core if not found[name]]
          if missing:
              raise SystemExit('Core camera function source check failed: ' + ', '.join(missing))

          if click_count < 8:
              raise SystemExit(f'Camera interaction audit found too few click handlers: {click_count}')

          print('PASS: core camera functions and interaction handlers are present in source.')
          PYAUDIT

      - name: Replace HUD with V280-69.32.33.41 camera function audit and true dial controls
        shell: bash
        run: |
          set -euo pipefail
          SRC='v172-source/app/src/main/java/com/sentongoharuna/pulse'
          GRADLE='v172-source/app/build.gradle.kts'

          cat > "$SRC/DevelopUgandaV28033454CleanHudProvider.kt" <<'KOTLIN'
          package com.sentongoharuna.pulse

          import android.app.Activity
          import android.app.Application
          import android.content.ContentProvider
          import android.content.ContentValues
          import android.database.Cursor
          import android.graphics.Color
          import android.graphics.drawable.GradientDrawable
          import android.net.Uri
          import android.os.Bundle
          import android.os.Handler
          import android.os.Looper
          import android.os.SystemClock
          import android.Manifest
          import android.content.pm.PackageManager
          import android.content.Intent
          import android.os.BatteryManager
          import android.os.Build
          import android.os.PowerManager
          import android.os.StatFs
          import android.hardware.Sensor
          import android.hardware.SensorEvent
          import android.hardware.SensorEventListener
          import android.hardware.SensorManager
          import android.content.Context
          import android.view.Gravity
          import android.view.HapticFeedbackConstants
          import android.view.MotionEvent
          import android.view.ScaleGestureDetector
          import android.view.View
          import android.view.ViewGroup
          import android.widget.FrameLayout
          import android.widget.LinearLayout
          import android.widget.TextView
          import android.widget.Toast
          import kotlin.math.roundToInt
          import androidx.camera.core.Camera
          import androidx.camera.core.FocusMeteringAction
          import androidx.camera.core.SurfaceOrientedMeteringPointFactory
          import java.util.concurrent.TimeUnit
          import androidx.camera.camera2.interop.Camera2CameraInfo
          import android.hardware.camera2.CaptureRequest
          import android.util.Range

          class DevelopUgandaV28033454CleanHudProvider : ContentProvider() {
              override fun onCreate(): Boolean {
                  val app = context?.applicationContext as? Application ?: return false

                  app.registerActivityLifecycleCallbacks(object : Application.ActivityLifecycleCallbacks {
                      override fun onActivityCreated(activity: Activity, savedInstanceState: Bundle?) = Unit
                      override fun onActivityStarted(activity: Activity) = Unit

                      override fun onActivityResumed(activity: Activity) {
                          val screen = activity.javaClass.simpleName
                          val blockedCameraPages = listOf(
                              "Settings", "Setup", "Health", "Review", "Story",
                              "Vault", "Director", "Recovery", "Control", "Console"
                          )

                          activity.window.decorView.post {
                              val isLiveCamera =
                                  screen.contains("Camera", ignoreCase = true) &&
                                  blockedCameraPages.none { screen.contains(it, ignoreCase = true) }

                              if (isLiveCamera) {
                                  runCatching { V28069323341Hud.install(activity) }
                              } else {
                                  runCatching { V28069323341PagePolish.install(activity) }
                              }
                          }
                      }

                      override fun onActivityPaused(activity: Activity) = Unit
                      override fun onActivityStopped(activity: Activity) = Unit
                      override fun onActivitySaveInstanceState(activity: Activity, outState: Bundle) = Unit
                      override fun onActivityDestroyed(activity: Activity) = Unit
                  })

                  return true
              }

              override fun query(
                  uri: Uri,
                  projection: Array<out String>?,
                  selection: String?,
                  selectionArgs: Array<out String>?,
                  sortOrder: String?
              ): Cursor? = null

              override fun getType(uri: Uri): String? = null
              override fun insert(uri: Uri, values: ContentValues?): Uri? = null
              override fun delete(uri: Uri, selection: String?, selectionArgs: Array<out String>?): Int = 0
              override fun update(
                  uri: Uri,
                  values: ContentValues?,
                  selection: String?,
                  selectionArgs: Array<out String>?
              ): Int = 0
          }


          private object V28069323341PagePolish {
              private const val TAG = "V28069323341_PAGE_POLISH"
              private const val GOLD = 0xFFFFB323.toInt()
              private const val PANEL = 0xF2070D14.toInt()
              private const val BUTTON = 0xF20A1118.toInt()

              private fun dp(activity: Activity, value: Int): Int =
                  (value * activity.resources.displayMetrics.density).roundToInt()

              private fun walk(view: View, out: MutableList<TextView>) {
                  if (view is TextView) out += view
                  if (view is ViewGroup) {
                      for (i in 0 until view.childCount) walk(view.getChildAt(i), out)
                  }
              }

              private fun screenTitle(activity: Activity): String {
                  val raw = activity.javaClass.simpleName
                      .replace("Activity", "")
                      .replace("Screen", "")
                      .replace(Regex("([a-z])([A-Z])"), "$1 $2")
                      .trim()

                  return when {
                      raw.contains("Settings", ignoreCase = true) -> "SETTINGS"
                      raw.contains("Setup", ignoreCase = true) -> "SETUP"
                      raw.contains("Health", ignoreCase = true) -> "HEALTH"
                      raw.contains("Review", ignoreCase = true) -> "REVIEW"
                      raw.contains("Story", ignoreCase = true) -> "STORY"
                      raw.contains("Vault", ignoreCase = true) -> "VAULT"
                      raw.contains("Director", ignoreCase = true) -> "DIRECTOR"
                      raw.contains("Recovery", ignoreCase = true) -> "RECOVERY"
                      raw.contains("Control", ignoreCase = true) -> "CONTROL"
                      raw.contains("Console", ignoreCase = true) -> "CONSOLE"
                      raw.contains("Tool", ignoreCase = true) -> "TOOLS"
                      raw.contains("Home", ignoreCase = true) -> "HOME"
                      raw.isBlank() -> "DEVELOP UGANDA"
                      else -> raw.uppercase().take(24)
                  }
              }

              private fun card(activity: Activity): GradientDrawable =
                  GradientDrawable().apply {
                      cornerRadius = dp(activity, 12).toFloat()
                      setColor(BUTTON)
                      setStroke(dp(activity, 1), GOLD)
                  }

              private fun clickableAncestor(view: View): View {
                  var current = view
                  repeat(5) {
                      if (current.isClickable) return current
                      current = current.parent as? View ?: return current
                  }
                  return current
              }

              private fun openCamera(activity: Activity): Boolean {
                  // First prefer an existing in-app camera navigation control.
                  val decor = activity.window.decorView as? ViewGroup
                  if (decor != null) {
                      val labels = mutableListOf<TextView>()
                      walk(decor, labels)

                      val existing = labels.firstOrNull { tv ->
                          val raw = tv.text?.toString()?.uppercase()?.replace("\n", " ")?.trim().orEmpty()
                          tv.tag != "V28063_OPEN_CAMERA" &&
                              (
                                  raw == "CAMERA" ||
                                  raw == "CAM" ||
                                  "CAM REPORTER" in raw ||
                                  "REPORTER CAM" in raw ||
                                  "PRO CAMERA" in raw ||
                                  "CINEMA CAMERA" in raw
                              )
                      }

                      if (existing != null) {
                          val host = clickableAncestor(existing)
                          if (host.performClick()) return true
                      }
                  }

                  // Fallback: discover this app's own camera-like Activity and launch it explicitly.
                  return runCatching {
                      @Suppress("DEPRECATION")
                      val info = activity.packageManager.getPackageInfo(
                          activity.packageName,
                          PackageManager.GET_ACTIVITIES
                      )

                      val candidates = info.activities
                          ?.filter { it.enabled && it.name != activity.javaClass.name }
                          ?.filter {
                              val n = it.name.lowercase()
                              "camera" in n ||
                                  "reporter" in n ||
                                  "procam" in n ||
                                  "cinema" in n ||
                                  n.endsWith("camactivity")
                          }
                          ?.sortedByDescending {
                              val n = it.name.lowercase()
                              when {
                                  "developuganda" in n && "camera" in n -> 100
                                  "reporter" in n && "camera" in n -> 90
                                  "pro" in n && "camera" in n -> 80
                                  "cinema" in n -> 70
                                  "camera" in n -> 60
                                  else -> 10
                              }
                          }
                          .orEmpty()

                      val cameraActivity = candidates.firstOrNull() ?: return@runCatching false
                      activity.startActivity(
                          Intent().setClassName(activity.packageName, cameraActivity.name)
                      )
                      true
                  }.getOrDefault(false)
              }

              fun install(activity: Activity) {
                  val decor = activity.window.decorView as? ViewGroup ?: return
                  if (decor.findViewWithTag<View>(TAG) != null) return

                  val overlay = FrameLayout(activity).apply {
                      tag = TAG
                      isClickable = false
                      isFocusable = false
                      setBackgroundColor(Color.TRANSPARENT)
                  }
                  decor.addView(
                      overlay,
                      ViewGroup.LayoutParams(
                          ViewGroup.LayoutParams.MATCH_PARENT,
                          ViewGroup.LayoutParams.MATCH_PARENT
                      )
                  )

                  // Consistent page identity and version on every non-camera screen.
                  val header = LinearLayout(activity).apply {
                      orientation = LinearLayout.HORIZONTAL
                      gravity = Gravity.CENTER_VERTICAL
                      setPadding(
                          dp(activity, 10),
                          dp(activity, 4),
                          dp(activity, 8),
                          dp(activity, 4)
                      )
                      background = GradientDrawable().apply {
                          cornerRadius = dp(activity, 12).toFloat()
                          setColor(PANEL)
                          setStroke(dp(activity, 1), GOLD)
                      }
                      isClickable = false
                  }

                  val title = TextView(activity).apply {
                      text = screenTitle(activity)
                      setTextColor(Color.WHITE)
                      textSize = 11f
                      gravity = Gravity.CENTER_VERTICAL
                      isClickable = false
                  }

                  val version = TextView(activity).apply {
                      text = "V280/69.32.33.41"
                      setTextColor(GOLD)
                      textSize = 9f
                      gravity = Gravity.CENTER
                      setPadding(dp(activity, 7), 0, dp(activity, 7), 0)
                      background = card(activity)
                      isClickable = false
                  }

                  header.addView(
                      title,
                      LinearLayout.LayoutParams(
                          0,
                          ViewGroup.LayoutParams.MATCH_PARENT,
                          1f
                      )
                  )
                  header.addView(
                      version,
                      LinearLayout.LayoutParams(
                          dp(activity, 92),
                          dp(activity, 30)
                      )
                  )

                  val openCameraButton = TextView(activity).apply {
                      tag = "V28064_OPEN_CAMERA"
                      text = "OPEN\nCAMERA"
                      setTextColor(Color.WHITE)
                      textSize = 8.5f
                      gravity = Gravity.CENTER
                      maxLines = 2
                      setPadding(dp(activity, 5), 0, dp(activity, 5), 0)
                      background = card(activity)
                      isClickable = true
                      isFocusable = true
                      elevation = dp(activity, 3).toFloat()
                      setOnClickListener {
                          val opened = openCamera(activity)
                          if (!opened) {
                              Toast.makeText(
                                  activity,
                                  "Camera page could not be located",
                                  Toast.LENGTH_SHORT
                              ).show()
                          }
                      }
                  }

                  header.addView(
                      openCameraButton,
                      LinearLayout.LayoutParams(
                          dp(activity, 82),
                          dp(activity, 30)
                      ).apply {
                          leftMargin = dp(activity, 5)
                      }
                  )

                  val cameraStatus = TextView(activity).apply {
                      text = "CAM\nREADY"
                      setTextColor(GOLD)
                      textSize = 7.2f
                      gravity = Gravity.CENTER
                      maxLines = 2
                      isClickable = false
                      isFocusable = false
                  }
                  header.addView(
                      cameraStatus,
                      LinearLayout.LayoutParams(
                          dp(activity, 46),
                          dp(activity, 30)
                      ).apply {
                          leftMargin = dp(activity, 3)
                      }
                  )

                  overlay.addView(
                      header,
                      FrameLayout.LayoutParams(
                          ViewGroup.LayoutParams.MATCH_PARENT,
                          dp(activity, 42)
                      ).apply {
                          gravity = Gravity.TOP
                          leftMargin = dp(activity, 8)
                          rightMargin = dp(activity, 8)
                          topMargin = dp(activity, 8)
                      }
                  )

                  // Bring buttons and action rows into the same compact gold family across pages.
                  val textViews = mutableListOf<TextView>()
                  walk(decor, textViews)

                  textViews.forEach { tv ->
                      if (
                          tv === title ||
                          tv === version ||
                          tv === openCameraButton ||
                          tv === cameraStatus
                      ) return@forEach
                      val raw = tv.text?.toString()?.trim().orEmpty()
                      if (raw.isBlank() || raw.length > 32) return@forEach

                      val parent = tv.parent as? View
                      val isAction =
                          tv.isClickable ||
                          parent?.isClickable == true ||
                          raw.uppercase() in setOf(
                              "SAVE", "APPLY", "DONE", "OPEN", "CLOSE", "BACK",
                              "NEXT", "START", "STOP", "RESET", "REVIEW", "TOOLS",
                              "SETTINGS", "SETUP", "HEALTH", "DIRECTOR"
                          )

                      if (isAction) {
                          tv.setPadding(
                              dp(activity, 7),
                              dp(activity, 5),
                              dp(activity, 7),
                              dp(activity, 5)
                          )
                          if (tv.background == null) {
                              tv.background = card(activity)
                          }
                      }
                  }
              }
          }

          private object V28069323341Hud {
              private const val TAG = "V28069323341_DOUBLE_TAP_RESET_HUD"
              private const val GOLD = 0xFFFFB323.toInt()
              private const val RED = 0xFFFF3038.toInt()
              private const val PANEL = 0xF0070D14.toInt()
              private const val BUTTON = 0xF20A1118.toInt()
              private const val SAFE = 0xFF7FE39B.toInt()
              private const val WARN = 0xFFFFB323.toInt()

              private fun dp(activity: Activity, value: Int): Int =
                  (value * activity.resources.displayMetrics.density).roundToInt()

              private fun walk(view: View, out: MutableList<TextView>) {
                  if (view is TextView) out += view
                  if (view is ViewGroup) {
                      for (i in 0 until view.childCount) walk(view.getChildAt(i), out)
                  }
              }

              private fun keyFor(text: String): String? {
                  val t = text.uppercase().replace("\n", " ").trim()
                  return when {
                      t == "REC" || t.startsWith("REC ") || "RECORD" in t -> "REC"
                      t == "PHOTO" || "TAKE PHOTO" in t -> "PHOTO"
                      "AF/AE" in t -> "AF/AE"
                      t.startsWith("ISO") -> "ISO"
                      "SHUTTER" in t -> "SHUTTER"
                      t == "WB" || t.startsWith("WB ") || "WHITE BALANCE" in t -> "WB"
                      t.startsWith("FPS") || "FRAME RATE" in t -> "FPS"
                      t == "LENS" || t.startsWith("LENS ") -> "LENS"
                      "CHECK HEAT" in t -> "HEAT"
                      "PRO CTRL" in t || "PRO SETTINGS" in t -> "PRO"
                      t == "SET" || t.startsWith("SET ") -> "SET"
                      t == "LUT" || t.startsWith("LUT ") -> "LUT"
                      "EXPOSURE" in t || t.startsWith("EXP ") -> "EXPOSURE"
                      t == "FOCUS" || t.startsWith("FOCUS ") -> "FOCUS"
                      t.startsWith("ZOOM") -> "ZOOM"
                      t == "SOUND" || t.startsWith("SOUND ") || t.startsWith("AUDIO") || t.startsWith("MIC ") -> "AUDIO"
                      t == "REVIEW" || t.startsWith("REVIEW ") -> "REVIEW"
                      t == "TOOLS" || t.startsWith("TOOLS ") || "TOOLS CLOSED" in t -> "TOOLS"
                      "ASPECT" in t -> "ASPECT"
                      t.startsWith("FORMAT") -> "FORMAT"
                      t.startsWith("STAB") || "STABIL" in t -> "STAB"
                      t.startsWith("TORCH") || t.startsWith("FLASH") -> "TORCH"
                      t.startsWith("TC ") || t == "TC" || "TIMECODE" in t -> "TC"
                      t.startsWith("GRID") || t.startsWith("GUIDE") -> "GRID"
                      t.startsWith("TEMP") || "KELVIN" in t -> "TEMP"
                      t.startsWith("TINT") -> "TINT"
                      t.startsWith("SAT") || "SATURATION" in t -> "SAT"
                      else -> null
                  }
              }

              private fun clickableHost(activity: Activity, text: TextView): View {
                  val maxW = activity.resources.displayMetrics.widthPixels * 0.45f
                  val maxH = activity.resources.displayMetrics.heightPixels * 0.20f
                  var current: View = text
                  repeat(3) {
                      val parent = current.parent as? View ?: return@repeat
                      if (
                          parent.isClickable &&
                          parent.width in 1..maxW.toInt() &&
                          parent.height in 1..maxH.toInt()
                      ) current = parent
                  }
                  return current
              }

              private fun solid(activity: Activity, title: String, detail: String = ""): TextView =
                  TextView(activity).apply {
                      text = if (detail.isBlank()) title else "$title\n$detail"
                      setTextColor(Color.WHITE)
                      textSize = 8.0f
                      gravity = Gravity.CENTER
                      maxLines = 2
                      setPadding(dp(activity, 3), dp(activity, 3), dp(activity, 3), dp(activity, 3))
                      background = GradientDrawable().apply {
                          cornerRadius = dp(activity, 10).toFloat()
                          setColor(BUTTON)
                          setStroke(dp(activity, 1), GOLD)
                      }
                      elevation = dp(activity, 2).toFloat()
                      isClickable = true
                      isFocusable = true
                  }

              private fun recButton(activity: Activity): TextView =
                  solid(activity, "REC", "00:00").apply {
                      background = GradientDrawable().apply {
                          shape = GradientDrawable.OVAL
                          setColor(0xF23D0509.toInt())
                          setStroke(dp(activity, 2), RED)
                      }
                  }

              private class OrientationTracker(
                  private val activity: Activity,
                  private val onUpdate: (Float, Float, Float) -> Unit
              ) : SensorEventListener {
                  private val sensorManager =
                      activity.getSystemService(Context.SENSOR_SERVICE) as SensorManager
                  private val rotationSensor =
                      sensorManager.getDefaultSensor(Sensor.TYPE_ROTATION_VECTOR)

                  private val rotationMatrix = FloatArray(9)
                  private val orientation = FloatArray(3)

                  private var lastRoll = 0f
                  private var lastPitch = 0f
                  private var lastUpdateMs = 0L

                  fun available(): Boolean = rotationSensor != null

                  fun start() {
                      rotationSensor?.let {
                          sensorManager.registerListener(
                              this,
                              it,
                              SensorManager.SENSOR_DELAY_GAME
                          )
                      }
                  }

                  fun stop() {
                      sensorManager.unregisterListener(this)
                  }

                  override fun onAccuracyChanged(sensor: Sensor?, accuracy: Int) = Unit

                  override fun onSensorChanged(event: SensorEvent?) {
                      if (event?.sensor?.type != Sensor.TYPE_ROTATION_VECTOR) return

                      SensorManager.getRotationMatrixFromVector(
                          rotationMatrix,
                          event.values
                      )
                      SensorManager.getOrientation(
                          rotationMatrix,
                          orientation
                      )

                      val pitch = Math.toDegrees(orientation[1].toDouble()).toFloat()
                      val roll = Math.toDegrees(orientation[2].toDouble()).toFloat()

                      val now = SystemClock.elapsedRealtime()
                      val dt = (now - lastUpdateMs).coerceAtLeast(1L)
                      val movement =
                          if (lastUpdateMs == 0L) 0f
                          else (
                              kotlin.math.abs(roll - lastRoll) +
                              kotlin.math.abs(pitch - lastPitch)
                          ) * (1000f / dt)

                      lastRoll = roll
                      lastPitch = pitch
                      lastUpdateMs = now

                      onUpdate(roll, pitch, movement)
                  }
              }

              private class CameraDialController(private val activity: Activity) {
                  private val isoValues = intArrayOf(50, 100, 200, 400, 800, 1600, 3200)
                  private val shutterLabels = arrayOf("1/24", "1/30", "1/48", "1/50", "1/60", "1/100", "1/120", "1/250")
                  private val shutterNs = longArrayOf(
                      41_666_667L, 33_333_333L, 20_833_333L, 20_000_000L,
                      16_666_667L, 10_000_000L, 8_333_333L, 4_000_000L
                  )
                  private val wbModes = arrayOf(
                      "AUTO" to CaptureRequest.CONTROL_AWB_MODE_AUTO,
                      "3200K" to CaptureRequest.CONTROL_AWB_MODE_INCANDESCENT,
                      "4000K" to CaptureRequest.CONTROL_AWB_MODE_FLUORESCENT,
                      "5600K" to CaptureRequest.CONTROL_AWB_MODE_DAYLIGHT,
                      "6500K" to CaptureRequest.CONTROL_AWB_MODE_CLOUDY_DAYLIGHT,
                      "SHADE" to CaptureRequest.CONTROL_AWB_MODE_SHADE
                  )
                  private val fpsRanges = arrayOf(
                      "24" to Range<Int>(24, 24),
                      "25" to Range<Int>(25, 25),
                      "30" to Range<Int>(30, 30),
                      "30-60" to Range<Int>(30, 60),
                      "60" to Range<Int>(60, 60)
                  )
                  private val focusValues = floatArrayOf(0f, 0.5f, 1f, 2f, 4f, 6f, 8f, 10f)

                  private var isoIndex = 1
                  private var shutterIndex = 4
                  private var wbIndex = 0
                  private var fpsIndex = 2
                  private var focusIndex = 0

                  private val shutterAngles = intArrayOf(90, 144, 172, 180, 270, 360)
                  private var shutterAngleIndex = 3
                  private var shutterAngleEnabled = false

                  private val flickerLabels = arrayOf("AUTO", "50Hz", "60Hz", "OFF")
                  private val flickerModes = intArrayOf(
                      CaptureRequest.CONTROL_AE_ANTIBANDING_MODE_AUTO,
                      CaptureRequest.CONTROL_AE_ANTIBANDING_MODE_50HZ,
                      CaptureRequest.CONTROL_AE_ANTIBANDING_MODE_60HZ,
                      CaptureRequest.CONTROL_AE_ANTIBANDING_MODE_OFF
                  )
                  private var flickerIndex = 0

                  private val prefs =
                      activity.getSharedPreferences("v280_69_camera_manual_memory", 0)

                  private var locked =
                      prefs.getBoolean("dial_locked", false)

                  private var meteringLocked =
                      prefs.getBoolean("metering_locked", false)

                  private fun findCamera(): Camera? {
                      var type: Class<*>? = activity.javaClass
                      while (type != null) {
                          for (field in type.declaredFields) {
                              runCatching {
                                  field.isAccessible = true
                                  val value = field.get(activity)
                                  if (value is Camera) return value
                              }
                          }
                          type = type.superclass
                      }
                      return null
                  }

                  private fun camera2Control(camera: Camera): Any? {
                      return runCatching {
                          val cls = Class.forName("androidx.camera.camera2.interop.Camera2CameraControl")
                          val from = cls.methods.firstOrNull {
                              it.name == "from" && it.parameterTypes.size == 1
                          }
                          if (from != null) {
                              from.invoke(null, camera.cameraControl)
                          } else {
                              val companion = cls.getDeclaredField("Companion").apply { isAccessible = true }.get(null)
                              companion.javaClass.methods.first {
                                  it.name == "from" && it.parameterTypes.size == 1
                              }.invoke(companion, camera.cameraControl)
                          }
                      }.getOrNull()
                  }

                  private fun applyCamera2(options: List<Pair<CaptureRequest.Key<*>, Any>>): Boolean {
                      val camera = findCamera() ?: return false
                      return runCatching {
                          val c2 = camera2Control(camera) ?: return false
                          val builderClass = Class.forName(
                              "androidx.camera.camera2.interop.CaptureRequestOptions\$Builder"
                          )
                          val builder = builderClass.getDeclaredConstructor().newInstance()
                          val setter = builderClass.methods.first {
                              it.name == "setCaptureRequestOption" && it.parameterTypes.size == 2
                          }
                          options.forEach { (key, value) ->
                              setter.invoke(builder, key, value)
                          }
                          val built = builderClass.getMethod("build").invoke(builder)
                          val optionsClass = Class.forName(
                              "androidx.camera.camera2.interop.CaptureRequestOptions"
                          )
                          c2.javaClass.getMethod(
                              "setCaptureRequestOptions",
                              optionsClass
                          ).invoke(c2, built)
                          true
                      }.getOrDefault(false)
                  }

                  private fun applyManualSensor(): Boolean =
                      applyCamera2(
                          listOf(
                              CaptureRequest.CONTROL_AE_MODE to CaptureRequest.CONTROL_AE_MODE_OFF,
                              CaptureRequest.SENSOR_SENSITIVITY to safeIso(),
                              CaptureRequest.SENSOR_EXPOSURE_TIME to safeShutterNs()
                          )
                      )

                  private fun wrap(index: Int, size: Int): Int {
                      val v = index % size
                      return if (v < 0) v + size else v
                  }

                  private fun canUseCamera2(): Boolean {
                      val camera = findCamera() ?: return false
                      return camera2Control(camera) != null
                  }

                  fun supported(key: String): Boolean {
                      val camera = findCamera()
                      return when (key) {
                          "ISO", "SHUTTER", "ANGLE", "FLICKER", "WB", "FPS", "FOCUS" ->
                              canUseCamera2()
                          "EXPOSURE", "ZOOM" -> camera != null
                          else -> targetsSupportFallback(key)
                      }
                  }

                  private fun targetsSupportFallback(key: String): Boolean {
                      // Non-dial functions are checked by the HUD's real existing button map.
                      return false
                  }

                  fun value(key: String): String {
                      val camera = findCamera()
                      if (!supported(key)) return "N/A"

                      return when (key) {
                          "ISO" -> safeIso().toString()
                          "SHUTTER" -> {
                              val ns = safeShutterNs()
                              val sec = ns / 1_000_000_000.0
                              if (sec >= 1.0) String.format("%.1fs", sec)
                              else "1/" + kotlin.math.round(1.0 / sec).toInt()
                          }
                          "ANGLE" ->
                              if (shutterAngleEnabled) "${shutterAngles[shutterAngleIndex]}°" else "OFF"
                          "FLICKER" -> flickerLabels[flickerIndex]
                          "WB" -> wbModes[wbIndex].first
                          "FPS" -> fpsRanges[fpsIndex].first
                          "FOCUS" -> if (focusIndex == 0) "AUTO" else "${focusValues[focusIndex]}D"
                          "EXPOSURE" -> {
                              val idx = camera?.cameraInfo?.exposureState?.exposureCompensationIndex ?: 0
                              if (idx > 0) "+$idx" else idx.toString()
                          }
                          "ZOOM" -> {
                              val ratio = camera?.cameraInfo?.zoomState?.value?.zoomRatio ?: 1f
                              String.format("%.1fx", ratio)
                          }
                          else -> "AUTO"
                      }
                  }

                  fun reset(key: String): String {
                      val camera = findCamera()
                      if (locked) return "LOCKED"
                      if (!supported(key)) return "N/A"

                      val ok = when (key) {
                          "ISO", "SHUTTER" -> {
                              val oldIso = isoIndex
                              val oldShutter = shutterIndex
                              val oldAngle = shutterAngleEnabled
                              isoIndex = 1
                              shutterIndex = 4
                              shutterAngleEnabled = false
                              val success = applyCamera2(
                                  listOf(
                                      CaptureRequest.CONTROL_AE_MODE to CaptureRequest.CONTROL_AE_MODE_ON
                                  )
                              )
                              if (!success) {
                                  isoIndex = oldIso
                                  shutterIndex = oldShutter
                                  shutterAngleEnabled = oldAngle
                              }
                              success
                          }
                          "ANGLE" -> {
                              shutterAngleEnabled = false
                              applyManualSensor()
                          }
                          "FLICKER" -> {
                              val old = flickerIndex
                              flickerIndex = 0
                              val success = applyCamera2(
                                  listOf(
                                      CaptureRequest.CONTROL_AE_ANTIBANDING_MODE to flickerModes[flickerIndex]
                                  )
                              )
                              if (!success) flickerIndex = old
                              success
                          }
                          "WB" -> {
                              val old = wbIndex
                              wbIndex = 0
                              val success = applyCamera2(
                                  listOf(
                                      CaptureRequest.CONTROL_AWB_MODE to CaptureRequest.CONTROL_AWB_MODE_AUTO
                                  )
                              )
                              if (!success) wbIndex = old
                              success
                          }
                          "FPS" -> {
                              val old = fpsIndex
                              fpsIndex = 2
                              val success = applyCamera2(
                                  listOf(
                                      CaptureRequest.CONTROL_AE_TARGET_FPS_RANGE to fpsRanges[fpsIndex].second
                                  )
                              )
                              if (!success) fpsIndex = old
                              success
                          }
                          "FOCUS" -> {
                              val old = focusIndex
                              focusIndex = 0
                              val success = applyCamera2(
                                  listOf(
                                      CaptureRequest.CONTROL_AF_MODE to CaptureRequest.CONTROL_AF_MODE_CONTINUOUS_VIDEO
                                  )
                              )
                              if (!success) focusIndex = old
                              success
                          }
                          "EXPOSURE" -> {
                              if (camera == null) false
                              else {
                                  camera.cameraControl.setExposureCompensationIndex(0)
                                  true
                              }
                          }
                          "ZOOM" -> {
                              if (camera == null) false
                              else {
                                  camera.cameraControl.setZoomRatio(1f)
                                  true
                              }
                          }
                          else -> false
                      }

                      return if (ok) value(key) else "N/A"
                  }

                  fun adjust(key: String, delta: Int): String {
                      val camera = findCamera()
                      if (locked) return "LOCKED"
                      if (!supported(key)) return "N/A"

                      val ok = when (key) {
                          "ISO" -> {
                              val old = isoIndex
                              isoIndex = wrap(isoIndex + delta, isoValues.size)
                              val success = applyManualSensor()
                              if (!success) isoIndex = old
                              success
                          }

                          "SHUTTER" -> {
                              val old = shutterIndex
                              val oldAngle = shutterAngleEnabled
                              shutterAngleEnabled = false
                              shutterIndex = wrap(shutterIndex + delta, shutterLabels.size)
                              val success = applyManualSensor()
                              if (!success) {
                                  shutterIndex = old
                                  shutterAngleEnabled = oldAngle
                              }
                              success
                          }

                          "ANGLE" -> {
                              val oldIndex = shutterAngleIndex
                              val oldEnabled = shutterAngleEnabled
                              shutterAngleEnabled = true
                              shutterAngleIndex = wrap(
                                  shutterAngleIndex + delta,
                                  shutterAngles.size
                              )
                              val success = applyManualSensor()
                              if (!success) {
                                  shutterAngleIndex = oldIndex
                                  shutterAngleEnabled = oldEnabled
                              }
                              success
                          }

                          "FLICKER" -> {
                              val old = flickerIndex
                              flickerIndex = wrap(flickerIndex + delta, flickerModes.size)
                              val success = applyCamera2(
                                  listOf(
                                      CaptureRequest.CONTROL_AE_ANTIBANDING_MODE to flickerModes[flickerIndex]
                                  )
                              )
                              if (!success) flickerIndex = old
                              success
                          }

                          "WB" -> {
                              val old = wbIndex
                              wbIndex = wrap(wbIndex + delta, wbModes.size)
                              val success = applyCamera2(
                                  listOf(
                                      CaptureRequest.CONTROL_AWB_MODE to wbModes[wbIndex].second
                                  )
                              )
                              if (!success) wbIndex = old
                              success
                          }

                          "FPS" -> {
                              val old = fpsIndex
                              fpsIndex = wrap(fpsIndex + delta, fpsRanges.size)
                              var success = applyCamera2(
                                  listOf(
                                      CaptureRequest.CONTROL_AE_TARGET_FPS_RANGE to fpsRanges[fpsIndex].second
                                  )
                              )
                              if (success && shutterAngleEnabled) {
                                  success = applyManualSensor()
                              }
                              if (!success) fpsIndex = old
                              success
                          }

                          "FOCUS" -> {
                              val old = focusIndex
                              focusIndex = (focusIndex + delta).coerceIn(0, focusValues.lastIndex)
                              val success =
                                  if (focusIndex == 0) {
                                      applyCamera2(
                                          listOf(
                                              CaptureRequest.CONTROL_AF_MODE to CaptureRequest.CONTROL_AF_MODE_CONTINUOUS_VIDEO
                                          )
                                      )
                                  } else {
                                      applyCamera2(
                                          listOf(
                                              CaptureRequest.CONTROL_AF_MODE to CaptureRequest.CONTROL_AF_MODE_OFF,
                                              CaptureRequest.LENS_FOCUS_DISTANCE to focusValues[focusIndex]
                                          )
                                      )
                                  }
                              if (!success) focusIndex = old
                              success
                          }

                          "EXPOSURE" -> {
                              if (camera == null) false
                              else {
                                  val state = camera.cameraInfo.exposureState
                                  val current = state.exposureCompensationIndex
                                  val range = state.exposureCompensationRange
                                  val target = (current + delta).coerceIn(range.lower, range.upper)
                                  camera.cameraControl.setExposureCompensationIndex(target)
                                  true
                              }
                          }

                          "ZOOM" -> {
                              if (camera == null) false
                              else {
                                  val state = camera.cameraInfo.zoomState.value
                                  if (state == null) false
                                  else {
                                      val direction = if (delta > 0) 1f else -1f
                                      val magnitude = kotlin.math.abs(delta).coerceAtLeast(1)
                                      val step = 0.15f * magnitude * direction
                                      camera.cameraControl.setZoomRatio(
                                          (state.zoomRatio + step).coerceIn(
                                              state.minZoomRatio,
                                              state.maxZoomRatio
                                          )
                                      )
                                      true
                                  }
                              }
                          }

                          else -> false
                      }

                      return if (ok) value(key) else "N/A"
                  }

                  fun setZoomRatioDirect(ratio: Float): String {
                      val camera = findCamera() ?: return "N/A"
                      val state = camera.cameraInfo.zoomState.value ?: return "N/A"
                      val target = ratio.coerceIn(
                          state.minZoomRatio,
                          state.maxZoomRatio
                      )
                      camera.cameraControl.setZoomRatio(target)
                      return String.format("%.1fx", target)
                  }

                  fun currentZoomRatio(): Float {
                      val camera = findCamera() ?: return 1f
                      return camera.cameraInfo.zoomState.value?.zoomRatio ?: 1f
                  }

                  fun isMeteringLocked(): Boolean = meteringLocked

                  private fun meteringPoint(
                      x: Float,
                      y: Float,
                      width: Int,
                      height: Int
                  ) = SurfaceOrientedMeteringPointFactory(
                      width.coerceAtLeast(1).toFloat(),
                      height.coerceAtLeast(1).toFloat()
                  ).createPoint(
                      x.coerceIn(0f, width.coerceAtLeast(1).toFloat()),
                      y.coerceIn(0f, height.coerceAtLeast(1).toFloat()),
                      0.16f
                  )

                  fun tapMeter(
                      x: Float,
                      y: Float,
                      width: Int,
                      height: Int
                  ): Boolean {
                      if (meteringLocked) return false
                      val camera = findCamera() ?: return false
                      val point = meteringPoint(x, y, width, height)
                      val action = FocusMeteringAction.Builder(
                          point,
                          FocusMeteringAction.FLAG_AF or FocusMeteringAction.FLAG_AE
                      )
                          .addPoint(point, FocusMeteringAction.FLAG_AWB)
                          .setAutoCancelDuration(4L, TimeUnit.SECONDS)
                          .build()

                      return runCatching {
                          camera.cameraControl.startFocusAndMetering(action)
                          true
                      }.getOrDefault(false)
                  }

                  fun lockMeteringAt(
                      x: Float,
                      y: Float,
                      width: Int,
                      height: Int
                  ): Boolean {
                      val camera = findCamera() ?: return false
                      val point = meteringPoint(x, y, width, height)
                      val action = FocusMeteringAction.Builder(
                          point,
                          FocusMeteringAction.FLAG_AF or FocusMeteringAction.FLAG_AE
                      )
                          .addPoint(point, FocusMeteringAction.FLAG_AWB)
                          .disableAutoCancel()
                          .build()

                      val started = runCatching {
                          camera.cameraControl.startFocusAndMetering(action)
                          true
                      }.getOrDefault(false)

                      if (started) {
                          runCatching {
                              applyCamera2(
                                  listOf(
                                      CaptureRequest.CONTROL_AE_LOCK to true
                                  )
                              )
                          }
                          meteringLocked = true
                          prefs.edit().putBoolean("metering_locked", true).apply()
                      }

                      return started
                  }

                  fun releaseMeteringLock(): Boolean {
                      val camera = findCamera() ?: return false
                      val cancelled = runCatching {
                          camera.cameraControl.cancelFocusAndMetering()
                          true
                      }.getOrDefault(false)

                      runCatching {
                          applyCamera2(
                              listOf(
                                  CaptureRequest.CONTROL_AE_LOCK to false
                              )
                          )
                      }

                      meteringLocked = false
                      prefs.edit().putBoolean("metering_locked", false).apply()
                      return cancelled
                  }

                  private data class SensorLimits(
                      val iso: android.util.Range<Int>?,
                      val shutter: android.util.Range<Long>?
                  )

                  private fun sensorLimits(): SensorLimits {
                      val camera = findCamera() ?: return SensorLimits(null, null)
                      return runCatching {
                          val c2 = Camera2CameraInfo.from(camera.cameraInfo)
                          val iso: android.util.Range<Int>? =
                              c2.getCameraCharacteristic(
                                  android.hardware.camera2.CameraCharacteristics.SENSOR_INFO_SENSITIVITY_RANGE
                              )
                          val shutter: android.util.Range<Long>? =
                              c2.getCameraCharacteristic(
                                  android.hardware.camera2.CameraCharacteristics.SENSOR_INFO_EXPOSURE_TIME_RANGE
                              )
                          SensorLimits(iso, shutter)
                      }.getOrDefault(SensorLimits(null, null))
                  }

                  private fun activeLensLabel(): String {
                      val camera = findCamera() ?: return "NO CAM"
                      return runCatching {
                          val c2 = Camera2CameraInfo.from(camera.cameraInfo)
                          val facing: Int? =
                              c2.getCameraCharacteristic(
                                  android.hardware.camera2.CameraCharacteristics.LENS_FACING
                              )
                          when (facing) {
                              android.hardware.camera2.CameraCharacteristics.LENS_FACING_FRONT -> "FRONT"
                              android.hardware.camera2.CameraCharacteristics.LENS_FACING_BACK -> "BACK"
                              android.hardware.camera2.CameraCharacteristics.LENS_FACING_EXTERNAL -> "EXTERNAL"
                              else -> "CAM"
                          }
                      }.getOrDefault("CAM")
                  }

                  private fun lensMemoryPrefix(): String =
                      activeLensLabel().lowercase().replace(" ", "_")

                  private fun safeIso(): Int {
                      val requested = isoValues[isoIndex]
                      val range = sensorLimits().iso ?: return requested
                      return requested.coerceIn(range.lower, range.upper)
                  }

                  private fun safeShutterNs(): Long {
                      val requested =
                          if (shutterAngleEnabled) {
                              val fps = fpsRanges[fpsIndex].second.upper.coerceAtLeast(1)
                              val angle = shutterAngles[shutterAngleIndex]
                              ((1_000_000_000.0 * angle.toDouble()) / (360.0 * fps.toDouble()))
                                  .toLong()
                                  .coerceAtLeast(1L)
                          } else {
                              shutterNs[shutterIndex]
                          }

                      val range = sensorLimits().shutter ?: return requested
                      return requested.coerceIn(range.lower, range.upper)
                  }

                  data class HardwareLimits(
                      val manualSensor: Boolean,
                      val isoRange: String,
                      val shutterRange: String,
                      val exposureRange: String,
                      val zoomRange: String,
                      val focusRange: String,
                      val torch: Boolean
                  )

                  fun hardwareLimits(): HardwareLimits {
                      val camera = findCamera()
                      if (camera == null) {
                          return HardwareLimits(
                              manualSensor = false,
                              isoRange = "N/A",
                              shutterRange = "N/A",
                              exposureRange = "N/A",
                              zoomRange = "N/A",
                              focusRange = "N/A",
                              torch = false
                          )
                      }

                      val cameraInfo = camera.cameraInfo
                      val exposure = cameraInfo.exposureState
                      val zoom = cameraInfo.zoomState.value

                      var manualSensor = false
                      var isoRange = "N/A"
                      var shutterRange = "N/A"
                      var focusRange = "N/A"

                      runCatching {
                          val c2 = Camera2CameraInfo.from(cameraInfo)
                          val iso: android.util.Range<Int>? =
                              c2.getCameraCharacteristic(
                                  android.hardware.camera2.CameraCharacteristics.SENSOR_INFO_SENSITIVITY_RANGE
                              )
                          val exp: android.util.Range<Long>? =
                              c2.getCameraCharacteristic(
                                  android.hardware.camera2.CameraCharacteristics.SENSOR_INFO_EXPOSURE_TIME_RANGE
                              )
                          val minFocus: Float? =
                              c2.getCameraCharacteristic(
                                  android.hardware.camera2.CameraCharacteristics.LENS_INFO_MINIMUM_FOCUS_DISTANCE
                              )

                          if (iso != null) {
                              isoRange = "${iso.lower}-${iso.upper}"
                          }
                          if (exp != null) {
                              fun nsToLabel(ns: Long): String {
                                  if (ns <= 0L) return "N/A"
                                  val sec = ns / 1_000_000_000.0
                                  return if (sec >= 1.0) {
                                      String.format("%.1fs", sec)
                                  } else {
                                      "1/" + kotlin.math.round(1.0 / sec).toInt()
                                  }
                              }
                              shutterRange = "${nsToLabel(exp.lower)}-${nsToLabel(exp.upper)}"
                          }
                          if (minFocus != null && minFocus > 0f) {
                              focusRange = "0-${String.format("%.1f", minFocus)}D"
                          } else {
                              focusRange = "AF"
                          }

                          manualSensor = iso != null && exp != null && canUseCamera2()
                      }

                      val expRange = exposure.exposureCompensationRange
                      val exposureRange =
                          if (expRange.lower == 0 && expRange.upper == 0) "0"
                          else "${expRange.lower}..${expRange.upper}"

                      val zoomRange =
                          if (zoom == null) "N/A"
                          else "${String.format("%.1f", zoom.minZoomRatio)}x-${String.format("%.1f", zoom.maxZoomRatio)}x"

                      return HardwareLimits(
                          manualSensor = manualSensor,
                          isoRange = isoRange,
                          shutterRange = shutterRange,
                          exposureRange = exposureRange,
                          zoomRange = zoomRange,
                          focusRange = focusRange,
                          torch = cameraInfo.hasFlashUnit()
                      )
                  }

                  fun selfTestLines(): List<Pair<String, Boolean>> {
                      val camera = findCamera()
                      val limits = hardwareLimits()
                      return listOf(
                          "ACTIVE CAMERA" to (camera != null),
                          "LENS " + activeLensLabel() to (camera != null),
                          "CAMERA2 CONTROL" to canUseCamera2(),
                          "MANUAL SENSOR" to limits.manualSensor,
                          "ISO CONTROL" to supported("ISO"),
                          "SHUTTER CONTROL" to supported("SHUTTER"),
                          "WHITE BALANCE" to supported("WB"),
                          "FPS CONTROL" to supported("FPS"),
                          "EXPOSURE COMP" to supported("EXPOSURE"),
                          "MANUAL FOCUS" to supported("FOCUS"),
                          "ZOOM CONTROL" to supported("ZOOM"),
                          "TORCH / FLASH" to limits.torch,
                          "TAP AF/AE METER" to (camera != null),
                          "SHUTTER ANGLE" to canUseCamera2(),
                          "ANTI-FLICKER" to canUseCamera2(),
                          "CINE SYNC 50/60" to canUseCamera2(),
                          "AE RECORD LOCK" to recordLockSupport().first,
                          "AWB RECORD LOCK" to recordLockSupport().second,
                          "ORIENTATION SENSOR" to (
                              (activity.getSystemService(Context.SENSOR_SERVICE) as SensorManager)
                                  .getDefaultSensor(Sensor.TYPE_ROTATION_VECTOR) != null
                          )
                      )
                  }

                  fun recordLockSupport(): Pair<Boolean, Boolean> {
                      val camera = findCamera() ?: return false to false
                      return runCatching {
                          val c2 = Camera2CameraInfo.from(camera.cameraInfo)
                          val ae: Boolean =
                              c2.getCameraCharacteristic(
                                  android.hardware.camera2.CameraCharacteristics.CONTROL_AE_LOCK_AVAILABLE
                              ) == true
                          val awb: Boolean =
                              c2.getCameraCharacteristic(
                                  android.hardware.camera2.CameraCharacteristics.CONTROL_AWB_LOCK_AVAILABLE
                              ) == true
                          ae to awb
                      }.getOrDefault(false to false)
                  }

                  fun recordLockAvailable(): Boolean {
                      val support = recordLockSupport()
                      return support.first || support.second
                  }

                  fun engageRecordLocks(): Boolean {
                      val support = recordLockSupport()
                      if (!support.first && !support.second) return false

                      val options = mutableListOf<Pair<CaptureRequest.Key<*>, Any>>()
                      if (support.first) {
                          options += CaptureRequest.CONTROL_AE_LOCK to true
                      }
                      if (support.second) {
                          options += CaptureRequest.CONTROL_AWB_LOCK to true
                      }

                      return applyCamera2(options)
                  }

                  fun releaseRecordLocks(): Boolean {
                      val support = recordLockSupport()
                      if (!support.first && !support.second) return false

                      val options = mutableListOf<Pair<CaptureRequest.Key<*>, Any>>()
                      if (support.first) {
                          // Preserve an AF/AE point lock that was active before recording.
                          options += CaptureRequest.CONTROL_AE_LOCK to meteringLocked
                      }
                      if (support.second) {
                          options += CaptureRequest.CONTROL_AWB_LOCK to false
                      }

                      return applyCamera2(options)
                  }

                  fun takeSnapshot(): String {
                      val lens = lensLabel()
                      val iso = value("ISO")
                      val shutter = value("SHUTTER")
                      val wb = value("WB")
                      val fps = value("FPS")
                      val exp = value("EXPOSURE")
                      val zoom = value("ZOOM")
                      val focus = value("FOCUS")
                      val meter = if (meteringLocked) "AF/AE LOCK" else "AF/AE FREE"
                      return "$lens • ISO $iso • $shutter • WB $wb • ${fps}fps • " +
                          "EXP $exp • ZOOM $zoom • FOCUS $focus • $meter"
                  }

                  fun isLocked(): Boolean = locked

                  fun toggleLock(): Boolean {
                      locked = !locked
                      prefs.edit().putBoolean("dial_locked", locked).apply()
                      return locked
                  }

                  fun saveBank(slot: String): Boolean {
                      val camera = findCamera()
                      val key = "${lensMemoryPrefix()}_${slot}"
                      val exp = camera?.cameraInfo?.exposureState?.exposureCompensationIndex ?: 0
                      val zoom = camera?.cameraInfo?.zoomState?.value?.zoomRatio ?: 1f

                      prefs.edit()
                          .putInt("${key}_iso", isoIndex)
                          .putInt("${key}_shutter", shutterIndex)
                          .putInt("${key}_wb", wbIndex)
                          .putInt("${key}_fps", fpsIndex)
                          .putInt("${key}_focus", focusIndex)
                          .putInt("${key}_exp", exp)
                          .putFloat("${key}_zoom", zoom)
                          .putBoolean("${key}_saved", true)
                          .apply()
                      return true
                  }

                  fun recallBank(slot: String): Boolean {
                      if (locked) return false
                      val key = "${lensMemoryPrefix()}_${slot}"
                      if (!prefs.getBoolean("${key}_saved", false)) return false

                      val oldIso = isoIndex
                      val oldShutter = shutterIndex
                      val oldWb = wbIndex
                      val oldFps = fpsIndex
                      val oldFocus = focusIndex

                      isoIndex = prefs.getInt("${key}_iso", isoIndex).coerceIn(0, isoValues.lastIndex)
                      shutterIndex = prefs.getInt("${key}_shutter", shutterIndex).coerceIn(0, shutterLabels.lastIndex)
                      wbIndex = prefs.getInt("${key}_wb", wbIndex).coerceIn(0, wbModes.lastIndex)
                      fpsIndex = prefs.getInt("${key}_fps", fpsIndex).coerceIn(0, fpsRanges.lastIndex)
                      focusIndex = prefs.getInt("${key}_focus", focusIndex).coerceIn(0, focusValues.lastIndex)

                      var ok = true

                      if (canUseCamera2()) {
                          ok = applyManualSensor() && ok
                          ok = applyCamera2(
                              listOf(
                                  CaptureRequest.CONTROL_AWB_MODE to wbModes[wbIndex].second,
                                  CaptureRequest.CONTROL_AE_TARGET_FPS_RANGE to fpsRanges[fpsIndex].second
                              )
                          ) && ok

                          ok =
                              if (focusIndex == 0) {
                                  applyCamera2(
                                      listOf(
                                          CaptureRequest.CONTROL_AF_MODE to CaptureRequest.CONTROL_AF_MODE_CONTINUOUS_VIDEO
                                      )
                                  ) && ok
                              } else {
                                  applyCamera2(
                                      listOf(
                                          CaptureRequest.CONTROL_AF_MODE to CaptureRequest.CONTROL_AF_MODE_OFF,
                                          CaptureRequest.LENS_FOCUS_DISTANCE to focusValues[focusIndex]
                                      )
                                  ) && ok
                              }
                      }

                      val camera = findCamera()
                      if (camera != null) {
                          val expState = camera.cameraInfo.exposureState
                          val savedExp = prefs.getInt("${key}_exp", 0)
                          val expTarget = savedExp.coerceIn(
                              expState.exposureCompensationRange.lower,
                              expState.exposureCompensationRange.upper
                          )
                          camera.cameraControl.setExposureCompensationIndex(expTarget)

                          val zoomState = camera.cameraInfo.zoomState.value
                          if (zoomState != null) {
                              val savedZoom = prefs.getFloat("${key}_zoom", 1f)
                              camera.cameraControl.setZoomRatio(
                                  savedZoom.coerceIn(
                                      zoomState.minZoomRatio,
                                      zoomState.maxZoomRatio
                                  )
                              )
                          }
                      }

                      if (!ok) {
                          isoIndex = oldIso
                          shutterIndex = oldShutter
                          wbIndex = oldWb
                          fpsIndex = oldFps
                          focusIndex = oldFocus
                      }

                      return ok
                  }

                  fun resetAll(): Boolean {
                      if (locked) return false

                      isoIndex = 1
                      shutterIndex = 4
                      wbIndex = 0
                      fpsIndex = 2
                      focusIndex = 0

                      var ok = true
                      if (canUseCamera2()) {
                          ok = applyCamera2(
                              listOf(
                                  CaptureRequest.CONTROL_AE_MODE to CaptureRequest.CONTROL_AE_MODE_ON,
                                  CaptureRequest.CONTROL_AWB_MODE to CaptureRequest.CONTROL_AWB_MODE_AUTO,
                                  CaptureRequest.CONTROL_AF_MODE to CaptureRequest.CONTROL_AF_MODE_CONTINUOUS_VIDEO,
                                  CaptureRequest.CONTROL_AE_TARGET_FPS_RANGE to fpsRanges[fpsIndex].second
                              )
                          ) && ok
                      }

                      val camera = findCamera()
                      if (camera != null) {
                          camera.cameraControl.setExposureCompensationIndex(0)
                          camera.cameraControl.setZoomRatio(1f)
                      }

                      return ok
                  }

                  fun bankState(slot: String): String {
                      val key = "${lensMemoryPrefix()}_${slot}"
                      return if (prefs.getBoolean("${key}_saved", false)) "SAVED" else "EMPTY"
                  }

                  fun lensLabel(): String = activeLensLabel()

                  fun autoSafeLimits(): Boolean {
                      if (locked) return false

                      shutterAngleEnabled = false
                      flickerIndex = 0

                      val limits = sensorLimits()
                      if (limits.iso != null) {
                          val targetIso = 100.coerceIn(limits.iso.lower, limits.iso.upper)
                          isoIndex = isoValues.indices.minByOrNull {
                              kotlin.math.abs(isoValues[it] - targetIso)
                          } ?: isoIndex
                      }

                      if (limits.shutter != null) {
                          val targetShutter = 16_666_667L.coerceIn(
                              limits.shutter.lower,
                              limits.shutter.upper
                          )
                          shutterIndex = shutterNs.indices.minByOrNull {
                              kotlin.math.abs(shutterNs[it] - targetShutter)
                          } ?: shutterIndex
                      }

                      wbIndex = 0
                      fpsIndex = 2
                      focusIndex = 0

                      var ok = true
                      if (canUseCamera2()) {
                          ok = applyManualSensor() && ok
                          ok = applyCamera2(
                              listOf(
                                  CaptureRequest.CONTROL_AWB_MODE to CaptureRequest.CONTROL_AWB_MODE_AUTO,
                                  CaptureRequest.CONTROL_AF_MODE to CaptureRequest.CONTROL_AF_MODE_CONTINUOUS_VIDEO,
                                  CaptureRequest.CONTROL_AE_TARGET_FPS_RANGE to fpsRanges[fpsIndex].second,
                                  CaptureRequest.CONTROL_AE_ANTIBANDING_MODE to flickerModes[flickerIndex]
                              )
                          ) && ok
                      }

                      val camera = findCamera()
                      if (camera != null) {
                          val exposure = camera.cameraInfo.exposureState
                          if (exposure.isExposureCompensationSupported) {
                              camera.cameraControl.setExposureCompensationIndex(0)
                          }
                          camera.cameraControl.setZoomRatio(1f)
                      }

                      return ok
                  }

                  fun cineSync(hz: Int): Boolean {
                      if (locked) return false
                      if (!canUseCamera2()) return false

                      val oldFps = fpsIndex
                      val oldAngleIndex = shutterAngleIndex
                      val oldAngleEnabled = shutterAngleEnabled
                      val oldFlicker = flickerIndex

                      // 50 Hz -> 25 fps + 180° (1/50s)
                      // 60 Hz -> 30 fps + 180° (1/60s)
                      fpsIndex = if (hz == 50) 1 else 2
                      shutterAngleIndex = shutterAngles.indexOf(180).let { if (it >= 0) it else 3 }
                      shutterAngleEnabled = true
                      flickerIndex = if (hz == 50) 1 else 2

                      val success = applyCamera2(
                          listOf(
                              CaptureRequest.CONTROL_AE_MODE to CaptureRequest.CONTROL_AE_MODE_OFF,
                              CaptureRequest.SENSOR_SENSITIVITY to safeIso(),
                              CaptureRequest.SENSOR_EXPOSURE_TIME to safeShutterNs(),
                              CaptureRequest.CONTROL_AE_TARGET_FPS_RANGE to fpsRanges[fpsIndex].second,
                              CaptureRequest.CONTROL_AE_ANTIBANDING_MODE to flickerModes[flickerIndex]
                          )
                      )

                      if (!success) {
                          fpsIndex = oldFps
                          shutterAngleIndex = oldAngleIndex
                          shutterAngleEnabled = oldAngleEnabled
                          flickerIndex = oldFlicker
                      }

                      return success
                  }

                  fun cineSyncLabel(hz: Int): String =
                      if (hz == 50) "25fps • 180° • 1/50"
                      else "30fps • 180° • 1/60"

                  fun preset(name: String): Boolean {
                      if (locked) return false
                      shutterAngleEnabled = false
                      return when (name) {
                          "DAY" -> {
                              isoIndex = 1
                              shutterIndex = 4
                              wbIndex = 3
                              fpsIndex = 2
                              applyManualSensor() &&
                                  applyCamera2(
                                      listOf(
                                          CaptureRequest.CONTROL_AWB_MODE to wbModes[wbIndex].second,
                                          CaptureRequest.CONTROL_AE_TARGET_FPS_RANGE to fpsRanges[fpsIndex].second
                                      )
                                  )
                          }
                          "INDOOR" -> {
                              isoIndex = 2
                              shutterIndex = 4
                              wbIndex = 1
                              fpsIndex = 2
                              applyManualSensor() &&
                                  applyCamera2(
                                      listOf(
                                          CaptureRequest.CONTROL_AWB_MODE to wbModes[wbIndex].second,
                                          CaptureRequest.CONTROL_AE_TARGET_FPS_RANGE to fpsRanges[fpsIndex].second
                                      )
                                  )
                          }
                          "NIGHT" -> {
                              isoIndex = 4
                              shutterIndex = 2
                              wbIndex = 0
                              fpsIndex = 0
                              applyManualSensor() &&
                                  applyCamera2(
                                      listOf(
                                          CaptureRequest.CONTROL_AWB_MODE to wbModes[wbIndex].second,
                                          CaptureRequest.CONTROL_AE_TARGET_FPS_RANGE to fpsRanges[fpsIndex].second
                                      )
                                  )
                          }
                          "ACTION" -> {
                              isoIndex = 3
                              shutterIndex = 6
                              wbIndex = 0
                              fpsIndex = 4
                              applyManualSensor() &&
                                  applyCamera2(
                                      listOf(
                                          CaptureRequest.CONTROL_AWB_MODE to wbModes[wbIndex].second,
                                          CaptureRequest.CONTROL_AE_TARGET_FPS_RANGE to fpsRanges[fpsIndex].second
                                      )
                                  )
                          }
                          else -> false
                      }
                  }

                  fun telemetry(): String {
                      return buildString {
                          append(lensLabel()).append(" • ")
                          append("ISO ").append(value("ISO"))
                          append(" • S ").append(value("SHUTTER"))
                          append(" • WB ").append(value("WB"))
                          append(" • ").append(value("FPS")).append("fps")
                          if (shutterAngleEnabled) {
                              append(" • ").append(shutterAngles[shutterAngleIndex]).append("°")
                          }
                          append(" • ").append(flickerLabels[flickerIndex])
                          append(if (locked) " • DIAL LOCK" else " • LIVE")
                          append(if (meteringLocked) " • AF/AE LOCK" else "")
                      }
                  }
              }

              private data class RecPreflight(
                  val critical: Boolean,
                  val warning: Boolean,
                  val reason: String,
                  val batteryPercent: Int,
                  val freeGb: Double,
                  val thermalLabel: String,
                  val micReady: Boolean,
                  val cameraReady: Boolean
              ) {
                  fun details(): String =
                      "BAT ${batteryPercent}% • FREE ${String.format("%.1f", freeGb)}GB • " +
                          "THERMAL $thermalLabel • MIC ${if (micReady) "READY" else "CHECK"} • " +
                          "CAM ${if (cameraReady) "READY" else "CHECK"}"
              }

              private fun recPreflight(
                  activity: Activity,
                  dialController: CameraDialController
              ): RecPreflight {
                  val batteryManager =
                      activity.getSystemService(Context.BATTERY_SERVICE) as BatteryManager
                  val rawBattery =
                      batteryManager.getIntProperty(BatteryManager.BATTERY_PROPERTY_CAPACITY)
                  val battery = if (rawBattery in 0..100) rawBattery else 100

                  val stat = StatFs(activity.filesDir.absolutePath)
                  val freeBytes = stat.availableBytes
                  val freeGb = freeBytes.toDouble() / (1024.0 * 1024.0 * 1024.0)

                  val power =
                      activity.getSystemService(Context.POWER_SERVICE) as PowerManager
                  val thermal =
                      if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.Q) {
                          power.currentThermalStatus
                      } else {
                          PowerManager.THERMAL_STATUS_NONE
                      }

                  val thermalLabel =
                      if (Build.VERSION.SDK_INT < Build.VERSION_CODES.Q) {
                          "N/A"
                      } else {
                          when (thermal) {
                              PowerManager.THERMAL_STATUS_NONE -> "NORMAL"
                              PowerManager.THERMAL_STATUS_LIGHT -> "LIGHT"
                              PowerManager.THERMAL_STATUS_MODERATE -> "MOD"
                              PowerManager.THERMAL_STATUS_SEVERE -> "HIGH"
                              PowerManager.THERMAL_STATUS_CRITICAL -> "CRITICAL"
                              PowerManager.THERMAL_STATUS_EMERGENCY -> "EMERGENCY"
                              PowerManager.THERMAL_STATUS_SHUTDOWN -> "SHUTDOWN"
                              else -> "UNKNOWN"
                          }
                      }

                  val micReady =
                      if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.M) {
                          activity.checkSelfPermission(Manifest.permission.RECORD_AUDIO) ==
                              PackageManager.PERMISSION_GRANTED
                      } else {
                          true
                      }

                  val cameraReady = dialController.lensLabel() != "NO CAM"

                  val thermalCritical =
                      Build.VERSION.SDK_INT >= Build.VERSION_CODES.Q &&
                          thermal >= PowerManager.THERMAL_STATUS_CRITICAL
                  val thermalWarning =
                      Build.VERSION.SDK_INT >= Build.VERSION_CODES.Q &&
                          thermal >= PowerManager.THERMAL_STATUS_SEVERE

                  val critical =
                      !cameraReady ||
                          freeBytes < 350L * 1024L * 1024L ||
                          thermalCritical

                  val warning =
                      critical ||
                          battery < 15 ||
                          freeBytes < 1500L * 1024L * 1024L ||
                          thermalWarning ||
                          !micReady

                  val reason = when {
                      !cameraReady -> "NO CAM"
                      freeBytes < 350L * 1024L * 1024L -> "SPACE!"
                      thermalCritical -> "HEAT!"
                      battery < 15 -> "BAT ${battery}%"
                      freeBytes < 1500L * 1024L * 1024L -> "LOW SPACE"
                      thermalWarning -> "HEAT"
                      !micReady -> "MIC?"
                      else -> "READY"
                  }

                  return RecPreflight(
                      critical,
                      warning,
                      reason,
                      battery,
                      freeGb,
                      thermalLabel,
                      micReady,
                      cameraReady
                  )
              }

              private fun compactRecHealth(check: RecPreflight): String {
                  val thermal =
                      when (check.thermalLabel) {
                          "NORMAL", "LIGHT" -> "TEMP OK"
                          "MOD" -> "TEMP MOD"
                          "HIGH" -> "TEMP HIGH"
                          "CRITICAL", "EMERGENCY", "SHUTDOWN" -> "TEMP!"
                          else -> "TEMP ${check.thermalLabel}"
                      }

                  return "BAT ${check.batteryPercent}% • ${String.format("%.1f", check.freeGb)}GB • $thermal"
              }

              private fun warningState(textViews: List<TextView>): Pair<Boolean, String> {
                  val all = textViews.joinToString(" | ") { it.text?.toString().orEmpty().uppercase() }
                  return when {
                      "BATTERY LOW" in all -> true to "LOW BAT"
                      "OVERHEAT" in all || "THERMAL HIGH" in all || "TOO HOT" in all -> true to "HEAT"
                      "MIC LOCK" !in all && "MIC READY" !in all -> true to "MIC?"
                      else -> false to "SAFE"
                  }
              }

              fun install(activity: Activity) {
                  val decor = activity.window.decorView as? ViewGroup ?: return
                  if (decor.findViewWithTag<View>(TAG) != null) return

                  val w = activity.resources.displayMetrics.widthPixels
                  val h = activity.resources.displayMetrics.heightPixels

                  val textViews = mutableListOf<TextView>()
                  walk(decor, textViews)

                  val targets = linkedMapOf<String, View>()
                  val sources = linkedMapOf<String, TextView>()

                  fun hideBottomCrowd(tv: TextView) {
                      val raw = tv.text?.toString().orEmpty()
                      val upper = raw.uppercase().replace("\n", " ").trim()
                      if (upper.isBlank()) return

                      val loc = IntArray(2)
                      tv.getLocationOnScreen(loc)
                      val y = loc[1]
                      if (y < h * 0.68f) return

                      val remove =
                          ("READY" in upper && "WATCH" in upper) ||
                          upper == "TOOLS" ||
                          upper.startsWith("TOOLS ") ||
                          "CHECK BEFORE REC" in upper

                      if (!remove) return

                      var victim: View = tv
                      repeat(3) {
                          val parent = victim.parent as? View ?: return@repeat
                          val pw = parent.width
                          val ph = parent.height
                          if (
                              pw in 1..w &&
                              ph in 1..(h * 0.22f).toInt()
                          ) {
                              victim = parent
                          }
                      }
                      victim.visibility = View.GONE
                  }

                  textViews.forEach { hideBottomCrowd(it) }

                  textViews.forEach { tv ->
                      val raw = tv.text?.toString().orEmpty()
                      val upper = raw.uppercase()

                      if ("ASPECT" in upper) {
                          val loc = IntArray(2)
                          tv.getLocationOnScreen(loc)
                          if (loc[1] < h * 0.20f) tv.text = "ASPECT\n9:16"
                      }

                      val key = keyFor(raw) ?: return@forEach
                      if (key in targets) return@forEach

                      val loc = IntArray(2)
                      tv.getLocationOnScreen(loc)
                      val x = loc[0]
                      val y = loc[1]

                      val rightZone = x > w * 0.58f && y > h * 0.18f
                      val bottomZone = y > h * 0.56f
                      val host = clickableHost(activity, tv)

                      targets[key] = host
                      sources[key] = tv

                      val replaceWithCompactHud =
                          (rightZone && key in setOf(
                              "REC", "AF/AE", "LENS", "HEAT", "PRO", "TOOLS", "SET"
                          )) ||
                          (bottomZone && key in setOf(
                              "LUT", "EXPOSURE", "FOCUS", "AUDIO", "REVIEW", "TOOLS"
                          ))

                      if (replaceWithCompactHud) {
                          host.visibility = View.GONE
                      }
                  }

                  fun resolveLiveTarget(key: String): View? {
                      val existing = targets[key]
                      if (existing != null && existing.isAttachedToWindow) {
                          return existing
                      }

                      val liveText = mutableListOf<TextView>()
                      walk(decor, liveText)

                      liveText.forEach { tv ->
                          val mapped = keyFor(tv.text?.toString().orEmpty()) ?: return@forEach
                          if (mapped != key) return@forEach

                          val host = clickableHost(activity, tv)
                          targets[key] = host
                          sources[key] = tv
                          return host
                      }

                      return null
                  }

                  fun trigger(key: String): Boolean {
                      val target = resolveLiveTarget(key)
                      if (target == null) {
                          Toast.makeText(activity, "$key unavailable", Toast.LENGTH_SHORT).show()
                          return false
                      }

                      val oldVisibility = target.visibility
                      target.visibility = View.VISIBLE
                      target.performHapticFeedback(HapticFeedbackConstants.CLOCK_TICK)
                      val clicked = target.performClick()
                      target.visibility = oldVisibility

                      if (!clicked) {
                          val source = sources[key]
                          val sourceClicked =
                              if (source != null && source !== target) source.performClick()
                              else false

                          if (!sourceClicked) {
                              Toast.makeText(
                                  activity,
                                  "$key control found but has no click action",
                                  Toast.LENGTH_SHORT
                              ).show()
                          }
                          return sourceClicked
                      }

                      return true
                  }

                  val overlay = FrameLayout(activity).apply {
                      tag = TAG
                      setBackgroundColor(Color.TRANSPARENT)
                  }
                  decor.addView(
                      overlay,
                      ViewGroup.LayoutParams(
                          ViewGroup.LayoutParams.MATCH_PARENT,
                          ViewGroup.LayoutParams.MATCH_PARENT
                      )
                  )

                  fun insideNewHud(view: View): Boolean {
                      var current: View? = view
                      repeat(8) {
                          if (current === overlay) return true
                          current = current?.parent as? View
                          if (current == null) return false
                      }
                      return false
                  }

                  fun removeOldCameraGhosts() {
                      val live = mutableListOf<TextView>()
                      walk(decor, live)

                      live.forEach { tv ->
                          if (insideNewHud(tv)) return@forEach

                          val raw = tv.text?.toString().orEmpty()
                          val upper = raw.uppercase().replace("\n", " ").trim()
                          if (upper.isBlank()) return@forEach

                          val loc = IntArray(2)
                          tv.getLocationOnScreen(loc)
                          val x = loc[0]
                          val y = loc[1]
                          val key = keyFor(raw)
                          val host = clickableHost(activity, tv)

                          val oldRightStack =
                              x > w * 0.70f &&
                                  y > h * 0.22f &&
                                  key in setOf("REC", "AF/AE", "LENS", "PRO", "TOOLS", "SET")

                          val oldBottomPanel =
                              y > h * 0.68f &&
                                  (
                                      key in setOf(
                                          "LUT", "EXPOSURE", "FOCUS",
                                          "AUDIO", "REVIEW", "TOOLS"
                                      ) ||
                                      "CHECK BEFORE REC" in upper
                                  )

                          val oldLowerRec =
                              key == "REC" &&
                                  x > w * 0.68f &&
                                  y > h * 0.45f

                          if (oldRightStack || oldBottomPanel || oldLowerRec) {
                              host.visibility = View.GONE
                              tv.visibility = View.GONE
                          }
                      }
                  }

                  val ghostCleanupHandler = Handler(Looper.getMainLooper())
                  removeOldCameraGhosts()
                  ghostCleanupHandler.postDelayed({ removeOldCameraGhosts() }, 250L)
                  ghostCleanupHandler.postDelayed({ removeOldCameraGhosts() }, 900L)
                  ghostCleanupHandler.postDelayed({ removeOldCameraGhosts() }, 1800L)

                  // Number every visible build so side-by-side installs are instantly identifiable.
                  val versionBadge = solid(activity, "V280/69", "32.33.41").apply {
                      isClickable = false
                      isFocusable = false
                  }
                  overlay.addView(
                      versionBadge,
                      FrameLayout.LayoutParams(
                          dp(activity, 74),
                          dp(activity, 34)
                      ).apply {
                          gravity = Gravity.TOP or Gravity.START
                          topMargin = dp(activity, 106)
                          leftMargin = dp(activity, 6)
                      }
                  )

                  val telemetry = solid(
                      activity,
                      "ISO AUTO",
                      "SHUTTER • WB • FPS"
                  ).apply {
                      isClickable = false
                      isFocusable = false
                      textSize = 7.4f
                  }

                  val rec = recButton(activity)
                  overlay.addView(
                      rec,
                      FrameLayout.LayoutParams(
                          dp(activity, 52),
                          dp(activity, 52)
                      ).apply {
                          gravity = Gravity.END or Gravity.CENTER_VERTICAL
                          rightMargin = dp(activity, 2)
                      }
                  )

                  overlay.addView(
                      telemetry,
                      FrameLayout.LayoutParams(
                          dp(activity, 190),
                          dp(activity, 38)
                      ).apply {
                          gravity = Gravity.TOP or Gravity.CENTER_HORIZONTAL
                          topMargin = dp(activity, 106)
                      }
                  )

                  val quickAccess = solid(activity, "QUICK", "CAM CTRL")
                  overlay.addView(
                      quickAccess,
                      FrameLayout.LayoutParams(
                          dp(activity, 62),
                          dp(activity, 38)
                      ).apply {
                          gravity = Gravity.TOP or Gravity.START
                          topMargin = dp(activity, 148)
                          leftMargin = dp(activity, 6)
                      }
                  )

                  val drawerTab = solid(activity, "•", "〈")
                  overlay.addView(
                      drawerTab,
                      FrameLayout.LayoutParams(
                          dp(activity, 32),
                          dp(activity, 40)
                      ).apply {
                          gravity = Gravity.END or Gravity.CENTER_VERTICAL
                          rightMargin = dp(activity, 60)
                      }
                  )

                  val recHealthPill = solid(activity, "REC HEALTH", "READY").apply {
                      textSize = 7.0f
                      visibility = View.GONE
                      isClickable = false
                      isFocusable = false
                  }
                  overlay.addView(
                      recHealthPill,
                      FrameLayout.LayoutParams(
                          dp(activity, 128),
                          dp(activity, 38)
                      ).apply {
                          gravity = Gravity.TOP or Gravity.CENTER_HORIZONTAL
                          topMargin = dp(activity, 148)
                      }
                  )

                  val recordGuardPill = solid(activity, "GUARD", "READY").apply {
                      textSize = 7.2f
                      visibility = View.GONE
