                  fun addBankRow(slot: String) {
                      val row = LinearLayout(activity).apply {
                          orientation = LinearLayout.HORIZONTAL
                      }

                      val save = solid(activity, "SAVE $slot", dialController.bankState(slot))
                      val recall = solid(activity, "RECALL $slot", dialController.bankState(slot))

                      save.setOnClickListener {
                          dialController.saveBank(slot)
                          save.text = "SAVE $slot\nSAVED"
                          recall.text = "RECALL $slot\nSAVED"
                          Toast.makeText(
                              activity,
                              "Manual camera settings saved to $slot",
                              Toast.LENGTH_SHORT
                          ).show()
                      }

                      recall.setOnClickListener {
                          if (dialController.isLocked()) {
                              Toast.makeText(
                                  activity,
                                  "Unlock manual dials before recalling $slot",
                                  Toast.LENGTH_SHORT
                              ).show()
                              return@setOnClickListener
                          }

                          val ok = dialController.recallBank(slot)
                          Toast.makeText(
                              activity,
                              if (ok) "$slot settings recalled" else "$slot has no usable saved settings",
                              Toast.LENGTH_SHORT
                          ).show()
                      }

                      row.addView(
                          save,
                          LinearLayout.LayoutParams(
                              0,
                              dp(activity, 36),
                              1f
                          ).apply {
                              rightMargin = dp(activity, 2)
                          }
                      )
                      row.addView(
