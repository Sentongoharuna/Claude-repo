                      if (horizonVisible) {
                          horizonLine.visibility = if (visible) View.VISIBLE else View.GONE
                          horizonReadout.visibility = if (visible) View.VISIBLE else View.GONE
                          steadyReadout.visibility = if (visible) View.VISIBLE else View.GONE
                      }

                      // REC and QUICK remain visible so recording and all controls
                      // are always one tap away.
                      rec.visibility = View.VISIBLE
                      quickAccess.visibility = View.VISIBLE
                  }

                  val hideIdleHud = Runnable {
                      if (!recording && hudAutoHideEnabled) {
                          setIdleHudVisible(false)
                      }
                  }

                  fun wakeIdleHud() {
                      if (recording) return
                      setIdleHudVisible(true)
                      idleHudHandler.removeCallbacks(hideIdleHud)
                      if (hudAutoHideEnabled) {
                          idleHudHandler.postDelayed(hideIdleHud, 3500L)
                      }
                  }

                  fun applyEdgeStep(key: String, delta: Int) {
                      if (delta == 0) return
                      val value = dialController.adjust(key, delta)
                      when (key) {
                          "EXPOSURE" -> {
                              exposureMeter.text = edgeRulerText("EXP", value)
                              exposureMeter.performHapticFeedback(
                                  HapticFeedbackConstants.CLOCK_TICK
                              )
                          }
                          "ZOOM" -> {
                              zoomMeter.text = edgeRulerText("ZOOM", value)
                              zoomMeter.performHapticFeedback(
                                  HapticFeedbackConstants.CLOCK_TICK
                              )
                          }
                      }
                  }

                  val hideTemporary = Runnable {
                      if (!recording) {
                          exposureMeter.visibility = View.GONE
                          zoomMeter.visibility = View.GONE
                          if (!dialController.isMeteringLocked()) {
                              focusReticle.visibility = View.GONE
                          }
                      }
                  }

                  overlayActions["EDGE EXP"] = {
                      wakeIdleHud()
                      exposureMeter.text =
                          edgeRulerText("EXP", dialController.value("EXPOSURE"))
                      exposureMeter.visibility = View.VISIBLE
                      zoomMeter.visibility = View.GONE
                      handler.removeCallbacks(hideTemporary)
                      handler.postDelayed(hideTemporary, 1400L)
                      Toast.makeText(
