                  fun showFocusReticle(x: Float, y: Float, label: String, locked: Boolean) {
                      val lp = focusReticle.layoutParams as FrameLayout.LayoutParams
                      lp.gravity = Gravity.TOP or Gravity.START
                      lp.leftMargin = (x - dp(activity, 33)).roundToInt()
                          .coerceIn(0, (w - dp(activity, 66)).coerceAtLeast(0))
                      lp.topMargin = (y - dp(activity, 27)).roundToInt()
                          .coerceIn(0, (h - dp(activity, 54)).coerceAtLeast(0))
                      focusReticle.layoutParams = lp
                      focusReticle.text = "◎\n$label"
                      focusReticle.setTextColor(if (locked) WARN else GOLD)
                      focusReticle.visibility = View.VISIBLE
                      focusReticle.alpha = 1f
                      focusReticle.animate().cancel()
                      focusReticle.scaleX = 1.12f
                      focusReticle.scaleY = 1.12f
                      focusReticle.animate()
                          .scaleX(1f)
                          .scaleY(1f)
                          .setDuration(160L)
                          .start()
                  }

