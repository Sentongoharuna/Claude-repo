      - name: Verify V280-18 master preservation, routes, and stable core
        shell: bash
        run: |
          set -euo pipefail
          SRC='v172-source/app/src/main/java/com/sentongoharuna/pulse'
          HUB="$SRC/DevelopUgandaGeneralHubActivity.kt"
          V13="$SRC/DevelopUgandaV28013StableMasterRefinement.kt"
          V18="$SRC/DevelopUgandaV28018LiveOperatorIntelligence.kt"
          CAM="$SRC/DevelopUgandaCameraActivity.kt"
          GRADLE='v172-source/app/build.gradle.kts'
          AUDIT13='v172-source/V280-13-PRO-STABLE-MASTER-REFINEMENT-AUDIT.txt'
          AUDIT18='v172-source/V280-18-LIVE-OPERATOR-INTELLIGENCE-CONTROL-POLISH-AUDIT.txt'

          test -s "$V13"
          test -s "$V18"
          test -s "$AUDIT13"
          test -s "$AUDIT18"
          grep -q 'develop.uganda • V280/18 LIVE OPERATOR MASTER' "$HUB"
          grep -q 'LIVE SESSION' "$HUB"
          grep -q 'OPERATOR PRIORITY' "$HUB"
          grep -q 'LIVE OPERATOR WORKFLOW' "$HUB"
          grep -q 'fun sessionBar' "$V18"
          grep -q 'fun alert' "$V18"
          grep -q 'fun directorBrief' "$V18"
          grep -q 'fun continuityBrief' "$V18"
          grep -q 'versionCode = 28180' "$GRADLE"
          grep -q 'versionName = "280.18-live-operator-intelligence-control-polish"' "$GRADLE"

          # Proven capture/audio/safety path remains untouched and present.
          grep -q '.withAudioEnabled()' "$CAM"
          grep -q 'DevelopUgandaV276RecordingSafety.onRecordingStarted' "$CAM"
          grep -q 'DevelopUgandaV276RecordingSafety.onRecordingFinalized' "$CAM"
          grep -q 'DevelopUgandaV272FieldSoundContinuity.armAudioLock' "$CAM"
          grep -q 'DevelopUgandaV272FieldSoundContinuity.audioRouteChanged' "$CAM"
          ! grep -q 'AudioRecord.Builder()' "$CAM"

          # Key protected systems remain present.
          for f in \
            DevelopUgandaV262RemoteDirector.kt \
            DevelopUgandaV263MultiCamDirector.kt \
            DevelopUgandaV264LiveCutDirector.kt \
            DevelopUgandaV265ProxySyncReview.kt \
            DevelopUgandaV269SmartStoryDesk.kt \
            DevelopUgandaV274MediaVault.kt \
            DevelopUgandaV277LightingExposure.kt \
            DevelopUgandaV280SmartDirector.kt
          do
            test -s "$SRC/$f"
          done

          # No empty click handlers and every routed Activity resolves.
          python3 - <<'PYAUDIT'
          from pathlib import Path
          import re
          root=Path('v172-source')
          src=root/'app/src/main/java/com/sentongoharuna/pulse'
          manifest=(root/'app/src/main/AndroidManifest.xml').read_text(encoding='utf-8')
          declared=set(re.findall(r'android:name="\.([A-Za-z0-9_]+)"',manifest))
          routes=set(); classes=set(); empty=[]
          for p in src.glob('*.kt'):
              t=p.read_text(encoding='utf-8',errors='ignore')
              routes.update(re.findall(r'(DevelopUganda[A-Za-z0-9_]+Activity)::class\.java',t))
              classes.update(re.findall(r'\b(?:open\s+)?class\s+(DevelopUganda[A-Za-z0-9_]+Activity)\b',t))
              if re.search(r'setOnClickListener\s*\{\s*\}',t):
                  empty.append(p.name)
          mm=sorted(routes-declared); mc=sorted(routes-classes)
          if mm or mc or empty:
              raise SystemExit('Route/button audit failed: missing manifest=%r missing class=%r empty=%r' % (mm,mc,empty))
          print('PASS: %d routed Activities resolve; no empty click handlers.' % len(routes))
          PYAUDIT
          echo 'PASS: V280/18 source, routes, Director stack, and protected recording/audio core verified.'

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android platform
        run: sdkmanager "platforms;android-36" "build-tools;35.0.0"

      - name: Set up Gradle 8.11.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.11.1

      - name: Build V280-18 APK
        working-directory: v172-source
        shell: bash
        run: |
          set -o pipefail
          gradle --no-daemon :app:assembleDebug --stacktrace 2>&1 | tee v28018-build.log

      - name: Prepare V280-18 APK
        if: success()
        run: |
          cp v172-source/app/build/outputs/apk/debug/app-debug.apk \
            DEVELOP-UGANDA-V280-18-LIVE-OPERATOR-INTELLIGENCE-CONTROL-POLISH.apk

      - name: Upload V280-18 APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: DEVELOP-UGANDA-V280-18-LIVE-OPERATOR-INTELLIGENCE-CONTROL-POLISH
          path: DEVELOP-UGANDA-V280-18-LIVE-OPERATOR-INTELLIGENCE-CONTROL-POLISH.apk
          retention-days: 14

      - name: Upload V280-18 audits
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: V280-18-LIVE-OPERATOR-AUDITS
          path: |
            v172-source/V280-11-FULL-PRESERVATION-AUDIT.txt
            v172-source/V280-12-PRO-WORKFLOW-AUDIT.txt
            v172-source/V280-12-FIX1-RUNTIME-AUDIT.txt
            v172-source/V280-12-FIX2-PHONE-CRASH-AUDIT.txt
            v172-source/V280-12-FIX3-FULL-FUNCTION-BUTTON-AUDIT.txt
            v172-source/V280-13-PRO-STABLE-MASTER-REFINEMENT-AUDIT.txt
            v172-source/V280-18-LIVE-OPERATOR-INTELLIGENCE-CONTROL-POLISH-AUDIT.txt
          retention-days: 14

      - name: Upload V280-18 build log if failed
        if: failure()
