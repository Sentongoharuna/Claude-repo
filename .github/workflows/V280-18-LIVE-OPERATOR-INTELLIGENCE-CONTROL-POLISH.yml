name: Build develop.uganda V280-18 LIVE OPERATOR INTELLIGENCE + CONTROL POLISH

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/V280-18-LIVE-OPERATOR-INTELLIGENCE-CONTROL-POLISH.yml'

permissions:
  contents: read

jobs:
  build_v280_18_live_operator_intelligence_control_polish:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout Claude repo
        uses: actions/checkout@v4

      - name: Fetch verified V280-12 FIX3 stable recipe
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 \
            'https://raw.githubusercontent.com/Sentongoharuna/Claude-repo/05258cf4058d16dc62bb557dd04b040685f4ebfd/.github/workflows/V280-12-FIX3-FULL-FUNCTION-BUTTON-HARDENING.yml' \
            -o /tmp/V280-12-FIX3.yml
          echo '063225a4de633a8c282082cecf870300ff7b12f5c8d650b259d568b4bf7ec4c3  /tmp/V280-12-FIX3.yml' | sha256sum -c -
          grep -q 'Build develop.uganda V280-12 FIX3 FULL FUNCTION + BUTTON HARDENING' /tmp/V280-12-FIX3.yml
          echo 'PASS: pinned working V280/12 FIX3 recipe downloaded and verified.'

      - name: Replay verified V280-12 FIX3 source pipeline
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PYREPLAY'
          from pathlib import Path
          import re, subprocess, tempfile, os

          recipe=Path('/tmp/V280-12-FIX3.yml')
          lines=recipe.read_text(encoding='utf-8').splitlines()
          wanted=[
              'Fetch verified V280-5 recipe',
              'Replay V280-5 source recipe',
              'Apply V280-9 safe V272 audio continuity',
              'Apply V280-11 FIX2 full legacy preservation master guard',
              'Apply V280-12 pro workflow console + function deepening',
              'Apply V280-12 FIX1 runtime stability + safe actions',
              'Apply V280-12 FIX2 format crash + all-button runtime guard',
              'Apply V280-12 FIX3 full function + button hardening',
              'Verify V280-12 console, preserved master, and critical recording path',
          ]

          def indent(s): return len(s)-len(s.lstrip(' '))
          steps={}
          i=0
          while i<len(lines):
              m=re.match(r'^(\s*)- name:\s*(.+?)\s*$',lines[i])
              if not m:
                  i+=1; continue
              step_indent=len(m.group(1)); name=m.group(2); j=i+1; end=len(lines)
              for k in range(j,len(lines)):
                  mm=re.match(r'^(\s*)- name:\s*(.+?)\s*$',lines[k])
                  if mm and len(mm.group(1))==step_indent:
                      end=k; break
              wd=None; script=None
              for k in range(i+1,end):
                  s=lines[k].strip()
                  if s.startswith('working-directory:'):
                      wd=s.split(':',1)[1].strip().strip("'\"")
                  if s=='run: |':
                      run_indent=indent(lines[k]); content_indent=run_indent+2; block=[]
                      for q in range(k+1,end):
                          ln=lines[q]
                          if not ln.strip(): block.append(''); continue
                          ind=indent(ln)
                          if ind<=run_indent: break
                          block.append(ln[content_indent:] if len(ln)>=content_indent else '')
                      script='\n'.join(block)+'\n'; break
              steps[name]=(wd,script)
              i=end

          missing=[n for n in wanted if n not in steps or not steps[n][1]]
          if missing: raise SystemExit('Missing FIX3 replay steps: '+', '.join(missing))
          root=Path.cwd()
          for name in wanted:
              wd,script=steps[name]
              print('\n===== FIX3 BASE STEP:',name,'=====',flush=True)
              work=(root/wd).resolve() if wd else root
              work.mkdir(parents=True,exist_ok=True) if wd and not work.exists() else None
              with tempfile.NamedTemporaryFile('w',suffix='.sh',delete=False,encoding='utf-8') as f:
                  f.write(script); tmp=f.name
              try:
                  r=subprocess.run(['bash',tmp],cwd=str(work),env=os.environ.copy())
              finally:
                  Path(tmp).unlink(missing_ok=True)
              if r.returncode:
                  raise SystemExit(r.returncode)
          print('PASS: proven V280/12 FIX3 source pipeline replayed.')
          PYREPLAY

