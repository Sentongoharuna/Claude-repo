      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android platform
        run: sdkmanager "platforms;android-36" "build-tools;35.0.0"

      - name: Set up Gradle 8.11.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Build V280-7 APK
        working-directory: v172-source
        shell: bash
        run: |
          set -o pipefail
          gradle --no-daemon :app:assembleDebug --stacktrace 2>&1 | tee v2807-build.log

      - name: Prepare V280-7 APK
        if: success()
        run: |
          cp v172-source/app/build/outputs/apk/debug/app-debug.apk \
            DEVELOP-UGANDA-V280-7-REC-CORE-AUDIO.apk

      - name: Upload V280-7 APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: DEVELOP-UGANDA-V280-7-REC-CORE-AUDIO
          path: DEVELOP-UGANDA-V280-7-REC-CORE-AUDIO.apk
          retention-days: 14

