name: Build develop.uganda V280-7 PRO CAM REC CORE + AUDIO

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/V280-7-REC-CORE-AUDIO.yml'

permissions:
  contents: read

jobs:
  build_v280_7_rec_core_audio:
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Checkout Claude repo
        uses: actions/checkout@v4

      - name: Fetch verified V280-5 recipe
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 \
            'https://raw.githubusercontent.com/Sentongoharuna/Claude-repo/3324bd4558283334bd5b93225ee9dfd19cf59cdb/.github/workflows/V280-5-PRO-CAM.yml' \
            -o /tmp/V280-5-PRO-CAM.yml
          echo 'dab9a31f43408a4fe047efd9bbbab7c4d75dd5505a7ee840c7b3be6d09aa10be  /tmp/V280-5-PRO-CAM.yml' | sha256sum -c -
          echo 'PASS: verified V280-5 build recipe downloaded.'

      - name: Replay V280-5 source recipe
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re, subprocess, sys

          recipe = Path('/tmp/V280-5-PRO-CAM.yml')
          text = recipe.read_text(encoding='utf-8')
          lines = text.splitlines()

          targets = [
              'Restore cumulative V270 base',
              'Apply cumulative V271 V272 V273 V274 source patch',
              'Apply V275 control surface + dual settings patch',
              'Apply V276 recording safety + recovery patch',
              'Apply V277 lighting + exposure intelligence overlay',
              'Verify V277 preservation and version',
              'Apply V278 live workflow home overlay',
              'Apply V279 active shooting intelligence overlay',
              'Apply V280 Smart Director + sequence coverage overlay',
              'Verify V280 preservation and Smart Director integration',
              'Apply V280-5 video pipeline safe-mode hotfix',
          ]

          def extract_run(name):
              marker = re.compile(r'^(\s*)-\s+name:\s+' + re.escape(name) + r'\s*$')
              start = None
              step_indent = None
              for i, line in enumerate(lines):
                  m = marker.match(line)
                  if m:
                      start = i
                      step_indent = len(m.group(1))
                      break
              if start is None:
                  raise SystemExit(f'Missing recipe step: {name}')

              end = len(lines)
              for i in range(start + 1, len(lines)):
                  stripped = lines[i].lstrip(' ')
                  indent = len(lines[i]) - len(stripped)
                  if stripped.startswith('- name:') and indent == step_indent:
                      end = i
                      break

              run_line = None
              run_indent = None
              for i in range(start + 1, end):
                  stripped = lines[i].lstrip(' ')
                  indent = len(lines[i]) - len(stripped)
                  if stripped == 'run: |':
                      run_line = i
                      run_indent = indent
                      break
              if run_line is None:
                  raise SystemExit(f'No run block found for: {name}')

              block = []
              content_indent = run_indent + 2
              for i in range(run_line + 1, end):
                  line = lines[i]
                  if not line.strip():
                      block.append('')
                      continue
                  indent = len(line) - len(line.lstrip(' '))
                  if indent <= run_indent:
                      break
                  block.append(line[content_indent:] if len(line) >= content_indent else '')
              return '\n'.join(block) + '\n'

          for name in targets:
              print(f'\n===== {name} =====', flush=True)
              script = extract_run(name)
              # Avoid Linux ARG_MAX for the very large embedded patch steps.
              # Write each extracted run block to a real shell script, then execute the file.
              safe_name = ''.join(c if c.isalnum() else '_' for c in name)
              script_path = Path('/tmp') / f'v2805_{safe_name}.sh'
              script_path.write_text(
                  '#!/usr/bin/env bash\nset -euo pipefail\n' + script,
                  encoding='utf-8'
              )
              script_path.chmod(0o700)
              result = subprocess.run(
                  ['bash', str(script_path)],
                  cwd='.',
                  text=True
              )
              if result.returncode != 0:
                  raise SystemExit(result.returncode)

          print('\nPASS: V280-5 source recipe replay completed.', flush=True)
          PY

