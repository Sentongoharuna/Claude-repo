name: Build Magic Pro R120 R118 UI Top 3 Buttons

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/R120-R118-UI-TOP-3-CENTERED-BUTTONS.yml'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install YAML parser
        run: python -m pip install --disable-pip-version-check pyyaml

      - name: Recreate exact tested R116 engine
        shell: bash
        run: |
          set -euo pipefail
          python <<'PY'
          from pathlib import Path
          import yaml

          source = Path(".github/workflows/R116-PRODUCTION-CONTROL-CENTER-FIX3-APK.yml")
          if not source.exists():
              raise SystemExit("Missing R116 FIX3 tested-engine workflow")

          wf = yaml.safe_load(source.read_text(encoding="utf-8"))
          step = next((s for s in wf["jobs"]["build"]["steps"]
                       if s.get("name") == "Create R116 Android project"), None)
          if not step or not step.get("run"):
              raise SystemExit("R116 project generator not found")

          Path("/tmp/r116-engine.sh").write_text(step["run"], encoding="utf-8")
          print("Using the exact R116 project generator as the R120 engine foundation.")
          PY

          bash /tmp/r116-engine.sh
          test -f r116/app/src/main/java/com/sentongoharuna/ducamera/R116MagicProProductionControlActivity.java

      - name: Rebuild only the presentation layer as R120
        shell: bash
        run: |
          set -euo pipefail
          python <<'PY'
          from pathlib import Path
          import re

          java = Path("r116/app/src/main/java/com/sentongoharuna/ducamera/R116MagicProProductionControlActivity.java")
          manifest = Path("r116/app/src/main/AndroidManifest.xml")
          gradle = Path("r116/app/build.gradle")
          src = java.read_text(encoding="utf-8")

          # Known R116 FIX3 compilation repair. No engine behavior is changed.
          if "import java.io.FileOutputStream;" not in src:
              anchor = "import java.io.PrintWriter;"
              if anchor in src:
                  src = src.replace(anchor, anchor + "\nimport java.io.FileOutputStream;", 1)
              else:
                  p = src.find("\n", src.find("package "))
                  src = src[:p+1] + "import java.io.FileOutputStream;\n" + src[p+1:]

          def method_end(text, method_name):
              m = re.search(r'\bvoid\s+' + re.escape(method_name) + r'\s*\([^)]*\)\s*\{', text)
              if not m:
                  return None
              start = text.find("{", m.start())
              depth = 0
              mode = "code"
              i = start
              while i < len(text):
                  c = text[i]
                  n = text[i+1] if i + 1 < len(text) else ""
                  if mode == "code":
                      if c == '"': mode = "str"
                      elif c == "'": mode = "chr"
                      elif c == "/" and n == "/": mode = "line"; i += 1
                      elif c == "/" and n == "*": mode = "block"; i += 1
                      elif c == "{": depth += 1
                      elif c == "}":
                          depth -= 1
                          if depth == 0: return i
                  elif mode == "str":
                      if c == "\\": i += 1
                      elif c == '"': mode = "code"
                  elif mode == "chr":
                      if c == "\\": i += 1
                      elif c == "'": mode = "code"
                  elif mode == "line":
                      if c == "\n": mode = "code"
                  elif mode == "block":
                      if c == "*" and n == "/": mode = "code"; i += 1
                  i += 1
              return None

          # Install R120 after the existing R116 initialization has completed.
          if "r120InstallOrganizedCameraUi();" not in src:
              end = method_end(src, "onCreate")
              if end is None:
                  raise SystemExit("Could not safely locate onCreate()")
              call = '''
                  new android.os.Handler(android.os.Looper.getMainLooper()).postDelayed(
                          () -> r120InstallOrganizedCameraUi(), 450L);
              '''
              src = src[:end] + call + src[end:]

          if "private void r120InstallOrganizedCameraUi()" not in src:
              helper = r'''
          // ================================================================
          // MAGIC PRO R120 — ORGANIZED UI OVER THE TESTED R116 ENGINE
          // ================================================================
          private final java.util.ArrayList<android.view.View> r120Legacy =
                  new java.util.ArrayList<>();
          private android.widget.FrameLayout r120Shell;
          private android.widget.ScrollView r120Sheet;
          private android.widget.LinearLayout r120SheetBody;
          private android.widget.TextView r120Mode;

          private int r120Dp(float n) {
              return Math.round(n * getResources().getDisplayMetrics().density);
          }

          private android.graphics.drawable.GradientDrawable r120Background(
                  int fill, float radius, int stroke, int strokeWidth) {
              android.graphics.drawable.GradientDrawable g =
                      new android.graphics.drawable.GradientDrawable();
              g.setColor(fill);
              g.setCornerRadius(r120Dp(radius));
              if (strokeWidth > 0) g.setStroke(r120Dp(strokeWidth), stroke);
              return g;
          }

          private android.widget.TextView r120Label(String text, float sp) {
              android.widget.TextView v = new android.widget.TextView(this);
              v.setText(text);
              v.setTextColor(android.graphics.Color.WHITE);
              v.setTextSize(sp);
              v.setGravity(android.view.Gravity.CENTER);
              v.setPadding(r120Dp(8), r120Dp(8), r120Dp(8), r120Dp(8));
              v.setMinHeight(r120Dp(44));
              return v;
          }

          private String r120Norm(String s) {
              return s == null ? "" :
                      s.toUpperCase(java.util.Locale.US).replace("\n", " ")
                       .replaceAll("\\s+", " ").trim();
          }

          private void r120Collect(android.view.View v) {
              if (v == null) return;
              if (v instanceof android.widget.TextView && v.hasOnClickListeners()) {
                  CharSequence t = ((android.widget.TextView) v).getText();
                  if (t != null && t.length() > 0) r120Legacy.add(v);
              }
              if (v instanceof android.view.ViewGroup) {
                  android.view.ViewGroup g = (android.view.ViewGroup) v;
                  for (int i = 0; i < g.getChildCount(); i++) r120Collect(g.getChildAt(i));
              }
          }

          private androidx.camera.view.PreviewView r120Preview(android.view.View v) {
              if (v instanceof androidx.camera.view.PreviewView)
                  return (androidx.camera.view.PreviewView) v;
              if (v instanceof android.view.ViewGroup) {
                  android.view.ViewGroup g = (android.view.ViewGroup) v;
                  for (int i = 0; i < g.getChildCount(); i++) {
                      androidx.camera.view.PreviewView p = r120Preview(g.getChildAt(i));
                      if (p != null) return p;
                  }
              }
              return null;
          }

          private boolean r120Matches(android.view.View v, String... keys) {
              if (!(v instanceof android.widget.TextView) || !v.hasOnClickListeners()) return false;
              String text = r120Norm(((android.widget.TextView) v).getText().toString());
              for (String key : keys) {
                  String k = r120Norm(key);
                  if (!k.isEmpty() && (text.equals(k) || text.startsWith(k + " ") || text.contains(k)))
                      return true;
              }
              return false;
          }

          private boolean r120Has(String... keys) {
              for (android.view.View v : r120Legacy) if (r120Matches(v, keys)) return true;
              return false;
          }

          private boolean r120Click(String... keys) {
              java.util.ArrayList<android.view.View> matches = new java.util.ArrayList<>();
              for (android.view.View v : r120Legacy) if (r120Matches(v, keys)) matches.add(v);
              java.util.Collections.sort(matches, (a, b) ->
                      Integer.compare(((android.widget.TextView)a).getText().length(),
                                      ((android.widget.TextView)b).getText().length()));
              for (android.view.View v : matches) if (v.performClick()) return true;
              return false;
          }

          private android.widget.TextView r120Action(String label, String... keys) {
              if (!r120Has(keys)) return null; // no fake unsupported controls
              android.widget.TextView b = r120Label(label, 11f);
              b.setTypeface(android.graphics.Typeface.DEFAULT_BOLD);
              b.setBackground(r120Background(0xD91A2028, 11, 0x66586575, 1));
              b.setOnClickListener(v -> {
                  if (!r120Click(keys)) android.widget.Toast.makeText(
                          this, label + " unavailable", android.widget.Toast.LENGTH_SHORT).show();
              });
              return b;
          }

          private android.widget.LinearLayout r120Row() {
              android.widget.LinearLayout r = new android.widget.LinearLayout(this);
              r.setOrientation(android.widget.LinearLayout.HORIZONTAL);
              r.setGravity(android.view.Gravity.CENTER);
              return r;
          }

          private void r120Put(android.widget.LinearLayout row, String label, String... keys) {
              android.widget.TextView b = r120Action(label, keys);
              if (b == null) return;
              android.widget.LinearLayout.LayoutParams lp =
                      new android.widget.LinearLayout.LayoutParams(0, r120Dp(46), 1f);
              lp.setMargins(r120Dp(3), r120Dp(3), r120Dp(3), r120Dp(3));
              row.addView(b, lp);
          }

          private void r120Section(String title) {
              android.widget.TextView h = r120Label(title, 11f);
              h.setGravity(android.view.Gravity.START | android.view.Gravity.CENTER_VERTICAL);
              h.setTextColor(0xFFAFC5DB);
              h.setTypeface(android.graphics.Typeface.DEFAULT_BOLD);
              android.widget.LinearLayout.LayoutParams p =
                      new android.widget.LinearLayout.LayoutParams(
                              android.view.ViewGroup.LayoutParams.MATCH_PARENT, r120Dp(38));
              p.topMargin = r120Dp(5);
              r120SheetBody.addView(h, p);
          }

          private void r120AddRow(Object[][] items) {
              android.widget.LinearLayout row = r120Row();
              for (Object[] item : items) {
                  String label = (String)item[0];
                  String[] keys = (String[])item[1];
                  r120Put(row, label, keys);
              }
              if (row.getChildCount() > 0) r120SheetBody.addView(row);
          }

          private void r120CloseButton() {
              android.widget.TextView c = r120Label("CLOSE PANEL", 11f);
              c.setTypeface(android.graphics.Typeface.DEFAULT_BOLD);
              c.setBackground(r120Background(0xEE252C35, 11, 0x66798798, 1));
              c.setOnClickListener(v -> r120Sheet.setVisibility(android.view.View.GONE));
              android.widget.LinearLayout.LayoutParams p =
                      new android.widget.LinearLayout.LayoutParams(
                              android.view.ViewGroup.LayoutParams.MATCH_PARENT, r120Dp(48));
              p.setMargins(0, r120Dp(10), 0, r120Dp(4));
              r120SheetBody.addView(c, p);
          }

