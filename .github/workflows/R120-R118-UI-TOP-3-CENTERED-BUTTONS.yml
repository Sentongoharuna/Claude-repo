          private void r120InstallOrganizedCameraUi() {
              if (r120Shell != null) return;
              android.widget.FrameLayout content =
                      (android.widget.FrameLayout)findViewById(android.R.id.content);
              if (content == null || content.getChildCount() == 0) return;

              r120Legacy.clear();
              r120Collect(content);

              // Keep the already-bound PreviewView. Camera/encoder logic stays untouched.
              androidx.camera.view.PreviewView preview = r120Preview(content);
              if (preview != null) {
                  android.view.ViewParent par = preview.getParent();
                  if (par instanceof android.view.ViewGroup)
                      ((android.view.ViewGroup)par).removeView(preview);
                  content.removeAllViews();
                  content.addView(preview, new android.widget.FrameLayout.LayoutParams(
                          android.view.ViewGroup.LayoutParams.MATCH_PARENT,
                          android.view.ViewGroup.LayoutParams.MATCH_PARENT));
              }

              r120Shell = new android.widget.FrameLayout(this);
              content.addView(r120Shell, new android.widget.FrameLayout.LayoutParams(
                      android.view.ViewGroup.LayoutParams.MATCH_PARENT,
                      android.view.ViewGroup.LayoutParams.MATCH_PARENT));

              // R120 TOP BAR — only the three requested centered buttons.
              // No MAGIC PRO text. No extra status bar. No other UI changes.
              android.widget.LinearLayout top = new android.widget.LinearLayout(this);
              top.setOrientation(android.widget.LinearLayout.HORIZONTAL);
              top.setGravity(android.view.Gravity.CENTER);
              top.setPadding(r120Dp(12), r120Dp(6), r120Dp(12), r120Dp(6));
              top.setBackgroundColor(android.graphics.Color.TRANSPARENT);

              android.widget.TextView proCam = r120Label("PRO CAM", 10.5f);
              proCam.setTypeface(android.graphics.Typeface.DEFAULT_BOLD);
              proCam.setBackground(r120Background(0xE51A2028, 18, 0xFF9BD6FF, 1));
              proCam.setOnClickListener(v -> r120Show("PRO"));

              android.widget.TextView liveCam = r120Label("LIVE CAM", 10.5f);
              liveCam.setTypeface(android.graphics.Typeface.DEFAULT_BOLD);
              liveCam.setBackground(r120Background(0xE51A2028, 18, 0xFF9BD6FF, 1));
              liveCam.setOnClickListener(v -> r120Show("LIVE"));

              android.widget.TextView settingsTop = r120Label("SETTINGS", 10.5f);
              settingsTop.setTypeface(android.graphics.Typeface.DEFAULT_BOLD);
              settingsTop.setBackground(r120Background(0xE51A2028, 18, 0xFF9BD6FF, 1));
              settingsTop.setOnClickListener(v -> r120Show("SETTINGS"));

              android.widget.LinearLayout.LayoutParams proP =
                      new android.widget.LinearLayout.LayoutParams(r120Dp(104), r120Dp(44));
              proP.setMargins(r120Dp(5), 0, r120Dp(5), 0);
              android.widget.LinearLayout.LayoutParams liveP =
                      new android.widget.LinearLayout.LayoutParams(r120Dp(104), r120Dp(44));
              liveP.setMargins(r120Dp(5), 0, r120Dp(5), 0);
              android.widget.LinearLayout.LayoutParams setP =
                      new android.widget.LinearLayout.LayoutParams(r120Dp(104), r120Dp(44));
              setP.setMargins(r120Dp(5), 0, r120Dp(5), 0);

              top.addView(proCam, proP);
              top.addView(liveCam, liveP);
              top.addView(settingsTop, setP);

              android.widget.FrameLayout.LayoutParams topP =
                      new android.widget.FrameLayout.LayoutParams(
                              android.view.ViewGroup.LayoutParams.MATCH_PARENT, r120Dp(58),
                              android.view.Gravity.TOP);
              topP.topMargin = r120Dp(6);
              r120Shell.addView(top, topP);

              // Left exposure rail — only real existing controls are shown.
              android.widget.LinearLayout left = new android.widget.LinearLayout(this);
              left.setOrientation(android.widget.LinearLayout.VERTICAL);
              left.setGravity(android.view.Gravity.CENTER);
              String[][] leftData = {
                      {"ISO","ISO"}, {"SHUT","SHUTTER"}, {"WB","WB"},
                      {"FOCUS","FOCUS"}, {"EV","EV"}, {"LUT","LUT"}
              };
              for (String[] x : leftData) {
                  android.widget.TextView b = r120Action(x[0], x[1]);
                  if (b != null) {
                      android.widget.LinearLayout.LayoutParams p =
                              new android.widget.LinearLayout.LayoutParams(r120Dp(58), r120Dp(42));
                      p.setMargins(0, r120Dp(3), 0, r120Dp(3));
                      left.addView(b, p);
                  }
              }
              android.widget.FrameLayout.LayoutParams leftP =
                      new android.widget.FrameLayout.LayoutParams(
