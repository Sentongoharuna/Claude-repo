        shell: bash
        run: |
          set -o pipefail
          gradle --no-daemon :app:assembleDebug --stacktrace 2>&1 | tee r038-tiktok-exposure-pro-build.log

      - name: Prepare APK
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          APK='r38-exposure/app/build/outputs/apk/debug/app-debug.apk'
          OUT='DU-Camera-R038-TIKTOK-EXPOSURE-PRO.apk'
          test -s "$APK"
          cp "$APK" "$OUT"
          ls -lh "$OUT"
          sha256sum "$OUT"

      - name: Upload audit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: R038-TIKTOK-EXPOSURE-PRO-AUDIT
          path: /tmp/R038-TIKTOK-EXPOSURE-PRO-AUDIT.txt
          if-no-files-found: error
          retention-days: 14

      - name: Upload failed build log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: R038-TIKTOK-EXPOSURE-PRO-FAILED-BUILD-LOG
          path: r38-exposure/r038-tiktok-exposure-pro-build.log
          if-no-files-found: warn
          retention-days: 14

      - name: Upload R038 APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: DU-Camera-R038-TIKTOK-EXPOSURE-PRO
          path: DU-Camera-R038-TIKTOK-EXPOSURE-PRO.apk
          if-no-files-found: error
          retention-days: 14
