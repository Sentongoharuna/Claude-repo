      run: "set -euo pipefail\n\nrm -rf r50-texture\nmkdir -p r50-texture/app/src/main/java/com/sentongoharuna/ducamera\nmkdir -p r50-texture/app/src/main/res/values\n\ncat > r50-texture/gradle.properties <<'PROPS'\nandroid.useAndroidX=true\nandroid.enableJetifier=false\norg.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8\nPROPS\n\ncat > r50-texture/settings.gradle <<'GRADLE'\npluginManagement {\n    repositories {\n        google()\n        mavenCentral()\n        gradlePluginPortal()\n    }\n}\n\ndependencyResolutionManagement {\n    repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)\n    repositories {\n        google()\n        mavenCentral()\n    }\n}\n\nrootProject.name = \"DUCameraR050ReferenceTextureBalancePro\"\ninclude(\":app\")\nGRADLE\n\ncat > r50-texture/build.gradle <<'GRADLE'\nplugins {\n    id 'com.android.application' version '8.11.1' apply false\n}\nGRADLE\n\ncat > r50-texture/app/build.gradle <<'GRADLE'\nplugins {\n    id 'com.android.application'\n}\n\nandroid {\n    namespace 'com.sentongoharuna.ducamera'\n    compileSdk 36\n\n    defaultConfig {\n        applicationId 'com.sentongoharuna.ducamera.r050referencetexturebalancepro'\n        minSdk 24\n        targetSdk 35\n        versionCode 400000064\n        versionName '1.0-r050-reference-texture-balance-pro'\n    }\n\n    compileOptions {\n        sourceCompatibility JavaVersion.VERSION_17\n        targetCompatibility JavaVersion.VERSION_17\n    }\n}\n\ndependencies {\n    implementation 'androidx.activity:activity:1.10.1'\n    implementation 'androidx.core:core:1.15.0'\n    implementation 'androidx.camera:camera-core:1.7.0-alpha03'\n    implementation 'androidx.camera:camera-camera2:1.7.0-alpha03'\n    implementation 'androidx.camera:camera-lifecycle:1.7.0-alpha03'\n    implementation 'androidx.camera:camera-video:1.7.0-alpha03'\n    implementation 'androidx.camera:camera-view:1.7.0-alpha03'\n\n    // R22 true saved-video enhancement.\n    def media3_version = '1.10.1'\n    implementation \"androidx.media3:media3-common:${media3_version}\"\n    implementation \"androidx.media3:media3-effect:${media3_version}\"\n    implementation \"androidx.media3:media3-transformer:${media3_version}\"\n    implementation 'androidx.camera.media3:media3-effect:1.0.0-alpha04'\n}\nGRADLE\n\ncat > r50-texture/app/src/main/res/values/styles.xml <<'XML'\n<?xml version=\"1.0\" encoding=\"utf-8\"?>\n<resources>\n    <style name=\"Theme.DUCamera\" parent=\"@android:style/Theme.Material.NoActionBar\">\n        <item name=\"android:fontFamily\">sans</item>\n        <item name=\"android:windowActionModeOverlay\">true</item>\n        <item name=\"android:windowBackground\">@android:color/black</item>\n        <item name=\"android:statusBarColor\">@android:color/black</item>\n        <item name=\"android:navigationBarColor\">@android:color/black</item>\n        <item name=\"android:colorAccent\">#FFB323</item>\n    </style>\n</resources>\nXML\n\ncat > r50-texture/app/src/main/AndroidManifest.xml <<'XML'\n<?xml version=\"1.0\" encoding=\"utf-8\"?>\n<manifest xmlns:android=\"http://schemas.android.com/apk/res/android\">\n\n    <uses-permission android:name=\"android.permission.CAMERA\" />\n    <uses-permission android:name=\"android.permission.RECORD_AUDIO\" />\n\n    <uses-feature\n        android:name=\"android.hardware.camera.any\"\n        android:required=\"true\" />\n\n    <application\n        android:allowBackup=\"false\"\n        android:label=\"DU Camera R50 Texture Balance\"\n        android:theme=\"@style/Theme.DUCamera\">\n\n        <activity\n            android:name=\".R50ReferenceTextureBalanceCameraActivity\"\n            android:exported=\"true\">\n            <intent-filter>\n                <action android:name=\"android.intent.action.MAIN\" />\n                <category android:name=\"android.intent.category.LAUNCHER\" />\n            </intent-filter>\n        </activity>\n\n    </application>\n</manifest>\nXML\n\ncat > r50-texture/app/src/main/java/com/sentongoharuna/ducamera/R50ReferenceTextureBalanceCameraActivity.java <<'JAVA'\npackage com.sentongoharuna.ducamera;\n\nimport android.Manifest;\nimport android.content.ContentValues;\nimport android.content.pm.PackageManager;\nimport android.content.Context;\nimport android.content.SharedPreferences;\nimport android.content.pm.ActivityInfo;\nimport android.net.Uri;\nimport android.os.Environment;\nimport android.graphics.Color;\nimport android.graphics.drawable.GradientDrawable;\nimport android.hardware.camera2.CaptureRequest;\nimport android.hardware.camera2.CameraCharacteristics;\nimport android.hardware.camera2.CameraManager;\nimport android.hardware.camera2.params.StreamConfigurationMap;\nimport android.os.Build;\nimport android.os.Bundle;\nimport android.os.Handler;\nimport android.os.Looper;\nimport android.os.SystemClock;\nimport android.media.MediaRecorder;\nimport android.media.MediaFormat;\nimport android.provider.MediaStore;\nimport android.util.Range;\nimport android.util.Size;\nimport android.view.Gravity;\nimport android.view.MotionEvent;\nimport android.view.ScaleGestureDetector;\nimport android.view.Surface;\nimport android.view.WindowManager;\nimport android.view.View;\nimport android.graphics.Typeface;\nimport android.widget.FrameLayout;\nimport android.widget.LinearLayout;\nimport android.widget.TextView;\n\nimport androidx.activity.ComponentActivity;\nimport androidx.annotation.OptIn;\nimport androidx.camera.camera2.interop.Camera2Interop;\nimport androidx.camera.camera2.interop.ExperimentalCamera2Interop;\nimport androidx.camera.core.Camera;\nimport androidx.camera.core.CameraSelector;\nimport androidx.camera.core.DynamicRange;\nimport androidx.camera.core.CameraEffect;\nimport androidx.camera.core.UseCaseGroup;\nimport androidx.camera.core.ExposureState;\nimport androidx.camera.core.FocusMeteringAction;\nimport androidx.camera.core.MeteringPoint;\nimport androidx.camera.core.Preview;\nimport androidx.camera.core.ZoomState;\nimport androidx.camera.lifecycle.ProcessCameraProvider;\nimport androidx.camera.video.ExperimentalMimeTypeApi;\nimport androidx.camera.video.FallbackStrategy;\nimport androidx.camera.video.MediaStoreOutputOptions;\nimport androidx.camera.video.Quality;\nimport androidx.camera.video.QualitySelector;\nimport androidx.camera.video.Recorder;\nimport androidx.camera.video.Recording;\nimport androidx.camera.video.VideoCapture;\nimport androidx.camera.video.VideoRecordEvent;\nimport androidx.camera.view.PreviewView;\nimport androidx.camera.media3.effect.Media3Effect;\nimport androidx.core.content.ContextCompat;\nimport androidx.media3.common.Effect;\nimport androidx.media3.common.MediaItem;\nimport androidx.media3.common.MimeTypes;\nimport androidx.media3.common.util.UnstableApi;\nimport androidx.media3.effect.Contrast;\nimport androidx.media3.effect.HslAdjustment;\nimport androidx.media3.effect.RgbAdjustment;\nimport androidx.media3.transformer.Composition;\nimport androidx.media3.transformer.DefaultEncoderFactory;\nimport androidx.media3.transformer.EditedMediaItem;\nimport androidx.media3.transformer.Effects;\nimport androidx.media3.transformer.ExportException;\nimport androidx.media3.transformer.ExportResult;\nimport androidx.media3.transformer.Transformer;\nimport androidx.media3.transformer.VideoEncoderSettings;\n\nimport com.google.common.util.concurrent.ListenableFuture;\n\nimport java.io.File;\nimport java.io.FileInputStream;\nimport java.io.InputStream;\nimport java.io.OutputStream;\nimport java.text.SimpleDateFormat;\nimport java.util.Arrays;\nimport java.util.Collections;\nimport java.util.Date;\nimport java.util.Locale;\nimport java.util.concurrent.TimeUnit;\n\n@UnstableApi\n@OptIn(markerClass = {\n    ExperimentalCamera2Interop.class,\n    ExperimentalMimeTypeApi.class\n})\npublic class R50ReferenceTextureBalanceCameraActivity extends ComponentActivity {\n\n    private static final int REQUEST_CAMERA = 4545;\n\n    private PreviewView previewView;\n    private TextView status;\n    private TextView recordButton;\n    private TextView lightButton;\n    private TextView highlightButton;\n    private TextView adaptiveButton;\n    private TextView motionButton;\n    private TextView enhanceButton;\n\n    private ProcessCameraProvider provider;\n    private Camera camera;\n    private VideoCapture<Recorder> videoCapture;\n    private Recording recording;\n    private ScaleGestureDetector scaleDetector;\n\n    private boolean useFront = false;\n    private boolean torchOn = false;\n    private boolean highlightProtect = false;\n    private boolean adaptiveEngine = true;\n    private boolean motionDetail = true;\n    private boolean autoEnhance = true;\n    private boolean directHevcAvailable = false;\n    private boolean directHevcActive = false;\n    private boolean directHevcRetryUsed = false;\n    private boolean directGradeCopy = false;\n    private Transformer activeTransformer = null;\n    private HardwareProfile hardwareProfile = new HardwareProfile();\n    private int activeAttempt = 0;\n    private boolean minimalIspRetryUsed = false;\n    private boolean motionPriorityRetryUsed = false;\n    private boolean highQualityEdgeRetryUsed = false;\n    private boolean highQualityToneRetryUsed = false;\n    private boolean highQualityColorActive = true;\n    private boolean highQualityColorRetryUsed = false;\n    private boolean noiseReductionOffActive = true;\n    private boolean noiseReductionOffRetryUsed = false;\n    private boolean richImageActive = true;\n    private boolean richImageRetryUsed = false;\n    private Media3Effect richImageEffect;\n\n    // UI-only precision recording timeline. Does not touch the R45 capture engine.\n    private TextView precisionTimeline;\n    private static final String PREFS_NAME = \"r48_reference_match\";\n    private static final String PREF_ASPECT_9_16 = \"aspect_9_16\";\n    private TextView aspectButton;\n    private boolean aspectNineSixteen = true;\n    private Handler precisionHandler = new Handler(Looper.getMainLooper());\n    private long recordingStartNanos = 0L;\n    private boolean precisionClockRunning = false;\n    private final Runnable precisionClockTick = new Runnable() {\n        @Override\n        public void run() {\n            if (!precisionClockRunning || precisionTimeline == null) return;\n\n            long elapsed = Math.max(0L, SystemClock.elapsedRealtimeNanos() - recordingStartNanos);\n\n            long hours = elapsed / 3_600_000_000_000L;\n            long minutes = (elapsed / 60_000_000_000L) % 60L;\n            long seconds = (elapsed / 1_000_000_000L) % 60L;\n            long millis = (elapsed / 1_000_000L) % 1000L;\n            long micros = (elapsed / 1_000L) % 1000L;\n            long nanos = elapsed % 1000L;\n\n            // Long, clean white timecode with many zeros. No background and no progress line.\n            precisionTimeline.setText(String.format(\n                Locale.US,\n                \"%04d:%02d:%02d:%03d:%03d:%03d\",\n                hours, minutes, seconds, millis, micros, nanos\n            ));\n            precisionTimeline.setTextColor(Color.WHITE);\n\n            // Source clock is nanosecond resolution; visible refresh follows display cadence.\n            precisionHandler.postDelayed(this, 16L);\n        }\n    };\n\n    @Override\n    protected void onCreate(Bundle savedInstanceState) {\n        super.onCreate(savedInstanceState);\n\n        getWindow().addFlags(WindowManager.LayoutParams.FLAG_KEEP_SCREEN_ON);\n        getWindow().setStatusBarColor(Color.BLACK);\n        getWindow().setNavigationBarColor(Color.BLACK);\n\n        SharedPreferences prefs =\n            getSharedPreferences(PREFS_NAME, MODE_PRIVATE);\n        aspectNineSixteen =\n            prefs.getBoolean(PREF_ASPECT_9_16, true);\n\n        applyRequestedAspectOrientation();\n\n        buildUi();\n        installCameraGestures();\n\n        if (hasCameraPermission()) {\n            startCamera();\n        } else {\n            status.setText(\"ALLOW CAMERA\");\n            requestPermissions(\n                new String[] {\n                    Manifest.permission.CAMERA,\n                    Manifest.permission.RECORD_AUDIO\n                },\n                REQUEST_CAMERA\n            );\n        }\n    }\n\n    private void buildUi() {\n        FrameLayout root = new FrameLayout(this);\n        root.setBackgroundColor(Color.BLACK);\n\n        previewView = new PreviewView(this);\n        previewView.setImplementationMode(PreviewView.ImplementationMode.COMPATIBLE);\n        previewView.setScaleType(PreviewView.ScaleType.FILL_CENTER);\n        previewView.setBackgroundColor(Color.BLACK);\n        root.addView(\n            previewView,\n            new FrameLayout.LayoutParams(\n                FrameLayout.LayoutParams.MATCH_PARENT,\n                FrameLayout.LayoutParams.MATCH_PARENT\n            )\n        );\n\n        TextView master = button(\"R50 TEXTURE\");\n        FrameLayout.LayoutParams masterLp =\n            new FrameLayout.LayoutParams(dp(108), dp(42), Gravity.TOP | Gravity.START);\n        masterLp.leftMargin = dp(12);\n        masterLp.topMargin = dp(16);\n        root.addView(master, masterLp);\n\n        // Clean precision recorder timecode: digits only, no panel, no progress line.\n        precisionTimeline = new TextView(this);\n        precisionTimeline.setText(\"0000:00:00:000:000:000\");\n        precisionTimeline.setTextColor(Color.WHITE);\n        precisionTimeline.setTextSize(16f);\n        precisionTimeline.setTypeface(Typeface.MONOSPACE, Typeface.BOLD);\n        precisionTimeline.setGravity(Gravity.CENTER);\n        precisionTimeline.setSingleLine(true);\n        precisionTimeline.setIncludeFontPadding(false);\n        precisionTimeline.setShadowLayer(2.2f, 0f, 1f, Color.BLACK);\n        precisionTimeline.setBackgroundColor(Color.TRANSPARENT);\n        precisionTimeline.setVisibility(View.GONE);\n\n        FrameLayout.LayoutParams timerLp =\n            new FrameLayout.LayoutParams(\n                FrameLayout.LayoutParams.MATCH_PARENT,\n                dp(42),\n                Gravity.TOP\n            );\n        timerLp.leftMargin = dp(8);\n        timerLp.rightMargin = dp(8);\n        timerLp.topMargin = dp(62);\n        root.addView(precisionTimeline, timerLp);\n\n        aspectButton = button(\n            aspectNineSixteen ? \"9:16\" : \"16:9\"\n        );\n        FrameLayout.LayoutParams aspectLp =\n            new FrameLayout.LayoutParams(dp(82), dp(42), Gravity.TOP | Gravity.END);\n        aspectLp.topMargin = dp(16);\n        aspectLp.rightMargin = dp(12);\n        root.addView(aspectButton, aspectLp);\n        aspectButton.setOnClickListener(v -> {\n            if (recording != null) return;\n\n            aspectNineSixteen = !aspectNineSixteen;\n\n            getSharedPreferences(PREFS_NAME, MODE_PRIVATE)\n                .edit()\n                .putBoolean(PREF_ASPECT_9_16, aspectNineSixteen)\n                .apply();\n\n            aspectButton.setText(\n                aspectNineSixteen ? \"9:16\" : \"16:9\"\n            );\n\n            applyRequestedAspectOrientation();\n        });\n\n        status = button(\"R50 TEXTURE \u2022 OPENING\");\n        FrameLayout.LayoutParams statusLp =\n            new FrameLayout.LayoutParams(dp(212), dp(40), Gravity.TOP | Gravity.CENTER_HORIZONTAL);\n        statusLp.topMargin = dp(108);\n        root.addView(status, statusLp);\n        status.setOnClickListener(v -> startCamera());\n\n        LinearLayout qualityRail = new LinearLayout(this);\n        qualityRail.setOrientation(LinearLayout.VERTICAL);\n        qualityRail.setGravity(Gravity.CENTER);\n\n        adaptiveButton = button(\"SOCIAL+\");\n        motionButton = button(\"MOTION+\");\n        enhanceButton = button(\"DIRECT FINAL\");\n        TextView bitrate = button(\"15 Mbps\");\n        TextView fps = button(\"60 FPS\");\n        TextView stab = button(\"STAB AUTO\");\n        highlightButton = button(\"AE AUTO\");\n\n        qualityRail.addView(adaptiveButton, railLp());\n        qualityRail.addView(motionButton, railLp());\n        qualityRail.addView(enhanceButton, railLp());\n        qualityRail.addView(bitrate, railLp());\n        qualityRail.addView(fps, railLp());\n        qualityRail.addView(stab, railLp());\n        qualityRail.addView(highlightButton, railLp());\n\n        FrameLayout.LayoutParams railRootLp =\n            new FrameLayout.LayoutParams(dp(104), FrameLayout.LayoutParams.WRAP_CONTENT,\n                Gravity.END | Gravity.CENTER_VERTICAL);\n        railRootLp.rightMargin = dp(10);\n        root.addView(qualityRail, railRootLp);\n\n        adaptiveButton.setOnClickListener(v -> {\n            if (recording != null) return;\n            adaptiveEngine = !adaptiveEngine;\n            adaptiveButton.setText(adaptiveEngine ? \"SOCIAL+\" : \"NATURAL\");\n            startCamera();\n        });\n\n        motionButton.setOnClickListener(v -> {\n            if (recording != null) return;\n            motionDetail = !motionDetail;\n            motionButton.setText(motionDetail ? \"MOTION+\" : \"MOTION OFF\");\n            startCamera();\n        });\n\n        enhanceButton.setOnClickListener(v -> {\n            if (recording != null || activeTransformer != null) return;\n            directGradeCopy = !directGradeCopy;\n            enhanceButton.setText(\n                directGradeCopy ? \"+GRADE COPY\" : \"DIRECT FINAL\"\n            );\n        });\n\n        highlightButton.setOnClickListener(v -> {\n            highlightProtect = false;\n            highlightButton.setText(\"AE AUTO\");\n            applyHighlightProtection();\n            status.setText(\"AE AUTO \u2022 TONE-HQ\");\n        });\n\n        LinearLayout bottom = new LinearLayout(this);\n        bottom.setOrientation(LinearLayout.HORIZONTAL);\n        bottom.setGravity(Gravity.CENTER);\n        bottom.setPadding(dp(8), dp(8), dp(8), dp(18));\n        bottom.setBackgroundColor(0x66000000);\n\n        TextView lensButton = button(\"LENS\");\n        recordButton = button(\"RECORD\");\n        lightButton = button(\"LIGHT\");\n\n        bottom.addView(lensButton, weightedButtonLp());\n        bottom.addView(recordButton, weightedButtonLp());\n        bottom.addView(lightButton, weightedButtonLp());\n\n        root.addView(\n            bottom,\n            new FrameLayout.LayoutParams(\n                FrameLayout.LayoutParams.MATCH_PARENT,\n                FrameLayout.LayoutParams.WRAP_CONTENT,\n                Gravity.BOTTOM\n            )\n        );\n\n        lensButton.setOnClickListener(v -> {\n            if (recording != null) {\n                recording.stop();\n            }\n            // Aspect mode is shared by BOTH front and back cameras.\n            useFront = !useFront;\n            startCamera();\n        });\n\n        recordButton.setOnClickListener(v -> toggleRecording());\n        lightButton.setOnClickListener(v -> toggleTorch());\n\n        setContentView(root);\n    }\n\n    private LinearLayout.LayoutParams railLp() {\n        LinearLayout.LayoutParams lp =\n            new LinearLayout.LayoutParams(dp(96), dp(40));\n        lp.bottomMargin = dp(7);\n        return lp;\n    }\n\n    private LinearLayout.LayoutParams weightedButtonLp() {\n        LinearLayout.LayoutParams lp =\n            new LinearLayout.LayoutParams(0, dp(62), 1f);\n        lp.setMarginStart(dp(5));\n        lp.setMarginEnd(dp(5));\n        return lp;\n    }\n\n    private void installCameraGestures() {\n        scaleDetector =\n            new ScaleGestureDetector(\n                this,\n                new ScaleGestureDetector.SimpleOnScaleGestureListener() {\n                    @Override\n                    public boolean onScale(ScaleGestureDetector detector) {\n                        if (camera == null) return false;\n                        ZoomState zoom =\n                            camera.getCameraInfo().getZoomState().getValue();\n                        if (zoom == null) return false;\n\n                        float next =\n                            zoom.getZoomRatio() * detector.getScaleFactor();\n                        next = Math.max(zoom.getMinZoomRatio(),\n                            Math.min(zoom.getMaxZoomRatio(), next));\n                        camera.getCameraControl().setZoomRatio(next);\n                        return true;\n                    }\n                }\n            );\n\n        previewView.setOnTouchListener((v, event) -> {\n            scaleDetector.onTouchEvent(event);\n\n            if (event.getAction() == MotionEvent.ACTION_UP &&\n                !scaleDetector.isInProgress() &&\n                camera != null) {\n\n                MeteringPoint point =\n                    previewView.getMeteringPointFactory()\n                        .createPoint(event.getX(), event.getY());\n\n                FocusMeteringAction action =\n                    new FocusMeteringAction.Builder(\n                        point,\n                        FocusMeteringAction.FLAG_AF |\n                        FocusMeteringAction.FLAG_AE\n                    )\n                    .setAutoCancelDuration(4, TimeUnit.SECONDS)\n                    .build();\n\n                camera.getCameraControl().startFocusAndMetering(action);\n                status.setText(\"FOCUS \u2022 EXPOSURE\");\n            }\n            return true;\n        });\n    }\n\n    private void startCamera() {\n        if (!hasCameraPermission()) {\n            status.setText(\"ALLOW CAMERA\");\n            requestPermissions(\n                new String[] { Manifest.permission.CAMERA },\n                REQUEST_CAMERA\n            );\n            return;\n        }\n\n        status.setText(\"R50 TEXTURE ENGINE OPENING\");\n\n        ListenableFuture<ProcessCameraProvider> future =\n            ProcessCameraProvider.getInstance(this);\n\n        future.addListener(() -> {\n            try {\n                provider = future.get();\n                hardwareProfile = detectHardwareProfile();\n                minimalIspRetryUsed = false;\n                motionPriorityRetryUsed = false;\n                highQualityEdgeRetryUsed = false;\n                highQualityToneRetryUsed = false;\n                highQualityColorActive = true;\n                highQualityColorRetryUsed = false;\n                noiseReductionOffActive = true;\n                noiseReductionOffRetryUsed = false;\n                richImageActive = true;\n                richImageRetryUsed = false;\n                directHevcRetryUsed = false;\n                directHevcAvailable = detectDirectHevcSupport();\n                directHevcActive = directHevcAvailable;\n                activeAttempt = chooseStartingAttempt(hardwareProfile);\n                bindMasterAttempt();\n            } catch (Throwable error) {\n                status.setText(\"PROVIDER ERROR \u2022 TAP\");\n            }\n        }, ContextCompat.getMainExecutor(this));\n    }\n\n    private boolean detectDirectHevcSupport() {\n        try {\n            return Recorder.getSupportedVideoMimeTypes()\n                .contains(MediaFormat.MIMETYPE_VIDEO_HEVC);\n        } catch (Throwable error) {\n            return false;\n        }\n    }\n\n    private void closeRichImageEffect() {\n        if (richImageEffect != null) {\n            try {\n                richImageEffect.close();\n            } catch (Throwable ignored) {\n            }\n            richImageEffect = null;\n        }\n    }\n\n    private void bindMasterAttempt() {\n        if (provider == null) return;\n\n        boolean target60;\n        boolean stabilization;\n        boolean ispEnhance;\n        int recorderBitrate;\n\n        /*\n         * R41 TIKTOK SWEET SPOT:\n         * Delivery-first profile based on the proven R40 image engine.\n         * Exact FHD60 direct HEVC is retained.\n         * Primary bitrate is 15 Mbps, close to the measured TikTok\n         * reference profile (~13 Mbps) while leaving modest headroom.\n         * No second encode is used when DIRECT FINAL is selected.\n         */\n        switch (activeAttempt) {\n            case 0:\n                // Primary: exact 1080p60, stabilized, direct HEVC, 15 Mbps.\n                target60 = true;\n                stabilization = true;\n                ispEnhance = adaptiveEngine;\n                recorderBitrate = 15_000_000;\n                break;\n\n            case 1:\n                // Same TikTok profile without stabilization if the device rejects the combo.\n                target60 = true;\n                stabilization = false;\n                ispEnhance = adaptiveEngine;\n                recorderBitrate = 15_000_000;\n                break;\n\n            case 2:\n                // Motion fallback only after both 60 fps attempts.\n                target60 = false;\n                stabilization = true;\n                ispEnhance = adaptiveEngine;\n                recorderBitrate = 22_000_000;\n                break;\n\n            case 3:\n                target60 = false;\n                stabilization = false;\n                ispEnhance = adaptiveEngine;\n                recorderBitrate = 22_000_000;\n                break;\n\n            default:\n                // Universal safety profile: exact FHD30, no extra ISP requests.\n                target60 = false;\n                stabilization = false;\n                ispEnhance = false;\n                recorderBitrate = 20_000_000;\n                break;\n        }\n\n        try {\n            Range<Integer> fpsRange =\n                target60 ? new Range<>(60, 60) : new Range<>(30, 30);\n\n            int targetRotation = currentTargetRotation();\n\n            Preview.Builder previewBuilder =\n                new Preview.Builder()\n                    .setTargetRotation(targetRotation)\n                    .setTargetFrameRate(fpsRange);\n\n            if (stabilization) {\n                previewBuilder.setPreviewStabilizationEnabled(true);\n            }\n\n            if (ispEnhance) {\n                applyAdaptiveIsp(previewBuilder, target60);\n            }\n\n            Preview preview = previewBuilder.build();\n            preview.setSurfaceProvider(previewView.getSurfaceProvider());\n\n            // Exact FHD: no hidden UHD request and no lower-quality fallback.\n            QualitySelector selector =\n                QualitySelector.from(Quality.FHD);\n\n            Recorder.Builder recorderBuilder =\n                new Recorder.Builder()\n                    .setQualitySelector(selector)\n                    .setTargetVideoEncodingBitRate(\n                        recorderBitrate\n                    );\n\n            if (directHevcActive) {\n                recorderBuilder\n                    .setVideoCapabilitiesSource(\n                        Recorder\n                            .VIDEO_CAPABILITIES_SOURCE_CODEC_CAPABILITIES\n                    )\n                    .setVideoMimeType(\n                        MediaFormat.MIMETYPE_VIDEO_HEVC\n                    );\n            }\n\n            Recorder recorder = recorderBuilder.build();\n\n            VideoCapture.Builder<Recorder> videoBuilder =\n                new VideoCapture.Builder<>(recorder)\n                    .setTargetRotation(targetRotation)\n                    .setDynamicRange(DynamicRange.SDR)\n                    .setTargetFrameRate(fpsRange);\n\n            if (stabilization) {\n                videoBuilder.setVideoStabilizationEnabled(true);\n            }\n\n            if (ispEnhance) {\n                applyAdaptiveIsp(videoBuilder, target60);\n            }\n\n            VideoCapture<Recorder> candidateVideo =\n                videoBuilder.build();\n\n            CameraSelector cameraSelector =\n                useFront\n                    ? CameraSelector.DEFAULT_FRONT_CAMERA\n                    : CameraSelector.DEFAULT_BACK_CAMERA;\n\n            provider.unbindAll();\n\n            closeRichImageEffect();\n\n            Camera candidateCamera;\n\n            if (richImageActive) {\n                richImageEffect =\n                    new Media3Effect(\n                        this,\n                        CameraEffect.PREVIEW | CameraEffect.VIDEO_CAPTURE,\n                        ContextCompat.getMainExecutor(this),\n                        error -> runOnUiThread(() -> {\n                            if (richImageActive &&\n                                !richImageRetryUsed) {\n\n                                richImageRetryUsed = true;\n                                richImageActive = false;\n                                closeRichImageEffect();\n                                status.setText(\n                                    \"TEXTURE FALLBACK \u2022 R49 SAFE\"\n                                );\n                                bindMasterAttempt();\n                            }\n                        })\n                    );\n\n                /*\n                 * R50 REFERENCE TEXTURE BALANCE PRO:\n                 * Preserve the R45 exposure/ISP path and direct HEVC.\n                 * Add only mild live pre-encode richness:\n                 *   Contrast +0.035\n                 *   Saturation +2.5 + Lightness +1.0\n                 *   RGB 1.008 / 1.003 / 0.998\n                 */\n                richImageEffect.setEffects(\n                    Arrays.asList(\n                        /*\n                         * R50 texture balance:\n                         * - keep R49 midtone/shadow opening\n                         * - keep R49 saturation and warm colour balance\n                         * - restore a small amount of micro-contrast for\n                         *   better texture survival after TikTok\n                         * - no extra sharpening and no saturation increase\n                         */\n                        new Contrast(0.035f),\n                        new HslAdjustment.Builder()\n                            .adjustSaturation(2.5f)\n                            .adjustLightness(1.0f)\n                            .build(),\n                        new RgbAdjustment.Builder()\n                            .setRedScale(1.008f)\n                            .setGreenScale(1.003f)\n                            .setBlueScale(0.998f)\n                            .build()\n                    )\n                );\n\n                UseCaseGroup useCaseGroup =\n                    new UseCaseGroup.Builder()\n                        .addUseCase(preview)\n                        .addUseCase(candidateVideo)\n                        .addEffect(richImageEffect)\n                        .build();\n\n                candidateCamera =\n                    provider.bindToLifecycle(\n                        this,\n                        cameraSelector,\n                        useCaseGroup\n                    );\n\n            } else {\n                candidateCamera =\n                    provider.bindToLifecycle(\n                        this,\n                        cameraSelector,\n                        preview,\n                        candidateVideo\n                    );\n            }\n\n            camera = candidateCamera;\n            videoCapture = candidateVideo;\n\n            torchOn = false;\n            lightButton.setText(\"LIGHT\");\n            applyHighlightProtection();\n\n            String fps =\n                target60\n                    ? (hardwareProfile.hasFixed60\n                        ? \"60 LOCK\"\n                        : \"60 TARGET\")\n                    : \"30 LOCK\";\n\n            String engine =\n                ispEnhance\n                    ? (hardwareProfile.hasHighQualityToneMap\n                        ? \"R50 TEXTURE-HQ\"\n                        : (hardwareProfile.hasHighQualityEdge\n                            ? \"REFERENCE EDGE-HQ\"\n                            : (target60 &&\n                               hardwareProfile.hasMinimalNoiseReduction\n                                ? \"REFERENCE NR-MIN\"\n                                : \"REFERENCE FAST\")))\n                    : \"NATURAL\";\n\n            String motion = motionDetail ? \"MOTION+\" : \"MOTION\";\n            String stab = stabilization ? \"STAB\" : \"NO-STAB\";\n            String codec =\n                directHevcActive\n                    ? \"HEVC DIRECT\"\n                    : \"H264 SAFE\";\n\n            enhanceButton.setText(\n                directHevcActive\n                    ? (directGradeCopy\n                        ? \"+GRADE COPY\"\n                        : \"DIRECT FINAL\")\n                    : \"SAFE ENHANCE\"\n            );\n\n            status.setText(\n                \"REFERENCE 1080 \u2022 \" +\n                (aspectNineSixteen ? \"9:16\" : \"16:9\") +\n                \" \u2022 \" + fps + \" \u2022 15M \u2022 \" +\n                engine + \" \u2022 \" + codec + \" \u2022 \" +\n                motion + \" \u2022 \" + stab\n            );\n\n        } catch (Throwable error) {\n            if (richImageActive &&\n                !richImageRetryUsed) {\n\n                richImageRetryUsed = true;\n                richImageActive = false;\n                closeRichImageEffect();\n                status.setText(\n                    \"TEXTURE FALLBACK \u2022 R49 SAFE\"\n                );\n                bindMasterAttempt();\n                return;\n            }\n\n            if (ispEnhance &&\n                target60 &&\n                noiseReductionOffActive &&\n                hardwareProfile.hasNoiseReductionOff &&\n                !noiseReductionOffRetryUsed) {\n\n                noiseReductionOffRetryUsed = true;\n                noiseReductionOffActive = false;\n                status.setText(\n                    \"NR-OFF FALLBACK \u2022 NR-MIN\"\n                );\n                bindMasterAttempt();\n                return;\n            }\n\n            if (ispEnhance &&\n                highQualityColorActive &&\n                !highQualityColorRetryUsed) {\n\n                highQualityColorRetryUsed = true;\n                highQualityColorActive = false;\n                status.setText(\n                    \"COLOR-HQ FALLBACK \u2022 FAST\"\n                );\n                bindMasterAttempt();\n                return;\n            }\n\n            // Preserve R36 image-engine fallbacks at the SAME FHD quality.\n            if (ispEnhance &&\n                hardwareProfile.hasHighQualityToneMap &&\n                !highQualityToneRetryUsed) {\n\n                highQualityToneRetryUsed = true;\n                hardwareProfile.hasHighQualityToneMap = false;\n                status.setText(\n                    \"TONE-HQ FALLBACK \u2022 FAST\"\n                );\n                bindMasterAttempt();\n                return;\n            }\n\n            if (ispEnhance &&\n                hardwareProfile.hasHighQualityEdge &&\n                !highQualityEdgeRetryUsed) {\n\n                highQualityEdgeRetryUsed = true;\n                hardwareProfile.hasHighQualityEdge = false;\n                status.setText(\n                    \"EDGE-HQ FALLBACK \u2022 FAST\"\n                );\n                bindMasterAttempt();\n                return;\n            }\n\n            if (ispEnhance &&\n                target60 &&\n                hardwareProfile.hasMinimalNoiseReduction &&\n                !minimalIspRetryUsed) {\n\n                minimalIspRetryUsed = true;\n                hardwareProfile.hasMinimalNoiseReduction = false;\n                status.setText(\n                    \"NR-MIN FALLBACK \u2022 FAST\"\n                );\n                bindMasterAttempt();\n                return;\n            }\n\n            // First remove stabilization, keeping exact 1080p60 HEVC.\n            if (activeAttempt == 0) {\n                activeAttempt = 1;\n                status.setText(\n                    \"1080P60 STAB -> NO-STAB\"\n                );\n                bindMasterAttempt();\n                return;\n            }\n\n            // If HEVC itself is the problem, protect 60 fps before dropping to 30.\n            if (activeAttempt == 1 &&\n                directHevcActive &&\n                !directHevcRetryUsed) {\n\n                directHevcRetryUsed = true;\n                directHevcActive = false;\n                activeAttempt = 0;\n                status.setText(\n                    \"HEVC -> H264 \u2022 KEEP 1080P60\"\n                );\n                bindMasterAttempt();\n                return;\n            }\n\n            if (activeAttempt == 1) {\n                activeAttempt = 2;\n                status.setText(\n                    \"1080P60 -> 1080P30 STAB\"\n                );\n                bindMasterAttempt();\n                return;\n            }\n\n            if (activeAttempt == 2) {\n                activeAttempt = 3;\n                status.setText(\n                    \"1080P30 STAB -> NO-STAB\"\n                );\n                bindMasterAttempt();\n                return;\n            }\n\n            if (activeAttempt == 3) {\n                activeAttempt = 4;\n                status.setText(\n                    \"1080P SAFE PROFILE\"\n                );\n                bindMasterAttempt();\n                return;\n            }\n\n            if (useFront) {\n                useFront = false;\n                hardwareProfile = detectHardwareProfile();\n                activeAttempt = 0;\n                status.setText(\"BACK CAMERA RETRY\");\n                bindMasterAttempt();\n            } else {\n                status.setText(\"BIND ERROR \u2022 TAP\");\n            }\n        }\n    }\n\n    private static class HardwareProfile {\n        boolean has4k = false;\n        boolean has60 = false;\n        boolean hasFixed60 = false;\n        boolean hasMinimalNoiseReduction = false;\n        boolean hasNoiseReductionOff = false;\n        boolean hasExposureTimePriority = false;\n        boolean hasHighQualityEdge = false;\n        boolean hasHighQualityToneMap = false;\n        String label = \"HW SAFE\";\n    }\n\n    private int chooseStartingAttempt(HardwareProfile profile) {\n        return 0;\n    }\n\n    private HardwareProfile detectHardwareProfile() {\n        HardwareProfile result = new HardwareProfile();\n\n        try {\n            CameraManager manager =\n                (CameraManager) getSystemService(Context.CAMERA_SERVICE);\n\n            Integer wantedFacing =\n                useFront\n                    ? CameraCharacteristics.LENS_FACING_FRONT\n                    : CameraCharacteristics.LENS_FACING_BACK;\n\n            for (String cameraId : manager.getCameraIdList()) {\n                CameraCharacteristics chars =\n                    manager.getCameraCharacteristics(cameraId);\n\n                Integer facing =\n                    chars.get(CameraCharacteristics.LENS_FACING);\n\n                if (facing == null || !facing.equals(wantedFacing)) {\n                    continue;\n                }\n\n                StreamConfigurationMap map =\n                    chars.get(\n                        CameraCharacteristics.SCALER_STREAM_CONFIGURATION_MAP\n                    );\n\n                if (map != null) {\n                    Size[] sizes = map.getOutputSizes(MediaRecorder.class);\n                    if (sizes != null) {\n                        for (Size size : sizes) {\n                            int longSide =\n                                Math.max(size.getWidth(), size.getHeight());\n                            int shortSide =\n                                Math.min(size.getWidth(), size.getHeight());\n\n                            if (longSide >= 3840 && shortSide >= 2160) {\n                                result.has4k = true;\n                                break;\n                            }\n                        }\n                    }\n                }\n\n                Range<Integer>[] ranges =\n                    chars.get(\n                        CameraCharacteristics.CONTROL_AE_AVAILABLE_TARGET_FPS_RANGES\n                    );\n\n                if (ranges != null) {\n                    for (Range<Integer> range : ranges) {\n                        if (range.getUpper() >= 60) {\n                            result.has60 = true;\n                        }\n\n                        if (range.getLower() == 60 &&\n                            range.getUpper() == 60) {\n                            result.hasFixed60 = true;\n                        }\n                    }\n                }\n\n                int[] noiseModes =\n                    chars.get(\n                        CameraCharacteristics\n                            .NOISE_REDUCTION_AVAILABLE_NOISE_REDUCTION_MODES\n                    );\n\n                if (noiseModes != null) {\n                    for (int mode : noiseModes) {\n                        if (mode ==\n                            CaptureRequest.NOISE_REDUCTION_MODE_OFF) {\n                            result.hasNoiseReductionOff = true;\n                        }\n\n                        if (mode ==\n                            CaptureRequest.NOISE_REDUCTION_MODE_MINIMAL) {\n                            result.hasMinimalNoiseReduction = true;\n                        }\n                    }\n                }\n\n                if (Build.VERSION.SDK_INT >= 36) {\n                    int[] priorityModes =\n                        chars.get(\n                            CameraCharacteristics\n                                .CONTROL_AE_AVAILABLE_PRIORITY_MODES\n                        );\n\n                    if (priorityModes != null) {\n                        for (int mode : priorityModes) {\n                            if (mode ==\n                                CaptureRequest\n                                    .CONTROL_AE_PRIORITY_MODE_SENSOR_EXPOSURE_TIME_PRIORITY) {\n                                result.hasExposureTimePriority = true;\n                                break;\n                            }\n                        }\n                    }\n                }\n\n                int[] edgeModes =\n                    chars.get(\n                        CameraCharacteristics\n                            .EDGE_AVAILABLE_EDGE_MODES\n                    );\n\n                if (edgeModes != null) {\n                    for (int mode : edgeModes) {\n                        if (mode ==\n                            CaptureRequest.EDGE_MODE_HIGH_QUALITY) {\n                            result.hasHighQualityEdge = true;\n                            break;\n                        }\n                    }\n                }\n\n                int[] toneMapModes =\n                    chars.get(\n                        CameraCharacteristics\n                            .TONEMAP_AVAILABLE_TONE_MAP_MODES\n                    );\n\n                if (toneMapModes != null) {\n                    for (int mode : toneMapModes) {\n                        if (mode ==\n                            CaptureRequest.TONEMAP_MODE_HIGH_QUALITY) {\n                            result.hasHighQualityToneMap = true;\n                        }\n\n                    }\n                }\n\n                break;\n            }\n        } catch (Throwable ignored) {\n            result.has4k = false;\n            result.has60 = false;\n        }\n\n        if (result.has4k && result.has60) {\n            result.label = \"HW 4K/60\";\n        } else if (result.has4k) {\n            result.label = \"HW 4K\";\n        } else if (result.has60) {\n            result.label = \"HW 60\";\n        }\n\n        if (result.hasNoiseReductionOff) {\n            result.label += \" \u2022 NR-OFF\";\n        } else if (result.hasMinimalNoiseReduction) {\n            result.label += \" \u2022 NR-MIN\";\n        }\n\n        if (result.hasExposureTimePriority) {\n            result.label += \" \u2022 AE-SHUTTER\";\n        }\n\n        if (result.hasFixed60) {\n            result.label += \" \u2022 60FIX\";\n        }\n\n        if (result.hasHighQualityEdge) {\n            result.label += \" \u2022 EDGE-HQ\";\n        }\n\n        if (result.hasHighQualityToneMap) {\n            result.label += \" \u2022 TONE-HQ\";\n        }\n\n        return result;\n    }\n\n    @SuppressWarnings({\"rawtypes\", \"unchecked\"})\n    private void applyAdaptiveIsp(\n        androidx.camera.core.ExtendableBuilder previewOrVideoBuilder,\n        boolean highFrameRate\n    ) {\n        /*\n         * R45 R50 TEXTURE CONTRAST PRO:\n         * Preserve R44 exposure, color, tone mapping and NR-OFF texture.\n         * R45's only new visual change is a live Contrast(+0.04) + Saturation(+4.0) + mild warm RGB\n         * CameraX Media3 effect before the single HEVC encode.\n         * The complete R44 Camera2 ISP path remains unchanged.\n         */\n        Camera2Interop.Extender interop =\n            new Camera2Interop.Extender(previewOrVideoBuilder);\n\n        int edgeMode =\n            hardwareProfile.hasHighQualityEdge\n                ? CaptureRequest.EDGE_MODE_HIGH_QUALITY\n                : CaptureRequest.EDGE_MODE_FAST;\n\n        interop.setCaptureRequestOption(\n            CaptureRequest.EDGE_MODE,\n            edgeMode\n        );\n\n        interop.setCaptureRequestOption(\n            CaptureRequest.TONEMAP_MODE,\n            hardwareProfile.hasHighQualityToneMap\n                ? CaptureRequest.TONEMAP_MODE_HIGH_QUALITY\n                : CaptureRequest.TONEMAP_MODE_FAST\n        );\n\n        interop.setCaptureRequestOption(\n            CaptureRequest.COLOR_CORRECTION_MODE,\n            highQualityColorActive\n                ? CaptureRequest.COLOR_CORRECTION_MODE_HIGH_QUALITY\n                : CaptureRequest.COLOR_CORRECTION_MODE_FAST\n        );\n\n        int noiseMode;\n\n        if (highFrameRate &&\n            noiseReductionOffActive &&\n            hardwareProfile.hasNoiseReductionOff) {\n\n            noiseMode =\n                CaptureRequest.NOISE_REDUCTION_MODE_OFF;\n\n        } else if (highFrameRate &&\n                   hardwareProfile.hasMinimalNoiseReduction) {\n\n            noiseMode =\n                CaptureRequest.NOISE_REDUCTION_MODE_MINIMAL;\n\n        } else {\n\n            noiseMode =\n                CaptureRequest.NOISE_REDUCTION_MODE_FAST;\n        }\n\n        interop.setCaptureRequestOption(\n            CaptureRequest.NOISE_REDUCTION_MODE,\n            noiseMode\n        );\n\n        interop.setCaptureRequestOption(\n            CaptureRequest.COLOR_CORRECTION_ABERRATION_MODE,\n            CaptureRequest.COLOR_CORRECTION_ABERRATION_MODE_HIGH_QUALITY\n        );\n\n        interop.setCaptureRequestOption(\n            CaptureRequest.CONTROL_AE_ANTIBANDING_MODE,\n            CaptureRequest.CONTROL_AE_ANTIBANDING_MODE_AUTO\n        );\n    }\n\n    private void applyHighlightProtection() {\n        if (camera == null) return;\n\n        ExposureState exposure =\n            camera.getCameraInfo().getExposureState();\n\n        Range<Integer> range =\n            exposure.getExposureCompensationRange();\n\n        int target = 0;\n\n        if (highlightProtect) {\n            double step =\n                exposure.getExposureCompensationStep().doubleValue();\n\n            if (step > 0.0) {\n                double wantedEv = 0.00;\n                target = (int) Math.round(wantedEv / step);\n            }\n        }\n\n        target = Math.max(range.getLower(),\n            Math.min(range.getUpper(), target));\n\n        camera.getCameraControl()\n            .setExposureCompensationIndex(target);\n    }\n\n    private void toggleTorch() {\n        if (camera == null) {\n            status.setText(\"CAMERA NOT READY\");\n            return;\n        }\n\n        if (!camera.getCameraInfo().hasFlashUnit()) {\n            status.setText(\"NO FLASH\");\n            return;\n        }\n\n        torchOn = !torchOn;\n        camera.getCameraControl().enableTorch(torchOn);\n        lightButton.setText(torchOn ? \"LIGHT ON\" : \"LIGHT\");\n    }\n\n    private void applyRequestedAspectOrientation() {\n        int wanted =\n            aspectNineSixteen\n                ? ActivityInfo.SCREEN_ORIENTATION_PORTRAIT\n                : ActivityInfo.SCREEN_ORIENTATION_LANDSCAPE;\n\n        if (getRequestedOrientation() != wanted) {\n            setRequestedOrientation(wanted);\n        }\n    }\n\n    private int currentTargetRotation() {\n        try {\n            if (previewView != null &&\n                previewView.getDisplay() != null) {\n                return previewView.getDisplay().getRotation();\n            }\n        } catch (Throwable ignored) {\n        }\n\n        return aspectNineSixteen\n            ? Surface.ROTATION_0\n            : Surface.ROTATION_90;\n    }\n\n    private void startPrecisionTimeline() {\n        recordingStartNanos = SystemClock.elapsedRealtimeNanos();\n        precisionClockRunning = true;\n        if (precisionTimeline != null) {\n            precisionTimeline.setVisibility(View.VISIBLE);\n            precisionTimeline.setText(\"0000:00:00:000:000:000\");\n            precisionTimeline.setTextColor(Color.WHITE);\n        }\n        precisionHandler.removeCallbacks(precisionClockTick);\n        precisionHandler.post(precisionClockTick);\n    }\n\n    private void stopPrecisionTimeline() {\n        precisionClockRunning = false;\n        precisionHandler.removeCallbacks(precisionClockTick);\n        if (precisionTimeline != null) {\n            precisionTimeline.setVisibility(View.GONE);\n            precisionTimeline.setText(\"0000:00:00:000:000:000\");\n            precisionTimeline.setTextColor(Color.WHITE);\n        }\n    }\n\n    private void toggleRecording() {\n        if (recording != null) {\n            recording.stop();\n            return;\n        }\n\n        if (videoCapture == null) {\n            status.setText(\"CAMERA NOT READY\");\n            return;\n        }\n\n        String stamp =\n            new SimpleDateFormat(\"yyyyMMdd_HHmmss\", Locale.US)\n                .format(new Date());\n\n        ContentValues values = new ContentValues();\n\n        String captureName =\n            directHevcActive\n                ? \"DU_R50_TEXTURE_BALANCE_\" +\n                    (aspectNineSixteen ? \"9x16_\" : \"16x9_\") +\n                    \"1080P60_HEVC_\" + stamp\n                : \"DU_R50_TEXTURE_BALANCE_\" +\n                    (aspectNineSixteen ? \"9x16_\" : \"16x9_\") +\n                    \"1080P60_H264_\" + stamp;\n\n        values.put(\n            MediaStore.Video.Media.DISPLAY_NAME,\n            captureName\n        );\n        values.put(\n            MediaStore.Video.Media.MIME_TYPE,\n            \"video/mp4\"\n        );\n\n        if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.Q) {\n            values.put(\n                MediaStore.Video.Media.RELATIVE_PATH,\n                directHevcActive\n                    ? \"Movies/DU Camera/R50 Texture Balance\"\n                    : \"Movies/DU Camera/R37 TikTok Master H264\"\n            );\n        }\n\n        MediaStoreOutputOptions output =\n            new MediaStoreOutputOptions.Builder(\n                getContentResolver(),\n                MediaStore.Video.Media.EXTERNAL_CONTENT_URI\n            )\n            .setContentValues(values)\n            .build();\n\n        androidx.camera.video.PendingRecording pending =\n            videoCapture.getOutput().prepareRecording(this, output);\n\n        if (hasAudioPermission()) {\n            pending = pending.withAudioEnabled();\n        }\n\n        recording =\n            pending.start(\n                ContextCompat.getMainExecutor(this),\n                event -> {\n                    if (event instanceof VideoRecordEvent.Start) {\n                        startPrecisionTimeline();\n                        recordButton.setText(\"STOP\");\n                        status.setText(\n                            directHevcActive\n                                ? \"1080P60/HEVC TIKTOK \u2022 REC\"\n                                : \"H264 SAFE \u2022 REC\"\n                        );\n                    } else if (event instanceof VideoRecordEvent.Finalize) {\n                        VideoRecordEvent.Finalize end =\n                            (VideoRecordEvent.Finalize) event;\n\n                        stopPrecisionTimeline();\n                        recording = null;\n                        recordButton.setText(\"RECORD\");\n\n                        if (end.hasError()) {\n                            status.setText(\"SAVE ERROR\");\n                        } else {\n                            Uri rawUri =\n                                end.getOutputResults().getOutputUri();\n\n                            if (directHevcActive &&\n                                !directGradeCopy) {\n                                status.setText(\n                                    \"DIRECT MASTER \u2022 FINAL SAVED\"\n                                );\n                            } else if (autoEnhance &&\n                                rawUri != null &&\n                                !Uri.EMPTY.equals(rawUri)) {\n                                status.setText(\n                                    directHevcActive\n                                        ? \"CREATING GRADE COPY...\"\n                                        : \"SAFE ENHANCING...\"\n                                );\n                                enhanceRecordedMaster(\n                                    rawUri,\n                                    true\n                                );\n                            } else {\n                                status.setText(\n                                    \"MASTER SAVED\"\n                                );\n                            }\n                        }\n                    }\n                }\n            );\n    }\n\n    private void enhanceRecordedMaster(\n        Uri inputUri,\n        boolean preferHevc\n    ) {\n        try {\n            File directory =\n                getExternalFilesDir(\n                    Environment.DIRECTORY_MOVIES\n                );\n\n            if (directory == null) {\n                directory = getCacheDir();\n            }\n\n            File enhancedFile =\n                new File(\n                    directory,\n                    \"DU_R37_GRADED_\" +\n                    System.currentTimeMillis() +\n                    \".mp4\"\n                );\n\n            if (enhancedFile.exists()) {\n                enhancedFile.delete();\n            }\n\n            // R37 TikTok Master optional grade-copy path.\n            // DIRECT FINAL remains the default and avoids a second encode.\n            // The proven R36 grade chain is retained only if the user\n            // explicitly taps +GRADE COPY.\n            Effect contrast =\n                new Contrast(-0.02f);\n\n            Effect saturation =\n                new HslAdjustment.Builder()\n                    .adjustSaturation(5.5f)\n                    .adjustLightness(0.5f)\n                    .build();\n\n            Effect channelBalance =\n                new RgbAdjustment.Builder()\n                    .setRedScale(1.018f)\n                    .setGreenScale(1.010f)\n                    .setBlueScale(0.995f)\n                    .build();\n\n            EditedMediaItem editedItem =\n                new EditedMediaItem.Builder(\n                    MediaItem.fromUri(inputUri)\n                )\n                .setEffects(\n                    new Effects(\n                        Collections.emptyList(),\n                        Arrays.asList(\n                            contrast,\n                            saturation,\n                            channelBalance\n                        )\n                    )\n                )\n                .build();\n\n            VideoEncoderSettings encoderSettings =\n                new VideoEncoderSettings.Builder()\n                    .setBitrate(46_000_000)\n                    .setiFrameIntervalSeconds(1.0f)\n                    .build();\n\n            DefaultEncoderFactory encoderFactory =\n                new DefaultEncoderFactory.Builder(this)\n                    .setEnableFallback(true)\n                    .setEnableCodecDbLite(true)\n                    .setRequestedVideoEncoderSettings(\n                        encoderSettings\n                    )\n                    .build();\n\n            Transformer.Builder builder =\n                new Transformer.Builder(this)\n                    .setEncoderFactory(encoderFactory)\n                    .addListener(\n                        new Transformer.Listener() {\n                            @Override\n                            public void onCompleted(\n                                Composition composition,\n                                ExportResult exportResult\n                            ) {\n                                activeTransformer = null;\n                                publishEnhancedVideo(\n                                    enhancedFile\n                                );\n                            }\n\n                            @Override\n                            public void onError(\n                                Composition composition,\n                                ExportResult exportResult,\n                                ExportException exportException\n                            ) {\n                                activeTransformer = null;\n\n                                // HEVC is preferred for social-media\n                                // quality/size. Retry as AVC on phones\n                                // whose encoders reject HEVC.\n                                if (preferHevc) {\n                                    if (enhancedFile.exists()) {\n                                        enhancedFile.delete();\n                                    }\n\n                                    status.setText(\n                                        \"SAFE FALLBACK \u2022 AVC\"\n                                    );\n\n                                    enhanceRecordedMaster(\n                                        inputUri,\n                                        false\n                                    );\n                                } else {\n                                    status.setText(\n                                        \"RAW SAFE \u2022 ENHANCE FAILED\"\n                                    );\n                                }\n                            }\n                        }\n                    );\n\n            builder.setVideoMimeType(\n                preferHevc\n                    ? MimeTypes.VIDEO_H265\n                    : MimeTypes.VIDEO_H264\n            );\n\n            activeTransformer = builder.build();\n\n            activeTransformer.start(\n                editedItem,\n                enhancedFile.getAbsolutePath()\n            );\n\n        } catch (Throwable error) {\n            activeTransformer = null;\n            status.setText(\n                \"RAW SAVED \u2022 ENHANCE ERROR\"\n            );\n        }\n    }\n\n    private void publishEnhancedVideo(\n        File sourceFile\n    ) {\n        if (sourceFile == null ||\n            !sourceFile.exists()) {\n            status.setText(\n                \"RAW SAVED \u2022 EXPORT MISSING\"\n            );\n            return;\n        }\n\n        Uri destination = null;\n\n        try {\n            ContentValues values =\n                new ContentValues();\n\n            values.put(\n                MediaStore.Video.Media.D