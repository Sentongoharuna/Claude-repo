      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android platform
        shell: bash
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle 8.11.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.11.1

      - name: Build R021 SOCIAL MASTER APK
        working-directory: r21-social
        shell: bash
        run: |
          set -o pipefail
          gradle --no-daemon :app:assembleDebug --stacktrace 2>&1 | tee r021-social-master-build.log

      - name: Prepare APK
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          APK='r21-social/app/build/outputs/apk/debug/app-debug.apk'
          OUT='DU-Camera-R021-SOCIAL-MASTER.apk'
          test -s "$APK"
          cp "$APK" "$OUT"
          ls -lh "$OUT"
          sha256sum "$OUT"

      - name: Upload audit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: R021-SOCIAL-MASTER-AUDIT
          path: /tmp/R021-SOCIAL-MASTER-AUDIT.txt
          if-no-files-found: error
          retention-days: 14

      - name: Upload failed build log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: R021-SOCIAL-MASTER-FAILED-BUILD-LOG
          path: r21-social/r021-social-master-build.log
          if-no-files-found: warn
          retention-days: 14

      - name: Upload R021 APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: DU-Camera-R021-SOCIAL-MASTER
          path: DU-Camera-R021-SOCIAL-MASTER.apk
          if-no-files-found: error
          retention-days: 14
