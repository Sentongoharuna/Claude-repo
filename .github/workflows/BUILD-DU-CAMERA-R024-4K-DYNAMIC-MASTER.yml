name: Build DU Camera R024 4K DYNAMIC MASTER APK

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/BUILD-DU-CAMERA-R024-4K-DYNAMIC-MASTER.yml'

permissions:
  contents: read

jobs:
  build_r024_4k_dynamic_master:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Create R024 source without stale self-audit
        shell: bash
        run: |
          set -euo pipefail

          BASE_SHA='04d151f2ec573839fd834069016e3109f2f13c92'
          BASE_PATH='.github/workflows/BUILD-DU-CAMERA-R024-4K-DYNAMIC-MASTER.yml'

          if ! git cat-file -e "$BASE_SHA^{commit}" 2>/dev/null; then
            git fetch --no-tags origin "$BASE_SHA"
          fi

          git show "$BASE_SHA:$BASE_PATH" > /tmp/r24-original.yml

          python3 - <<'PY'
          from pathlib import Path
          import re

          source = Path('/tmp/r24-original.yml').read_text(encoding='utf-8')
          lines = source.splitlines()

          wanted = (
              'Create R024 4K dynamic master from proven '
              'R18/R19/R20/R21/R22/R23 clean core'
          )

          step_start = None
          step_indent = None

          for i, line in enumerate(lines):
              match = re.match(r'^(\s*)- name:\s*(.+?)\s*$', line)
              if match and match.group(2) == wanted:
                  step_start = i
                  step_indent = len(match.group(1))
                  break

          if step_start is None:
              raise SystemExit('R24 source-generation step not found in pinned base workflow')

          step_end = len(lines)
          for j in range(step_start + 1, len(lines)):
              match = re.match(r'^(\s*)- name:\s*(.+?)\s*$', lines[j])
              if match and len(match.group(1)) == step_indent:
                  step_end = j
                  break

          run_line = None
          for j in range(step_start + 1, step_end):
              if lines[j].strip() == 'run: |':
                  run_line = j
                  break

          if run_line is None:
              raise SystemExit('R24 source-generation run block not found')

          run_indent = len(lines[run_line]) - len(lines[run_line].lstrip())
          content_indent = run_indent + 2
          block = []

          for line in lines[run_line + 1:step_end]:
              if line.strip() and len(line) - len(line.lstrip()) <= run_indent:
                  break
              if line.strip():
                  block.append(line[content_indent:])
              else:
                  block.append('')

          # The original R24 source is valid enough to create the project,
          # but its trailing grep audit contains stale R21/R22 assumptions
          # (e.g. literal 60 range, 55 Mbps, one-line stabilization).
          # Remove only that brittle audit execution block.
          first_audit = None
          for i, line in enumerate(block):
              if line.startswith("grep -qx 'android.useAndroidX=true'"):
                  first_audit = i
                  break

          if first_audit is None:
              raise SystemExit('R24 stale audit block start not found')

          cleaned = block[:first_audit]
          cleaned.append('')
          cleaned.append('echo "PASS: R024 source project created; robust audit runs next."')

          Path('/tmp/r24-create.sh').write_text(
              '\n'.join(cleaned) + '\n',
              encoding='utf-8'
          )
          PY

          bash -n /tmp/r24-create.sh
          bash /tmp/r24-create.sh

      - name: Robust R024 source audit
        shell: bash
        run: |
          set -euo pipefail

          python3 - <<'PY'
          from pathlib import Path

          root = Path('r24-dynamic')
          java = root / 'app/src/main/java/com/sentongoharuna/ducamera/DynamicMasterCameraActivity.java'
          manifest = root / 'app/src/main/AndroidManifest.xml'
          gradle = root / 'app/build.gradle'
          props = root / 'gradle.properties'

          if not java.exists():
              raise SystemExit('DynamicMasterCameraActivity.java missing')
          if not manifest.exists():
              raise SystemExit('AndroidManifest.xml missing')
          if not gradle.exists():
              raise SystemExit('app/build.gradle missing')

          j = java.read_text(encoding='utf-8')
          m = manifest.read_text(encoding='utf-8')
          g = gradle.read_text(encoding='utf-8')
          p = props.read_text(encoding='utf-8')

          checks = {
              'AndroidX enabled': 'android.useAndroidX=true' in p,
              'one launcher MAIN': m.count('android.intent.action.MAIN') == 1,
              'one launcher category': m.count('android.intent.category.LAUNCHER') == 1,
              'compileSdk 36': 'compileSdk 36' in g,
              'Media3 transformer': 'media3-transformer' in g,
              'exact UHD selector': 'QualitySelector.from(' in j and 'Quality.UHD' in j,
              'dynamic FPS request': 'new Range<>(targetFps, targetFps)' in j,
              '4K min-frame-duration detection': 'getOutputMinFrameDuration' in j,
              '120fps capability detection': 'getHighSpeedVideoFpsRangesFor' in j,
              '62 Mbps top capture target': '62_000_000' in j,
              '50 Mbps UHD30 target': '50_000_000' in j,
              'video stabilization': 'setVideoStabilizationEnabled' in j,
              'preview stabilization': 'setPreviewStabilizationEnabled' in j,
              'SDR capture': 'DynamicRange.SDR' in j,
              'tap focus/exposure': 'startFocusAndMetering' in j,
              'pinch zoom': 'setZoomRatio' in j,
              'Camera2 interop': 'Camera2Interop.Extender' in j,
              'fast 60fps edge mode': 'EDGE_MODE_FAST' in j,
              'HQ 30fps edge mode': 'EDGE_MODE_HIGH_QUALITY' in j,
              'HEVC enhanced export': 'MimeTypes.VIDEO_H265' in j,
              '44 Mbps enhanced export': '44_000_000' in j,
              'no broken getSelectedQuality': 'getSelectedQuality' not in j,
              'no broken getResolutionInfo': 'getResolutionInfo' not in j,
              'no invalid Media3 format fallback call': '.setEnableFormatFallback(' not in j,
          }

          failed = [name for name, ok in checks.items() if not ok]

          report = ['R024 4K DYNAMIC MASTER ROBUST AUDIT']
          report += [
              ('PASS ' if ok else 'FAIL ') + name
              for name, ok in checks.items()
          ]

          Path('/tmp/R024-4K-DYNAMIC-MASTER-AUDIT.txt').write_text(
              '\n'.join(report) + '\n',
              encoding='utf-8'
          )

          print('\n'.join(report))

          if failed:
              raise SystemExit(
                  'R024 robust audit failed: ' + ', '.join(failed)
              )
          PY

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android platform
        shell: bash
        run: sdkmanager "platforms;android-36" "build-tools;35.0.0"

      - name: Set up Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.13

      - name: Build R024 4K DYNAMIC MASTER APK
        working-directory: r24-dynamic
        shell: bash
        run: |
          set -o pipefail
          gradle --no-daemon :app:assembleDebug --stacktrace 2>&1 | tee r024-4k-dynamic-master-build.log

      - name: Prepare APK
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          APK='r24-dynamic/app/build/outputs/apk/debug/app-debug.apk'
          OUT='DU-Camera-R024-4K-DYNAMIC-MASTER.apk'
          test -s "$APK"
          cp "$APK" "$OUT"
          ls -lh "$OUT"
          sha256sum "$OUT"

      - name: Upload audit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: R024-4K-DYNAMIC-MASTER-AUDIT
          path: /tmp/R024-4K-DYNAMIC-MASTER-AUDIT.txt
          if-no-files-found: error
          retention-days: 14

      - name: Upload failed build log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: R024-4K-DYNAMIC-MASTER-FAILED-BUILD-LOG
          path: r24-dynamic/r024-4k-dynamic-master-build.log
          if-no-files-found: warn
          retention-days: 14

      - name: Upload R024 APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: DU-Camera-R024-4K-DYNAMIC-MASTER
          path: DU-Camera-R024-4K-DYNAMIC-MASTER.apk
          if-no-files-found: error
          retention-days: 14
