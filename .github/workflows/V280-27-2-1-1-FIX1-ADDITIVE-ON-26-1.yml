      - name: Verify V280-27.2.1.1 FIX1 preserves V280-26.1 and adds home2 page2 camera UI
        shell: bash
        run: |
          set -euo pipefail
          SRC='v172-source/app/src/main/java/com/sentongoharuna/pulse'
          CAM="$SRC/DevelopUgandaCameraActivity.kt"
          HUB="$SRC/DevelopUgandaGeneralHubActivity.kt"
          UI="$SRC/DevelopUgandaV28027211CameraUi.kt"
          GRADLE='v172-source/app/build.gradle.kts'
          AUDIT='v172-source/V280-27-2-1-1-FIX1-ADDITIVE-ON-26-1-AUDIT.txt'
          test -s "$UI"; test -s "$AUDIT"; test -s /tmp/v28027211_cam_before.kt; test -s /tmp/v28027211_hub_before.kt
          grep -q 'versionCode = 2827212' "$GRADLE"
          grep -q 'versionName = "280.27.2.1.1-fix1-additive-on-26-1"' "$GRADLE"
          # FIX1 guard: V280/26.1 first-page identity must remain exactly present.
          grep -Fq 'develop.uganda • V280/26.1 LIVE INTERACTIVE MASTER' "$HUB"
          grep -Fq 'LIVE INTERACTIVE HOME • CINEMA CONTROL • FIELD RELIABILITY' "$HUB"
          grep -Fq 'V280/26.1 is a dual-upgrade point release: camera intelligence advances together with a livelier first page.' "$HUB"
          grep -Fq 'page.addView(buildV280261LiveControlDeck())' "$HUB"
          grep -Fq 'page.addView(buildV28027211FirstPageSecondUpgrade())' "$HUB"
          grep -Fq 'shell.addView(buildV28027211SecondPageFirstUpgrade())' "$HUB"
          grep -q 'SECOND UI UPGRADE' "$HUB"
          grep -q 'PAGE 2 • PRODUCTION BOARD • FIRST UI UPGRADE' "$HUB"
          grep -q 'buildV28027211FirstPageSecondUpgrade' "$HUB"
          grep -q 'buildV28027211SecondPageFirstUpgrade' "$HUB"
          grep -q 'refreshV28027211Ui' "$HUB"
          grep -q 'DevelopUgandaV28027211CameraUi.attach' "$CAM"
          grep -q 'camera-page UI upgrade #1' "$UI"
          grep -q 'LUT' "$UI"
          grep -q 'EXPOSURE' "$UI"
          grep -q 'FOCUS' "$UI"
          grep -q 'SOUND' "$UI"
          grep -q 'REVIEW' "$UI"
          grep -q 'DevelopUgandaV280261ShotReadyLiveAssist.attach' "$CAM"
          grep -q 'DevelopUgandaV28025ContinuityMatchRetakeAssist.attach' "$CAM"
          grep -q 'DevelopUgandaV28024ShotMemoryContinuity.attach' "$CAM"
          grep -q 'DevelopUgandaV28023AudioConfidenceTakeAssist.attach' "$CAM"
          grep -q 'DevelopUgandaV28022FocusExposureIntelligence.attach' "$CAM"
          grep -q '.withAudioEnabled()' "$CAM"
          grep -q 'DevelopUgandaV276RecordingSafety.onRecordingStarted' "$CAM"
          grep -q 'DevelopUgandaV276RecordingSafety.onRecordingFinalized' "$CAM"
          grep -q 'DevelopUgandaV272FieldSoundContinuity.armAudioLock' "$CAM"
          grep -q 'ZoomRulerView' "$SRC/DevelopUgandaV242QualityMatchPro.kt"
          grep -q 'ExposureRulerView' "$SRC/DevelopUgandaV242QualityMatchPro.kt"
          ! grep -q 'AudioRecord(' "$UI"
          ! grep -q 'MediaRecorder(' "$UI"
          ! grep -q 'ProcessCameraProvider.getInstance' "$UI"
          python3 - <<'PYVERIFY27211'
          from pathlib import Path
          import re
          root=Path('v172-source'); src=root/'app/src/main/java/com/sentongoharuna/pulse'
          manifest=(root/'app/src/main/AndroidManifest.xml').read_text(encoding='utf-8')
          declared=set(re.findall(r'android:name="\.([A-Za-z0-9_]+)"',manifest)); routes=set(); classes=set(); empty=[]
          for p in src.glob('*.kt'):
              t=p.read_text(encoding='utf-8',errors='ignore')
              routes.update(re.findall(r'(DevelopUganda[A-Za-z0-9_]+Activity)::class\.java',t))
              classes.update(re.findall(r'\b(?:open\s+)?class\s+(DevelopUganda[A-Za-z0-9_]+Activity)\b',t))
              if re.search(r'setOnClickListener\s*\{\s*\}',t): empty.append(p.name)
          mm=sorted(routes-declared); mc=sorted(routes-classes)
          if mm or mc or empty: raise SystemExit('V280/27.2.1.1 route/button audit failed: missing manifest=%r missing class=%r empty=%r' % (mm,mc,empty))
          sig=re.compile(r'\b(?:private\s+|internal\s+|public\s+|protected\s+)?fun\s+([A-Za-z0-9_]+)\s*\(')
          checks=[('DevelopUgandaCameraActivity.kt','/tmp/v28027211_cam_before.kt'),('DevelopUgandaGeneralHubActivity.kt','/tmp/v28027211_hub_before.kt')]
          for filename,before_path in checks:
              before=Path(before_path).read_text(encoding='utf-8',errors='ignore')
              after=(src/filename).read_text(encoding='utf-8',errors='ignore')
              removed=sorted(set(sig.findall(before))-set(sig.findall(after)))
              if removed: raise SystemExit('V280/27.2.1.1 removed existing functions from %s: %r' % (filename,removed[:30]))
          hub=(src/'DevelopUgandaGeneralHubActivity.kt').read_text(encoding='utf-8',errors='ignore')
          hero=hub.index('page.addView(hero)')
          deck=hub.index('page.addView(buildV280261LiveControlDeck())', hero)
          home2=hub.index('page.addView(buildV28027211FirstPageSecondUpgrade())', deck)
          console=hub.index('page.addView(buildV28012ProWorkflowConsole())', home2)
          if not (hero < deck < home2 < console): raise SystemExit('FIX1 first-page order regression: V280/26.1 deck must stay before Home2 extension')
          console_fn=hub.index('private fun buildV28012ProWorkflowConsole')
          nested=hub.index('shell.addView(buildV28027211SecondPageFirstUpgrade())', console_fn)
          if nested < console_fn: raise SystemExit('FIX1 Page2 board not nested in preserved console')
          print('PASS: V280/26.1 hero + LIVE CONTROL DECK preserved in original order; Home2 extension is additive; Page2 board is nested in existing console.')
          print('PASS: %d routed Activities resolve; no empty click handlers; 0 prior Camera/Hub functions removed.' % len(routes))
          PYVERIFY27211
          echo 'PASS: V280/27.2.1.1 FIX1 preserves V280/26.1 first page and adds Home2 + Page2 + Camera UI layers.'

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android platform
        run: sdkmanager "platforms;android-36" "build-tools;35.0.0"

      - name: Set up Gradle 8.11.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.11.1

      - name: Build V280-27.2.1.1 FIX1 APK
        working-directory: v172-source
        shell: bash
        run: |
          set -o pipefail
          gradle --no-daemon :app:assembleDebug --stacktrace 2>&1 | tee v28027211fix1-build.log

      - name: Prepare and verify V280-27.2.1.1 FIX1 APK artifact
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          APK='v172-source/app/build/outputs/apk/debug/app-debug.apk'
          OUT='DEVELOP-UGANDA-V280-27-2-1-1-FIX1-ADDITIVE-ON-26-1.apk'
          test -s "$APK"
          cp "$APK" "$OUT"
          test -s "$OUT"
          echo "PASS: APK exists and is non-empty."
          ls -lh "$OUT"
          sha256sum "$OUT"

      - name: Upload V280-27.2.1.1 FIX1 APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: DEVELOP-UGANDA-V280-27-2-1-1-FIX1-ADDITIVE-ON-26-1
          path: DEVELOP-UGANDA-V280-27-2-1-1-FIX1-ADDITIVE-ON-26-1.apk
          if-no-files-found: error
          compression-level: 0
          retention-days: 14

      - name: Upload V280-27.2.1.1 FIX1 audits
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: V280-27-2-1-1-FIX1-ADDITIVE-ON-26-1-AUDITS
