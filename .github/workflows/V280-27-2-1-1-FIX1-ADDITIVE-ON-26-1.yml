      - name: Verify V280-22 focus exposure assist, preservation, routes, and artifact contract
        shell: bash
        run: |
          set -euo pipefail
          SRC='v172-source/app/src/main/java/com/sentongoharuna/pulse'
          CAM="$SRC/DevelopUgandaCameraActivity.kt"
          ASSIST="$SRC/DevelopUgandaV28022FocusExposureIntelligence.kt"
          GRADLE='v172-source/app/build.gradle.kts'
          AUDIT='v172-source/V280-22-FOCUS-EXPOSURE-INTELLIGENCE-RECORDING-ASSIST-AUDIT.txt'
          test -s "$ASSIST"; test -s "$AUDIT"
          grep -q 'versionCode = 28220' "$GRADLE"
          grep -q 'versionName = "280.22-focus-exposure-intelligence-recording-assist"' "$GRADLE"
          grep -q 'DevelopUgandaV28022FocusExposureIntelligence.attach' "$CAM"
          grep -q 'internal fun v28022ToggleProAssist' "$CAM"
          grep -q 'internal fun v28022ToggleFaceExposure' "$CAM"
          grep -q 'internal fun v28022ToggleWaveform' "$CAM"
          grep -q 'internal fun v28022ToggleFalseColor' "$CAM"
          grep -q 'internal fun v28022ToggleFocusPull' "$CAM"
          grep -q 'internal fun v28022RunFocusPull' "$CAM"
          grep -q 'internal fun v28022ApplyLightingFix' "$CAM"
          grep -q 'v251ToggleProAssist' "$CAM"
          grep -q 'v255ToggleWaveform' "$CAM"
          grep -q 'v255ToggleFalseColor' "$CAM"
          grep -q 'v255RunFocusPull' "$CAM"
          grep -q 'DevelopUgandaV277LightingExposure.lastSnapshot' "$CAM"
          grep -q 'EXPOSURE FIX LOCKED WHILE RECORDING' "$CAM"
          grep -q 'ASSIST PANEL HIDDEN WHILE RECORDING' "$ASSIST"
          grep -q 'APPLY SAFE EXPOSURE GUIDANCE' "$ASSIST"
          grep -q 'EXPOSURE WARNING' "$ASSIST"
          grep -q 'DevelopUgandaV28012RuntimeGuard.recordUiFault' "$ASSIST"
          grep -q '.withAudioEnabled()' "$CAM"
          grep -q 'DevelopUgandaV276RecordingSafety.onRecordingStarted' "$CAM"
          grep -q 'DevelopUgandaV276RecordingSafety.onRecordingFinalized' "$CAM"
          grep -q 'DevelopUgandaV272FieldSoundContinuity.armAudioLock' "$CAM"
          grep -q 'DevelopUgandaV272FieldSoundContinuity.audioRouteChanged' "$CAM"
          ! grep -q 'AudioRecord.Builder()' "$CAM"
          grep -q 'ZoomRulerView' "$SRC/DevelopUgandaV242QualityMatchPro.kt"
          grep -q 'ExposureRulerView' "$SRC/DevelopUgandaV242QualityMatchPro.kt"
          sha256sum -c /tmp/v28022-protected.sha256
          python3 - <<'PYFUN'
          from pathlib import Path
          import re
          old=Path('/tmp/v28022-camera-before.kt').read_text(encoding='utf-8',errors='ignore')
          new=Path('v172-source/app/src/main/java/com/sentongoharuna/pulse/DevelopUgandaCameraActivity.kt').read_text(encoding='utf-8',errors='ignore')
          pat=re.compile(r'\bfun\s+([A-Za-z0-9_]+)\s*\(')
          before=set(pat.findall(old)); after=set(pat.findall(new)); removed=sorted(before-after)
          if removed: raise SystemExit('V280/22 removed camera functions: '+', '.join(removed))
          needed={'v28022ToggleProAssist','v28022ToggleFaceExposure','v28022ToggleWaveform','v28022ToggleFalseColor','v28022ToggleFocusPull','v28022RunFocusPull','v28022ApplyLightingFix'}
          if not needed.issubset(after): raise SystemExit('V280/22 camera bridge incomplete')
          print('PASS: no V280/21 camera functions removed; V280/22 bridge present.')
          PYFUN
          python3 - <<'PYROUTE'
          from pathlib import Path
          import re
          root=Path('v172-source'); src=root/'app/src/main/java/com/sentongoharuna/pulse'
          manifest=(root/'app/src/main/AndroidManifest.xml').read_text(encoding='utf-8')
          declared=set(re.findall(r'android:name="\.([A-Za-z0-9_]+)"',manifest)); routes=set(); classes=set(); empty=[]
          for p in src.glob('*.kt'):
              t=p.read_text(encoding='utf-8',errors='ignore')
              routes.update(re.findall(r'(DevelopUganda[A-Za-z0-9_]+Activity)::class\.java',t))
              classes.update(re.findall(r'\b(?:open\s+)?class\s+(DevelopUganda[A-Za-z0-9_]+Activity)\b',t))
              if re.search(r'setOnClickListener\s*\{\s*\}',t): empty.append(p.name)
          mm=sorted(routes-declared); mc=sorted(routes-classes)
          if mm or mc or empty: raise SystemExit('V280/22 route/button audit failed: missing manifest=%r missing class=%r empty=%r' % (mm,mc,empty))
          print('PASS: %d routed Activities resolve; no empty click handlers.' % len(routes))
          PYROUTE
          echo 'PASS: V280/22 focus/exposure intelligence, V250 rulers, Director stack, recording safety and audio continuity verified.'

