      - name: Verify V280-21 active controls, preservation, routes, and artifact contract
        shell: bash
        run: |
          set -euo pipefail
          SRC='v172-source/app/src/main/java/com/sentongoharuna/pulse'
          CAM="$SRC/DevelopUgandaCameraActivity.kt"
          HUD20="$SRC/DevelopUgandaV28020CinemaHud.kt"
          CTRL="$SRC/DevelopUgandaV28021ActiveCinemaControls.kt"
          GRADLE='v172-source/app/build.gradle.kts'
          AUDIT='v172-source/V280-21-ACTIVE-CINEMA-CONTROLS-TOUCH-PRECISION-AUDIT.txt'
          test -s "$CTRL"; test -s "$AUDIT"
          grep -q 'versionCode = 28210' "$GRADLE"
          grep -q 'versionName = "280.21-active-cinema-controls-touch-precision"' "$GRADLE"
          grep -q 'DevelopUgandaV28021ActiveCinemaControls.attach' "$CAM"
          grep -q 'tag = "v28020_status_\${key}"' "$HUD20"
          grep -q 'internal fun v28021CycleShutter' "$CAM"
          grep -q 'internal fun v28021CycleIso' "$CAM"
          grep -q 'internal fun v28021CycleWhiteBalance' "$CAM"
          grep -q 'internal fun v28021CycleTimecode' "$CAM"
          grep -q 'internal fun v28021ExposureStep' "$CAM"
          grep -q 'internal fun v28021ResetExposure' "$CAM"
          grep -q 'internal fun v28021ResetManualControls' "$CAM"
          grep -q 'bind("LENS")' "$CTRL"
          grep -q 'bind("FPS")' "$CTRL"
          grep -q 'bind("SHUTTER")' "$CTRL"
          grep -q 'bind("ISO")' "$CTRL"
          grep -q 'bind("WB")' "$CTRL"
          grep -q 'bind("TC")' "$CTRL"
          grep -q 'PRECISION CONTROLS LOCKED WHILE RECORDING' "$CTRL"
          grep -q 'v28020InvokeControl("PRO"' "$CTRL"
          grep -q 'v249ExposureLabel' "$CTRL"
          grep -q '.withAudioEnabled()' "$CAM"
          grep -q 'DevelopUgandaV276RecordingSafety.onRecordingStarted' "$CAM"
          grep -q 'DevelopUgandaV276RecordingSafety.onRecordingFinalized' "$CAM"
          grep -q 'DevelopUgandaV272FieldSoundContinuity.armAudioLock' "$CAM"
          grep -q 'DevelopUgandaV272FieldSoundContinuity.audioRouteChanged' "$CAM"
          ! grep -q 'AudioRecord.Builder()' "$CAM"
          grep -q 'ZoomRulerView' "$SRC/DevelopUgandaV242QualityMatchPro.kt"
          grep -q 'ExposureRulerView' "$SRC/DevelopUgandaV242QualityMatchPro.kt"
          sha256sum -c /tmp/v28021-protected.sha256
          python3 - <<'PYFUN'
          from pathlib import Path
          import re
          old=Path('/tmp/v28021-camera-before.kt').read_text(encoding='utf-8',errors='ignore')
          new=Path('v172-source/app/src/main/java/com/sentongoharuna/pulse/DevelopUgandaCameraActivity.kt').read_text(encoding='utf-8',errors='ignore')
          pat=re.compile(r'\bfun\s+([A-Za-z0-9_]+)\s*\(')
          before=set(pat.findall(old)); after=set(pat.findall(new)); removed=sorted(before-after)
          if removed: raise SystemExit('V280/21 removed camera functions: '+', '.join(removed))
          added=sorted(after-before)
          needed={'v28021CycleShutter','v28021CycleIso','v28021CycleWhiteBalance','v28021CycleTimecode','v28021ExposureStep','v28021ResetExposure','v28021ResetManualControls'}
          if not needed.issubset(after): raise SystemExit('V280/21 camera bridge incomplete')
          print('PASS: no V280/20 camera functions removed; V280/21 bridge functions added=%d.' % len(added))
          PYFUN
          python3 - <<'PYROUTE'
          from pathlib import Path
          import re
          root=Path('v172-source'); src=root/'app/src/main/java/com/sentongoharuna/pulse'
          manifest=(root/'app/src/main/AndroidManifest.xml').read_text(encoding='utf-8')
          declared=set(re.findall(r'android:name="\.([A-Za-z0-9_]+)"',manifest)); routes=set(); classes=set(); empty=[]
          for p in src.glob('*.kt'):
              t=p.read_text(encoding='utf-8',errors='ignore')
              routes.update(re.findall(r'(DevelopUganda[A-Za-z0-9_]+Activity)::class\.java',t))
              classes.update(re.findall(r'\b(?:open\s+)?class\s+(DevelopUganda[A-Za-z0-9_]+Activity)\b',t))
              if re.search(r'setOnClickListener\s*\{\s*\}',t): empty.append(p.name)
          mm=sorted(routes-declared); mc=sorted(routes-classes)
          if mm or mc or empty: raise SystemExit('V280/21 route/button audit failed: missing manifest=%r missing class=%r empty=%r' % (mm,mc,empty))
          print('PASS: %d routed Activities resolve; no empty click handlers.' % len(routes))
          PYROUTE
          echo 'PASS: V280/21 real top controls, precision EV/manual controls, V250 rulers, Director stack, recording safety and audio continuity verified.'

