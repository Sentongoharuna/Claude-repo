          require_any('V275 live control surface', ['LIVE CONTROL SURFACE', 'CONTROL SURFACE'], control)
          require_any('V275 dual settings', ['CAMERA SETTINGS', 'WORKFLOW SETTINGS'])

          safety = source_texts['DevelopUgandaV276RecordingSafety.kt']
          require_all('V276 recording safety lifecycle', [
              'onRecordingStarted', 'onRecordingStatus', 'onRecordingFinalized'
          ], safety)
          require_any('V276 recovery', ['RECOVERY', 'recover', 'journal'], safety, case_sensitive=False)

          lighting = source_texts['DevelopUgandaV277LightingExposure.kt']
          require_any('V277 lighting intelligence', ['LIGHT', 'EXPOSURE'], lighting)
          require_any('V277 tap spot meter', ['spot', 'meter'], lighting)

          # -----------------------------------------------------------------
          # I. V278–V280 CURRENT INTELLIGENCE STACK.
          # -----------------------------------------------------------------
          require_any('V278 live workflow overlay', ['LIVE WORKFLOW', 'WORKFLOW'], source_texts['DevelopUgandaV278LiveWorkflow.kt'])

          active = source_texts['DevelopUgandaV279ActiveShooting.kt']
          require_all('V279 active shooting intelligence', ['RECORDING HEALTH', 'SHOT MEMORY'], active)

          smart = source_texts['DevelopUgandaV280SmartDirector.kt']
          require_all('V280 Smart Director sequence coverage', [
              'COVERAGE', 'NEXT SHOT', 'PROPERTY', 'CONSTRUCTION'
          ], smart)

          # -----------------------------------------------------------------
          # J. RECORDING / AUDIO MASTER SAFETY GATE (V280/9 baseline).
          # CameraX owns the microphone; V276 and safe V272 continuity remain.
          # -----------------------------------------------------------------
          cam = source_texts.get('DevelopUgandaCameraActivity.kt', '')
          require_all('V280/9 CameraX recording + microphone audio', [
              '.withAudioEnabled()',
              'DevelopUgandaV276RecordingSafety.onRecordingStarted',
              'DevelopUgandaV276RecordingSafety.onRecordingFinalized',
              'DevelopUgandaV272FieldSoundContinuity.armAudioLock',
              'DevelopUgandaV272FieldSoundContinuity.audioRouteChanged',
          ], cam)
          if 'AudioRecord.Builder()' in cam:
              raise SystemExit('V280/11 safety failure: CameraActivity must not open a second AudioRecord while CameraX records')
          passed('V280/9 single microphone owner rule', 'no second AudioRecord.Builder() in CameraActivity')

          # -----------------------------------------------------------------
          # K. UI / ROUTING / MANIFEST PROTECTION.
          # -----------------------------------------------------------------
          require_any('Prominent LUTS control preserved', [
              'LUTS • V235', 'LUTS REMAIN AT TOP-LEFT', 'v275OpenCameraControl("LUTS")'
          ])
          require_any('ASPECT / format control preserved', [
              'ASPECT •', 'v275OpenCameraControl("ASPECT")', 'Aspect / Format'
          ])
          if 'bottomDeck.addView(identityRow)' in cam:
              raise SystemExit('V280/11 UI regression: legacy bottom identity/report bar returned')
          if 'bottomDeck.addView(settingsSummaryView)' in cam:
              raise SystemExit('V280/11 UI regression: legacy long bottom settings summary returned')
          passed('Clean camera deck protection', 'legacy bottom bars remain removed')

          man = manifest.read_text(encoding='utf-8', errors='ignore')
          require_all('Manifest Remote Director route', ['DevelopUgandaV262RemoteDirectorActivity'], man)
          activity_count = len(re.findall(r'<activity(?:\s|>)', man))
          if activity_count < 27:
              raise SystemExit(f'V280/11 routing regression: only {activity_count} activities declared; expected at least 27')
          passed('Main workflow manifest route floor', f'{activity_count} activities declared')

          # Version only advances after every preservation gate above passes.
          g = gradle.read_text(encoding='utf-8')
          if 'versionCode = 28090' not in g or 'versionName = "280.9-rec-audio-safety-continuity"' not in g:
              raise SystemExit('V280/11 expected the verified V280/9 version block before master-preservation bump')
          g = g.replace('versionCode = 28090', 'versionCode = 28110', 1)
          g = g.replace(
              'versionName = "280.9-rec-audio-safety-continuity"',
              'versionName = "280.11-full-legacy-preservation-master"',
              1,
          )
          gradle.write_text(g, encoding='utf-8')

          audit_lines.extend([
              '',
              'MASTER RESULT: PASS — FIX2 protected functional legacy stack is present and wired strongly enough for compilation.',
              'VersionCode: 28110',
              'VersionName: 280.11-full-legacy-preservation-master',
              'Baseline rule: future V281+ builds should inherit from this V280/11 FIX2 preservation master.',
          ])
          audit = root / 'V280-11-FULL-PRESERVATION-AUDIT.txt'
          audit.write_text('\n'.join(audit_lines) + '\n', encoding='utf-8')
          print('PASS: V280/11 FULL LEGACY PRESERVATION MASTER guard completed.')
          PY

      - name: Verify V280-11 master version and critical recording path
        shell: bash
        run: |
          set -euo pipefail
          CAM='v172-source/app/src/main/java/com/sentongoharuna/pulse/DevelopUgandaCameraActivity.kt'
          GRADLE='v172-source/app/build.gradle.kts'
          AUDIT='v172-source/V280-11-FULL-PRESERVATION-AUDIT.txt'
          test -s "$AUDIT"
          grep -q '.withAudioEnabled()' "$CAM"
          grep -q 'DevelopUgandaV276RecordingSafety.onRecordingStarted' "$CAM"
          grep -q 'DevelopUgandaV276RecordingSafety.onRecordingFinalized' "$CAM"
          grep -q 'DevelopUgandaV272FieldSoundContinuity.armAudioLock' "$CAM"
          grep -q 'DevelopUgandaV272FieldSoundContinuity.audioRouteChanged' "$CAM"
          grep -q 'versionCode = 28110' "$GRADLE"
          grep -q 'versionName = "280.11-full-legacy-preservation-master"' "$GRADLE"
          grep -q 'MASTER RESULT: PASS' "$AUDIT"
          echo 'PASS: V280/11 preservation master + recording/audio safety verified.'

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android platform
        run: sdkmanager "platforms;android-36" "build-tools;35.0.0"

      - name: Set up Gradle 8.11.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Build V280-11 APK
        working-directory: v172-source
        shell: bash
        run: |
          set -o pipefail
          gradle --no-daemon :app:assembleDebug --stacktrace 2>&1 | tee v28011-build.log

      - name: Prepare V280-11 APK + preservation audit
        if: success()
        run: |
          cp v172-source/app/build/outputs/apk/debug/app-debug.apk \
            DEVELOP-UGANDA-V280-11-FULL-LEGACY-PRESERVATION-MASTER.apk

      - name: Upload V280-11 APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: DEVELOP-UGANDA-V280-11-FULL-LEGACY-PRESERVATION-MASTER
          path: DEVELOP-UGANDA-V280-11-FULL-LEGACY-PRESERVATION-MASTER.apk
          retention-days: 14

      - name: Upload V280-11 preservation audit
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: V280-11-FULL-PRESERVATION-AUDIT
          path: v172-source/V280-11-FULL-PRESERVATION-AUDIT.txt
          retention-days: 14

      - name: Upload V280-11 build log if failed
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: V280-11-BUILD-LOG
          path: v172-source/v28011-build.log
          if-no-files-found: ignore
          retention-days: 7
