          require_any('V267 first-page readiness / director routing', [
              'CAMERA HEALTH', 'DIRECTOR', 'REVIEW', 'READY TO SHOOT CHECK'
          ])
          require_any('V267 quick-shoot presets', [
              'NEWS', 'INTERVIEW', 'CINEMA', 'NIGHT', 'SOCIAL', 'v267ConsumePendingQuickPreset'
          ])

          story = source_texts['DevelopUgandaV269SmartStoryDesk.kt']
          require_any('V269 Smart Story / Field Desk', ['SMART STORY', 'FIELD DESK'], story)
          require_all('V269 shot-list workflow', [
              'OPENING', 'WIDE', 'MEDIUM', 'CLOSE-UP', 'INTERVIEW', 'B-ROLL', 'CLOSING'
          ], story)
          require_any('V269 next-shot workflow', ['NEXT SHOT', 'SET NEXT'], story)
          require_all('V269 take ratings', ['BEST', 'KEEP', 'RETAKE', 'REJECT'], story)

          guidance = source_texts['DevelopUgandaV270Guidance.kt']
          require_any('V270 chronological workflow guidance', ['PREPARE', 'NEXT ACTION'], guidance)
          require_any('V270 Action Guard', ['Action Guard', 'ACTION GUARD', 'actionGuard'], guidance)
          require_any('V270 function audit / verified actions', ['VERIFY ACTIONS', 'FUNCTION AUDIT', 'verify'], guidance)

          # -----------------------------------------------------------------
          # H. V271–V277 ASSISTANT / SOUND / MOTION / VAULT / SETTINGS /
          # RECORDING SAFETY / LIGHTING STACK.
          # -----------------------------------------------------------------
          require_any('V271 Live Coach', ['DevelopUgandaV271LiveCoach', 'LIVE COACH'])
          require_any('V271 Clean / Reporter / Branded output modes', [
