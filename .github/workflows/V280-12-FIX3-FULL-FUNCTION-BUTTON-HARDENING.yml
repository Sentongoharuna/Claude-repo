          require_any('V273 Motion + Shot Control', ['MOTION', 'SHOT CONTROL'], source_texts['DevelopUgandaV273MotionShotControl.kt'])

          vault = source_texts['DevelopUgandaV274MediaVault.kt']
          require_any('V274 Media Vault', ['MEDIA VAULT', 'MediaVault'], vault)
