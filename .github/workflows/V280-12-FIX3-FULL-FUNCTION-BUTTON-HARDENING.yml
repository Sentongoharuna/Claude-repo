            'NOTE • a page can still contain a device-specific fault that only a real phone exposes. If that happens, the next launch now identifies the route/exception instead of leaving us blind.',
          ])+'\n')
          print('PASS: V280/12 FIX1 runtime stability source installed and audited.')
          PYFIX

      - name: Apply V280-12 FIX2 format crash + all-button runtime guard
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PYFIX2'
          from pathlib import Path

          root = Path('v172-source')
          src = root / 'app/src/main/java/com/sentongoharuna/pulse'
          hub_path = src / 'DevelopUgandaGeneralHubActivity.kt'
          console_path = src / 'DevelopUgandaV28012ProWorkflowConsole.kt'
          gradle_path = root / 'app/build.gradle.kts'
          vault_path = src / 'DevelopUgandaV274MediaVault.kt'
          live_workflow_path = src / 'DevelopUgandaV278LiveWorkflow.kt'

          hub = hub_path.read_text(encoding='utf-8')
          console = console_path.read_text(encoding='utf-8')
          gradle = gradle_path.read_text(encoding='utf-8')
          vault = vault_path.read_text(encoding='utf-8')
          live_workflow = live_workflow_path.read_text(encoding='utf-8')

          # 1) PHONE-PROVEN CRASH FIX.
          # V280/12 built a string containing BAT 20% and READY 80%, then called
          # String.format() on that already-interpolated string. Java treated the
          # literal percent signs as conversion prefixes and threw
          # UnknownFormatConversionException on real Android devices.
          ribbon_start = console.find('    fun statusRibbon(snapshot: Snapshot): String {')
          if ribbon_start < 0:
              raise SystemExit('FIX2: statusRibbon function not found')
          ribbon_end = console.find('\n    fun ', ribbon_start + 8)
          if ribbon_end < 0:
              raise SystemExit('FIX2: could not find end of statusRibbon function')
          old_ribbon = console[ribbon_start:ribbon_end]
          if 'S%03d T%03d | MIC' not in old_ribbon or '.format(Locale.US, snapshot.scene, snapshot.take)' not in old_ribbon:
              raise SystemExit('FIX2: unsafe statusRibbon signature changed unexpectedly')
          new_ribbon = '''    fun statusRibbon(snapshot: Snapshot): String {
              val bat = if (snapshot.battery >= 0) "${snapshot.battery}%" else "--"
              val input = snapshot.audio.removePrefix("INPUT • ").replace('\\n', ' ').take(24)
              val sceneCode = snapshot.scene.coerceIn(0, 999).toString().padStart(3, '0')
              val takeCode = snapshot.take.coerceIn(0, 999).toString().padStart(3, '0')
              // FIX2: never run String.format over a string that already contains
              // runtime percent text such as battery/readiness percentages.
              return "${snapshot.project} • ${snapshot.camera} • S$sceneCode T$takeCode | MIC $input | BAT $bat | ${snapshot.freeGb}GB | THERM ${snapshot.thermal} | READY ${snapshot.readiness}%"
          }
          '''
          console = console[:ribbon_start] + new_ribbon + console[ribbon_end:]

          # 2) ALL FIRST-PAGE BUTTON HANDLERS.
          # Every synchronous button action is isolated. A bad status/toggle/
          # preference/action callback is journaled instead of terminating the home.
          button_start = hub.find('    private fun v267ActionButton(')
          button_end = hub.find('    private fun v267Open(', button_start)
          if button_start < 0 or button_end < 0:
              raise SystemExit('FIX2: v267ActionButton function boundaries not found')
          button_block = hub[button_start:button_end]
          action_line = '                action()\n'
          if button_block.count(action_line) != 1:
              raise SystemExit(f'FIX2: expected one v267ActionButton action() call, found {button_block.count(action_line)}')
          guarded_action = '                v28012SafeUi("BUTTON • $label") {\n                    action()\n                }\n'
          button_block = button_block.replace(action_line, guarded_action, 1)
          hub = hub[:button_start] + button_block + hub[button_end:]

          # 3) SAFE HOME uses the core camera recovery path.
          old_safe_cam = 'v267ActionButton("OPEN FIELD CAMERA", cyan) { v267Open(DevelopUgandaAllProCameraActivity::class.java) }'
          new_safe_cam = 'v267ActionButton("OPEN CORE CAMERA", cyan) { v267Open(DevelopUgandaCameraActivity::class.java) }'
          if old_safe_cam not in hub:
              raise SystemExit('FIX2: safe-home camera route not found')
          hub = hub.replace(old_safe_cam, new_safe_cam, 1)

          # 4) RETRY stays on SAFE HOME if full home construction still fails.
          retry_start = hub.find('        page.addView(v267ActionButton("RETRY FULL HOME", gold) {')
          retry_end = hub.find('\n        page.addView(v267ActionButton("SHOW LAST CRASH REPORT", violet) {', retry_start)
          if retry_start < 0 or retry_end < 0:
              raise SystemExit('FIX2: safe-home retry block boundaries not found')
          old_retry = hub[retry_start:retry_end]
          if 'setContentView(buildHome())' not in old_retry:
              raise SystemExit('FIX2: safe-home retry signature changed unexpectedly')
          new_retry = '''        page.addView(v267ActionButton("RETRY FULL HOME", gold) {
              runCatching { buildHome() }
                  .onSuccess { setContentView(it) }
                  .onFailure {
                      DevelopUgandaV28012RuntimeGuard.recordUiFault(this@DevelopUgandaGeneralHubActivity, "SAFE HOME RETRY", it)
                      setContentView(buildV28012SafeRecoveryHome(it))
                  }
          }, LinearLayout.LayoutParams(ViewGroup.LayoutParams.MATCH_PARENT, dp(50)).apply { topMargin = dp(8) })
          '''
          hub = hub[:retry_start] + new_retry + hub[retry_end:]

          # 5) Catch any synchronous exception thrown by ANY first-page touch path,
          # including legacy cards that do not use v267ActionButton.
          touch_anchor = '''    override fun onCreate(savedInstanceState: Bundle?) {
          '''
          touch_guard = '''    override fun dispatchTouchEvent(ev: MotionEvent): Boolean {
              return try {
                  super.dispatchTouchEvent(ev)
              } catch (t: Throwable) {
                  DevelopUgandaV28012RuntimeGuard.recordUiFault(this, "TOUCH DISPATCH", t)
                  Toast.makeText(this, "ACTION BLOCKED • ${t.javaClass.simpleName}", Toast.LENGTH_SHORT).show()
                  true
              }
          }

              override fun onCreate(savedInstanceState: Bundle?) {
          '''
          if touch_anchor not in hub:
              raise SystemExit('FIX2: onCreate anchor for global touch guard missing')
          hub = hub.replace(touch_anchor, touch_guard, 1)

          # 6) Remove two more interpolation-before-format hazards that can
          # surface with restored/edited project or workflow preference text.
          old_vault = '        addView(text("${c.project} • ${c.camera} • S%03d T%03d".format(Locale.US, c.scene, c.take), 8.3f, cyan, true).apply { setPadding(0, dp(3), 0, 0) })'
          new_vault = '''        val sceneCode = c.scene.coerceIn(0, 999).toString().padStart(3, '0')
          val takeCode = c.take.coerceIn(0, 999).toString().padStart(3, '0')
          addView(text("${c.project} • ${c.camera} • S$sceneCode T$takeCode", 8.3f, cyan, true).apply { setPadding(0, dp(3), 0, 0) })'''
          if old_vault not in vault:
              raise SystemExit('FIX2: V274 vault dynamic format line not found')
          vault = vault.replace(old_vault, new_vault, 1)

          old_memory = '        return "SHOT MEMORY %02d • MATCH ${matchScore(context)}%% • $profile • $shot • $output".format(Locale.US, count.coerceAtMost(99))'
          new_memory = '''        val memoryCode = count.coerceIn(0, 99).toString().padStart(2, '0')
          return "SHOT MEMORY $memoryCode • MATCH ${matchScore(context)}% • $profile • $shot • $output"'''
          if old_memory not in live_workflow:
              raise SystemExit('FIX2: V278 shot-memory dynamic format line not found')
          live_workflow = live_workflow.replace(old_memory, new_memory, 1)

          # 7) Version bump.
          if 'versionCode = 28121' not in gradle:
              raise SystemExit('FIX2: expected FIX1 versionCode missing')
          gradle = gradle.replace('versionCode = 28121', 'versionCode = 28122', 1)
          if 'versionName = "280.12.1-runtime-stability-safe-actions"' not in gradle:
              raise SystemExit('FIX2: expected FIX1 versionName missing')
          gradle = gradle.replace(
              'versionName = "280.12.1-runtime-stability-safe-actions"',
              'versionName = "280.12.2-format-crash-all-button-guard"',
              1
          )

          hub_path.write_text(hub, encoding='utf-8')
          console_path.write_text(console, encoding='utf-8')
          gradle_path.write_text(gradle, encoding='utf-8')
          vault_path.write_text(vault, encoding='utf-8')
          live_workflow_path.write_text(live_workflow, encoding='utf-8')

          # Phone-targeted source audit.
          if 'S%03d T%03d | MIC' in console:
              raise SystemExit('FIX2: unsafe formatted ribbon still present')
          if '.format(Locale.US, snapshot.scene, snapshot.take)' in console:
              raise SystemExit('FIX2: unsafe statusRibbon format call still present')
          if "padStart(3, '0')" not in console:
              raise SystemExit('FIX2: safe scene/take padding missing')
          if 'v28012SafeUi("BUTTON • $label")' not in hub:
              raise SystemExit('FIX2: all-button synchronous guard missing')
          if 'OPEN CORE CAMERA' not in hub:
              raise SystemExit('FIX2: safe core camera recovery route missing')
          if 'override fun dispatchTouchEvent(ev: MotionEvent): Boolean' not in hub:
              raise SystemExit('FIX2: global first-page touch guard missing')
          if 'TOUCH DISPATCH' not in hub:
              raise SystemExit('FIX2: touch fault journal label missing')
          if '${c.project} • ${c.camera} • S%03d T%03d'.replace('\n','') in vault:
              raise SystemExit('FIX2: V274 interpolation-before-format hazard still present')
          if 'SHOT MEMORY %02d • MATCH ${matchScore(context)}%%' in live_workflow:
              raise SystemExit('FIX2: V278 interpolation-before-format hazard still present')

          audit = root / 'V280-12-FIX2-PHONE-CRASH-AUDIT.txt'
          audit.write_text(
              '\n'.join([
                  'DEVELOP.UGANDA V280/12 FIX2 • FORMAT CRASH + ALL BUTTON GUARD',
                  '',
                  'PHONE EVIDENCE',
                  'PASS • targeted UnknownFormatConversionException from SAFE HOME screenshot',
                  'PASS • removed String.format from percent-bearing live status ribbon',
                  'PASS • scene/take are padded without formatter conversion syntax',
                  '',
                  'BUTTON SAFETY',
                  'PASS • every V267/V28012 first-page action button is wrapped in v28012SafeUi',
                  'PASS • General Hub dispatchTouchEvent guards legacy and direct first-page click paths',
                  'PASS • SAFE HOME recovery camera now opens core DevelopUgandaCameraActivity',
                  'PASS • SAFE HOME retry builds completely before replacing the current view',
                  'PASS • failed retry returns to SAFE HOME with the new exception recorded',
                  '',
                  'PRESERVATION',
                  'PASS • V280/9 CameraX audio and V276/V272 recording safety source unchanged',
                  'PASS • V280/11 preservation master remains upstream of this runtime-only fix',
              ]) + '\n',
              encoding='utf-8'
          )
          print('PASS: V280/12 FIX2 phone-proven format crash and button guard applied.')
          PYFIX2

