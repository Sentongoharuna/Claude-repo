              last = src.rfind("}")
              if last < 0:
                  raise SystemExit("Class end not found")
              src = src[:last] + "\n" + helper + "\n" + src[last:]

          java.write_text(src, encoding="utf-8")

          # R124 identity, while keeping applicationId/package for upgrade continuity.
          m = manifest.read_text(encoding="utf-8")
          m = m.replace("Magic Pro R116 Production Control Center", "Magic Pro R124 Pro Camera")
          manifest.write_text(m, encoding="utf-8")

          g = gradle.read_text(encoding="utf-8")
          g = re.sub(r"versionCode\s+\d+", "versionCode 400000124", g, count=1)
          g = re.sub(r"versionName\s+'[^']+'",
                     "versionName '1.0-r124-pro-camera-tiktok-engine'", g, count=1)
          gradle.write_text(g, encoding="utf-8")

          # Hard guard: these tested engine components must survive the UI rebuild.
          required = [
              "androidx.camera:camera-core",
              "androidx.camera:camera-camera2",
              "androidx.camera:camera-video",
              "androidx.media3:media3-transformer",
              "RootEncoder:library:2.7.5",
          ]
          final_g = gradle.read_text(encoding="utf-8")
          missing = [x for x in required if x not in final_g]
          if missing:
              raise SystemExit("ENGINE GUARD FAILED: " + ", ".join(missing))

          final_j = java.read_text(encoding="utf-8")
          assert "import java.io.FileOutputStream;" in final_j
          assert "private void r124InstallOrganizedCameraUi()" in final_j
          print("R124 UI injection complete; tested R116 engine foundation preserved.")
          PY

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android 36 platform
        shell: bash
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-36" "build-tools;35.0.0"

      - name: Set up Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Build R124 APK
        shell: bash
        run: |
          set -o pipefail
          cd r116
          gradle --no-daemon --stacktrace :app:assembleDebug 2>&1 | tee ../r124-build.log
          mkdir -p ../r124-output
          cp app/build/outputs/apk/debug/app-debug.apk \
             ../r124-output/Magic-Pro-R124-TikTok-Engine.apk

      - name: Upload build log if failed
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: R124-FAILED-BUILD-LOG
          path: r124-build.log
          if-no-files-found: warn

      - name: Upload R124 APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: Magic-Pro-R124-TikTok-Engine-APK
          path: r124-output/Magic-Pro-R124-TikTok-Engine.apk
          if-no-files-found: error
