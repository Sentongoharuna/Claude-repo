          private void r124InstallOrganizedCameraUi() {
              if (r124Shell != null) return;
              android.widget.FrameLayout content =
                      (android.widget.FrameLayout)findViewById(android.R.id.content);
              if (content == null || content.getChildCount() == 0) return;

              r124Legacy.clear();
              r124Collect(content);

              // Keep the already-bound PreviewView. Camera/encoder logic stays untouched.
              androidx.camera.view.PreviewView preview = r124Preview(content);
              if (preview != null) {
                  android.view.ViewParent par = preview.getParent();
                  if (par instanceof android.view.ViewGroup)
                      ((android.view.ViewGroup)par).removeView(preview);
                  content.removeAllViews();
                  content.addView(preview, new android.widget.FrameLayout.LayoutParams(
                          android.view.ViewGroup.LayoutParams.MATCH_PARENT,
                          android.view.ViewGroup.LayoutParams.MATCH_PARENT));
              }

              r124Shell = new android.widget.FrameLayout(this);
              content.addView(r124Shell, new android.widget.FrameLayout.LayoutParams(
                      android.view.ViewGroup.LayoutParams.MATCH_PARENT,
                      android.view.ViewGroup.LayoutParams.MATCH_PARENT));

              // R124 TOP BAR — only the three requested centered buttons.
              // No MAGIC PRO text. No extra status bar. No other UI changes.
              android.widget.LinearLayout top = new android.widget.LinearLayout(this);
              top.setOrientation(android.widget.LinearLayout.HORIZONTAL);
              top.setGravity(android.view.Gravity.CENTER);
              top.setPadding(r124Dp(12), r124Dp(6), r124Dp(12), r124Dp(6));
              top.setBackgroundColor(android.graphics.Color.TRANSPARENT);

              android.widget.TextView proCam = r124Label("PRO CAM", 10.5f);
              proCam.setTypeface(android.graphics.Typeface.DEFAULT_BOLD);
              proCam.setBackground(r124Background(0xE51A2028, 18, 0xFF9BD6FF, 1));
              proCam.setOnClickListener(v -> r124Show("PRO"));

              android.widget.TextView liveCam = r124Label("LIVE CAM", 10.5f);
              liveCam.setTypeface(android.graphics.Typeface.DEFAULT_BOLD);
              liveCam.setBackground(r124Background(0xE51A2028, 18, 0xFF9BD6FF, 1));
              liveCam.setOnClickListener(v -> r124Show("LIVE"));

              android.widget.TextView settingsTop = r124Label("SETTINGS", 10.5f);
              settingsTop.setTypeface(android.graphics.Typeface.DEFAULT_BOLD);
              settingsTop.setBackground(r124Background(0xE51A2028, 18, 0xFF9BD6FF, 1));
              settingsTop.setOnClickListener(v -> r124Show("SETTINGS"));

              android.widget.LinearLayout.LayoutParams proP =
                      new android.widget.LinearLayout.LayoutParams(r124Dp(104), r124Dp(44));
              proP.setMargins(r124Dp(5), 0, r124Dp(5), 0);
              android.widget.LinearLayout.LayoutParams liveP =
                      new android.widget.LinearLayout.LayoutParams(r124Dp(104), r124Dp(44));
              liveP.setMargins(r124Dp(5), 0, r124Dp(5), 0);
              android.widget.LinearLayout.LayoutParams setP =
                      new android.widget.LinearLayout.LayoutParams(r124Dp(104), r124Dp(44));
              setP.setMargins(r124Dp(5), 0, r124Dp(5), 0);

              top.addView(proCam, proP);
              top.addView(liveCam, liveP);
              top.addView(settingsTop, setP);

              android.widget.FrameLayout.LayoutParams topP =
                      new android.widget.FrameLayout.LayoutParams(
                              android.view.ViewGroup.LayoutParams.MATCH_PARENT, r124Dp(58),
                              android.view.Gravity.TOP);
              topP.topMargin = r124Dp(6);
              r124Shell.addView(top, topP);

              // R124 FUNCTIONAL ACTION CENTER
              // Every top/bottom/action button routes to a real panel or an existing engine action.
              android.widget.TextView actionBtn = r124Label("ACTION +", 10.5f);
              actionBtn.setTypeface(android.graphics.Typeface.DEFAULT_BOLD);
              actionBtn.setBackground(r124Background(0xE51A2028, 18, 0xFF9BD6FF, 1));

              android.widget.FrameLayout.LayoutParams actionP =
                      new android.widget.FrameLayout.LayoutParams(
                              r124Dp(116), r124Dp(44),
                              android.view.Gravity.TOP | android.view.Gravity.CENTER_HORIZONTAL);
              actionP.topMargin = r124Dp(68);
              r124Shell.addView(actionBtn, actionP);

