name: Build Magic Pro R124 Pro Cam ISO Control

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/R124-PRO-CAM-ISO-CONTROL-NO-HOME-BUTTONS.yml'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install YAML parser
        run: python -m pip install --disable-pip-version-check pyyaml

      - name: Recreate exact tested R116 engine
        shell: bash
        run: |
          set -euo pipefail
          python <<'PY'
          from pathlib import Path
          import yaml

          source = Path(".github/workflows/R116-PRODUCTION-CONTROL-CENTER-FIX3-APK.yml")
          if not source.exists():
              raise SystemExit("Missing R116 FIX3 tested-engine workflow")

          wf = yaml.safe_load(source.read_text(encoding="utf-8"))
          step = next((s for s in wf["jobs"]["build"]["steps"]
                       if s.get("name") == "Create R116 Android project"), None)
          if not step or not step.get("run"):
              raise SystemExit("R116 project generator not found")

          Path("/tmp/r116-engine.sh").write_text(step["run"], encoding="utf-8")
          print("Using the exact R116 project generator as the R124 engine foundation.")
          PY

          bash /tmp/r116-engine.sh
          test -f r116/app/src/main/java/com/sentongoharuna/ducamera/R116MagicProProductionControlActivity.java

      - name: Rebuild only the presentation layer as R124
        shell: bash
        run: |
          set -euo pipefail
          python <<'PY'
          from pathlib import Path
          import re

          java = Path("r116/app/src/main/java/com/sentongoharuna/ducamera/R116MagicProProductionControlActivity.java")
          manifest = Path("r116/app/src/main/AndroidManifest.xml")
          gradle = Path("r116/app/build.gradle")
          src = java.read_text(encoding="utf-8")

          # Known R116 FIX3 compilation repair. No engine behavior is changed.
          if "import java.io.FileOutputStream;" not in src:
              anchor = "import java.io.PrintWriter;"
              if anchor in src:
                  src = src.replace(anchor, anchor + "\nimport java.io.FileOutputStream;", 1)
              else:
                  p = src.find("\n", src.find("package "))
                  src = src[:p+1] + "import java.io.FileOutputStream;\n" + src[p+1:]

          def method_end(text, method_name):
              m = re.search(r'\bvoid\s+' + re.escape(method_name) + r'\s*\([^)]*\)\s*\{', text)
              if not m:
                  return None
              start = text.find("{", m.start())
              depth = 0
              mode = "code"
              i = start
              while i < len(text):
                  c = text[i]
                  n = text[i+1] if i + 1 < len(text) else ""
                  if mode == "code":
                      if c == '"': mode = "str"
                      elif c == "'": mode = "chr"
                      elif c == "/" and n == "/": mode = "line"; i += 1
                      elif c == "/" and n == "*": mode = "block"; i += 1
                      elif c == "{": depth += 1
                      elif c == "}":
                          depth -= 1
                          if depth == 0: return i
                  elif mode == "str":
                      if c == "\\": i += 1
                      elif c == '"': mode = "code"
                  elif mode == "chr":
                      if c == "\\": i += 1
                      elif c == "'": mode = "code"
                  elif mode == "line":
                      if c == "\n": mode = "code"
                  elif mode == "block":
                      if c == "*" and n == "/": mode = "code"; i += 1
                  i += 1
              return None

          # Install R124 after the existing R116 initialization has completed.
          if "r124InstallOrganizedCameraUi();" not in src:
              end = method_end(src, "onCreate")
              if end is None:
                  raise SystemExit("Could not safely locate onCreate()")
              call = '''
                  new android.os.Handler(android.os.Looper.getMainLooper()).postDelayed(
                          () -> r124InstallOrganizedCameraUi(), 450L);
              '''
              src = src[:end] + call + src[end:]

          if "private void r124InstallOrganizedCameraUi()" not in src:
              helper = r'''
          // ================================================================
          // MAGIC PRO R124 — ORGANIZED UI OVER THE TESTED R116 ENGINE
          // ================================================================
          private final java.util.ArrayList<android.view.View> r124Legacy =
                  new java.util.ArrayList<>();
          private android.widget.FrameLayout r124Shell;
          private android.widget.ScrollView r124Sheet;
          private android.widget.LinearLayout r124SheetBody;
          private android.widget.TextView r124Mode;

          private int r124Dp(float n) {
              return Math.round(n * getResources().getDisplayMetrics().density);
          }

          private android.graphics.drawable.GradientDrawable r124Background(
                  int fill, float radius, int stroke, int strokeWidth) {
              android.graphics.drawable.GradientDrawable g =
                      new android.graphics.drawable.GradientDrawable();
              g.setColor(fill);
              g.setCornerRadius(r124Dp(radius));
              if (strokeWidth > 0) g.setStroke(r124Dp(strokeWidth), stroke);
              return g;
          }

          private android.widget.TextView r124Label(String text, float sp) {
              android.widget.TextView v = new android.widget.TextView(this);
              v.setText(text);
              v.setTextColor(android.graphics.Color.WHITE);
              v.setTextSize(sp);
              v.setGravity(android.view.Gravity.CENTER);
              v.setPadding(r124Dp(8), r124Dp(8), r124Dp(8), r124Dp(8));
              v.setMinHeight(r124Dp(44));
              return v;
          }

          private String r124Norm(String s) {
              return s == null ? "" :
                      s.toUpperCase(java.util.Locale.US).replace("\n", " ")
                       .replaceAll("\\s+", " ").trim();
          }

          private void r124Collect(android.view.View v) {
              if (v == null) return;
              if (v instanceof android.widget.TextView && v.hasOnClickListeners()) {
                  CharSequence t = ((android.widget.TextView) v).getText();
                  if (t != null && t.length() > 0) r124Legacy.add(v);
              }
              if (v instanceof android.view.ViewGroup) {
                  android.view.ViewGroup g = (android.view.ViewGroup) v;
                  for (int i = 0; i < g.getChildCount(); i++) r124Collect(g.getChildAt(i));
              }
          }

          private androidx.camera.view.PreviewView r124Preview(android.view.View v) {
              if (v instanceof androidx.camera.view.PreviewView)
                  return (androidx.camera.view.PreviewView) v;
              if (v instanceof android.view.ViewGroup) {
                  android.view.ViewGroup g = (android.view.ViewGroup) v;
                  for (int i = 0; i < g.getChildCount(); i++) {
                      androidx.camera.view.PreviewView p = r124Preview(g.getChildAt(i));
                      if (p != null) return p;
                  }
              }
              return null;
          }

          private boolean r124Matches(android.view.View v, String... keys) {
              if (!(v instanceof android.widget.TextView) || !v.hasOnClickListeners()) return false;
              String text = r124Norm(((android.widget.TextView) v).getText().toString());
              for (String key : keys) {
                  String k = r124Norm(key);
                  if (!k.isEmpty() && (text.equals(k) || text.startsWith(k + " ") || text.contains(k)))
                      return true;
              }
              return false;
          }

          private boolean r124Has(String... keys) {
              for (android.view.View v : r124Legacy) if (r124Matches(v, keys)) return true;
              return false;
          }

          private boolean r124Click(String... keys) {
              java.util.ArrayList<android.view.View> matches = new java.util.ArrayList<>();
              for (android.view.View v : r124Legacy) if (r124Matches(v, keys)) matches.add(v);
              java.util.Collections.sort(matches, (a, b) ->
                      Integer.compare(((android.widget.TextView)a).getText().length(),
                                      ((android.widget.TextView)b).getText().length()));
              for (android.view.View v : matches) if (v.performClick()) return true;
              return false;
          }

          private android.widget.TextView r124Action(String label, String... keys) {
              if (!r124Has(keys)) return null; // no fake unsupported controls
              android.widget.TextView b = r124Label(label, 11f);
              b.setTypeface(android.graphics.Typeface.DEFAULT_BOLD);
              b.setBackground(r124Background(0xD91A2028, 11, 0x66586575, 1));
              b.setOnClickListener(v -> {
                  boolean handled = r124Click(keys);
                  if ("ISO".equals(label) && handled) {
                      // R124: ISO uses the already-built engine action.
                      // Feedback is temporary text only; no new home-screen control is added.
                      android.widget.Toast.makeText(
                              this, "ISO CONTROL", android.widget.Toast.LENGTH_SHORT).show();
                  } else if (!handled) {
                      android.widget.Toast.makeText(
                              this, label + " unavailable", android.widget.Toast.LENGTH_SHORT).show();
                  }
              });
              return b;
          }

          private android.widget.LinearLayout r124Row() {
              android.widget.LinearLayout r = new android.widget.LinearLayout(this);
              r.setOrientation(android.widget.LinearLayout.HORIZONTAL);
              r.setGravity(android.view.Gravity.CENTER);
              return r;
          }

          private void r124Put(android.widget.LinearLayout row, String label, String... keys) {
              android.widget.TextView b = r124Action(label, keys);
              if (b == null) return;
              android.widget.LinearLayout.LayoutParams lp =
                      new android.widget.LinearLayout.LayoutParams(0, r124Dp(46), 1f);
              lp.setMargins(r124Dp(3), r124Dp(3), r124Dp(3), r124Dp(3));
              row.addView(b, lp);
          }

          private void r124Section(String title) {
              android.widget.TextView h = r124Label(title, 11f);
              h.setGravity(android.view.Gravity.START | android.view.Gravity.CENTER_VERTICAL);
              h.setTextColor(0xFFAFC5DB);
              h.setTypeface(android.graphics.Typeface.DEFAULT_BOLD);
              android.widget.LinearLayout.LayoutParams p =
                      new android.widget.LinearLayout.LayoutParams(
                              android.view.ViewGroup.LayoutParams.MATCH_PARENT, r124Dp(38));
              p.topMargin = r124Dp(5);
              r124SheetBody.addView(h, p);
          }

          private void r124AddRow(Object[][] items) {
              android.widget.LinearLayout row = r124Row();
              for (Object[] item : items) {
                  String label = (String)item[0];
                  String[] keys = (String[])item[1];
                  r124Put(row, label, keys);
              }
              if (row.getChildCount() > 0) r124SheetBody.addView(row);
          }

          private void r124CloseButton() {
              android.widget.TextView c = r124Label("CLOSE PANEL", 11f);
              c.setTypeface(android.graphics.Typeface.DEFAULT_BOLD);
              c.setBackground(r124Background(0xEE252C35, 11, 0x66798798, 1));
              c.setOnClickListener(v -> r124Sheet.setVisibility(android.view.View.GONE));
              android.widget.LinearLayout.LayoutParams p =
                      new android.widget.LinearLayout.LayoutParams(
                              android.view.ViewGroup.LayoutParams.MATCH_PARENT, r124Dp(48));
              p.setMargins(0, r124Dp(10), 0, r124Dp(4));
              r124SheetBody.addView(c, p);
          }

