      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android packages
        shell: bash
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-36" "build-tools;35.0.0"

      - name: Set up Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Build R117 APK
        shell: bash
        run: |
          set -o pipefail
          cd r116
          gradle --no-daemon --stacktrace assembleDebug 2>&1 | tee ../r117-build.log

      - name: Upload failed build log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: R117-FAILED-BUILD-LOG
          path: r117-build.log

      - name: Collect APK
        if: success()
        shell: bash
        run: |
          mkdir -p out
          cp r116/app/build/outputs/apk/debug/app-debug.apk out/Magic-Pro-R117-Pro-Camera.apk

      - name: Upload R117 APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: Magic-Pro-R117-Pro-Camera-APK
          path: out/Magic-Pro-R117-Pro-Camera.apk
