              private void control(LinearLayout p,String text,Runnable r){Button b=button(text);b.setGravity(Gravity.START|Gravity.CENTER_VERTICAL);b.setPadding(dp(16),0,dp(10),0);b.setOnClickListener(v->r.run());LinearLayout.LayoutParams q=new LinearLayout.LayoutParams(-1,dp(54));q.setMargins(0,dp(3),0,dp(3));p.addView(b,q);}
