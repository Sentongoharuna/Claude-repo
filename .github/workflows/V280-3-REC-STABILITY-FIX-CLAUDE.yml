          python3 - <<'PY'
          from pathlib import Path
          import re, subprocess, os, sys, tempfile

          recipe = Path('/tmp/v280fresh/V280-1-PRO-CAM.yml')
          lines = recipe.read_text(encoding='utf-8').splitlines()

          pre_steps = [
              'Restore cumulative V270 base',
              'Apply cumulative V271 V272 V273 V274 source patch',
              'Apply V275 control surface + dual settings patch',
              'Apply V276 recording safety + recovery patch',
              'Apply V277 lighting + exposure intelligence overlay',
              'Verify V277 preservation and version',
              'Apply V278 live workflow home overlay',
              'Apply V279 active shooting intelligence overlay',
              'Apply V280 Smart Director + sequence coverage overlay',
              'Verify V280 preservation and Smart Director integration',
          ]
          post_steps = [
              'Install Android platform',
              'Build V280 APK',
              'Prepare V280 APK',
          ]

          def indent(s):
              return len(s) - len(s.lstrip(' '))

          steps = {}
          i = 0
          while i < len(lines):
              m = re.match(r'^(\s*)- name:\s*(.+?)\s*$', lines[i])
              if not m:
                  i += 1
                  continue
              step_indent = len(m.group(1))
              name = m.group(2).strip('"\'')
              wd = None
              script = None
              j = i + 1
              while j < len(lines):
                  if re.match(r'^\s*- name:', lines[j]) and indent(lines[j]) == step_indent:
                      break
                  stripped = lines[j].strip()
                  if stripped.startswith('working-directory:'):
                      wd = stripped.split(':', 1)[1].strip().strip('"\'')
                  runm = re.match(r'^(\s*)run:\s*\|[-+]?\s*$', lines[j])
                  if runm:
                      run_indent = len(runm.group(1))
                      k = j + 1
                      block = []
                      content_indent = None
                      while k < len(lines):
                          ln = lines[k]
                          if ln.strip() and indent(ln) <= run_indent:
                              break
                          if ln.strip() and content_indent is None:
                              content_indent = indent(ln)
                          if content_indent is None:
                              block.append('')
                          else:
                              block.append(ln[content_indent:] if len(ln) >= content_indent else '')
                          k += 1
                      script = '\n'.join(block) + '\n'
                      j = k
                      continue
                  inline_run = re.match(r'^\s*run:\s*(.+?)\s*$', lines[j])
                  if inline_run:
                      script = inline_run.group(1) + '\n'
                  j += 1
              steps[name] = (wd, script)
              i = j

          required = pre_steps + post_steps
          missing = [n for n in required if n not in steps or not steps[n][1]]
          if missing:
              raise SystemExit('Missing recipe steps: ' + ', '.join(missing))

          root = Path.cwd()

          def run_step(name):
              wd, script = steps[name]
              print(f'\n===== V280-3 STEP: {name} =====', flush=True)
              work = (root / wd).resolve() if wd else root
              if not work.exists():
                  raise SystemExit(f'Working directory does not exist for {name}: {work}')
              with tempfile.NamedTemporaryFile('w', suffix='.sh', delete=False, encoding='utf-8') as f:
                  f.write(script)
                  p = f.name
              try:
                  r = subprocess.run(['bash', p], cwd=str(work), env=os.environ.copy())
              finally:
                  Path(p).unlink(missing_ok=True)
              if r.returncode != 0:
                  Path('/tmp/v280fresh/failed-step.txt').write_text(name, encoding='utf-8')
                  sys.exit(r.returncode)

          for n in pre_steps:
              run_step(n)

          # Replace only the CameraActivity with the exact V280/3 hardened version.
          camera_dst = root / 'v172-source/app/src/main/java/com/sentongoharuna/pulse/DevelopUgandaCameraActivity.kt'
          camera_src = Path('/tmp/v280fresh/DevelopUgandaCameraActivity-V280-3.kt')
          camera_dst.write_bytes(camera_src.read_bytes())

          build_file = root / 'v172-source/app/build.gradle.kts'
          b = build_file.read_text(encoding='utf-8')
          if 'versionCode = 28000' not in b or 'versionName = "280.0-smart-director-mode"' not in b:
              raise SystemExit('Unexpected V280 version block before V280/3 hotfix.')
          b = b.replace('versionCode = 28000', 'versionCode = 28030', 1)
          b = b.replace(
              'versionName = "280.0-smart-director-mode"',
              'versionName = "280.3-recording-stability"',
              1
          )
          build_file.write_text(b, encoding='utf-8')

          check = camera_dst.read_text(encoding='utf-8')
          must_have = [
              'V280/3: REC must stay alive even if an auxiliary feature fails.',
              'Intentionally no TextToSpeech here',
              'Recording failed • recovering camera',
              'runCatching { v276SetRecordingControlLock(true) }',
          ]
          for marker in must_have:
              if marker not in check:
                  raise SystemExit('V280/3 camera hotfix marker missing: ' + marker)

          start_marker = '                is VideoRecordEvent.Start -> {'
          status_marker = '                is VideoRecordEvent.Status -> {'
          start_pos = check.index(start_marker)
          status_pos = check.index(status_marker, start_pos)
          start_branch = check[start_pos:status_pos]
          if 'DevelopUgandaV271LiveCoach.speak(this, "Recording")' in start_branch:
              raise SystemExit('V280/3 failed: recording TTS still exists in Start branch.')
          if 'enforceFullFramePreview()' in start_branch or 'enforceImmersiveCameraWindow()' in start_branch:
              raise SystemExit('V280/3 failed: camera/window reconfiguration still exists in Start branch.')

          print('\nPASS: exact V280/3 recording stability source installed.', flush=True)

          for n in post_steps:
              run_step(n)

          print('\nPASS: V280-3 recording stability build recipe completed successfully.', flush=True)
          PY

          cp DEVELOP-UGANDA-V280-1-PRO-CAM.apk DEVELOP-UGANDA-V280-3-REC-STABILITY.apk

      - name: Show V280 compiler errors if build fails
        if: failure()
        shell: bash
        run: |
          echo "Failed step: $(cat /tmp/v280fresh/failed-step.txt 2>/dev/null || echo unknown)"
          if [ -f v172-source/v280-build.log ]; then
            grep -Ein '(^e:|error:|unresolved reference|overload resolution ambiguity|expecting|type mismatch|cannot infer|FAILURE:)' v172-source/v280-build.log | head -5000 || true
          fi

      - name: Upload V280-1 APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: DEVELOP-UGANDA-V280-3-REC-STABILITY
          path: DEVELOP-UGANDA-V280-3-REC-STABILITY.apk
          if-no-files-found: error
          retention-days: 14

      - name: Upload build log if failed
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: V280-3-REC-STABILITY-BUILD-LOG
          path: |
            v172-source/v280-build.log
            /tmp/v280fresh/failed-step.txt
          if-no-files-found: warn
          retention-days: 7
