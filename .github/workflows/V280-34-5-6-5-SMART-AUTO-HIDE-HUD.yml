name: Build develop.uganda V280-34.5.6.5 SMART AUTO-HIDE HUD + APK

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/V280-34-5-6-5-SMART-AUTO-HIDE-HUD.yml'

permissions:
  contents: read

jobs:
  build_v280_34_5_6_5:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout Claude repo
        uses: actions/checkout@v4

      - name: Replay proven V280-33.4.5.4 clean HUD source
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PYREPLAY'
          from pathlib import Path
          import os, re, subprocess, tempfile

          recipe = Path('.github/workflows/V280-33-4-5-4-CLEAN-CINEMA-HUD.yml')
          lines = recipe.read_text(encoding='utf-8').splitlines()
          wanted = [
              'Replay proven V280-31.4 FIX1 source pipeline',
              'Apply V280-33.4.5.4 clean cinema HUD overlay',
              'Verify V280-33.4.5.4 clean cinema HUD contract',
          ]

          def indent(s):
              return len(s) - len(s.lstrip(' '))

          steps = {}
          i = 0
          while i < len(lines):
              m = re.match(r'^(\s*)- name:\s*(.+?)\s*$', lines[i])
              if not m:
                  i += 1
                  continue
              step_indent = len(m.group(1))
              name = m.group(2)
              end = len(lines)
              for k in range(i + 1, len(lines)):
                  mm = re.match(r'^(\s*)- name:\s*(.+?)\s*$', lines[k])
                  if mm and len(mm.group(1)) == step_indent:
                      end = k
                      break

              wd = None
              script = None
              for k in range(i + 1, end):
                  s = lines[k].strip()
                  if s.startswith('working-directory:'):
                      wd = s.split(':', 1)[1].strip().strip("'\"")
                  if s == 'run: |':
                      run_indent = indent(lines[k])
                      content_indent = run_indent + 2
                      block = []
                      for q in range(k + 1, end):
                          ln = lines[q]
                          if not ln.strip():
                              block.append('')
                              continue
                          if indent(ln) <= run_indent:
                              break
                          block.append(ln[content_indent:] if len(ln) >= content_indent else '')
                      script = '\n'.join(block) + '\n'
                      break
              steps[name] = (wd, script)
              i = end

          missing = [n for n in wanted if n not in steps or not steps[n][1]]
          if missing:
              raise SystemExit('Missing V280-33 replay steps: ' + ', '.join(missing))

          root = Path.cwd()
          for name in wanted:
              wd, script = steps[name]
              print(f'\n===== V280-34 BASE: {name} =====', flush=True)
              work = (root / wd).resolve() if wd else root
              if wd and not work.exists():
                  work.mkdir(parents=True, exist_ok=True)
              with tempfile.NamedTemporaryFile('w', suffix='.sh', delete=False, encoding='utf-8') as f:
                  f.write(script)
                  tmp = f.name
              try:
                  r = subprocess.run(['bash', tmp], cwd=str(work), env=os.environ.copy())
              finally:
                  Path(tmp).unlink(missing_ok=True)
              if r.returncode:
                  raise SystemExit(r.returncode)

          print('PASS: V280-33.4.5.4 clean HUD source replayed.')
          PYREPLAY

      - name: Apply V280-34.5.6.5 compact smart auto-hide refinement
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY34565'
          from pathlib import Path
          import re

          p = Path('v172-source/app/src/main/java/com/sentongoharuna/pulse/DevelopUgandaV28033454CleanHudProvider.kt')
          s = p.read_text(encoding='utf-8')

          # New version tag.
          s = s.replace(
              'private const val TAG = "V28033454_CLEAN_HUD"',
              'private const val TAG = "V28034565_SMART_AUTO_HIDE_HUD"',
              1
          )

          # Keep one solid amber/gold control family like the approved ASPECT button.
          s = s.replace('setStroke(dp(activity, 1), 0x664C5968)', 'setStroke(dp(activity, 1), ACCENT)')

          # Make the right rail and bottom bar smaller.
          s = s.replace(
              'FrameLayout.LayoutParams(dp(activity, 82), ViewGroup.LayoutParams.WRAP_CONTENT)',
              'FrameLayout.LayoutParams(dp(activity, 72), ViewGroup.LayoutParams.WRAP_CONTENT)',
              1
          )
          s = s.replace('railAdd(rec, 72)', 'railAdd(rec, 64)', 1)
          s = s.replace('railAdd(afae, 58)', 'railAdd(afae, 48)', 1)
          s = s.replace('railAdd(lens, 58)', 'railAdd(lens, 48)', 1)
          s = s.replace('railAdd(more, 58)', 'railAdd(more, 48)', 1)
          s = s.replace(
              'FrameLayout.LayoutParams(ViewGroup.LayoutParams.MATCH_PARENT, dp(activity, 66))',
              'FrameLayout.LayoutParams(ViewGroup.LayoutParams.MATCH_PARENT, dp(activity, 56))',
              1
          )

          # Stronger red recorder pulse while keeping REC permanently visible.
          s = s.replace(
              'rec.animate().alpha(if (bright) 1f else 0.58f).setDuration(330).start()',
              'rec.animate().alpha(if (bright) 1f else 0.40f).scaleX(if (bright) 1.06f else 1f).scaleY(if (bright) 1.06f else 1f).setDuration(330).start()',
              1
          )

          # Add smart fading of secondary controls after inactivity.
          needle = '''                  val handler = Handler(Looper.getMainLooper())
                  var recording = false'''
          repl = '''                  val handler = Handler(Looper.getMainLooper())

                  val revealSecondary = Runnable {
                      afae.animate().cancel()
                      lens.animate().cancel()
                      more.animate().cancel()
                      bottom.animate().cancel()
                      afae.alpha = 1f
                      lens.alpha = 1f
                      more.alpha = 1f
                      bottom.alpha = 1f
                  }

                  val fadeSecondary = Runnable {
                      if (rightMore.visibility != View.VISIBLE && bottomMore.visibility != View.VISIBLE) {
                          afae.animate().alpha(0.22f).setDuration(220).start()
                          lens.animate().alpha(0.22f).setDuration(220).start()
                          more.animate().alpha(0.34f).setDuration(220).start()
                          bottom.animate().alpha(0.18f).setDuration(220).start()
                      }
                  }

                  fun scheduleSecondaryFade(delayMs: Long = 2800L) {
                      handler.removeCallbacks(fadeSecondary)
                      handler.postDelayed(fadeSecondary, delayMs)
                  }

                  var recording = false'''
          if needle not in s:
              raise SystemExit('Auto-hide insertion anchor missing')
          s = s.replace(needle, repl, 1)

          # Reveal when user reaches for More / bottom More / REC.
          old_more = '''                  more.setOnClickListener {
                      rightMore.visibility = if (rightMore.visibility == View.VISIBLE) View.GONE else View.VISIBLE
                  }'''
          new_more = '''                  more.setOnClickListener {
                      revealSecondary.run()
                      rightMore.visibility = if (rightMore.visibility == View.VISIBLE) View.GONE else View.VISIBLE
                      scheduleSecondaryFade(4500L)
                  }'''
          if old_more not in s:
              raise SystemExit('Right MORE click anchor missing')
          s = s.replace(old_more, new_more, 1)

          old_bottom_more = '''                  moreControls.setOnClickListener {
                      bottomMore.visibility = if (bottomMore.visibility == View.VISIBLE) View.GONE else View.VISIBLE
                  }'''
          new_bottom_more = '''                  moreControls.setOnClickListener {
                      revealSecondary.run()
                      bottomMore.visibility = if (bottomMore.visibility == View.VISIBLE) View.GONE else View.VISIBLE
                      scheduleSecondaryFade(4500L)
                  }'''
          if old_bottom_more not in s:
              raise SystemExit('Bottom MORE click anchor missing')
          s = s.replace(old_bottom_more, new_bottom_more, 1)

          old_rec = '''                  rec.setOnClickListener {
                      trigger("REC")
                      recording = !recording'''
          new_rec = '''                  rec.setOnClickListener {
                      revealSecondary.run()
                      trigger("REC")
                      recording = !recording'''
          if old_rec not in s:
              raise SystemExit('REC click anchor missing')
          s = s.replace(old_rec, new_rec, 1)

          # Start with a clean camera view after a short delay.
          s = s.replace(
              '                  val pulse = object : Runnable {',
              '                  scheduleSecondaryFade()\n\n                  val pulse = object : Runnable {',
              1
          )

          # Make ASPECT explicitly 9:16 and keep the primary labels concise.
          s = s.replace('tv.text = "ASPECT • 9:16"', 'tv.text = "ASPECT\\n9:16"', 1)

          p.write_text(s, encoding='utf-8')

          gradle = Path('v172-source/app/build.gradle.kts')
          g = gradle.read_text(encoding='utf-8')
          g, n1 = re.subn(r'versionCode\s*=\s*\d+', 'versionCode = 2834565', g, count=1)
          g, n2 = re.subn(
              r'versionName\s*=\s*"[^"]+"',
              'versionName = "280.34.5.6.5-smart-auto-hide-hud"',
              g,
              count=1
          )
          if n1 != 1 or n2 != 1:
              raise SystemExit(f'Version metadata update failed: code={n1}, name={n2}')
          gradle.write_text(g, encoding='utf-8')

          print('PASS: V280/34.5.6.5 smaller one-color controls, smart fade and stronger REC glow applied.')
          PY34565

      - name: Verify V280-34.5.6.5 smart auto-hide HUD
        shell: bash
        run: |
          set -euo pipefail
          FILE='v172-source/app/src/main/java/com/sentongoharuna/pulse/DevelopUgandaV28033454CleanHudProvider.kt'
          GRADLE='v172-source/app/build.gradle.kts'

          grep -Fq 'V28034565_SMART_AUTO_HIDE_HUD' "$FILE"
          grep -Fq 'ASPECT\n9:16' "$FILE"
          grep -Fq 'FrameLayout.LayoutParams(dp(activity, 72), ViewGroup.LayoutParams.WRAP_CONTENT)' "$FILE"
          grep -Fq 'FrameLayout.LayoutParams(ViewGroup.LayoutParams.MATCH_PARENT, dp(activity, 56))' "$FILE"
          grep -Fq 'scheduleSecondaryFade' "$FILE"
          grep -Fq 'afae.animate().alpha(0.22f)' "$FILE"
          grep -Fq 'bottom.animate().alpha(0.18f)' "$FILE"
          grep -Fq 'scaleX(if (bright) 1.06f else 1f)' "$FILE"
          grep -Fq 'versionCode = 2834565' "$GRADLE"
          grep -Fq 'versionName = "280.34.5.6.5-smart-auto-hide-hud"' "$GRADLE"

          echo 'PASS: V280/34.5.6.5 compact 9:16 one-color HUD, smart auto-hide and strong red REC glow verified.'

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android platform
        shell: bash
        run: sdkmanager "platforms;android-36" "build-tools;35.0.0"

      - name: Set up Gradle 8.11.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.11.1

      - name: Build V280-34.5.6.5 APK
        working-directory: v172-source
        shell: bash
        run: |
          set -o pipefail
          gradle --no-daemon :app:assembleDebug --stacktrace 2>&1 | tee v28034565-build.log

      - name: Prepare V280-34.5.6.5 APK
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          APK='v172-source/app/build/outputs/apk/debug/app-debug.apk'
          OUT='DEVELOP-UGANDA-V280-34-5-6-5-SMART-AUTO-HIDE-HUD.apk'
          test -s "$APK"
          cp "$APK" "$OUT"
          test -s "$OUT"
          ls -lh "$OUT"
          sha256sum "$OUT"

      - name: Upload V280-34.5.6.5 APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: DEVELOP-UGANDA-V280-34-5-6-5-SMART-AUTO-HIDE-HUD
          path: DEVELOP-UGANDA-V280-34-5-6-5-SMART-AUTO-HIDE-HUD.apk
          if-no-files-found: error
          compression-level: 0
          retention-days: 14

      - name: Upload V280-34.5.6.5 build log if failed
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: V280-34-5-6-5-BUILD-LOG
          path: v172-source/v28034565-build.log
          if-no-files-found: ignore
          retention-days: 7
