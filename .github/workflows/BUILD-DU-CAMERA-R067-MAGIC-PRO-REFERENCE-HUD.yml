                  '\n                root.addView(focusMark, focusLp);'
                  '\n\n                TextView modeHud = new TextView(this);'
                  '\n                modeHud.setText("VIDEO      PHOTO      SLO-MO        CINEMA      TIME-LAPSE      MORE");'
                  '\n                modeHud.setTextColor(0xE6FFFFFF);'
