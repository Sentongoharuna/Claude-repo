                  '\n                waveBg.setCornerRadius(dp(7));'
                  '\n                waveBg.setStroke(dp(1), 0x33FFFFFF);'
                  '\n                waveHud.setBackground(waveBg);'
                  '\n                FrameLayout.LayoutParams waveLp = new FrameLayout.LayoutParams(dp(64), dp(46), Gravity.TOP | Gravity.END);'
