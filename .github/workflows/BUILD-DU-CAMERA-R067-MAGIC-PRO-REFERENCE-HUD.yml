              text = text.replace(target, cinema_overlay, 1)

          # R67 reference-HUD audit.
          assert 'button("MAGIC PRO")' in text
          assert 'HDR · LOG · HEVC' in text
          assert 'ISO\\n100' in text
          assert 'MIC\\n▮ ▮' in text
          assert 'VIDEO      PHOTO      SLO-MO' in text
          assert 'SHUTTER\\n1/100' in text

          # ------------------------------------------------------------
          # 3) COMPRESSION-SURVIVAL TUNING.
          #
          # From our original-vs-compressed test:
          # - resolution/fps survived
          # - bitrate dropped materially
          # - fine texture weakened modestly
          #
          # So: the locked R60 visual/compression master, preserved exactly while camera controls are improved.
          # No image-quality changes: preserve the exact R60 contrast, color, exposure, NR, codec and bitrate behavior.
          # ------------------------------------------------------------
          text = text.replace('new Contrast(0.035f)', 'new Contrast(0.050f)')
          text = text.replace('.adjustSaturation(2.5f)', '.adjustSaturation(3.0f)')
          text = text.replace('.adjustLightness(1.0f)', '.adjustLightness(0.75f)')

          # Keep warm RGB balance essentially unchanged, only microscopic red lift.
          text = text.replace('.setRedScale(1.008f)', '.setRedScale(1.009f)')

          # Keep the proven direct encoding target unchanged.
          # 1080p60 + HEVC + 15 Mbps remains the master delivery profile.

          new.write_text(text)
          old.unlink()

          manifest = srcdir / 'app/src/main/AndroidManifest.xml'
          manifest.write_text(
              manifest.read_text()
              .replace('.R50ReferenceTextureBalanceCameraActivity', '.R67MagicProCameraActivity')
              .replace('DU Camera R50 Texture Balance', 'DU Camera R67 Magic Pro')
          )

          gradle = srcdir / 'app/build.gradle'
          gradle.write_text(
              gradle.read_text()
              .replace('com.sentongoharuna.ducamera.r050referencetexturebalancepro', 'com.sentongoharuna.ducamera.r067magicproui')
              .replace('versionCode 400000064', 'versionCode 400000081')
              .replace("versionName '1.0-r050-reference-texture-balance-pro'", "versionName '1.0-r067-magic-pro-ui'")
          )

          settings = srcdir / 'settings.gradle'
          settings.write_text(
              settings.read_text().replace(
                  'DUCameraR050ReferenceTextureBalancePro',
                  'DUCameraR067MagicProUI'
              )
          )

          # ------------------------------------------------------------
          # 4) Guardrails: lock the R60 image engine; R67 may change controls/reliability only. R51 foundation + R54 visual checkpoint must both survive.
          # R67 deliberately does NOT inherit the experimental R55 tuning or the prior R67 20 Mbps/MINIMAL-NR changes.
          # ------------------------------------------------------------
          checks = [
              '15_000_000',
              'MediaFormat.MIMETYPE_VIDEO_HEVC',
              'QualitySelector.from(Quality.FHD)',
              'NOISE_REDUCTION_MODE_OFF',
              'TONEMAP_MODE_HIGH_QUALITY',
              'COLOR_CORRECTION_MODE_HIGH_QUALITY',
              'button("M PRO")',
              'button("GRID")',
              'new Contrast(0.050f)',
              '.adjustSaturation(3.0f)',
              '.adjustLightness(0.75f)',
              '.setRedScale(1.009f)'
          ]

          for c in checks:
              assert c in text, f'R67 audit failed: missing {c}'

          # Also ensure we did NOT add risky sharpening.
          assert 'Sharpness' not in text

          print('PASS: R67 preserves the locked R60 image engine and applies the approved Magic Pro reference HUD.')
          PY

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android platform
        shell: bash
        run: sdkmanager "platforms;android-36" "build-tools;35.0.0"

      - name: Set up Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.13

      - name: Build R067 MAGIC PRO CINEMA HUD APK
        working-directory: r50-texture
        shell: bash
        run: |
          set -o pipefail
          gradle --no-daemon :app:assembleDebug --stacktrace 2>&1 | tee r067-modern-pro-ui-build.log

      - name: Prepare APK
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          APK='r50-texture/app/build/outputs/apk/debug/app-debug.apk'
          OUT='DU-Camera-R067-MAGIC-PRO-UI.apk'
          test -s "$APK"
          cp "$APK" "$OUT"
          ls -lh "$OUT"
          sha256sum "$OUT"

      - name: Upload failed build log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: R067-CONTROLS-MASTER-FAILED-BUILD-LOG
          path: r50-texture/r067-modern-pro-ui-build.log
          if-no-files-found: warn
          retention-days: 14

      - name: Upload R067 APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: DU-Camera-R067-MAGIC-PRO-UI
          path: DU-Camera-R067-MAGIC-PRO-UI.apk
          if-no-files-found: error
          retention-days: 30
