                  '\n                waveLp.topMargin = dp(86);'
                  '\n                root.addView(waveHud, waveLp);'
                  '\n\n                TextView evHud = new TextView(this);'
                  '\n                evHud.setText("☼\\n│\\n│\\n│\\n0.0\\n│\\n│\\n│");'
                  '\n                evHud.setTextColor(0xE6FFFFFF);'
                  '\n                evHud.setTextSize(9f);'
                  '\n                evHud.setGravity(Gravity.CENTER);'
                  '\n                evHud.setTypeface(Typeface.MONOSPACE);'
                  '\n                FrameLayout.LayoutParams evLp = new FrameLayout.LayoutParams(dp(42), dp(190), Gravity.CENTER_VERTICAL | Gravity.END);'
                  '\n                evLp.rightMargin = dp(10);'
                  '\n                evLp.topMargin = dp(110);'
                  '\n                root.addView(evHud, evLp);'
                  '\n\n                TextView zoomHud = new TextView(this);'
                  '\n                zoomHud.setText("5×\\n\\n3×\\n\\n2×\\n\\n1×\\n\\n0.5×");'
                  '\n                zoomHud.setTextColor(0xE6FFFFFF);'
                  '\n                zoomHud.setTextSize(9f);'
                  '\n                zoomHud.setGravity(Gravity.CENTER);'
                  '\n                GradientDrawable zoomBg = new GradientDrawable();'
                  '\n                zoomBg.setColor(0x66050608);'
                  '\n                zoomBg.setCornerRadius(dp(22));'
