                  '\n\n                TextView waveHud = new TextView(this);'
                  '\n                waveHud.setText("〰〰");'
                  '\n                waveHud.setTextColor(0xCCFFFFFF);'
                  '\n                waveHud.setTextSize(15f);'
                  '\n                waveHud.setGravity(Gravity.CENTER);'
                  '\n                GradientDrawable waveBg = new GradientDrawable();'
