                  '\n                controlDeck.setText("ISO\\nAuto        SHUTTER\\n1/100        WB\\n5600K        FOCUS\\nAF        EV\\n0.0        LUT\\nStandard");'
                  '\n                controlDeck.setTextColor(0xE6FFFFFF);'
                  '\n                controlDeck.setTextSize(7.5f);'
                  '\n                controlDeck.setGravity(Gravity.CENTER);'
                  '\n                GradientDrawable deckBg = new GradientDrawable();'
                  '\n                deckBg.setColor(0xD9111215);'
                  '\n                deckBg.setCornerRadius(dp(16));'
                  '\n                deckBg.setStroke(dp(1), 0x33FFFFFF);'
                  '\n                controlDeck.setBackground(deckBg);'
                  '\n                FrameLayout.LayoutParams deckLp = new FrameLayout.LayoutParams(FrameLayout.LayoutParams.MATCH_PARENT, dp(62), Gravity.BOTTOM);'
                  '\n                deckLp.leftMargin = dp(6);'
