    - name: Set up Java 17
      uses: actions/setup-java@v4
      with:
        distribution: temurin
        java-version: '17'

    - name: Set up Android SDK
      uses: android-actions/setup-android@v3

    - name: Install Android platform
      shell: bash
      run: sdkmanager "platforms;android-36" "build-tools;35.0.0"

    - name: Set up Gradle 8.13
      uses: gradle/actions/setup-gradle@v4
      with:
        gradle-version: 8.13

    - name: Build R045 REFERENCE MICRO CONTRAST PRO APK
      working-directory: r45-ui-pro
      shell: bash
      run: |
        set -o pipefail
        gradle --no-daemon :app:assembleDebug --stacktrace 2>&1 | tee r043-reference-micro-contrast-pro-build.log

    - name: Prepare APK
      if: success()
      shell: bash
      run: |
        set -euo pipefail
        APK='r45-ui-pro/app/build/outputs/apk/debug/app-debug.apk'
        OUT='DU-Camera-R045-UI-PRO-PRECISION-TIMELINE.apk'
        test -s "$APK"
        cp "$APK" "$OUT"
        ls -lh "$OUT"
        sha256sum "$OUT"

    - name: Upload audit
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: R045-REFERENCE-MICRO-CONTRAST-PRO-AUDIT
        path: /tmp/R045-REFERENCE-MICRO-CONTRAST-PRO-AUDIT.txt
        if-no-files-found: error
        retention-days: 14

    - name: Upload failed build log
      if: failure()
      uses: actions/upload-artifact@v4
      with:
        name: R045-REFERENCE-MICRO-CONTRAST-PRO-FAILED-BUILD-LOG
        path: r45-ui-pro/r043-reference-micro-contrast-pro-build.log
        if-no-files-found: warn
        retention-days: 14

    - name: Upload R045 APK
      if: success()
      uses: actions/upload-artifact@v4
      with:
        name: DU-Camera-R045-UI-PRO-PRECISION-TIMELINE
        path: DU-Camera-R045-UI-PRO-PRECISION-TIMELINE.apk
        if-no-files-found: error
        retention-days: 14
