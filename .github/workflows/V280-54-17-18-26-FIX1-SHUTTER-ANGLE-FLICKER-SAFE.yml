                  }
                  handler.post(safetyTicker)

                  fun enterRecordMode() {
                      drawer.visibility = View.GONE
                      drawerTab.visibility = View.GONE
                      dialsTab.visibility = View.GONE
                      telemetry.visibility = View.GONE
                      presets.visibility = View.GONE
                      dialPanel.visibility = View.GONE
                      functionPanel.visibility = View.GONE
                      selfTestPanel.visibility = View.GONE
                      safePill.visibility = View.GONE
                      exposureMeter.visibility = View.GONE
                      zoomMeter.visibility = View.GONE
                      focusReticle.visibility = View.GONE
                  }

                  fun exitRecordMode() {
                      drawerTab.visibility = View.VISIBLE
                      dialsTab.visibility = View.VISIBLE
                      telemetry.visibility = View.VISIBLE
                      if (dialController.isMeteringLocked()) {
                          focusReticle.visibility = View.VISIBLE
                          focusReticle.text = "◎\nAF/AE LOCK"
                          focusReticle.setTextColor(WARN)
                      }
                      if (horizonVisible) {
                          horizonLine.visibility = View.VISIBLE
                          horizonReadout.visibility = View.VISIBLE
                          steadyReadout.visibility = View.VISIBLE
                      }
                      safePill.visibility = View.VISIBLE
                  }

                  val pulse = object : Runnable {
                      override fun run() {
                          if (!recording || !rec.isAttachedToWindow) return

                          val elapsed = (SystemClock.elapsedRealtime() - startedAt) / 1000L
                          rec.text = "REC\n%02d:%02d".format(elapsed / 60L, elapsed % 60L)

                          bright = !bright
                          rec.animate().cancel()
                          rec.animate()
                              .alpha(if (bright) 1f else 0.20f)
                              .scaleX(if (bright) 1.16f else 1f)
                              .scaleY(if (bright) 1.16f else 1f)
                              .setDuration(210)
                              .start()

                          handler.postDelayed(this, 310L)
                      }
                  }

                  rec.setOnClickListener {
                      val (warn, reason) = warningState(textViews)

                      if (!recording && warn) {
                          Toast.makeText(activity, "Check $reason before recording", Toast.LENGTH_SHORT).show()
                      }

                      trigger("REC")
                      recording = !recording

                      if (recording) {
                          enterRecordMode()
                          startedAt = SystemClock.elapsedRealtime()
                          rec.background = GradientDrawable().apply {
                              shape = GradientDrawable.OVAL
                              setColor(0xF266050A.toInt())
                              setStroke(dp(activity, 3), RED)
                          }
                          handler.removeCallbacks(pulse)
                          handler.post(pulse)
                      } else {
                          exitRecordMode()
                          handler.removeCallbacks(pulse)
                          rec.animate().cancel()
                          rec.alpha = 1f
                          rec.scaleX = 1f
                          rec.scaleY = 1f
                          rec.text = "REC\n00:00"
                      }
                  }
              }
          }
