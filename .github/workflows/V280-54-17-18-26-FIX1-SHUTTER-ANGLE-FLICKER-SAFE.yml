      - name: Give V280-54.17.18.26 its own Android app identity
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PYIDENTITY'
          from pathlib import Path
          import re

          ROOT = Path('v172-source')
          GRADLE = ROOT / 'app/build.gradle.kts'
          MANIFEST = ROOT / 'app/src/main/AndroidManifest.xml'
          STRINGS = ROOT / 'app/src/main/res/values/strings.xml'

          unique_id = 'com.sentongoharuna.pulse.v28054171826fix1'
          visible_name = 'V280-54.17.18.26 FIX1 Develop Uganda'

          g = GRADLE.read_text(encoding='utf-8')
          g, count = re.subn(
              r'applicationId\s*=\s*"[^"]+"',
              f'applicationId = "{unique_id}"',
              g,
              count=1
          )
          if count != 1:
              raise SystemExit(f'Expected exactly one applicationId, found {count}')
          GRADLE.write_text(g, encoding='utf-8')

          if STRINGS.exists():
              s = STRINGS.read_text(encoding='utf-8')
              if re.search(r'<string\s+name="app_name"[^>]*>.*?</string>', s, flags=re.S):
                  s = re.sub(
                      r'<string\s+name="app_name"[^>]*>.*?</string>',
                      f'<string name="app_name">{visible_name}</string>',
                      s,
                      count=1,
                      flags=re.S
                  )
              else:
                  if '</resources>' not in s:
                      raise SystemExit('strings.xml has no </resources>')
                  s = s.replace(
                      '</resources>',
                      f'    <string name="app_name">{visible_name}</string>\n</resources>',
                      1
                  )
              STRINGS.write_text(s, encoding='utf-8')
          else:
              STRINGS.parent.mkdir(parents=True, exist_ok=True)
              STRINGS.write_text(
                  '<?xml version="1.0" encoding="utf-8"?>\n'
                  '<resources>\n'
                  f'    <string name="app_name">{visible_name}</string>\n'
                  '</resources>\n',
                  encoding='utf-8'
              )

          m = MANIFEST.read_text(encoding='utf-8')
          app_match = re.search(r'<application\b[^>]*>', m, flags=re.S)
          if not app_match:
              raise SystemExit('AndroidManifest has no <application> tag')

          app_tag = app_match.group(0)
          if re.search(r'android:label\s*=\s*"[^"]+"', app_tag):
              new_tag = re.sub(
                  r'android:label\s*=\s*"[^"]+"',
                  'android:label="@string/app_name"',
                  app_tag,
                  count=1
              )
          else:
              new_tag = app_tag[:-1] + ' android:label="@string/app_name">'
          m = m[:app_match.start()] + new_tag + m[app_match.end():]
          MANIFEST.write_text(m, encoding='utf-8')

          print('PASS: V280-54.17.18.26 has its own Android app identity.')
          print('applicationId:', unique_id)
          print('launcher name:', visible_name)
          PYIDENTITY

