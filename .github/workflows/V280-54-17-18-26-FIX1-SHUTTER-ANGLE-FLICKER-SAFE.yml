                  overlay.setOnTouchListener { _, event ->
                      if (recording) return@setOnTouchListener false

                      val centerZone =
                          event.x >= w * 0.12f &&
                          event.x <= w * 0.88f

                      when (event.action) {
                          MotionEvent.ACTION_DOWN -> {
                              touchDownAt = SystemClock.elapsedRealtime()

                              when {
                                  event.x < w * 0.12f -> {
                                      exposureMeter.visibility = View.VISIBLE
                                      zoomMeter.visibility = View.GONE
                                  }

                                  event.x > w * 0.88f -> {
                                      zoomMeter.visibility = View.VISIBLE
                                      exposureMeter.visibility = View.GONE
                                  }

                                  centerZone -> {
                                      showFocusReticle(
                                          event.x,
                                          event.y,
                                          if (dialController.isMeteringLocked()) "LOCKED" else "METER",
                                          dialController.isMeteringLocked()
                                      )
                                  }
                              }

                              handler.removeCallbacks(hideTemporary)
                              handler.postDelayed(hideTemporary, 1400L)
                              true
                          }

                          MotionEvent.ACTION_UP -> {
                              val held = SystemClock.elapsedRealtime() - touchDownAt

                              if (centerZone) {
                                  if (held >= 520L) {
                                      val ok = dialController.lockMeteringAt(
                                          event.x,
                                          event.y,
                                          w,
                                          h
                                      )
                                      if (ok) {
                                          showFocusReticle(event.x, event.y, "AF/AE LOCK", true)
                                          meterLockButton.text = "AF/AE METER LOCK\nLOCKED"
                                          Toast.makeText(
                                              activity,
                                              "AF/AE locked at this point",
                                              Toast.LENGTH_SHORT
                                          ).show()
                                      } else {
                                          Toast.makeText(
                                              activity,
                                              "AF/AE lock unavailable",
                                              Toast.LENGTH_SHORT
                                          ).show()
                                      }
                                  } else {
                                      val ok = dialController.tapMeter(
                                          event.x,
                                          event.y,
                                          w,
                                          h
                                      )
                                      if (ok) {
                                          showFocusReticle(event.x, event.y, "AF/AE", false)
                                      } else if (dialController.isMeteringLocked()) {
                                          showFocusReticle(event.x, event.y, "LOCKED", true)
                                          Toast.makeText(
                                              activity,
                                              "Release AF/AE lock before moving the metering point",
                                              Toast.LENGTH_SHORT
                                          ).show()
                                      }
                                  }
                              }

                              handler.removeCallbacks(hideTemporary)
                              handler.postDelayed(hideTemporary, 1400L)
                              true
                          }

                          MotionEvent.ACTION_CANCEL -> {
                              handler.removeCallbacks(hideTemporary)
                              handler.postDelayed(hideTemporary, 700L)
                              true
                          }

                          else -> true
                      }
                  }

                  val telemetryTicker = object : Runnable {
