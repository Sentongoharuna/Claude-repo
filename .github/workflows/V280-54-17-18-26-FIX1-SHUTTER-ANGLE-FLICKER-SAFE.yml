                      focusReticle.text = "◎\n$label"
                      focusReticle.setTextColor(if (locked) WARN else GOLD)
                      focusReticle.visibility = View.VISIBLE
                      focusReticle.alpha = 1f
                      focusReticle.animate().cancel()
                      focusReticle.scaleX = 1.12f
                      focusReticle.scaleY = 1.12f
