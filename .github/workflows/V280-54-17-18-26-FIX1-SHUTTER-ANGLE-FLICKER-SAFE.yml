                  fun addDialRow(key: String, label: String) {
                      val row = LinearLayout(activity).apply {
                          orientation = LinearLayout.HORIZONTAL
                          gravity = Gravity.CENTER_VERTICAL
                      }

                      val title = solid(activity, label)
                      val minus = solid(activity, "−")
                      val value = solid(
                          activity,
                          if (dialController.supported(key)) dialController.value(key) else "N/A"
                      ).apply {
                          setTextColor(if (dialController.supported(key)) GOLD else WARN)
                      }
                      val plus = solid(activity, "+")
                      dialValueViews[key] = value

                      fun update(delta: Int) {
                          if (!dialController.supported(key)) {
                              value.text = "N/A"
                              value.setTextColor(WARN)
                              Toast.makeText(
                                  activity,
                                  "$label manual control is not supported by this camera",
                                  Toast.LENGTH_SHORT
                              ).show()
                              return
                          }

                          val result = dialController.adjust(key, delta)
                          value.text = result
                          value.setTextColor(if (result == "N/A" || result == "LOCKED") WARN else GOLD)
                          if (result == "LOCKED") {
                              Toast.makeText(
                                  activity,
                                  "Manual dials are locked",
                                  Toast.LENGTH_SHORT
                              ).show()
                          }
                          value.performHapticFeedback(HapticFeedbackConstants.CLOCK_TICK)
                      }

                      minus.setOnClickListener { update(-1) }
                      plus.setOnClickListener { update(+1) }

                      minus.setOnLongClickListener {
                          update(-2)
                          true
                      }
                      plus.setOnLongClickListener {
                          update(+2)
                          true
                      }

                      value.setOnClickListener {
                          if (!dialController.supported(key)) {
                              Toast.makeText(
                                  activity,
                                  "$label is unavailable on this camera",
                                  Toast.LENGTH_SHORT
                              ).show()
                          } else {
                              value.text = dialController.reset(key)
                              value.setTextColor(
                                  if (value.text == "N/A" || value.text == "LOCKED") WARN else GOLD
                              )
                              Toast.makeText(
                                  activity,
                                  "$label returned to AUTO / DEFAULT",
                                  Toast.LENGTH_SHORT
                              ).show()
                          }
                      }

                      row.addView(title, LinearLayout.LayoutParams(dp(activity, 64), dp(activity, 34)))
                      row.addView(
                          minus,
                          LinearLayout.LayoutParams(dp(activity, 42), dp(activity, 34)).apply {
                              leftMargin = dp(activity, 3)
                          }
                      )
                      row.addView(
                          value,
                          LinearLayout.LayoutParams(0, dp(activity, 34), 1f).apply {
                              leftMargin = dp(activity, 3)
                              rightMargin = dp(activity, 3)
                          }
                      )
                      row.addView(plus, LinearLayout.LayoutParams(dp(activity, 42), dp(activity, 34)))

                      dialPanel.addView(
                          row,
                          LinearLayout.LayoutParams(
                              ViewGroup.LayoutParams.MATCH_PARENT,
                              dp(activity, 38)
                          ).apply {
                              bottomMargin = dp(activity, 2)
                          }
                      )
                  }

