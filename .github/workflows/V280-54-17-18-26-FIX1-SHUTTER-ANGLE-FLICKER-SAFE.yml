                  val orientationTracker = OrientationTracker(activity) { roll, pitch, movement ->
                      val nearLevel = kotlin.math.abs(roll) <= 1.5f
                      val steady = movement <= 4.5f

                      horizonLine.rotation = (-roll).coerceIn(-18f, 18f)
                      horizonLine.setTextColor(if (nearLevel) SAFE else GOLD)

                      horizonReadout.text = "LEVEL\n${String.format("%.1f", roll)}°"
                      horizonReadout.setTextColor(if (nearLevel) SAFE else GOLD)

                      steadyReadout.text =
                          if (steady) "STEADY\nREADY" else "STEADY\nHOLD"
                      steadyReadout.setTextColor(if (steady) SAFE else WARN)

                      if (kotlin.math.abs(pitch) > 45f) {
                          steadyReadout.text = "ANGLE\n${String.format("%.0f", pitch)}°"
                      }
                  }

                  orientationTracker.start()

                  overlay.addOnAttachStateChangeListener(object : View.OnAttachStateChangeListener {
                      override fun onViewAttachedToWindow(v: View) = Unit
                      override fun onViewDetachedFromWindow(v: View) {
                          orientationTracker.stop()
                      }
                  })

                  val exposureMeter = solid(activity, "EXP", "0.0").apply { visibility = View.GONE }
                  val zoomMeter = solid(activity, "ZOOM", "1.0x").apply { visibility = View.GONE }

                  overlay.addView(
                      exposureMeter,
                      FrameLayout.LayoutParams(
