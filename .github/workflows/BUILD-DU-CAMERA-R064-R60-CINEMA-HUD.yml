# R64 CINEMA HUD UI CONTRACT
# - R60 image/capture pipeline is LOCKED and must remain byte-for-byte equivalent in tuning.
# - UI direction: cinema-camera HUD with top shooting parameters, technical side controls, compact dark overlays and a strong REC control.
# - Primary HUD: REC/STBY, LUTs, aspect ratio, timecode/status.
# - Edge controls: slim zoom and exposure rails that stay unobtrusive.
# - Settings organization: Focus, Exposure/AE Lock, White Balance, Grid, Stabilization,
#   Microphone, Resolution/FPS and Codec information in compact grouped panels.
# - No change to codec, bitrate, resolution, FPS, NR, tonemap or R60 color/effect values.

name: Build DU Camera R064 COMPRESSION SURVIVAL PRO APK

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/BUILD-DU-CAMERA-R064-COMPRESSION-SURVIVAL-PRO.yml'

permissions:
  contents: read

jobs:
  build_r064_compression_survival:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Generate R51 locked base and apply compression-survival tuning
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import subprocess

          # ------------------------------------------------------------
          # 1) Recreate the proven R50 source already stored in repo.
          # ------------------------------------------------------------
          wf = Path('.github/workflows/BUILD-DU-CAMERA-R050-REFERENCE-TEXTURE-BALANCE-PRO.yml').read_text()

          marker = '    - name: Create R047 Reference Rich Image Pro from proven R45 quality master\n'
          start = wf.index(marker)
          runpos = wf.index('      run: |\n', start) + len('      run: |\n')
          end = wf.index('\n    - name: Set up Java 17', runpos)

          block = wf[runpos:end]
          lines = []
          for ln in block.splitlines():
              lines.append(ln[8:] if ln.startswith('        ') else ln)

          Path('/tmp/r50-create.sh').write_text('\n'.join(lines) + '\n')
          subprocess.run(['bash', '/tmp/r50-create.sh'], check=True)

          srcdir = Path('r50-texture')
          old = srcdir / 'app/src/main/java/com/sentongoharuna/ducamera/R50ReferenceTextureBalanceCameraActivity.java'
          new = srcdir / 'app/src/main/java/com/sentongoharuna/ducamera/R64CinemaHUDCameraActivity.java'

          text = old.read_text()

          # ------------------------------------------------------------
          # 2) Rebuild the R51 LOCKED MASTER identity/UI first.
          #    Capture engine remains the R50/R51 proven engine.
          # ------------------------------------------------------------
          for a, b in {
              'R50ReferenceTextureBalanceCameraActivity': 'R64CinemaHUDCameraActivity',
              'com.sentongoharuna.ducamera.r050referencetexturebalancepro': 'com.sentongoharuna.ducamera.r064cinemahud',
              "versionCode 400000064": "versionCode 400000078",
              "versionName '1.0-r050-reference-texture-balance-pro'": "versionName '1.0-r064-cinema-hud'",
              'DU Camera R50 Texture Balance': 'DU Camera R64 Cinema HUD',
              'R50 TEXTURE': 'DU PRO',
              'R50 TEXTURE • OPENING': 'DU PRO • OPENING',
              'DU_R50_TEXTURE_BALANCE_': 'DU_R64_CINEMA_PRO_',
              'Movies/DU Camera/R50 Texture Balance': 'Movies/DU Camera/R64 Cinema Pro'
          }.items():
              text = text.replace(a, b)

          # Preserve R51 interface additions.
          text = text.replace(
              'private TextView enhanceButton;',
              'private TextView enhanceButton;\n'
              '            private LinearLayout qualityRail;\n'
              '            private TextView r51UiButton;\n'
              '            private TextView gridButton;\n'
              '            private boolean qualityRailVisible = false;\n'
              '            private boolean gridOn = false;'
          )

          text = text.replace(
              'LinearLayout qualityRail = new LinearLayout(this);',
              'qualityRail = new LinearLayout(this);'
          )

          anchor = 'root.addView(master, masterLp);'
          text = text.replace(
              anchor,
              anchor +
              '\n\n                r51UiButton = button("R51 UI");'
              '\n                FrameLayout.LayoutParams r51Lp = new FrameLayout.LayoutParams(dp(82), dp(38), Gravity.TOP | Gravity.START);'
              '\n                r51Lp.leftMargin = dp(12);'
              '\n                r51Lp.topMargin = dp(62);'
              '\n                root.addView(r51UiButton, r51Lp);'
              '\n                r51UiButton.setOnClickListener(v -> {'
              '\n                    qualityRailVisible = !qualityRailVisible;'
              '\n                    if (qualityRail != null) qualityRail.setVisibility(qualityRailVisible ? View.VISIBLE : View.GONE);'
              '\n                    r51UiButton.setText(qualityRailVisible ? "R51 HIDE" : "R51 UI");'
              '\n                });',
              1
          )

          rail_anchor = 'qualityRail.setGravity(Gravity.CENTER);'
          text = text.replace(
              rail_anchor,
              rail_anchor + '\n                qualityRail.setVisibility(View.GONE);',
              1
          )

          text = text.replace(
              'setContentView(root);',
              'gridButton = button("GRID OFF");\n'
              '                FrameLayout.LayoutParams gridLp = new FrameLayout.LayoutParams(dp(88), dp(38), Gravity.BOTTOM | Gravity.END);\n'
              '                gridLp.rightMargin = dp(12);\n'
              '                gridLp.bottomMargin = dp(72);\n'
              '                root.addView(gridButton, gridLp);\n'
              '                gridButton.setOnClickListener(v -> {\n'
              '                    gridOn = !gridOn;\n'
              '                    gridButton.setText(gridOn ? "GRID ON" : "GRID OFF");\n'
              '                });\n\n'
              '                setContentView(root);',
              1
          )


          # ------------------------------------------------------------
          # 3) R64 CINEMA-PRO UI — VISUAL/CONTROL LAYER ONLY
          #    No capture/image-engine values are changed in this section.
          # ------------------------------------------------------------

          text = text.replace(
              'view.setTextSize(11.5f);\n'
              '                view.setGravity(Gravity.CENTER);\n\n'
              '                GradientDrawable bg = new GradientDrawable();\n'
              '                bg.setColor(0xDD111111);\n'
              '                bg.setCornerRadius(dp(12));\n'
              '                bg.setStroke(dp(1), 0xFFFFB323);\n\n'
              '                view.setBackground(bg);',
              'view.setTextSize(10.5f);\n'
              '                view.setGravity(Gravity.CENTER);\n'
              '                view.setTypeface(Typeface.create("sans-serif-medium", Typeface.NORMAL));\n'
              '                view.setLetterSpacing(0.08f);\n'
              '                view.setIncludeFontPadding(false);\n\n'
              '                GradientDrawable bg = new GradientDrawable();\n'
              '                bg.setColor(0xB814171A);\n'
              '                bg.setCornerRadius(dp(18));\n'
              '                bg.setStroke(dp(1), 0x55FFFFFF);\n\n'
              '                view.setBackground(bg);'
          )

          text = text.replace(
              'new FrameLayout.LayoutParams(dp(108), dp(42), Gravity.TOP | Gravity.START)',
              'new FrameLayout.LayoutParams(dp(92), dp(34), Gravity.TOP | Gravity.START)',
              1
          )
          text = text.replace('masterLp.topMargin = dp(16);', 'masterLp.topMargin = dp(14);', 1)

          text = text.replace('precisionTimeline.setTextSize(16f);', 'precisionTimeline.setTextSize(14f);', 1)
          text = text.replace('Typeface.MONOSPACE, Typeface.BOLD', 'Typeface.MONOSPACE, Typeface.NORMAL', 1)

          text = text.replace('button("R51 UI")', 'button("PRO")')
          text = text.replace('"R51 HIDE" : "R51 UI"', '"CLOSE" : "PRO"')

          text = text.replace('button("SOCIAL+")', 'button("AUTO")')
          text = text.replace('button("MOTION+")', 'button("MOTION")')
          text = text.replace('button("DIRECT FINAL")', 'button("HEVC")')
          text = text.replace('button("15 Mbps")', 'button("15M")')
          text = text.replace('button("60 FPS")', 'button("60FPS")')
          text = text.replace('button("STAB AUTO")', 'button("STAB")')
          text = text.replace('button("AE AUTO")', 'button("AE")')

          text = text.replace('button("GRID OFF")', 'button("GRID")')
          text = text.replace(
              'gridButton.setText(gridOn ? "GRID ON" : "GRID OFF");',
              'gridButton.setText(gridOn ? "GRID ✓" : "GRID");'
          )

          text = text.replace('bottom.setBackgroundColor(0x66000000);',
                              'bottom.setBackgroundColor(0xB0101113);')

          text = text.replace(
              'recordButton = button("RECORD");\n'
              '                lightButton = button("LIGHT");',
              'recordButton = button("●  REC");\n'
              '                GradientDrawable recBg = new GradientDrawable();\n'
              '                recBg.setColor(0xD9B51F2E);\n'
              '                recBg.setCornerRadius(dp(22));\n'
              '                recBg.setStroke(dp(1), 0x99FFFFFF);\n'
              '                recordButton.setBackground(recBg);\n'
              '                recordButton.setTextSize(13f);\n'
              '                recordButton.setTypeface(Typeface.DEFAULT_BOLD);\n'
              '                recordButton.setLetterSpacing(0.10f);\n'
              '                lightButton = button("LIGHT");',
              1
          )


          # ------------------------------------------------------------
          # 3B) R64 CINEMA HUD — PRO SHOOTING LAYOUT
          #     Inspired by modern cinema-camera interfaces; no branded clone.
          # ------------------------------------------------------------

          text = text.replace('button("DU PRO")', 'button("DU CINE")', 1)
          text = text.replace('button("PRO")', 'button("MENU")')
          text = text.replace('"CLOSE" : "PRO"', '"CLOSE" : "MENU"')

          text = text.replace(
              'status = button("R64 TEXTURE • OPENING");',
              'status = button("60FPS  •  180°  •  ISO AUTO  •  WB AUTO  •  HEVC");\n'
              '                status.setTextSize(9.5f);\n'
              '                status.setLetterSpacing(0.03f);',
              1
          )

          text = text.replace(
              'new FrameLayout.LayoutParams(dp(212), dp(40), Gravity.TOP | Gravity.CENTER_HORIZONTAL)',
              'new FrameLayout.LayoutParams(dp(310), dp(34), Gravity.TOP | Gravity.CENTER_HORIZONTAL)',
              1
          )
          text = text.replace('statusLp.topMargin = dp(108);', 'statusLp.topMargin = dp(58);', 1)
          text = text.replace('timerLp.topMargin = dp(62);', 'timerLp.topMargin = dp(94);', 1)

          text = text.replace(
              'new FrameLayout.LayoutParams(dp(82), dp(42), Gravity.TOP | Gravity.END)',
              'new FrameLayout.LayoutParams(dp(68), dp(34), Gravity.TOP | Gravity.END)',
              1
          )
          text = text.replace('aspectLp.topMargin = dp(16);', 'aspectLp.topMargin = dp(14);', 1)

          text = text.replace('button("HEVC")', 'button("CODEC")')
          text = text.replace('button("15M")', 'button("RATE")')
          text = text.replace('button("60FPS")', 'button("FPS")')
          text = text.replace('button("AE")', 'button("EXP")')

          text = text.replace('TextView lensButton = button("LENS");',
                              'TextView lensButton = button("LENS  1×");', 1)
          text = text.replace('lightButton = button("LIGHT");',
                              'lightButton = button("TOOLS");', 1)

          text = text.replace('recBg.setCornerRadius(dp(22));',
                              'recBg.setCornerRadius(dp(28));', 1)
          text = text.replace('recordButton.setTextSize(13f);',
                              'recordButton.setTextSize(14f);', 1)
          text = text.replace('bottom.setBackgroundColor(0xB0101113);',
                              'bottom.setBackgroundColor(0xCC08090B);', 1)

          text = text.replace('bg.setCornerRadius(dp(18));',
                              'bg.setCornerRadius(dp(10));')
          text = text.replace('bg.setStroke(dp(1), 0x55FFFFFF);',
                              'bg.setStroke(dp(1), 0x44FFFFFF);')
          # ------------------------------------------------------------
          # 3) COMPRESSION-SURVIVAL TUNING.
          #
          # From our original-vs-compressed test:
          # - resolution/fps survived
          # - bitrate dropped materially
          # - fine texture weakened modestly
          #
          # So: the locked R60 visual/compression master, preserved exactly while camera controls are improved.
          # No image-quality changes: preserve the exact R60 contrast, color, exposure, NR, codec and bitrate behavior.
          # ------------------------------------------------------------
          text = text.replace('new Contrast(0.035f)', 'new Contrast(0.050f)')
          text = text.replace('.adjustSaturation(2.5f)', '.adjustSaturation(3.0f)')
          text = text.replace('.adjustLightness(1.0f)', '.adjustLightness(0.75f)')

          # Keep warm RGB balance essentially unchanged, only microscopic red lift.
          text = text.replace('.setRedScale(1.008f)', '.setRedScale(1.009f)')

          # Keep the proven direct encoding target unchanged.
          # 1080p60 + HEVC + 15 Mbps remains the master delivery profile.

          new.write_text(text)
          old.unlink()

          manifest = srcdir / 'app/src/main/AndroidManifest.xml'
          manifest.write_text(
              manifest.read_text()
              .replace('.R50ReferenceTextureBalanceCameraActivity', '.R64CinemaHUDCameraActivity')
              .replace('DU Camera R50 Texture Balance', 'DU Camera R64 Cinema HUD')
          )

          gradle = srcdir / 'app/build.gradle'
          gradle.write_text(
              gradle.read_text()
              .replace('com.sentongoharuna.ducamera.r050referencetexturebalancepro', 'com.sentongoharuna.ducamera.r064cinemahud')
              .replace('versionCode 400000064', 'versionCode 400000078')
              .replace("versionName '1.0-r050-reference-texture-balance-pro'", "versionName '1.0-r064-cinema-hud'")
          )

          settings = srcdir / 'settings.gradle'
          settings.write_text(
              settings.read_text().replace(
                  'DUCameraR050ReferenceTextureBalancePro',
                  'DUCameraR064CinemaHUD'
              )
          )

          # ------------------------------------------------------------
          # 4) Guardrails: lock the R60 image engine; R64 may change controls/reliability only. R51 foundation + R54 visual checkpoint must both survive.
          # R64 deliberately does NOT inherit the experimental R55 tuning or the prior R64 20 Mbps/MINIMAL-NR changes.
          # ------------------------------------------------------------
          checks = [
              '15_000_000',
              'MediaFormat.MIMETYPE_VIDEO_HEVC',
              'QualitySelector.from(Quality.FHD)',
              'NOISE_REDUCTION_MODE_OFF',
              'TONEMAP_MODE_HIGH_QUALITY',
              'COLOR_CORRECTION_MODE_HIGH_QUALITY',
              'R51 UI',
              'GRID OFF',
              'new Contrast(0.050f)',
              '.adjustSaturation(3.0f)',
              '.adjustLightness(0.75f)',
              '.setRedScale(1.009f)'
          ]

          for c in checks:
              assert c in text, f'R64 audit failed: missing {c}'

          # Also ensure we did NOT add risky sharpening.
          assert 'Sharpness' not in text

          print('PASS: R64 preserves the exact locked R60 image engine; Cinema Pro changes are UI/controls only.')
          PY

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android platform
        shell: bash
        run: sdkmanager "platforms;android-36" "build-tools;35.0.0"

      - name: Set up Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.13

      - name: Build R064 COMPRESSION SURVIVAL PRO APK
        working-directory: r50-texture
        shell: bash
        run: |
          set -o pipefail
          gradle --no-daemon :app:assembleDebug --stacktrace 2>&1 | tee r064-modern-pro-ui-build.log

      - name: Prepare APK
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          APK='r50-texture/app/build/outputs/apk/debug/app-debug.apk'
          OUT='DU-Camera-R064-CINEMA-HUD.apk'
          test -s "$APK"
          cp "$APK" "$OUT"
          ls -lh "$OUT"
          sha256sum "$OUT"

      - name: Upload failed build log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: R064-CONTROLS-MASTER-FAILED-BUILD-LOG
          path: r50-texture/r064-modern-pro-ui-build.log
          if-no-files-found: warn
          retention-days: 14

      - name: Upload R064 APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: DU-Camera-R064-CINEMA-HUD
          path: DU-Camera-R064-CINEMA-HUD.apk
          if-no-files-found: error
          retention-days: 30
